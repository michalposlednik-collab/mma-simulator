<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V94</title><style>*{box-sizing:border-box}body{margin:0;background:#071017;color:#eef3f5;font:15px Arial}.app{min-height:100vh;background:radial-gradient(circle at 20% 0,#174156,#05090d 65%)}button{cursor:pointer}.creator{max-width:1100px;margin:auto;padding:35px}.card,.panel{background:#0d1922;border:1px solid #294653;border-radius:16px;padding:22px;box-shadow:0 18px 55px #0008}.gold{color:#d7b258}.muted{color:#8fa1aa}.field{margin:14px 0}.field label{display:block;font-size:11px;margin-bottom:6px;color:#9aabb4}.field input{width:100%;padding:13px;background:#071017;color:#fff;border:1px solid #294653;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:13px;background:#101e27;border:1px solid #294653;border-radius:9px;cursor:pointer;min-height:70px}.pick:checked+label{border-color:#d7b258;background:#211f15}.pick+label small{display:block;color:#91a1a9;margin-top:5px}.btn{padding:11px 16px;background:#12232d;color:#fff;border:1px solid #45606d;border-radius:8px}.primary{background:#80672e;border-color:#d7b258;font-weight:bold}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#060c12;border-right:1px solid #203642;padding:12px}.side button{width:100%;margin:4px 0;padding:12px;text-align:left;background:#0b151d;color:#c2cdd1;border:1px solid #203642;border-radius:8px}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:15px 0}.stat{padding:13px;background:#101e27;border:1px solid #263f4d;border-radius:10px}.stat small{color:#778b95}.stat strong{display:block;font-size:18px;margin-top:6px}.cols{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.hero{padding:25px;background:radial-gradient(circle at 80% 0,#3a301a,#101a21 60%);border:1px solid #80672e;border-radius:16px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.tile{padding:15px;background:#101d26;border:1px solid #294653;border-radius:10px}.feed{padding:9px 0;border-bottom:1px solid #1d303a}.bar{height:7px;background:#1c2c34;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#3dc982}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50;padding:18px}.modalbox{width:min(850px,95vw);max-height:90vh;overflow:auto;background:#0d1922;border:1px solid #d7b258;border-radius:18px;padding:26px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#183d4d,#05090d 68%)}.fightgrid{max-width:1100px;margin:15px auto;display:grid;grid-template-columns:1fr 160px 1fr;gap:12px;align-items:center}.fighter{padding:16px;background:#0b171f;border:1px solid #294653;border-radius:12px;text-align:center}.hp{height:13px;background:#35191e;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#3dc982}.opp i{background:#df5965}.clock{width:135px;height:135px;border:7px solid #d7b258;border-radius:50%;display:grid;place-items:center;margin:auto}.comment{max-width:1100px;height:180px;overflow:auto;margin:12px auto;background:#050c11;border:1px solid #294653;border-radius:10px;padding:10px}.comment p{margin:0;padding:7px;border-bottom:1px solid #172a34}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{padding:12px;min-height:55px;background:#101f29;color:#fff;border:1px solid #294653;border-radius:9px}.wheel{position:relative;width:290px;height:290px;margin:18px auto}.disk{width:290px;height:290px;border-radius:50%;background:conic-gradient(#36c77b 0 8%,#d84f5b 8% 16%,#36c77b 16% 24%,#d84f5b 24% 32%,#36c77b 32% 40%,#d84f5b 40% 48%,#36c77b 48% 56%,#d84f5b 56% 64%,#36c77b 64% 72%,#d84f5b 72% 80%,#36c77b 80% 88%,#d84f5b 88%);border:7px solid #65747d;transition:transform 2s cubic-bezier(.12,.75,.08,1)}.pointer{position:absolute;z-index:2;top:-26px;left:50%;transform:translateX(-50%);font-size:30px}@media(max-width:900px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats,.grid,.tiles,.cols{grid-template-columns:1fr 1fr}.fightgrid{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}}@media(max-width:600px){.stats,.grid,.tiles,.choices,.acts{grid-template-columns:1fr}}</style></head><body><div id="app" class="app"></div><script>(()=>{const app=document.getElementById('app');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:'Talent, refleks i potencjał.',Bijok:'Twarda głowa, presja i chaos.',Fizol:'Siła, klincz i brutalność.',Zapaśnik:'Obalenia, kontrola i siatka.',Striker:'Boks, kopnięcia i nokauty.',Gumiarz:'BJJ, gardа i poddania.',Allrounder:'Równy rozwój MMA.'};const BUD=[[5000,'Normalny etat','Trenujesz po pracy.'],[10000,'Etat + oszczędności','Masz trochę oddechu.'],[25000,'Rodzina pomaga','Możesz inwestować w rozwój.'],[50000,'Bogata rodzina','Stać Cię na obozy.'],[100000,'Rodzinny biznes','Mocne zaplecze.']];let s={day:1,age:18,ig:100,rep:5,mot:55,money:10000,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',gym:'Lokalny klub',fight:null,sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},log:[]};function creator(){app.innerHTML='<div class="creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do światowych gal.</p><div class="field"><label>IMIĘ *</label><input id="fn"></div><div class="field"><label>NAZWISKO *</label><input id="ln"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.entries(TYPES).map((x,i)=>'<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x[0]+'"><label for="t'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="grid">'+BUD.map((x,i)=>'<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'"><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' ISK</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>').join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.entries(KG).map((x,i)=>'<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x[0]+'"><label for="w'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><br><button id="start" class="btn primary">STWÓRZ KARIERĘ →</button></div></div>';document.getElementById('start').onclick=start}function start(){const f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.first=f;s.last=l;s.type=t.value;s.money=+b.value;s.weight=w.value;s.log=['🥊 Kariera rozpoczęta.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance(1)">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fightHub()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="stats()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button class="btn" onclick="advance(1)">＋ 1 DZIEŃ</button> <button class="btn primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><strong>'+s.w+'-'+s.l+'-'+s.d+'</strong></div><div class="stat"><small>INSTAGRAM</small><strong>'+s.ig.toLocaleString()+'</strong></div><div class="stat"><small>REPUTACJA</small><strong>'+s.rep+'/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>'+s.mot+'/100</strong></div><div class="stat"><small>BUDŻET</small><strong>'+s.money.toLocaleString()+' ISK</strong></div><div class="stat"><small>WIEK</small><strong>'+s.age+'</strong></div></div><div class="cols"><section><div class="hero"><small class="gold">NASTĘPNY KROK</small><h2>'+(s.fight?'OBÓZ PRZYGOTOWAWCZY':'ZBUDUJ SWOJĄ KARIĘRĘ')+'</h2><p>'+(s.fight?'Masz aktywną walkę z '+s.fight.opponent+'. Pozostało '+s.fight.days+' dni przygotowań.':'Szukaj treningu, buduj reputację i czekaj na pierwszą propozycję.')+'</p><button class="btn primary" onclick="nextEvent()">PRZEWIŃ DO NASTĘPNEGO EVENTU</button></div><div class="tiles"><div class="tile"><b>🥋 KLUB</b><br>'+s.gym+'</div><div class="tile"><b>🏆 POZIOM</b><br>'+level()+'</div><div class="tile"><b>💰 FINANSE</b><br>'+s.money.toLocaleString()+' ISK</div></div><div class="panel"><h3>📰 OŚ KARIERY</h3>'+s.log.slice(0,15).map(x=>'<div class="feed">'+x+'</div>').join('')+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+Object.entries(s.sk).map(x=>'<div class="feed"><b>'+x[0]+'</b> '+x[1]+'<div class="bar"><i style="width:'+x[1]+'%"></i></div></div>').join('')+'</div><div class="panel"><h3>🗺️ ŚCIEŻKA KARIERY</h3>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map((x,i)=>'<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'✅':'🔒')+' '+x+'</div>').join('')+'</div></aside></div></main></div>'}function level(){if(s.rep>=80)return'UFC';if(s.rep>=65)return'PFL';if(s.rep>=50)return'Cage Warriors';if(s.rep>=35)return'OKTAGON';if(s.rep>=20)return'KSW';return'Lokalne gale'}function advance(n){for(let i=0;i<n;i++){s.day++;if(s.day%365===0)s.age++}s.log.unshift('📅 Dzień '+s.day+'.');dashboard()}function modal(title,text,choices){const d=document.createElement('div');d.className='modal';d.innerHTML='<div class="modalbox"><small class="gold">EVENT KARIERY</small><h1>'+title+'</h1><p style="font-size:17px">'+text+'</p><div class="choices"></div></div>';document.body.appendChild(d);choices.forEach(c=>{const b=document.createElement('button');b.className='btn primary';b.textContent=c[0];b.onclick=()=>{d.remove();c[1]()};d.querySelector('.choices').appendChild(b)})}function nextEvent(){s.day++;if(s.day%365===0)s.age++;if(s.fight){modal('DZIEŃ OBOZU','Masz aktywną walkę. Trenuj, regeneruj się i pilnuj formy.',['TRENING',()=>training()],['ODPOCZYNEK',()=>{s.mot=Math.min(100,s.mot+4);s.log.unshift('🛌 Regeneracja: +4 motywacji.');dashboard()}]]);return}const r=Math.random();if(r<.35)modal('PROPOZYCJA WALKI','Promotor lokalnej gali oferuje Ci pojedynek. Po akceptacji nie możesz przyjąć kolejnej walki aż do zakończenia tej.',[['PRZYJMUJĘ',()=>{s.fight={opponent:['Marek „Kosa” Nowak','Paweł „Beton” Zieliński','Igor „Kret” Wrona'][Math.floor(Math.random()*3)],days:21};s.log.unshift('🏆 Przyjęto walkę z '+s.fight.opponent+'. Obóz: 21 dni.');dashboard()}],['ODRZUCAM',()=>dashboard()]]);else if(r<.65)modal('SPOTKANIE NA GALI','Widzisz Mameda Khalidova. Telefon już jest w ręce.',[['ZDJĘCIE + „ETA KAUkas”',()=>{s.ig+=1000;s.rep+=2;s.log.unshift('🔥 Zdjęcie z Mamedem z muzyką poszło viralem. +1000 IG.');dashboard()}],['UDASZ, ŻE NIE POZNAJESZ',()=>{s.ig+=600;s.log.unshift('😂 Udajesz, że nie rozpoznajesz Mameda. Internet eksploduje. +600 IG.');dashboard()}]]);else if(r<.82)modal('JURAS ZAUWAŻYŁ AKCJĘ','Fragment Twojego treningu trafia do jego relacji.',[['UDOSTĘPNIAM',()=>{s.ig+=250;s.rep++;s.log.unshift('📱 Juras udostępnił trening. +250 IG.');dashboard()}],['NIE WRZUCAM',()=>dashboard()]]);else modal('DZIENNIKARZ PYTA','Na Twitterze pojawia się zaczepka dotycząca Twojego stylu.',[['ODPOWIADAM',()=>{s.rep++;s.ig+=120;s.log.unshift('🐦 Odpowiedziałeś na zaczepkę. +1 reputacji.');dashboard()}],['IGNORUJĘ',()=>dashboard()]]);dashboard()}function training(){modal('CENTRUM TRENINGOWE','Wybierz inwestycję w rozwój. Lepsze obozy wymagają pieniędzy i reputacji.',[['LOKALNY · +1 BOKS',()=>{s.sk.Boks=Math.min(100,s.sk.Boks+1);s.mot=Math.min(100,s.mot+2);dashboard()}],['ADT · 3000 ISK · +3 ZAPASY',()=>{if(s.money<3000)return alert('Za mało pieniędzy.');s.money-=3000;s.sk.Zapasy=Math.min(100,s.sk.Zapasy+3);s.log.unshift('🥋 ADT: +3 zapasy.');dashboard()}],['ANKOS · 6000 ISK · REP 15 · +6 ZAPASY',()=>{if(s.money<6000||s.rep<15)return alert('Potrzebujesz 6000 ISK i 15 reputacji.');s.money-=6000;s.sk.Zapasy=Math.min(100,s.sk.Zapasy+6);s.sk.Kondycja=Math.min(100,s.sk.Kondycja+2);s.log.unshift('🥋 ANKOS: +6 zapasów, +2 kondycji.');dashboard()}],['BJJ CAMP · 5000 ISK · +5 BJJ',()=>{if(s.money<5000)return alert('Za mało pieniędzy.');s.money-=5000;s.sk.BJJ=Math.min(100,s.sk.BJJ+5);s.log.unshift('🥋 BJJ Camp: +5 BJJ.');dashboard()}]])}function fightHub(){if(!s.fight){modal('WALKI','Nie masz aktywnej walki. Czekaj na ofertę w Następnym Evencie.',['OK',()=>dashboard()]);return}modal('AKTYWNA WALKA','Rywal: '+s.fight.opponent+' · przygotowanie: '+s.fight.days+' dni.',[['TRENUJ',()=>training()],['PRZESUŃ DZIEŃ',()=>{s.fight.days--;advance(1)}],['START WALKI',()=>{if(s.fight.days>0)return alert('Okres przygotowawczy jeszcze trwa.');startFight()}]])}function startFight(){const opp=s.fight.opponent;window.fs={sec:0,round:1,me:100,enemy:100,opp};app.innerHTML='<div class="fight"><div style="max-width:1100px;margin:auto;display:flex;justify-content:space-between"><b>'+s.first+' '+s.last+'</b><b>RUNDA <span id="rnd">1</span>/3</b><b>'+opp+'</b></div><div class="fightgrid"><div class="fighter"><h2>'+s.first+'</h2><div class="hp"><i id="mh" style="width:100%"></i></div></div><div class="clock"><div id="clock">5:00</div></div><div class="fighter"><h2>'+opp+'</h2><div class="hp opp"><i id="eh" style="width:100%"></i></div></div></div><div id="comments" class="comment"></div><div class="acts">'+['Jab / low kick','Presja pod siatką','Obalenie','High kick','Spinning backfist','Latające kolano','Łokieć','Balacha / trójkąt'].map(x=>'<button class="act" onclick="action(\''+x+'\')">'+x+'</button>').join('')+'</div></div>';addComment('JURAS: Zaczynamy. Badanie dystansu, dużo pracy na nogach.');window.ft=setInterval(()=>{if(!window.fs)return;window.fs.sec++;if(window.fs.sec>=300){if(window.fs.round<3){window.fs.round++;window.fs.sec=0;addComment('JURAS: Koniec rundy. Narożnik ma teraz robotę.')}else finish('decision')}renderFight()},220)}function renderFight(){if(!window.fs)return;const left=300-window.fs.sec;document.getElementById('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');document.getElementById('rnd').textContent=window.fs.round;document.getElementById('mh').style.width=window.fs.me+'%';document.getElementById('eh').style.width=window.fs.enemy+'%'}function addComment(x){const c=document.getElementById('comments');if(c){const p=document.createElement('p');p.textContent=x;c.prepend(p)}}window.action=a=>{if(!window.fs)return;if(/High|Spinning|Latające|Łokieć|Balacha/.test(a)){wheel(a);return}let dmg=2+Math.random()*7;if(a==='Obalenie'){dmg+=4;addComment('JURAS: Próba wejścia w nogi! Dobra praca przy siatce.')}else if(a.includes('Presja'))addComment('JURAS: Dociska go, rywal nie ma gdzie oddychać.');else addComment('JURAS: Dobra wymiana, zawodnicy pracują w swoim tempie.');window.fs.enemy=Math.max(0,window.fs.enemy-dmg);window.fs.me=Math.max(5,window.fs.me-Math.random()*3);renderFight();if(window.fs.enemy<=0)finish('tko')};function wheel(a){const ok=Math.random()<.55;const d=document.createElement('div');d.className='modal';d.innerHTML='<div class="modalbox" style="text-align:center"><h2>'+a+'</h2><p>Timing techniki</p><div class="wheel"><span class="pointer">▼</span><div class="disk" id="disk"></div></div><h2 id="wr">LOSOWANIE...</h2></div>';document.body.appendChild(d);requestAnimationFrame(()=>document.getElementById('disk').style.transform='rotate('+(1800+Math.random()*720)+'deg)');setTimeout(()=>{document.getElementById('wr').textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';if(ok){window.fs.enemy=Math.max(0,window.fs.enemy-18);addComment(/High|Latające|Spinning/.test(a)?'JURAS: ŁOOOOOO! Ależ to weszło!':'JURAS: Ooo! Bardzo mocna akcja!');renderFight();if(window.fs.enemy<=0){d.remove();finish('ko');return}}else addComment('JURAS: Nie siadło. Rywal zdążył uciec.');setTimeout(()=>d.remove(),800)},2100)}function finish(type){clearInterval(window.ft);const f=window.fs;window.fs=null;s.fight=null;if(type==='ko'||type==='tko'){s.w++;s.rep+=5;s.ig+=300;s.log.unshift('🏆 Zwycięstwo przez '+(type==='ko'?'KO':'TKO')+'.')}else{s.w++;s.rep+=3;s.log.unshift('🏆 Zwycięstwo decyzją.')}modal('KONIEC WALKI',type==='decision'?'Sędziowie jednogłośnie wskazali Ciebie.':'JURAS: Koniec! Walka zakończona przed czasem.',[['WRÓĆ DO KARIERY',()=>dashboard()]])}function career(){modal('ŚCIEŻKA KARIERY','Lokalne gale → Hybrid/Babylon/FEN → KSW → OKTAGON → Cage Warriors → PFL → UFC. Reputacja odblokowuje kolejne poziomy.',[['OK',()=>dashboard()]])}function media(){modal('MEDIA','Instagram: '+s.ig.toLocaleString('pl-PL')+' obserwujących. Reputacja: '+s.rep+'. Virale, wywiady i konflikty będą wpływać na oferty.',[['OK',()=>dashboard()]])}function manager(){modal('MENEDŻER KARIERY','Negocjuje kontrakty, sponsorów i oferty. Aktywna walka blokuje przyjęcie kolejnej.',[['OK',()=>dashboard()]])}function stats(){modal('STATYSTYKI',Object.entries(s.sk).map(x=>x[0]+': '+x[1]).join('<br>')+'<br><br>Rekord: '+s.w+'-'+s.l+'-'+s.d,[['OK',()=>dashboard()]])}function events(){modal('EVENTY','Kalendarz kariery: treningi, gale, oferty walk, media, virale i niespodziewane spotkania. Każdy event może zmienić dalszą ścieżkę.',[['OK',()=>dashboard()]])}creator()})();</script></body></html>
