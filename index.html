 app.innerHTML='<div class="creator hashwizard"><div class="box"><div class="brand">MMA <span>CAREER SIMULATOR</span></div>'+
 '<div class="steps"><div class="step on">1 · ZAWODNIK</div><div class="step">2 · FINANSE</div><div class="step">3 · WAGA</div><div class="step">4 · START</div></div>'+
 '<div class="hw">'+
 '<section id="hw1" class="hwstep"><h2>1. ZAWODNIK</h2><div class="field"><label>IMIĘ I NAZWISKO</label><input id="nm" value="'+esc(S.name)+'" placeholder="np. Jan Kowalski"></div><div class="native-grid">'+ps+'</div><div class="native-foot"><span></span><a class="btn primary" href="#hw2">DALEJ →</a></div></section>'+
 '<section id="hw2" class="hwstep"><h2>2. FINANSE STARTOWE</h2><div class="native-grid">'+bs+'</div><div class="native-foot"><a class="btn" href="#hw1">← WSTECZ</a><a class="btn primary" href="#hw3">DALEJ →</a></div></section>'+
 '<section id="hw3" class="hwstep"><h2>3. KATEGORIA WAGOWA</h2><p class="muted"><b>OBOWIĄZKOWA.</b> Wybierz jedną kategorię.</p><div class="native-grid">'+ws+'</div><div class="native-foot"><a class="btn" href="#hw2">← WSTECZ</a><a class="btn primary" href="#hw4">DALEJ →</a></div></section>'+
 '<section id="hw4" class="hwstep"><h2>4. PODSUMOWANIE</h2><div class="panel"><h2>Gotowy do rozpoczęcia?</h2><p>Imię: '+esc(S.name||"uzupełnij")+'</p><p>Profil: '+esc(S.profile||"wybierz w kroku 1")+'</p><p>Kategoria: '+esc(S.weight||"wybierz w kroku 3")+'</p><p>Budżet: '+budgets[S.budget][0]+' · '+budgets[S.budget][1].toLocaleString("pl-PL")+' PLN</p></div><div class="native-foot"><a class="btn" href="#hw3">← WSTECZ</a><button type="button" class="btn primary" id="realStart" >ROZPOCZNIJ KARIERĘ</button></div></section>'+
 '</div></div></div>';

   if(!S.weight)return alert("Wybierz kategorię wagową.");
   startCareer();
 });

 creator();
}

window.beginCareerNow=function beginCareerNow(){
 const n=document.getElementById("nm");
 const p=document.querySelector('input[name="profile"]:checked');
 const b=document.querySelector('input[name="budget"]:checked');
 const w=document.querySelector('input[name="weight"]:checked');
 S.name=n?n.value.trim():"";
 S.profile=p?profiles[Number(p.value)]:"";
 S.budget=b?b.value:"normal";
 S.weight=w?weights[Number(w.value)]:"";
 if(!S.name){alert("Wpisz imię i nazwisko.");location.hash="#hw1";return;}
 if(!S.profile){alert("Wybierz profil zawodnika.");location.hash="#hw1";return;}
 if(!S.weight){alert("Wybierz kategorię wagową.");location.hash="#hw3";return;}
 G.money=Number((budgets[S.budget]||budgets.normal)[1]);
 G.day=1;G.age=16;G.rep=5;G.ig=120;G.fatigue=8;G.event=null;G.fight=null;G.fights=[];G.manager=null;

}
function startCareer(){beginCareerNow();}


function strongest(){
 const sk=G.skills||S.skills||{};
 let best="Technika";
 let val=-1;
 Object.keys(sk).forEach(k=>{if(Number(sk[k])>val){val=Number(sk[k]);best=k;}});
 return best;
}

 const n=document.getElementById("nm"); if(n)S.name=n.value.trim();

}

 const level=G.fights.length;
 const opponents=[
   ["Kamil Wrona","Lokalna gala","0-1"],
   ["Adrian Zieliński","HYBRID","2-1"],
   ["Michał Sobiech","HYBRID","4-2"],
   ["Patryk Nowak","Babilon MMA","6-3"]
 ];
 const o=opponents[Math.min(level,opponents.length-1)];
 return {
   opp:o[0],org:o[1],round:1,t:0,events:0,prompt:false,started:false,
   score:0,roundAdv:0,roundScores:[],fightScores:[],
   log:[
    "🎙️ KOMENTATOR: Obaj zawodnicy są już w klatce.",
    "🎙️ KOMENTATOR: Sędzia sprawdza rękawice i daje ostatnie instrukcje.",
    "🎙️ KOMENTATOR: Zaczynamy pojedynek — pierwsze sekundy należą do rozpoznania dystansu."
   ]
 };
}
function record(){
 const fs=Array.isArray(G.fights)?G.fights:[];
 let w=0,l=0,d=0;
 fs.forEach(f=>{if(f.r==="W")w++;else if(f.r==="L")l++;else d++;});
 return w+"-"+l+"-"+d;
}
function currentRoundScore(){
 const a=G.fight?G.fight.roundAdv:0;
 if(a>=4)return "10-8";
 if(a<=-4)return "8-10";
 if(a>0)return "10-9";
 if(a<0)return "9-10";
 return "10-10";
}

 if(G.financeLog.length>30)G.financeLog.length=30;

 if(G.event||G.fight)return false;

 // First fight after a realistic preparation block, then new offers depend on record.

 }

 }
 return true;
}

function fightHealth(f,player){
 if(!f)return 50;
 let total=0;
 (f.roundScores||[]).forEach(x=>{total+=(x[0]-x[1]);});
 total += Number(f.visualAdv!==undefined?f.visualAdv:(f.roundAdv||0));
 const h=50+(player?total:-total)*5;
 return Math.max(20,Math.min(100,Math.round(h)));
}

 const oa=document.getElementById("oppHp"),ob=document.getElementById("oppHpBar");
 if(pa)pa.textContent=a+"%";if(pb)pb.style.width=a+"%";
 if(oa)oa.textContent=b+"%";if(ob)ob.style.width=b+"%";
 document.querySelectorAll(".leadmark").forEach((el,i)=>{
   const mine=i===0;
   const lead=a===b?"= RÓWNO":(mine?(a>b?"▲ PROWADZI":"▼ TRACI"):(b>a?"▲ PROWADZI":"▼ TRACI"));
   el.textContent=lead;
 });
}
function fightScreen(){
 const f=G.fight;if(!f)return dashboard();
 const ph=fightHealth(f,true),oh=fightHealth(f,false);

 const total=f.roundScores.length?f.roundScores.reduce((a,b)=>a+b[0],0):0;

 app.innerHTML='<div class="fightlock"><div class="fighttop"><b>🥊 '+esc(S.name)+' vs '+esc(f.opp)+'</b><span>'+esc(f.org)+' · RUNDA '+f.round+'/3</span></div>'+

 '<div class="clock"><div class="clockin"><small>POZOSTAŁO</small><div class="time">'+timeLeft(f.t)+'</div><small>RUNDA '+f.round+' · ZEGAR '+(f.prompt?"ZATRZYMANY":"BIEGNIE")+'</small></div></div>'+
 '<div class="fighter"><b>'+esc(f.opp)+'</b><p>RYWAL</p><div class="hp-label"><span>FORMA WALKI</span><strong>'+oh+'%</strong></div><div class="hpbar opp"><i style="width:'+oh+'%"></i></div><small class="leadmark">'+(oh>ph?"▲ PROWADZI":oh<ph?"▼ TRACI":"= RÓWNO")+'</small></div></div>'+
 '<div class="fight-score"><div class="scorebox"><small>PUNKTACJA TEJ RUNDY</small><b>'+sc+'</b><small>przewaga na podstawie przebiegu rundy</small></div><div class="scorebox"><small>SUMA RUND</small><b>'+total+' – '+oppTotal+'</b><small>10-9 / 10-8 zgodnie z przewagą</small></div></div>'+
 '<div class="comment">'+f.log.slice(0,32).map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>'+

}

function timeLeft(t){let l=Math.max(0,300-t),m=Math.floor(l/60),s=Math.floor(l%60),d=Math.floor((l-Math.floor(l))*10);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d}
function startFight(){
 const f=G.fight;
 if(!f||f.started)return;
 f.started=true;f.last=performance.now();fightScreen();requestAnimationFrame(fightTick);
}
function fightTick(){
 const f=G.fight;if(!f||f.prompt||!f.started)return;
 const now=performance.now(),dt=Math.min(.1,(now-f.last)/1000);f.last=now;
 f.t+=dt*5.8;

 // Natural fight commentary roughly every 10-16 seconds of fight time.
 if(!f.nextComment)f.nextComment=22+Math.random()*10;
 if(f.t>=f.nextComment){
   const comments=[
    "Obaj zawodnicy krążą po klatce i szukają właściwego dystansu.",
    "Jab pracuje regularnie. Rywal musi uważać na wejście w półdystans.",
    "Tempo jest wysokie, ale na razie nikt nie chce otworzyć się bez potrzeby.",
    "Dobra praca nóg — zawodnik nie stoi przed rywalem w miejscu.",
    "Rywal zaczyna mocniej pracować na korpus. To może mieć znaczenie w końcówce rundy.",
    "Widać coraz więcej krótkich wymian w półdystansie.",
    "Obaj zawodnicy zaczynają czytać swoje reakcje. To już nie jest tylko rozpoznanie.",
    "Publiczność reaguje na każdą wymianę. Walka nabiera tempa.",
    "Rywal próbuje przejąć środek klatki, ale nie dostaje go za darmo.",
    "Coraz więcej pracy przy siatce — pozycja może za chwilę zdecydować o kolejnej akcji."
   ];
   f.log.unshift("🎙️ KOMENTATOR: "+comments[Math.floor(Math.random()*comments.length)]);
   f.nextComment=f.t+10+Math.random()*7;
   // Keep commentary readable rather than growing forever.
   if(f.log.length>40)f.log.length=40;
 }

 // Continuous visual score drift: a fighter who is ahead in the current round
 // gradually gets a larger advantage bar. It is intentionally subtle between
 // tactical decisions.
 const staminaPressure=(f.t/300)*0.8;
 f.visualAdv=(f.roundAdv||0)+Math.sin(f.t/38)*0.12-staminaPressure*(f.roundAdv<0?-1:1);

 if(f.t>35+f.events*62&&f.events<4){
   f.events++;
   f.prompt=true;
   clearInterval(f.timer);
   const situations=[
    "🎙️ KOMENTATOR: Rywal odsłania prawy łokieć po prostym — pojawia się moment na ciasny łokieć.",
    "🎙️ KOMENTATOR: Rywal cofa się pod siatkę. Jest przestrzeń na akcję po rotacji.",
    "🎙️ KOMENTATOR: Zmiana poziomu jest dostępna — rywal przeniósł ciężar na przednią nogę.",
    "🎙️ KOMENTATOR: Po wymianie rywal zostaje wysoko. Można wejść w półdystans."
   ];
   f.log.unshift(situations[f.events-1]);
   f.log.unshift("⏸️ CZAS ZATRZYMANY — WYBIERZ REAKCJĘ");
   fightScreen();return;
 }
 if(f.t>=300){endRound();return;}

 // Update only the live HUD; do not rebuild the entire fight DOM.
 const timeEl=document.querySelector(".fightlock .time");
 if(timeEl)timeEl.textContent=timeLeft(f.t);
 const phaseEl=document.querySelector(".fightlock .clockin small:last-child");
 if(phaseEl)phaseEl.textContent="RUNDA "+f.round+" · ZEGAR BIEGNIE";
 updateFightBars();
 requestAnimationFrame(fightTick);
}

function endRound(){
 const f=G.fight;clearInterval(f.timer);
 const adv=f.roundAdv;
 let my=10,opp=10;
 if(adv>=4){my=10;opp=8}else if(adv>0){my=10;opp=9}else if(adv<=-4){my=8;opp=10}else if(adv<0){my=9;opp=10}
 f.roundScores.push([my,opp]);
 f.log.unshift("🔔 KONIEC RUNDY "+f.round+" — punktacja: "+my+"-"+opp+".");
 if(f.round<3){f.round++;f.t=0;f.events=0;f.roundAdv=0;f.prompt="corner";f.mid=false;f.late=false;fightScreen();}
 else finishFight();
}


function decision(){
 const f=G.fight;
 if(f.prompt==="corner")return '<div class="decision"><b>🗣️ NAROŻNIK · PRZERWA</b><div class="acts"><button type="button" class="act corner-btn" data-corner="1">„Spokojnie, jab i dystans”<small>techniczna kontrola</small></button><button type="button" class="act corner-btn" data-corner="2">„Dociskaj go pod siatkę”<small>presja</small></button><button type="button" class="act corner-btn" data-corner="3">„KURWA, CIŚNIJ!”<small>charakter</small></button><button type="button" class="act corner-btn" data-corner="4">„Oddychaj, wróć do planu”<small>regeneracja</small></button></div></div>';
 return '<div class="decision"><b>⏸ ZEGAR ZATRZYMANY · REAKCJA '+f.events+'/4</b><p class="decisionhint">'+(f.events===1?"Rywal odsłonił bok po prostym.":f.events===2?"Cofa się pod siatkę.":f.events===3?"Przenosi ciężar na przednią nogę.":"Został wysoko po wymianie.")+'</p><div class="acts">'+
 '<button type="button" class="act risk fight-action" data-chance="25" data-action="ŁOKIEĆ Z KRÓTKIEGO KLINCZU"><strong>ŁOKIEĆ Z KRÓTKIEGO KLINCZU</strong><small>25% · wysoka nagroda</small></button>'+
 '<button type="button" class="act fight-action" data-chance="40" data-action="BACKFIST PO ROTACJI"><strong>BACKFIST PO ROTACJI</strong><small>40% · timing</small></button>'+
 '<button type="button" class="act fight-action" data-chance="65" data-action="DOUBLE LEG PO ZMIANIE POZIOMU"><strong>DOUBLE LEG PO ZMIANIE POZIOMU</strong><small>65% · solidna technika</small></button>'+
 '<button type="button" class="act safe fight-action" data-chance="85" data-action="JAB · LOW KICK · WYJŚCIE"><strong>JAB · LOW KICK · WYJŚCIE</strong><small>85% · bezpieczne punkty</small></button>'+
 '</div></div>';
}

function corner(type){
 const f=G.fight;if(!f)return;
 if(type===1){f.roundAdv+=1;f.log.unshift("🗣️ NAROŻNIK: „Spokojnie. Jab, dystans, nie oddawaj pozycji.”");}
 if(type===2){f.roundAdv+=2;f.log.unshift("🗣️ NAROŻNIK: „Dociskaj go, ale nie szalej z wejściem!”");G.fatigue=Math.min(100,G.fatigue+3);}
 if(type===3){f.roundAdv+=3;f.log.unshift("🗣️ NAROŻNIK: „KURWA, CIŚNIJ! Masz go!”");G.fatigue=Math.min(100,G.fatigue+5);}
 if(type===4){f.roundAdv+=0;G.fatigue=Math.max(0,G.fatigue-8);f.log.unshift("🗣️ NAROŻNIK: „Oddychaj. Druga minuta jest twoja.”");}
 f.prompt=false;f.last=performance.now();fightScreen();requestAnimationFrame(fightTick);
}


function resumeFightFromWheel(overlay){
 const f=G.fight;
 if(!f || !overlay)return;
 overlay.remove();
 f.wheelBusy=false;
 f.prompt=false;
 f.last=performance.now();
 if(f.timer)clearInterval(f.timer);
 f.timer=setInterval(fightTick,60);
 fightScreen();
}
function action(ch,name){
 const f=G.fight;
 if(!f || f.wheelBusy || !f.prompt)return;
 f.wheelBusy=true;
 const chance=Math.max(25,Math.min(85,Number(ch)||25));
 const success=Math.random()*100<chance;
 const green=chance, red=100-chance;
 let pos=0,segments=[];
 for(let i=0;i<8;i++){
   const size=(i%2===0?green:red)/4;
   const color=i%2===0?"#35c77b":"#d94d5b";
   segments.push(color+" "+pos+"% "+(pos+size)+"%");
   pos+=size;
 }
 const o=document.createElement("div");
 o.className="overlay fight-wheel-overlay";
 o.innerHTML=
 '<div class="modal fight-wheel-modal">'+
   '<button type="button" class="fw-x" aria-label="Zamknij">×</button>'+
   '<div class="fw-kicker">REAKCJA W WALCE · ZEGAR ZATRZYMANY</div>'+
   '<h2>'+esc(name)+'</h2>'+
   '<div class="fw-scene">RYZYKO DECYZJI <b>'+chance+'%</b></div>'+
   '<div class="fw-wheel-wrap"><div class="fw-pointer"></div>'+
   '<div class="fw-wheel" id="fwWheel" style="background:conic-gradient('+segments.join(",")+')"></div>'+
   '<div class="fw-center">MMA<br><small>DECISION</small></div></div>'+
   '<div class="fw-legend"><span class="fw-green">SUKCES '+chance+'%</span><span class="fw-red">NIEPOWODZENIE '+red+'%</span></div>'+
   '<div class="fw-status" id="fwStatus">LOSOWANIE...</div>'+
   '<div class="fw-comment" id="fwComment">Sprawdzamy, czy zawodnik wykorzystał moment.</div>'+
   '<button type="button" class="btn primary fw-close">WRÓĆ DO WALKI</button>'+
 '</div>';
 document.body.appendChild(o);

 // Direct listeners — both controls perform exactly the same close action.
 o.querySelector(".fw-x").addEventListener("click",()=>resumeFightFromWheel(o));
 o.querySelector(".fw-close").addEventListener("click",()=>resumeFightFromWheel(o));

 const wheel=o.querySelector("#fwWheel");
 const target=success ? Math.random()*green : green+Math.random()*red;
 const rotation=2160+(360-target);
 requestAnimationFrame(()=>wheel.style.transform="rotate("+rotation+"deg)");

 setTimeout(()=>{
   if(!o.isConnected)return;
   const status=o.querySelector("#fwStatus");
   const comment=o.querySelector("#fwComment");
   status.textContent=success?"🟢 DECYZJA SIĘ UDAŁA":"🔴 DECYZJA NIEUDANA";
   status.className="fw-status "+(success?"fw-success":"fw-fail");
   comment.textContent=fightCommentary(name,success,"");
   f.roundAdv+=success?2:-2;
   f.log.unshift("🎙️ "+comment.textContent);
   // Do not auto-close. Player must close with X or WRÓĆ DO WALKI.
 },2300);
}

function commentSuccess(name){
 const c={
  "ŁOKIEĆ NA GŁOWĘ":"Łokieć wchodzi czysto! Rywal cofa głowę i wyraźnie odczuwa tę akcję.",
  "BACKFIST PO LUKĘ":"Backfist trafia! Świetnie wykorzystana luka po wycofaniu rywala.",
  "DOUBLE LEG W KONTRZE":"Double leg siada. Zawodnik sprowadza rywala i zdobywa kontrolę.",
  "ZAMKNIJ POZYCJĘ":"Bardzo metodyczna akcja. Zamyka dystans i odbiera rywalowi przestrzeń."
 };
 return c[name]||"Bardzo dobra realizacja założenia taktycznego.";
}
function commentFail(name){
 const c={
  "ŁOKIEĆ NA GŁOWĘ":"Łokieć był za daleko. Rywal odchylił głowę i odpowiedział krótkim ciosem.",
  "BACKFIST PO LUKĘ":"Backfist minął cel. Rywal zdążył odczytać rotację.",
  "DOUBLE LEG W KONTRZE":"Rywal sprawlował i zatrzymał zejście. Próba kosztowała trochę energii.",
  "ZAMKNIJ POZYCJĘ":"Rywal nie pozwolił zamknąć dystansu i wrócił na środek klatki."
 };
 return c[name]||"Rywal dobrze odczytał zamiar.";
}


function finishFight(){
 const f=G.fight;if(!f)return;
 clearInterval(f.timer);
 let my=f.roundScores.reduce((s,x)=>s+x[0],0),opp=f.roundScores.reduce((s,x)=>s+x[1],0);
 if(f.finishMethod==="KO"||f.finishMethod==="SUBMISSION"){my=99;opp=0;}
 const win=f.finishMethod==="KO"||f.finishMethod==="SUBMISSION"||my>opp;
 const method=f.finishMethod==="KO"?"KO/TKO":f.finishMethod==="SUBMISSION"?"Submission":"Decision";
 G.fights.push({r:win?"W":"L",o:f.opp,org:f.org,m:method,rd:f.round});
 G.rep=Math.max(0,Math.min(100,G.rep+(win?5:-2)));
 G.money+=win?1000:500;
 G.logs.unshift((win?"🏆 WYGRANA ":"❌ PORAŻKA ")+f.opp+" · "+method);
 G.media.unshift(win?(method==="Decision"?"📺 Debiutant wygrywa decyzją sędziów.":"🔥 Zakończenie przed czasem trafia do mediów."):"📰 Debiut zakończony porażką — czas wyciągnąć wnioski.");
 G.fight=null;
 app.innerHTML='<div class="result"><div class="resultbox"><div class="tag">OFICJALNY WYNIK</div><h1 class="'+(win?"win":"loss")+'">'+(f.finishMethod==="KO"?"💥 NOKAUT":f.finishMethod==="SUBMISSION"?"🔒 PODDANIE":win?"🏆 ZWYCIĘSTWO":"PORAŻKA")+'</h1><h2>'+esc(S.name)+' vs '+esc(f.opp)+'</h2><p>'+method+' · '+(f.finishMethod?"Runda "+f.round:"po "+f.round+" rundach")+'</p><div class="fight-score"><div class="scorebox"><small>PUNKTACJA</small><b>'+my+' – '+opp+'</b></div><div class="scorebox"><small>REKORD</small><b>'+record()+'</b></div></div><button type="button" class="btn primary" onclick="dashboard()">KONTYNUUJ KARIERĘ</button></div></div>';
}

document.addEventListener("click",function(e){
 const t=e.target.closest ? e.target.closest("#realStart") : null;
 if(t){e.preventDefault();beginCareerNow();}
});
window.addEventListener("error",function(e){
 console.error("MMA Career Simulator:",e.error||e.message);
});

document.addEventListener("click",function(e){
 const actionBtn=e.target.closest && e.target.closest(".fight-action");
 if(actionBtn){
   e.preventDefault();
   const chance=Number(actionBtn.dataset.chance);
   const name=actionBtn.dataset.action;
   if(G.fight && G.fight.prompt && !G.fight.wheelBusy) action(chance,name);
   return;
 }
 const cornerBtn=e.target.closest && e.target.closest(".corner-btn");
 if(cornerBtn){
   e.preventDefault();
   const n=Number(cornerBtn.dataset.corner);
   if(G.fight && G.fight.prompt) corner(n);
 }
});

window.action=action;
window.decision=decision;
</script></body></html>
