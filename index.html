<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V82</title><style>
*{box-sizing:border-box}body{margin:0;background:#060d12;color:#edf2f4;font:14px Arial,sans-serif}button{cursor:pointer;font:inherit}.app{min-height:100vh}.creator,.career{min-height:100vh}.creator{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#173c50,#05090d 55%),#05090d}.box,.panel,.card{background:#0d171f;border:1px solid #294252;border-radius:8px}.creator .box{width:min(1050px,95vw);padding:28px;box-shadow:0 25px 80px #000}.brand{font-weight:900;font-size:27px;letter-spacing:1px}.brand span{color:#d6ab45}.muted{color:#8295a0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{margin:18px 0}.field label{display:block;color:#81949f;font-size:10px;margin-bottom:6px}.field input{width:100%;padding:12px;background:#071018;color:#fff;border:1px solid #294554;border-radius:5px}.pick{position:absolute;opacity:0}.picklabel{display:block;padding:15px;min-height:85px;background:#101e28;border:1px solid #294454;border-radius:6px;cursor:pointer}.picklabel:hover,.pick:checked+.picklabel{border-color:#d6ab45;background:#211f15}.picklabel small{display:block;color:#8295a0;margin-top:7px;line-height:1.4}.actions{display:flex;justify-content:space-between;margin-top:18px}.btn{padding:10px 15px;background:#101e28;color:#fff;border:1px solid #355063;border-radius:5px}.primary{background:#80652b;border-color:#d6ab45;font-weight:800}.career header{height:70px;padding:0 24px;background:#060c12;border-bottom:1px solid #223946;display:flex;align-items:center}.topplayer{margin-left:auto;text-align:right}.topplayer small{display:block;color:#718692;margin-top:4px}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 70px)}nav{background:#060c12;padding:14px 10px;border-right:1px solid #1d3440}nav button{width:100%;padding:11px;margin:3px 0;text-align:left;background:transparent;color:#82949f;border:1px solid transparent;border-radius:5px}nav button:hover,nav button.active{background:#171c18;color:#e2bd5b;border-color:#705b2d}.content{max-width:1400px;width:100%;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{margin:4px 0}.eyebrow{font-size:9px;letter-spacing:1.6px;color:#c9a248;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:15px;background:linear-gradient(145deg,#101c25,#091218);border:1px solid #263f4d;border-radius:7px}.stat small{display:block;color:#718692;font-size:9px}.stat strong{display:block;font-size:22px;margin:7px 0}.cols{display:grid;grid-template-columns:1.6fr .8fr;gap:12px}.panel{padding:15px;margin-bottom:12px}.panel h3{margin:0 0 10px}.feed{padding:9px 0;border-bottom:1px solid #172b36;font-size:11px;line-height:1.4}.eventhero{padding:20px;background:linear-gradient(135deg,#17170f,#0f1b22);border:1px solid #80662d;border-radius:7px;margin-bottom:12px}.quick button{display:block;width:100%;margin:6px 0}.fight{min-height:100vh;background:radial-gradient(circle at 50% 5%,#17394d,#050b10 55%,#020406);padding:18px}.fighttop{max-width:1180px;margin:auto;display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #294252}.fighters{max-width:1100px;margin:18px auto 10px;display:grid;grid-template-columns:1fr 210px 1fr;gap:18px;align-items:center;text-align:center}.fighter{padding:18px;background:#0b161f;border:1px solid #2a4656;border-radius:7px}.fighter b{font-size:20px}.fighter p{color:#718692;font-size:9px}.hp{height:16px;background:#27171b;border:1px solid #49323a;border-radius:3px;overflow:hidden}.hp i{display:block;height:100%;background:linear-gradient(90deg,#65e29c,#23945d);transition:.35s}.hp.opp i{background:linear-gradient(90deg,#ee7077,#a42e39)}.clock{width:180px;height:180px;border-radius:50%;margin:auto;border:8px solid #d1a946;background:#091218;display:grid;place-items:center}.time{font:700 31px monospace}.scoregrid{max-width:1100px;margin:10px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.scorebox{padding:11px;background:#071018;border:1px solid #294554;border-radius:6px}.scorebox small{display:block;color:#718692;font-size:9px}.scorebox b{font-size:17px}.comment{max-width:1100px;height:240px;overflow:auto;margin:10px auto;background:#050c11;border:1px solid #223d4c;border-radius:6px;padding:12px}.comment p{margin:0;padding:6px 0;border-bottom:1px solid #132631;font-size:11px;line-height:1.45}.decision{max-width:1100px;margin:12px auto;padding:15px;background:#0c171f;border:1px solid #80662d;border-radius:7px}.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.act{min-height:76px;padding:11px;text-align:left;background:#101f29;color:#fff;border:1px solid #294554;border-radius:5px}.act:hover{border-color:#d2ab48;background:#191b14}.act small{display:block;color:#d0ae57;margin-top:5px}.overlay{position:fixed;inset:0;z-index:1000;background:#020609ee;display:grid;place-items:center;padding:20px}.modal{width:min(850px,94vw);max-height:90vh;overflow:auto;padding:24px;background:#0d1821;border:1px solid #80662d;border-radius:8px;box-shadow:0 25px 100px #000}.modal h2{margin-top:5px}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.wheel{width:280px;height:280px;margin:15px auto;border-radius:50%;border:7px solid #64747e;transition:transform 2s cubic-bezier(.12,.74,.1,1);box-shadow:0 15px 45px #000;background:conic-gradient(#35c77b 0 65%,#d94d5b 65% 100%)}.result{min-height:100vh;display:grid;place-items:center;padding:20px}.resultbox{width:min(800px,94vw);padding:35px;text-align:center;background:#0d171f;border:1px solid #344e5c;border-radius:8px}.win{color:#4bd892}.loss{color:#e05e68}.tag{font-size:9px;letter-spacing:1.5px;color:#d1aa4c;font-weight:900}@media(max-width:900px){.grid,.stats,.cols,.fighters,.acts{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.clock{order:-1}.cols{grid-template-columns:1fr}}@media(max-width:600px){.grid,.stats,.scoregrid,.choicegrid,.acts{grid-template-columns:1fr}.content{padding:12px}.fight{padding:10px}}
</style></head><body><div id="app"></div><script>
"use strict";
const app=document.getElementById('app');
const profiles={"Wonderkid":{desc:'Szybki, młody talent.',b:7,g:5,w:4,j:5,c:6,s:9,p:2,ch:2},"Fizol":{desc:'Siła, presja i fizyczność.',b:3,g:4,w:6,j:2,c:5,s:2,p:10,ch:8},"Mistrz zapasów":{desc:'Obalenia i kontrola.',b:1,g:8,w:12,j:7,c:7,s:4,p:5,ch:4},"Czysty striker":{desc:'Boks, dystans i nokauty.',b:12,g:0,w:-2,j:0,c:6,s:9,p:5,ch:2},"Człowiek-guma":{desc:'BJJ, przetrwanie i poddania.',b:2,g:10,w:3,j:12,c:6,s:5,p:1,ch:10},"All-rounder":{desc:'Równy rozwój całego MMA.',b:5,g:5,w:5,j:5,c:6,s:5,p:5,ch:5},"Lokalny bijok":{desc:'Agresja i odporność.',b:7,g:2,w:2,j:-2,c:5,s:3,p:8,ch:10}};
const weights=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];
const state={name:'',profile:'',weight:'',money:8000,day:1,age:16,rep:5,ig:120,fatigue:8,skills:{boks:50,grappling:50,zapasy:50,bjj:50,kondycja:50,szybkosc:50,sila:50,odpornosc:50},fights:[],logs:[],media:[],event:null,fight:null,viral:0,motivation:50};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function creator(){let p=Object.keys(profiles).map((x,i)=>`<input class="pick" id="p${i}" type="radio" name="p" value="${x}"><label class="picklabel" for="p${i}"><b>${x}</b><small>${profiles[x].desc}<br>Boks ${profiles[x].b>0?'+':''}${profiles[x].b} · Grappling ${profiles[x].g>0?'+':''}${profiles[x].g} · Zapasy ${profiles[x].w>0?'+':''}${profiles[x].w} · BJJ ${profiles[x].j>0?'+':''}${profiles[x].j}</small></label>`).join('');let w=weights.map((x,i)=>`<input class="pick" id="w${i}" type="radio" name="w" value="${x}"><label class="picklabel" for="w${i}"><b>${x}</b><small>Kategoria wagowa</small></label>`).join('');app.innerHTML=`<div class="creator"><div class="box"><div class="brand">MMA <span>CAREER SIMULATOR</span></div><p class="muted">V80 · przebudowana mechanika walki</p><div class="field"><label>IMIĘ I NAZWISKO</label><input id="name" placeholder="np. Jan Kowalski"></div><h3>PROFIL ZAWODNIKA</h3><div class="grid">${p}</div><h3>KATEGORIA</h3><div class="grid">${w}</div><div class="actions"><span></span><button class="btn primary" onclick="start()">ROZPOCZNIJ KARIERĘ →</button></div></div></div>`}
function start(){let n=document.getElementById('name').value.trim(),p=document.querySelector('input[name=p]:checked'),w=document.querySelector('input[name=w]:checked');if(!n||!p||!w)return alert('Uzupełnij imię, profil i kategorię.');state.name=n;state.profile=p.value;state.weight=w.value;let d=profiles[state.profile];state.skills={boks:50+d.b,grappling:50+d.g,zapasy:50+d.w,bjj:50+d.j,kondycja:50+d.c,szybkosc:50+d.s,sila:50+d.p,odpornosc:50+d.ch};state.logs=['🥊 Kariera rozpoczęta.','🎙️ Pierwszy cel: zbudować nazwisko i dostać debiut.'];state.media=['📱 Konto startowe: 120 obserwujących.'];dashboard()}
function record(){let w=state.fights.filter(x=>x.r==='W').length,l=state.fights.filter(x=>x.r==='L').length,d=state.fights.filter(x=>x.r==='D').length;return `${w}-${l}-${d}`}
function dashboard(){app.innerHTML=`<div class="career"><header><div class="brand">MMA <span>CAREER SIMULATOR</span></div><div class="topplayer"><b>${esc(state.name)}</b><small>${state.age} lat · ${state.weight}</small></div></header><div class="shell"><nav><button class="active" onclick="dashboard()">⌂ PRZEGLĄD</button><button onclick="stats()">▦ STATYSTYKI</button><button onclick="motivation()">🔥 MOTYWACJA</button><button onclick="events()">◉ EVENTY</button></nav><main class="content"><div class="head"><div><div class="eyebrow">CENTRUM KARIERY</div><h1>Dzień ${state.day}</h1><p class="muted">Decyzje budują zawodnika, rekord i rozpoznawalność.</p></div><button class="btn primary" onclick="advance()">⏩ NASTĘPNY ISTOTNY MOMENT</button></div><div class="stats"><div class="stat"><small>REKORD</small><strong>${record()}</strong></div><div class="stat"><small>INSTAGRAM</small><strong>${state.ig}</strong></div><div class="stat"><small>REPUTACJA</small><strong>${state.rep}/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>${state.motivation}/100</strong></div></div><div class="cols"><section><div class="eventhero"><div class="tag">NAJWAŻNIEJSZE</div><h2>${state.event?esc(state.event.title):'Droga do kolejnej walki'}</h2><p>${state.event?esc(state.event.text):'Trenuj, buduj formę i reputację. Gra zatrzyma czas, gdy pojawi się ważna decyzja.'}</p><button class="btn primary" onclick="${state.event?'showEvent()':'advance()'}">${state.event?'OTWÓRZ WYDARZENIE':'PRZEJDŹ DALEJ'}</button></div><div class="panel"><h3>📰 MEDIA / VIRAL</h3>${state.media.slice(0,8).map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</div></section><aside><div class="panel"><h3>🥊 FORMA</h3><div class="feed">Zmęczenie: ${state.fatigue}%</div><div class="feed">Profil: ${esc(state.profile)}</div><div class="feed">Najmocniejsza: ${best()}</div></div><div class="panel quick"><h3>SZYBKO</h3><button class="btn" onclick="advance()">▶ Symuluj czas</button><button class="btn" onclick="motivation()">🔥 Motywacja</button><button class="btn" onclick="stats()">📊 Statystyki</button></div></aside></div></main></div></div>`}
function best(){return Object.entries(state.skills).sort((a,b)=>b[1]-a[1])[0][0]}
function stats(){app.innerHTML=`<div class="career"><header><div class="brand">MMA <span>CAREER SIMULATOR</span></div><div class="topplayer"><b>${esc(state.name)}</b></div></header><div class="shell"><nav><button onclick="dashboard()">⌂ PRZEGLĄD</button><button class="active">▦ STATYSTYKI</button><button onclick="motivation()">🔥 MOTYWACJA</button><button onclick="events()">◉ EVENTY</button></nav><main class="content"><div class="head"><div><div class="eyebrow">ROZWÓJ</div><h1>Statystyki</h1></div></div><div class="stats">${Object.entries(state.skills).map(([k,v])=>`<div class="stat"><small>${k.toUpperCase()}</small><strong>${Math.round(v)}</strong><div class="hp"><i style="width:${v}%"></i></div></div>`).join('')}</div></main></div></div>`}
function motivation(){let opts=[['🔥 OGLĄDAJ STARE WALKI',6,0,'+6 motywacji'],['🥊 DODATKOWY TRENING',12,5,'+8 forma'],['👊 WYZWANIE RYWALA W SOCIALACH',4,10,'+viral'],['🧘 DZIEŃ RESETU',-8,-3,'-zmęczenie']];app.innerHTML=`<div class="career"><header><div class="brand">MMA <span>CAREER SIMULATOR</span></div></header><div class="shell"><nav><button onclick="dashboard()">⌂ PRZEGLĄD</button><button onclick="stats()">▦ STATYSTYKI</button><button class="active">🔥 MOTYWACJA</button><button onclick="events()">◉ EVENTY</button></nav><main class="content"><div class="panel"><div class="eyebrow">ŻYCIE POMIĘDZY WALKAMI</div><h1>Motywacja</h1><p class="muted">Twoje zachowanie pomiędzy walkami wpływa na formę, media i przyszłe oferty.</p><div class="grid">${opts.map((o,i)=>`<div class="card" style="padding:15px"><h3>${o[0]}</h3><p class="muted">${o[3]}</p><button class="btn primary" onclick="motAct(${i})">WYBIERAM</button></div>`).join('')}</div></div></main></div></div>`}
function motAct(i){let a=[[6,0],[12,5],[4,10],[-8,-3]][i];state.motivation=Math.max(0,Math.min(100,state.motivation+a[0]));state.fatigue=Math.max(0,state.fatigue+a[1]);if(i===2){state.viral++;state.ig+=50+state.viral*20;state.media.unshift('🔥 Viral: zawodnik wywołał rywala w socialach.');state.rep=Math.min(100,state.rep+1)}else state.logs.unshift('🧠 Zawodnik podjął decyzję poza klatką.');state.day++;dashboard()}
function events(){app.innerHTML=`<div class="career"><header><div class="brand">MMA <span>CAREER SIMULATOR</span></div></header><div class="shell"><nav><button onclick="dashboard()">⌂ PRZEGLĄD</button><button onclick="stats()">▦ STATYSTYKI</button><button onclick="motivation()">🔥 MOTYWACJA</button><button class="active">◉ EVENTY</button></nav><main class="content"><div class="panel"><h1>Dziennik kariery</h1>${state.logs.concat(state.media).slice(0,30).map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</div></main></div></div>`}
function advance(){if(state.fight)return fightScreen();if(state.event)return showEvent();for(let i=0;i<120&&!state.event;i++){state.day++;state.age=16+Math.floor(state.day/365);state.fatigue=Math.min(100,state.fatigue+1);state.motivation=Math.max(0,state.motivation-.15);Object.keys(state.skills).forEach(k=>state.skills[k]=Math.min(100,state.skills[k]+.05));if(state.day>=45&&state.fights.length===0)state.event={title:'Oferta debiutu — lokalna gala',text:'Dostałeś pierwszą propozycję walki. Możesz wejść do klatki albo poczekać i dalej budować formę.',a:'PRZYJMUJĘ WALKĘ',b:'ODKŁADAM DEBIUT',type:'fight'};if(state.day>=state.fights.length*70+100&&state.fights.length>0)state.event={title:'Kolejna oferta walki',text:'Promotor chce zobaczyć, czy potrafisz potwierdzić poprzedni wynik.',a:'BIORĘ WALKĘ',b:'ODMAWIAM',type:'fight'}}showEvent()}
function showEvent(){if(!state.event)return dashboard();let e=state.event;let o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal"><div class="tag">DZIEŃ ${state.day}</div><h2>${esc(e.title)}</h2><p>${esc(e.text)}</p><div class="choicegrid"><button class="btn primary" id="yes">${e.a}</button><button class="btn" id="no">${e.b}</button></div></div>`;document.body.appendChild(o);o.querySelector('#yes').onclick=()=>resolveEvent(true,o);o.querySelector('#no').onclick=()=>resolveEvent(false,o)}
function resolveEvent(ok,o){let e=state.event;state.event=null;o.remove();if(e.type==='fight'&&ok){state.fight=newFight();fightScreen()}else{state.motivation=Math.max(0,state.motivation+(ok?4:-5));state.day+=7;state.logs.unshift(ok?'🥊 Przyjęto wyzwanie.':'⏳ Odłożono walkę.');dashboard()}}
function newFight(){let names=[['Kamil Wrona','Lokalna Gala'],['Adrian Zieliński','HYBRID'],['Michał Sobiech','Babilon MMA'],['Patryk Nowak','FEN']];let o=names[Math.min(state.fights.length,names.length-1)];let opp={hp:100,st:100,score:0,style:['striker','wrestler','grappler'][Math.floor(Math.random()*3)]};return{opp:o[0],org:o[1],round:1,t:0,started:false,prompt:false,events:0,roundAdv:0,roundScores:[],playerHp:100,oppHp:100,playerSt:100,oppSt:100,ko:0,sub:0,log:['🎙️ JURA: Panowie, witamy w klatce! Dzisiaj będzie ogień.','🎙️ JURA: Sędzia sprawdza rękawice... i zaczynamy!'],oppStyle:opp.style}}
const jura=['Panowie, tutaj nie ma miejsca na przypadek — jest robota!','Oooo, ale timing! Rywal właśnie zobaczył, że to nie będzie spacerek.','JURA: To jest ten moment, który potem ląduje w viralach!','Publiczność już to kupiła. Zobaczcie tę reakcję!','On zaczyna czytać rywala. To nie jest zwykła bójka, to jest szachy w rękawicach.','Ależ presja! Rywal nie ma gdzie uciec.','Mamy tutaj piękną pracę na nogach i bardzo złą wiadomość dla przeciwnika.','Jeżeli to pójdzie dalej w tym tempie, sędzia może mieć za chwilę robotę.'];
function fightScreen(){let f=state.fight;if(!f)return dashboard();let total=f.roundScores.reduce((a,b)=>[a[0]+b[0],a[1]+b[1]],[0,0]);app.innerHTML=`<div class="fight"><div class="fighttop"><b>🥊 ${esc(state.name)} vs ${esc(f.opp)}</b><span>${f.org} · RUNDA ${f.round}/3</span></div><div class="fighters"><div class="fighter"><b>${esc(state.name)}</b><p>FORMA · ${Math.round(f.playerHp)}% · STAMINA ${Math.round(f.playerSt)}%</p><div class="hp"><i style="width:${f.playerHp}%"></i></div></div><div class="clock"><div><div class="time">${left(f.t)}</div><small>RUNDA ${f.round}</small></div></div><div class="fighter"><b>${esc(f.opp)}</b><p>FORMA · ${Math.round(f.oppHp)}% · STAMINA ${Math.round(f.oppSt)}%</p><div class="hp opp"><i style="width:${f.oppHp}%"></i></div></div></div><div class="scoregrid"><div class="scorebox"><small>RUNDA</small><b>${roundScore(f.roundAdv)}</b></div><div class="scorebox"><small>SUMA</small><b>${total[0]} – ${total[1]}</b></div></div><div class="comment">${f.log.slice(0,35).map(x=>`<p>${esc(x)}</p>`).join('')}</div><div id="fightActions">${!f.started?`<div class="decision"><button class="btn primary" onclick="startFight()">🥊 ROZPOCZNIJ WALKĘ</button></div>`:f.prompt?decision():''}</div></div>`}
function left(t){let l=Math.max(0,300-t),m=Math.floor(l/60),s=Math.floor(l%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function roundScore(a){return a>=5?'10-8':a>0?'10-9':a<=-5?'8-10':a<0?'9-10':'10-10'}
function startFight(){let f=state.fight;if(!f||f.started)return;f.started=true;f.last=performance.now();requestAnimationFrame(fightTick)}
function fightTick(){let f=state.fight;if(!f||!f.started||f.prompt)return;let now=performance.now(),dt=Math.min(.1,(now-f.last)/1000);f.last=now;f.t+=dt*6;f.playerSt=Math.max(0,f.playerSt-dt*.035);f.oppSt=Math.max(0,f.oppSt-dt*.04);if(!f.next)f.next=15+Math.random()*10;if(f.t>=f.next){f.log.unshift('🎙️ JURA: '+jura[Math.floor(Math.random()*jura.length)]);f.next=f.t+11+Math.random()*12;if(f.log.length>45)f.log.pop()}if(f.t>35+f.events*60&&f.events<4){f.events++;f.prompt=true;f.log.unshift('⏸️ JURA: STOP! Mamy moment decyzyjny — teraz decyzja zawodnika.');fightScreen();return}if(f.t>=300){endRound();return}let drift=(Math.random()-.48)*dt*.18;f.oppHp=Math.max(1,f.oppHp-drift*2);f.playerHp=Math.max(1,f.playerHp+drift);let el=document.querySelector('.time');if(el)el.textContent=left(f.t);requestAnimationFrame(fightTick)}
