<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator — Tworzenie zawodnika</title><style>*{box-sizing:border-box}body{margin:0;background:#070c11;color:#edf2f4;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 20% 0,#173b49,#060a0e 68%);padding:32px 18px}.wrap{max-width:1180px;margin:auto}.card{background:#101c25;border:1px solid #304955;border-radius:16px;padding:28px;box-shadow:0 18px 55px #0009}.brand{font-size:28px;font-weight:900;letter-spacing:1px}.gold{color:#d6ae51}.muted{color:#91a3ac}.sub{margin-top:6px;color:#91a3ac}.field{margin:18px 0}.field label,.sectionLabel{display:block;color:#9eb0b8;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:7px}.field input{width:100%;padding:14px;background:#071018;color:#fff;border:1px solid #304955;border-radius:9px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.weights{grid-template-columns:repeat(4,1fr)}.budgetgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pick{position:absolute;opacity:0;width:1px;height:1px}.pick+label{display:block;padding:15px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:92px;transition:.15s}.pick+label:hover{border-color:#7f8e95}.pick:checked+label{border-color:#d6ae51;background:#211f15;box-shadow:inset 0 0 0 1px #d6ae51}.pick+label b{font-size:15px}.pick+label small{display:block;color:#9eb0b8;margin-top:7px;line-height:1.4}.typeCard small{min-height:42px}.bonus{margin-top:8px;color:#d6ae51;font-size:11px;font-weight:700}.budgetCard{min-height:128px!important;display:flex!important;flex-direction:column;justify-content:center}.budgetCard .amount{font-size:24px!important;color:#d6ae51;display:block;margin-bottom:8px}.budgetCard small b{color:#fff}.preview{margin-top:18px;padding:18px;border:1px solid #304955;border-radius:12px;background:#0b151d}.preview h3{margin:0 0 8px}.skillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.skill{padding:9px;background:#101e27;border-radius:8px;border:1px solid #243b46}.skill span{display:block;color:#91a3ac;font-size:10px}.skill b{font-size:15px}.actions{display:flex;justify-content:flex-end;margin-top:22px}.primary{cursor:pointer;background:#80652a;border:1px solid #d6ae51;color:#fff;border-radius:9px;padding:13px 18px;font-weight:900;font-size:15px}.hint{font-size:11px;color:#71858f;margin-top:8px}@media(max-width:950px){.grid,.weights,.budgetgrid{grid-template-columns:repeat(2,1fr)}.skillgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.weights,.budgetgrid,.skillgrid{grid-template-columns:1fr}.app{padding:12px}.card{padding:18px}}</style></head><body><div id="app" class="app"></div><script>const KEY='mmaCareerV127';const types={Wonderkid:{desc:'Młody talent: refleks, szybkość i potencjał.',bonus:{Szybkość:10,Boks:5}},Bijok:{desc:'Twarda szczęka, presja i mocne wymiany.',bonus:{Odporność:10,Siła:8,Boks:5}},Fizol:{desc:'Fizyczność, siła i kontrola w klinczu.',bonus:{Siła:10,Zapasy:6,Odporność:5}},Zapaśnik:{desc:'Obalenia, siatka, kontrola i praca z góry.',bonus:{Zapasy:10,Kondycja:6,Siła:5}},Striker:{desc:'Dystans, timing, boks i kopnięcia.',bonus:{Boks:10,Szybkość:8,Kondycja:4}},Gumiarz:{desc:'Parter, kreatywność i przetrwanie w chaosie.',bonus:{BJJ:10,Odporność:8,Zapasy:4}},Allrounder:{desc:'Wszechstronny zawodnik bez jednej dużej słabości.',bonus:{Boks:4,Zapasy:4,BJJ:4,Kondycja:4,Siła:4,Szybkość:4,Odporność:4}}};const budgets=[[5000,'Normalny etat','Praca po godzinach. Mało marginesu finansowego.'],[10000,'Etat + oszczędności','Możesz spokojniej wejść w pierwsze przygotowania.'],[25000,'Rodzina pomaga','Dobre zaplecze na pierwsze obozy i starty.'],[50000,'Bogata rodzina','Dużo większe możliwości inwestowania w karierę.'],[100000,'Rodzinny biznes','Sport może być finansowany jak drugi biznes.']];const weights=[['Flyweight','56,7 kg'],['Bantamweight','61,2 kg'],['Featherweight','65,8 kg'],['Lightweight','70,3 kg'],['Welterweight','77,1 kg'],['Middleweight','83,9 kg'],['Light Heavyweight','93,0 kg'],['Heavyweight','120,2 kg']];const base={Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50,Odporność:50};function money(n){return n.toLocaleString('pl-PL')+' zł'}function creator(){const t=Object.entries(types).map(([name,v],i)=>`<input class="pick" id="t${i}" name="type" type="radio" value="${name}" onchange="preview()"><label class="typeCard" for="t${i}"><b>${name}</b><small>${v.desc}</small><div class="bonus">${Object.entries(v.bonus).map(([k,x])=>k+' +'+x).join(' · ')}</div></label>`).join('');const b=budgets.map((x,i)=>`<input class="pick" id="b${i}" name="budget" type="radio" value="${x[0]}"><label class="budgetCard" for="b${i}"><span class="amount">${money(x[0])}</span><small><b>${x[1]}</b><br>${x[2]}</small></label>`).join('');const w=weights.map((x,i)=>`<input class="pick" id="w${i}" name="weight" type="radio" value="${x[0]}"><label for="w${i}"><b>${x[0]}</b><small>${x[1]}</small></label>`).join('');app.innerHTML=`<div class="wrap"><div class="card"><div class="brand">MMA <span class="gold">CAREER SIMULATOR</span></div><div class="sub">Stwórz zawodnika i rozpocznij karierę od lokalnych gal.</div><div class="field"><label>IMIĘ *</label><input id="first" placeholder="np. Michał"></div><div class="field"><label>NAZWISKO *</label><input id="last" placeholder="np. Kowalski"></div><div class="sectionLabel">TYP ZAWODNIKA *</div><div class="grid">${t}</div><div class="hint">Bonusy pokazują, które umiejętności są promowane przez wybrany profil.</div><div style="height:22px"></div><div class="sectionLabel">BUDŻET STARTOWY *</div><div class="budgetgrid">${b}</div><div class="hint">Wybierz kapitał, z którym rozpoczynasz karierę. Budżet zostanie zapisany w profilu zawodnika.</div><div style="height:22px"></div><div class="sectionLabel">KATEGORIA WAGOWA *</div><div class="grid weights">${w}</div><div id="preview" class="preview"><h3>Podgląd zawodnika</h3><p class="muted">Wybierz typ zawodnika, aby zobaczyć promowane umiejętności.</p></div><div class="actions"><button class="primary" onclick="start()">STWÓRZ KARIERĘ →</button></div></div></div>`}function preview(){const t=document.querySelector('[name=type]:checked');if(!t)return;const v=types[t.value];const skills=Object.entries(base).map(([k,n])=>[k,n+(v.bonus[k]||0)]);document.getElementById('preview').innerHTML='<h3>'+t.value+'</h3><p class="muted">'+v.desc+'</p><div class="skillgrid">'+skills.map(([k,n])=>'<div class="skill"><span>'+k+'</span><b>'+n+'</b>'+(v.bonus[k]?' <span class="gold">+'+v.bonus[k]+'</span>':'')+'</div>').join('')+'</div>'}function start(){const f=document.getElementById('first').value.trim(),l=document.getElementById('last').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=budget]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij imię, nazwisko, typ zawodnika, budżet i kategorię wagową.');return}const skills={...base};Object.entries(types[t.value].bonus).forEach(([k,v])=>skills[k]+=v);const s={created:true,first:f,last:l,type:t.value,weight:w.value,money:+b.value,day:1,age:18,rep:5,ig:100,w:0,l:0,d:0,club:'Lokalny klub',sk:skills,fight:null,history:[],log:['🥊 Start kariery: '+f+' '+l+'. Typ: '+t.value+'. Budżet: '+money(+b.value)+'.'],media:{interviewUntil:0,postUntil:0,controversyUntil:0},manager:null,sponsors:[],income:{gateUntil:0,job:false,adUntil:0,extortCount:0,extortMonth:0},campPlan:[],injuryUntil:0,careerFreezeUntil:0};localStorage.setItem(KEY,JSON.stringify(s));location.href='./mma-v127.html?newcareer='+Date.now()}creator();</script></body></html>
