<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V86</title><style>*{box-sizing:border-box}body{margin:0;background:#070c11;color:#edf2f4;font:14px Arial}.app{min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:28px}.card{background:#0d1821;border:1px solid #294454;border-radius:16px;padding:22px;box-shadow:0 20px 70px #0008}.brand{font-size:26px;font-weight:900;letter-spacing:1px}.gold{color:#d7ae4c}.muted{color:#8195a1}.field{margin:16px 0}.field label{display:block;color:#8da0aa;font-size:11px;margin-bottom:7px}.field input{width:100%;padding:13px;background:#071017;color:#fff;border:1px solid #345161;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:16px;background:#101f29;border:1px solid #2b4655;border-radius:11px;cursor:pointer}.pick:checked+label{border-color:#d7ae4c;background:#211e14}.pick+label small{display:block;color:#8da0aa;margin-top:7px;line-height:1.4}.btn{padding:12px 17px;border-radius:9px;border:1px solid #3b5664;background:#12232d;color:#fff;cursor:pointer;font-weight:800}.primary{background:#80652b;border-color:#d7ae4c}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:15px;background:#0b151d;border:1px solid #253e4b;border-radius:11px}.stat small{color:#80939e}.stat b{display:block;font-size:23px;margin-top:7px}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.panel{padding:18px;background:#0c171f;border:1px solid #253f4c;border-radius:13px;margin-bottom:14px}.event{border-color:#9a7933;background:linear-gradient(135deg,#19180f,#0d1921)}.feed{padding:10px 0;border-bottom:1px solid #1a303b;line-height:1.45}.fight{max-width:1200px;margin:auto;padding:20px}.fighters{display:grid;grid-template-columns:1fr 190px 1fr;gap:14px;align-items:center;text-align:center}.fighter{padding:18px;background:#0d1821;border:1px solid #294454;border-radius:14px}.bar{height:13px;background:#30171c;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#41ce87}.clock{width:170px;height:170px;border:7px solid #d7ae4c;border-radius:50%;display:grid;place-items:center;margin:auto;font:700 30px monospace}.comment{height:260px;overflow:auto;background:#050b10;border:1px solid #223b48;border-radius:12px;padding:14px;margin:14px 0}.comment p{padding:8px 0;margin:0;border-bottom:1px solid #152a35}.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.act{min-height:75px;text-align:left}.overlay{position:fixed;inset:0;background:#020509ed;z-index:50;display:grid;place-items:center}.wheelbox{text-align:center;width:min(470px,92vw);padding:25px;background:#0d1821;border:1px solid #d7ae4c;border-radius:18px}.wheel{width:280px;height:280px;margin:18px auto;border-radius:50%;border:7px solid #65747d;background:conic-gradient(#35c77b 0 8%,#d94d5b 8% 16%,#35c77b 16% 24%,#d94d5b 24% 32%,#35c77b 32% 40%,#d94d5b 40% 48%,#35c77b 48% 56%,#d94d5b 56% 64%,#35c77b 64% 72%,#d94d5b 72% 80%,#35c77b 80% 88%,#d94d5b 88%);transition:transform 2.1s cubic-bezier(.12,.74,.08,1);position:relative}.wheel:after{content:'▼';position:absolute;top:-38px;left:50%;transform:translateX(-50%);font-size:28px}.alert{position:fixed;right:22px;top:22px;z-index:40;width:min(390px,90vw);padding:17px;background:#0d1821;border:1px solid #d7ae4c;border-radius:14px;box-shadow:0 20px 70px #000;animation:in .3s}.alert b{color:#e0b852}@keyframes in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.fighters{grid-template-columns:1fr}.acts{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="app"></div><script>const A=document.getElementById('app');const kg={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const profiles={Wonderkid:'szybkość i rozwój',Fizol:'siła i odporność','Mistrz zapasów':'zapasy i kontrola','Czysty striker':'boks i stójka','Człowiek-guma':'BJJ i poddania','All-rounder':'równy rozwój','Lokalny bijok':'agresja i presja'};const S={name:'',surname:'',type:'',budget:0,weight:'',day:1,age:18,rep:5,ig:120,mot:70,fat:8,wins:0,losses:0,draws:0,comments:[],events:[]};function creator(){A.innerHTML='<div class="wrap"><div class="card"><div class="brand">MMA <span class="gold">CAREER SIMULATOR</span></div><p class="muted">Nowa samodzielna wersja — bez iframe i bez ładowania innych wersji.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="np. Michał"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="np. Kowalski"></div><h3>TYP ZAWODNIKA *</h3><div class="grid">${Object.entries(profiles).map(([x,d],i)=>`<input class="pick" id="p${i}" name="type" type="radio" value="${x}"><label for="p${i}"><b>${x}</b><small>Promowane: ${d}</small></label>`).join('')}</div><h3>BUDŻET STARTOWY *</h3><div class="grid">${[5000,10000,25000,50000].map((x,i)=>`<input class="pick" id="b${i}" name="budget" type="radio" value="${x}"><label for="b${i}"><b>${x.toLocaleString('pl-PL')} ISK</b><small>Budżet kariery</small></label>`).join('')}</div><h3>KATEGORIA WAGOWA *</h3><div class="grid">${Object.entries(kg).map(([x,k],i)=>`<input class="pick" id="w${i}" name="weight" type="radio" value="${x}"><label for="w${i}"><b>${x}</b><small>${k}</small></label>`).join('')}</div><br><button class="btn primary" onclick="start()">ROZPOCZNIJ KARIERĘ →</button></div></div>'}function start(){const f=fn.value.trim(),l=ln.value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=budget]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w)return alert('Uzupełnij wszystkie obowiązkowe pola.');Object.assign(S,{name:f,surname:l,type:t.value,budget:+b.value,weight:w.value,comments:['JURAS: Nowa kariera. Zobaczymy, czy ten chłopak zrobi tutaj coś ciekawego.'],events:[]});dashboard()}function dashboard(){A.innerHTML=`<div class="wrap"><div class="brand">MMA <span class="gold">CAREER CONTROL</span></div><p class="muted">${S.name} ${S.surname} · ${S.age} lat · ${S.weight} · budżet ${S.budget.toLocaleString('pl-PL')} ISK</p><div class="nav"><button class="btn primary" onclick="dashboard()">Dashboard</button><button class="btn" onclick="stats()">Zawodnik</button><button class="btn" onclick="nextDay()">Następny dzień</button><button class="btn" onclick="startFight()">🥊 WEJDŹ DO WALKI</button></div><div class="stats"><div class="stat"><small>REKORD</small><b>${S.wins}-${S.losses}-${S.draws}</b></div><div class="stat"><small>INSTAGRAM</small><b>${S.ig}</b></div><div class="stat"><small>REPUTACJA</small><b>${S.rep}</b></div><div class="stat"><small>MOTYWACJA</small><b>${S.mot}</b></div><div class="stat"><small>DZIEŃ / WIEK</small><b>${S.day} / ${S.age}</b></div></div><div class="cols"><section><div class="panel event"><small class="gold">NAJNOWSZY ALERT</small><h2>${S.events[0]?.title||'Kariera właśnie się zaczyna'}</h2><p>${S.events[0]?.text||'Trening, media, pieniądze i walki będą stopniowo budować Twoją karierę.'}</p></div><div class="panel"><h3>📰 FEED KARIERY</h3>${S.comments.map(x=>`<div class="feed">${x}</div>`).join('')}</div></section><aside><div class="panel"><h3>📋 INFORMACJE</h3><div class="feed">Typ: ${S.type}</div><div class="feed">Waga: ${S.weight} — ${kg[S.weight]}</div><div class="feed">Budżet: ${S.budget.toLocaleString('pl-PL')} ISK</div><div class="feed">Zmęczenie: ${S.fat}%</div></div><div class="panel"><h3>🎯 NAJBLIŻSZY CEL</h3><p>Zdobyć pierwszą walkę i zbudować rozpoznawalność.</p><button class="btn primary" onclick="startFight()">PRZEJDŹ DO WALKI</button></div></aside></div></div>`}function stats(){alert('Statystyki zawodnika: '+S.type+' · '+S.weight+' · rekord '+S.wins+'-'+S.losses+'-'+S.draws)}function nextDay(){S.day++;if(S.day%365===0)S.age++;S.fat=Math.min(100,S.fat+3);const r=Math.random();if(r<.22){S.ig+=Math.floor(Math.random()*80)+20;S.events.unshift({title:'📱 Urywek z treningu poszedł viralem!',text:'Klip został zauważony. Instagram rośnie, a kilka osób z branży zaczyna pytać, kim jesteś.'});S.comments.unshift('MEDIA: Twój materiał treningowy zaczyna krążyć po MMA Twitterze.')}else if(r<.38){S.events.unshift({title:'🥊 Ktoś pyta o Ciebie!',text:'Lokalna gala zauważyła Twój profil i rozważa propozycję walki.'})}dashboard()}function startFight(){const opp=['Kamil „Bizon” Wrona','Patryk „Kosa” Nowak','Mateusz „Cichy” Zalewski','Marek „Buldożer” Lis'][Math.floor(Math.random()*4)];S.fight={round:1,sec:0,opp,mehp:100,ohp:100,stam:100,ostam:100,score:0,oscore:0,ended:false};fight()}function fight(){const F=S.fight;A.innerHTML=`<div class="fight"><div class="brand">MMA <span class="gold">LIVE FIGHT</span></div><p>${S.name} ${S.surname} vs ${F.opp} · ${S.weight}</p><div class="fighters"><div class="fighter"><b>${S.name}</b><p>Witalność</p><div class="bar"><i style="width:${F.mehp}%"></i></div><p>Stamina ${F.stam}%</p></div><div><div class="clock"><span id="tm">${fmt(F.sec)}</span></div><p style="text-align:center">Runda ${F.round}</p></div><div class="fighter"><b>${F.opp}</b><p>Witalność</p><div class="bar"><i style="width:${F.ohp}%"></i></div><p>Stamina ${F.ostam}%</p></div></div><div class="comment" id="com">${S.comments.slice(0,8).map(x=>`<p>${x}</p>`).join('')}</div><div class="acts">${['Jab','Sierp','High Kick','Spinning Backfist','Latające kolano','Łokieć','Obalenie','Balacha','Duszenie trójkątne','RNC','Low Kick','Ground & Pound'].map(x=>`<button class="btn act" onclick="action('${x}')">${x}<small>Wybierz akcję</small></button>`).join('')}</div><br><button class="btn" onclick="dashboard()">Wyjdź z walki</button></div>`;if(!F.timer)F.timer=setInterval(tick,1000)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function tick(){const F=S.fight;if(!F||F.ended)return;F.sec++;F.stam=Math.max(0,F.stam-.35);F.ostam=Math.max(0,F.ostam-.32);if(F.sec>=300){if(F.round<3){F.round++;F.sec=0;S.comments.unshift('JURAS: Przerwa. Narożnik ma chwilę, żeby poukładać plan.');}else finishDecision()}const tm=document.getElementById('tm');if(tm)tm.textContent=fmt(F.sec)}function action(x){const F=S.fight;if(!F||F.ended)return;const c=document.getElementById('com');let txt=['JURAS: '+x+' — zawodnik próbuje znaleźć odpowiedni moment.'];if(x==='High Kick')txt=['JURAS: Opuścił rękę! Jest miejsce na high kicka!'];if(x==='Spinning Backfist')txt=['JURAS: Próba obrotówki — to musi być dobrze wyczute!'];if(x==='Latające kolano')txt=['JURAS: LATAJĄCE KOLANO! Ależ ryzyko!'];if(x==='Obalenie')txt=['JURAS: Wchodzi po nogę! Bardzo mocne tempo zapaśnicze.'];if(x==='Balacha'||x.includes('Duszenie')||x==='RNC')txt=['JURAS: Jest próba poddania! Teraz liczy się obrona i zimna krew.'];const p=document.createElement('p');p.textContent=txt[0];c.prepend(p);let dmg=Math.floor(Math.random()*10)+3;if(x==='High Kick'||x==='Latające kolano'||x==='Spinning Backfist')dmg+=Math.floor(Math.random()*10);if(/Balacha|Duszenie|RNC/.test(x)){if(Math.random()<.12){F.ended=true;clearInterval(F.timer);S.wins++;S.rep+=3;S.comments.unshift('JURAS: PODDANIE! Koniec walki!');setTimeout(()=>result('SUBMISSION'),400);return}}F.ohp=Math.max(0,F.ohp-dmg);F.score+=dmg;F.oscore+=Math.floor(Math.random()*7);if(F.ohp<=0){F.ended=true;clearInterval(F.timer);S.wins++;S.rep+=4;S.ig+=35;S.comments.unshift('JURAS: ŁOOOOOO! Nokaut! To może być viral!');setTimeout(()=>result('KO'),400);return}F.mehp=Math.max(1,F.mehp-(Math.random()*4));F.stam=Math.max(0,F.stam-2);if(F.mehp<20&&Math.random()<.03){F.ended=true;clearInterval(F.timer);S.losses++;setTimeout(()=>result('TKO'),400)}}function finishDecision(){const F=S.fight;F.ended=true;clearInterval(F.timer);let me=F.score,op=F.oscore;let r=me>op?'W':me<op?'L':'D';if(r==='W')S.wins++;if(r==='L')S.losses++;if(r==='D')S.draws++;result('DECISION')}function result(method){A.innerHTML=`<div class="wrap"><div class="card" style="text-align:center;padding:50px"><div class="brand">KONIEC WALKI</div><h1>${method}</h1><h2>${S.name} ${S.surname}</h2><p class="muted">${method==='DECISION'?'Sędziowie punktują walkę rundami.':'Walka zakończyła się przed czasem.'}</p><p>Rekord: ${S.wins}-${S.losses}-${S.draws}</p><button class="btn primary" onclick="dashboard()">WRÓĆ DO DASHBOARDU</button></div></div>`}creator();</script></body></html>
