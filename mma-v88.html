<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V88</title><style>body{margin:0;background:#071018;color:#eee;font:15px Arial}.screen{min-height:100vh;padding:28px;background:radial-gradient(circle at 20% 0,#173c50,#05090d 65%)}.card,.panel{background:#0d1821;border:1px solid #2c4858;border-radius:16px;padding:24px;box-shadow:0 15px 50px #0008}.card{max-width:1100px;margin:auto}.field{margin:16px 0}.field label{display:block;font-size:11px;color:#9aacb4;margin-bottom:7px}.field input{width:100%;padding:13px;background:#071017;color:#fff;border:1px solid #294554;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:15px;background:#101e27;border:1px solid #294554;border-radius:10px;cursor:pointer}.pick:checked+label{border-color:#d5ad4e;background:#211f15}.pick+label small{display:block;color:#8799a3;margin-top:7px;line-height:1.45}.budget{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.btn{padding:12px 17px;background:#13232d;color:#fff;border:1px solid #405866;border-radius:9px;cursor:pointer}.primary{background:#80662b;border-color:#d5ad4e;font-weight:800}.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{padding:14px;background:#060c12;border-right:1px solid #203541}.side button{display:block;width:100%;margin:5px 0;padding:12px;text-align:left;background:#0b151d;color:#b8c3c8;border:1px solid #203541;border-radius:8px;cursor:pointer}.main{padding:24px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.stat{background:#0d1922;border:1px solid #263f4d;border-radius:10px;padding:14px}.stat small{color:#718692}.stat strong{display:block;font-size:20px;margin-top:7px}.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.tabs button{padding:10px;background:#0d1921;color:#b9c5ca;border:1px solid #294352;border-radius:8px;cursor:pointer}.cols{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.hero{padding:25px;min-height:180px;background:radial-gradient(circle at 80% 0,#352c18,#101a21 60%);border:1px solid #80662d;border-radius:16px}.feed{padding:10px 0;border-bottom:1px solid #1b303b}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:10;padding:20px}.modalbox{width:min(820px,94vw);background:#0d1821;border:1px solid #d5ad4e;border-radius:18px;padding:28px}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle,#173b4d,#050a0e 65%)}.fighters{display:grid;grid-template-columns:1fr 190px 1fr;gap:15px;align-items:center;max-width:1100px;margin:auto;text-align:center}.fighter{padding:18px;background:#0b161f;border:1px solid #294554;border-radius:12px}.hp{height:14px;background:#29171b;border-radius:6px;overflow:hidden}.hp i{display:block;height:100%;background:#3dcc84}.opp i{background:#df5964}.clock{width:150px;height:150px;border:7px solid #d5ad4e;border-radius:50%;display:grid;place-items:center;margin:auto}.time{font:700 28px monospace}.comment{max-width:1100px;height:220px;overflow:auto;margin:12px auto;background:#050c11;border:1px solid #294352;border-radius:10px;padding:12px}.comment p{margin:0;padding:7px;border-bottom:1px solid #172a35}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{padding:13px;min-height:60px;text-align:left;background:#101f29;color:#fff;border:1px solid #294554;border-radius:9px;cursor:pointer}.wheelwrap{position:relative;width:290px;height:290px;margin:18px auto}.wheel{width:290px;height:290px;border-radius:50%;background:conic-gradient(#36c77b 0 8%,#d84f5b 8% 16%,#36c77b 16% 24%,#d84f5b 24% 32%,#36c77b 32% 40%,#d84f5b 40% 48%,#36c77b 48% 56%,#d84f5b 56% 64%,#36c77b 64% 72%,#d84f5b 72% 80%,#36c77b 80% 88%,#d84f5b 88%);border:7px solid #65747d;transition:transform 2.3s cubic-bezier(.12,.75,.08,1)}.pointer{position:absolute;z-index:2;top:-20px;left:50%;transform:translateX(-50%);font-size:30px}.gold{color:#d5ad4e}@media(max-width:900px){.grid,.budget,.stats,.cols,.fighters,.acts,.tabs{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.clock{order:-1}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:120px}}@media(max-width:600px){.grid,.budget,.stats,.cols,.acts,.tabs{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const A=document.getElementById('app');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:'Młody talent — szybkość i potencjał.', 'Osiedlowy bijok':'Twardy charakter — presja i chaos.',Fizol:'Siła — klincz i brutalna presja.',Zapaśnik:'Obalenia — kontrola i siatka.',Striker:'Stójka — boks i nokauty.',Gumiarz:'BJJ — poddania i przetrwanie.',Allrounder:'Równy rozwój całego MMA.'};const BUDGETS=[[5000,'Normalny etat','Praca po godzinach i trening z oszczędności.'],[10000,'Etat + oszczędności','Pierwszy sprzęt i okazjonalny obóz.'],[25000,'Rodzina pomaga','Masz finansowy oddech na rozwój.'],[50000,'Bogata rodzina','Możesz inwestować w najlepszych ludzi.'],[100000,'Rodzinny biznes','Mocne zaplecze, ale wielkie oczekiwania.']];let s={day:1,age:18,ig:100,rep:5,mot:55,budget:10000,w:0,l:0,d:0,fat:8,sk:{boks:50,zapasy:50,bjj:50,kondycja:50},logs:[]};function creator(){A.innerHTML='<div class="screen"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p>Stwórz zawodnika i rozpocznij karierę.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="np. Michał"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="np. Kowalski"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.entries(TYPES).map((x,i)=>'<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x[0]+'"><label for="t'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="budget">'+BUDGETS.map((x,i)=>'<input class="pick" id="b'+i+'" name="budget" type="radio" value="'+x[0]+'" '+(i===1?'checked':'')+'><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' ISK</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>').join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.entries(KG).map((x,i)=>'<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x[0]+'"><label for="w'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><br><button class="btn primary" onclick="start()">STWÓRZ KARIERĘ →</button></div></div>'}function start(){let t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=budget]:checked'),w=document.querySelector('[name=weight]:checked');if(!fn.value.trim()||!ln.value.trim()||!t||!b||!w)return alert('Uzupełnij wszystkie pola.');s.first=fn.value.trim();s.last=ln.value.trim();s.type=t.value;s.budget=+b.value;s.weight=w.value;s.logs=['Kariera rozpoczęta.'];dashboard();event('NOWA KARIERA','Masz '+s.budget.toLocaleString('pl-PL')+' ISK. Czas zbudować nazwisko.',['WEJDŹ DO DASHBOARDU',()=>dashboard()])}function side(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="training()">🥊 Trening</button><button onclick="fight()">🏆 Walka</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="stats()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){A.innerHTML='<div class="layout">'+side()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p>Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><button class="btn primary" onclick="nextEvent()">⏩ PRZEWIŃ DO NASTĘPNEGO EVENTU</button></div><div class="stats"><div class="stat"><small>REKORD</small><strong>'+s.w+'-'+s.l+'-'+s.d+'</strong></div><div class="stat"><small>INSTAGRAM</small><strong>'+s.ig+'</strong></div><div class="stat"><small>REPUTACJA</small><strong>'+s.rep+'/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>'+s.mot+'/100</strong></div><div class="stat"><small>BUDŻET</small><strong>'+s.budget.toLocaleString()+' ISK</strong></div><div class="stat"><small>WIEK</small><strong>'+s.age+'</strong></div></div><div class="tabs"><button onclick="training()">Trening</button><button onclick="fight()">Walka</button><button onclick="media()">Media</button><button onclick="manager()">Menedżer</button><button onclick="stats()">Statystyki</button><button onclick="events()">Eventy</button><button onclick="nextEvent()">Następny event</button></div><div class="cols"><section><div class="hero"><small class="gold">NAJBLIŻSZY MOMENT</small><h2>Buduj formę i reputację</h2><p>Eventy, treningi i walki będą otwierały kolejne ścieżki kariery.</p><button class="btn primary" onclick="nextEvent()">OTWÓRZ EVENT</button></div><div class="panel"><h3>📰 OŚ CZASU</h3>'+s.logs.slice(0,10).map(x=>'<div class="feed">'+x+'</div>').join('')+'</div></section><aside><div class="panel"><h3>FORMA</h3><p>Zmęczenie: '+s.fat+'%</p><div class="feed">Boks: '+s.sk.boks+'</div><div class="feed">Zapasy: '+s.sk.zapasy+'</div><div class="feed">BJJ: '+s.sk.bjj+'</div><div class="feed">Kondycja: '+s.sk.kondycja+'</div></div></aside></div></main></div>'}function event(title,text,choice){A.innerHTML='<div class="modal"><div class="modalbox"><small class="gold">EVENT KARIERY</small><h1>'+title+'</h1><p style="font-size:18px;line-height:1.6">'+text+'</p><button class="btn primary" id="go">'+choice[0]+'</button></div></div>';document.getElementById('go').onclick=choice[1]}function nextEvent(){s.day++;if(s.day%365===0)s.age++;let r=Math.random();if(r<.25)event('ZAPROSZENIE NA TRENING','Trener proponuje dwutygodniowy obóz. Wybierz specjalizację.', ['WYBIERZ TRENING',()=>trainingCamp()]);else if(r<.5)event('PROPOZYCJA WALKI','Promotor chce dać Ci walkę. To może być pierwszy duży krok.', ['PRZYJMIJ WALKĘ',()=>fight()]);else if(r<.75)event('VIRAL','Fragment treningu został zauważony w sieci. +100 obserwujących.', ['WRZUCAMY!',()=>{s.ig+=100;s.logs.unshift('🔥 Viral: +100 obserwujących.');dashboard()}]);else event('ZAPROSZENIE NA GALĘ','Masz zaproszenie na galę. Możesz się pokazać mediom.', ['IDĘ NA GALĘ',()=>{s.ig+=60;s.rep+=2;s.logs.unshift('🎟️ Gala: +60 IG, +2 reputacji.');dashboard()}])}function trainingCamp(){event('OBÓZ 2 TYGODNIE','Wybierz priorytet.', ['BOKS +8',()=>camp('boks')]);document.getElementById('go').insertAdjacentHTML('afterend','<button class="btn" id="z">ZAPASY +8</button><button class="btn" id="j">BJJ +8</button><button class="btn" id="k">KONDYCJA +8</button>');document.getElementById('z').onclick=()=>camp('zapasy');document.getElementById('j').onclick=()=>camp('bjj');document.getElementById('k').onclick=()=>camp('kondycja')}function camp(k){s.sk[k]+=8;s.fat=Math.min(80,s.fat+15);s.day+=14;s.logs.unshift('🥊 Obóz 2 tygodnie: +8 '+k+'.');dashboard()}function training(){event('TRENING','Wybierz szybki blok treningowy.', ['BOKS +2',()=>{s.sk.boks+=2;s.fat+=5;dashboard()}]);}function media(){event('MEDIA','Twój profil medialny rośnie. Możesz zrobić viral.', ['VIRAL +120 IG',()=>{s.ig+=120;s.rep++;s.logs.unshift('📱 Viral medialny: +120 IG.');dashboard()}])}function manager(){event('MENEDŻER KARIERY','Kontrakty, sponsorzy i federacje będą rozwijane tutaj.', ['SZUKAJ SPONSORA',()=>{s.budget+=3000;s.logs.unshift('💰 Sponsor: +3000 ISK.');dashboard()}])}function stats(){event('STATYSTYKI','Rekord '+s.w+'-'+s.l+'-'+s.d+' · Instagram '+s.ig+' · Reputacja '+s.rep, ['WRÓĆ',()=>dashboard()])}function events(){nextEvent()}function fight(){let f={sec:300,me:100,op:100,st:100};s.f=f;A.innerHTML='<div class="fight"><button class="btn" onclick="dashboard()">WYJDŹ</button><div class="fighters"><div class="fighter"><b>'+s.first+' '+s.last+'</b><p>STAMINA</p><div class="hp"><i id="me" style="width:100%"></i></div></div><div class="clock"><div class="time" id="tm">05:00</div></div><div class="fighter"><b>RYWAL</b><p>WITALNOŚĆ</p><div class="hp opp"><i id="op" style="width:100%"></i></div></div></div><div class="comment" id="com"><p>JURAS: Zaczynamy. Obaj spokojnie badają dystans.</p></div><div class="acts">'+['JAB','LOW KICK','CROSS','CLINCH','HIGH KICK','SPINNING BACKFIST','LATAJĄCE KOLANO','ŁOKIEĆ','SINGLE LEG','DOUBLE LEG','BALACHA','TRÓJKĄT','RNC'].map(x=>'<button class="act" onclick="act(\''+x+'\')"><b>'+x+'</b></button>').join('')+'</div></div>';f.timer=setInterval(tick,1000)}function tick(){let f=s.f;if(!f)return;f.sec--;f.st=Math.max(0,f.st-1);f.op=Math.max(0,f.op-Math.random()*0.7);document.getElementById('tm').textContent=Math.floor(f.sec/60).toString().padStart(2,'0')+':'+(f.sec%60).toString().padStart(2,'0');document.getElementById('me').style.width=f.st+'%';document.getElementById('op').style.width=f.op+'%';if(Math.random()<.15)comment(['JURAS: Dobra praca na nogach.','JURAS: Rywal zaczyna oddychać ciężej.','JURAS: Mocny low kick.','JURAS: Jest presja pod siatką.'][Math.floor(Math.random()*4)]);if(f.sec<=0)finish('decyzja');if(f.op<8&&Math.random()<.04)finish('TKO')}function comment(t){let c=document.getElementById('com');let p=document.createElement('p');p.textContent=t;c.prepend(p)}function act(n){let special=/HIGH KICK|SPINNING|LATAJĄCE|ŁOKIEĆ|BALACHA|TRÓJKĄT|RNC/.test(n);if(special)wheel(n);else{let f=s.f;f.op=Math.max(0,f.op-(3+Math.random()*5));f.st=Math.max(0,f.st-2);comment('JURAS: '+n+'. Akcja wykonana, walka płynie dalej.')}}function wheel(n){let o=document.createElement('div');o.className='modal';o.innerHTML='<div class="modalbox" style="text-align:center"><b class="gold">JURAS · MOMENT W WALCE</b><h2>'+n+'</h2><div class="wheelwrap"><div class="pointer">▼</div><div class="wheel"></div></div><h2 id="wr">LOSOWANIE...</h2><button class="btn" id="wb" disabled>WRÓĆ DO WALKI</button></div>';document.body.appendChild(o);let ok=Math.random()<.55;setTimeout(()=>o.querySelector('.wheel').style.transform='rotate('+(1800+Math.random()*720)+'deg)',50);setTimeout(()=>{o.querySelector('#wr').textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';if(ok){s.f.op=Math.max(0,s.f.op-18);comment(/HIGH KICK|SPINNING|LATAJĄCE/.test(n)?'JURAS: ŁOOOOOO! Ależ weszło!':'JURAS: Ooo, świetnie wykonana technika!');if(/HIGH KICK|SPINNING|LATAJĄCE/.test(n))s.ig+=30}o.querySelector('#wb').disabled=false;o.querySelector('#wb').onclick=()=>o.remove()},2300)}function finish(type){clearInterval(s.f.timer);s.w++;s.logs.unshift('🏆 Zwycięstwo: '+type+'.');s.rep+=2;event('WALKA ZAKOŃCZONA','Zwycięstwo przez '+type+'.','WRÓĆ DO KARIERY',()=>dashboard())}creator();</script></body></html>
