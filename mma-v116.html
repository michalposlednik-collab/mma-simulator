<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V116</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="game" src="./mma-v111.html?v=116"></iframe><script>(function(){'use strict';const f=document.getElementById('game');let installed=false,modalOpen=false;const KEY='mmaCareerV111';function W(){return f.contentWindow}function D(){return f.contentDocument}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function close(){const d=D();const m=d&&d.getElementById('modal');if(m)m.style.display='none';modalOpen=false}function modal(title,head,body,buttons){const d=D();if(!d)return;const box=d.getElementById('modal'),mc=d.getElementById('mc');if(!box||!mc)return;d.getElementById('mt').textContent=title;d.getElementById('mh').textContent=head;d.getElementById('mb').innerHTML=body;mc.innerHTML='';buttons.forEach(([label,fn])=>{const b=d.createElement('button');b.className='option';b.innerHTML=label;b.onclick=fn;mc.appendChild(b)});box.style.display='flex';modalOpen=true}function react(text,rep,ig){const s=read();if(!s)return;s.rep=Math.max(0,Math.min(100,(s.rep||0)+rep));s.ig=(s.ig||0)+ig;s.log=s.log||[];s.log.push('📱 '+text);write(s);close();W().dashboard()}function social(){const s=read();if(!s)return;const events=[['🔥 RYWAL WBIJA SZPILĘ','„Widziałem ostatnią walkę. Dużo krzyku, mało roboty. Może czas to sprawdzić?”'],['📱 KOMENTARZ POD POSTEM','„Instagram to nie klatka. Pokaż coś poza pozowaniem.”'],['🎙️ RYWAL W WYWIADZIE','„Jest dobry, ale jak ktoś naprawdę na niego naciska, zaczyna szukać wymówek.”']];const e=events[Math.floor(Math.random()*events.length)];modal('EVENT · SOCIAL MEDIA',e[0],`<p><b>${e[1]}</b></p><p class="muted">Wybierz konkretną odpowiedź. To nie jest prosty przycisk „pozytywna/negatywna” — każda reakcja ma własny charakter i konsekwencje.</p>`,[[`🥊 „WIDZIMY SIĘ W KLATCE, NIE W KOMENTARZACH.”`,()=>react('Sportowa kontra na zaczepkę.',2,250)],[`😂 „NAJPIERW NAUCZ SIĘ TAGOWAĆ MÓJ PROFIL.”`,()=>react('Żartobliwa kontra.',3,500)],[`🔥 „SKORO MASZ TYLE DO POWIEDZENIA, PODAJ TERMIN.”`,()=>react('Mocny callout.',5,800)],[`🙏 „SZANUJĘ GO, ALE KAŻDY MA SWÓJ MOMENT.”`,()=>react('Odpowiedź z klasą.',2,200)]] )}function fightOffer(){const s=read();if(!s||s.fight)return;const names=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk'];const opp=names[Math.floor(Math.random()*names.length)],org=W().league(),purse=2500+(s.rep||0)*150+(s.w||0)*450;modal('EVENT · OFERTA WALKI','📩 TELEFON OD MATCHMAKERA',`<p>Propozycja: <b>${opp}</b> · ${org}</p><p>Gaża: <b>${Math.round(purse).toLocaleString('pl-PL')} zł</b></p><p>Najpierw przyjmujesz lub odrzucasz ofertę. Po przyjęciu wybierasz camp i dopiero wtedy walka trafia do kalendarza.</p>`,[[`🥊 „BIORĘ. DAJCIE MI KONTRAKT.”`,()=>{close();W().chooseCamp(opp,org,purse)}],[`😏 „NIECH NAJPIERW ZASŁUŻY.”`,()=>{s.log=s.log||[];s.log.push('❌ Odrzucono ofertę walki z '+opp+'.');write(s);close();W().dashboard()}]])}function continueCareer(){if(modalOpen)return;const s=read();if(!s)return;if(!s.created){W().creator();return}if(s.fight&&s.day>=s.fight.date){W().startFight();return}let stopped=false;for(let i=0;i<365&&!stopped;i++){s.day++;if(s.day%365===0)s.age++;s.money=Math.max(0,(s.money||0)-200);if(s.fight&&s.day>=s.fight.date){stopped=true;break}if(!s.fight&&s.day%10===0){write(s);fightOffer();stopped=true;break}if(s.day%17===0&&(s.ig||0)>=1000){write(s);social();stopped=true;break}if(!s.manager&&(s.ig||0)>=5000&&s.day%7===0){write(s);managerOffer();stopped=true;break}}write(s);if(!stopped)W().dashboard();else if(!modalOpen)W().dashboard()}function managerOffer(){const s=read();if(!s||s.manager||s.ig<5000)return;modal('EVENT · MENEDŻER','🤝 KTOŚ CHCE CIĘ REPREZENTOWAĆ','Masz ponad 5 000 obserwujących. To jednorazowa decyzja — po podpisaniu nie zmieniasz agenta.',[['10% · negocjacje + lokalni sponsorzy',()=>signManager('Marek Kowalski Management',10)],['15% · sponsorzy + media + matchmaking',()=>signManager('North Fight Management',15)],['20% · duże marki + pełny management',()=>signManager('Elite Combat Group',20)]])}function signManager(name,fee){const s=read();s.manager={name,fee};s.log=s.log||[];s.log.push('💼 Podpisano managera: '+name+' ('+fee+'%).');write(s);close();W().dashboard()}function install(){try{const d=D(),s=read();if(!d||!s)return;if(!s.created){W().creator();return}const top=d.querySelector('.main .top');if(!top)return;let b=d.getElementById('v116Continue');if(!b){b=d.createElement('button');b.id='v116Continue';b.className='primary';b.textContent='▶ KONTYNUUJ DO NASTĘPNEGO EVENTU';b.style.cssText='margin-left:auto;font-size:15px;padding:13px 18px;white-space:nowrap';b.onclick=continueCareer;top.appendChild(b)}b.style.display=s.screen==='dashboard'?'inline-block':'none';b.onclick=continueCareer;/* Hide the old sidebar day-advance control so there is one clear time control. */const old=[...d.querySelectorAll('.side button')].find(x=>x.textContent.includes('NASTĘPNY DZIEŃ'));if(old)old.style.display='none';}catch(e){console.error(e)}}function firstLoad(){try{if(!sessionStorage.getItem('mmaV116Clean')){localStorage.removeItem(KEY);sessionStorage.setItem('mmaV116Clean','1')}}catch(e){}setTimeout(install,250);setTimeout(install,800)}f.addEventListener('load',firstLoad);setInterval(install,600)})();</script></body></html>
