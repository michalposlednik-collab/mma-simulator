<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V114</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="game" src="./mma-v111.html?v=114"></iframe><script>(function(){'use strict';const f=document.getElementById('game');let patched=false;function patch(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||!d.body)return;if(!patched){patched=true;
/* Force a clean creator on the first V114 load. After the player creates a career the V111 save is retained normally. */
try{if(!sessionStorage.getItem('mmaV114Fresh')){localStorage.removeItem('mmaCareerV111');sessionStorage.setItem('mmaV114Fresh','1');w.s={created:false,day:1,age:18,money:10000,rep:5,ig:100,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',club:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,history:[],log:[],media:{interviewUntil:0,postUntil:0,controversyUntil:0},manager:null,sponsors:[],screen:'dashboard'};w.creator()}}catch(e){}
/* Replace only the time-flow control. The original dashboard markup remains untouched. */
w.continueCareer=function(){if(!w.s||!w.s.created){w.creator();return}if(w.s.fight&&w.s.day>=w.s.fight.date){if(typeof w.startFight==='function')w.startFight();return}let moved=0;while(moved<7){w.s.day++;moved++;if(w.s.day%30===0)w.s.age++;w.s.money=Math.max(0,w.s.money-150);/* Important event: fight offer. */if(!w.s.fight&&w.s.day%10===0){showFightOffer();w.save&&w.save();return}/* Important event: manager eligibility. */if(!w.s.manager&&w.s.ig>=5000&&w.s.day%7===0){showManagerEvent();w.save&&w.save();return}/* Existing scheduled fight. */if(w.s.fight&&w.s.day>=w.s.fight.date){w.save&&w.save();if(typeof w.dashboard==='function')w.dashboard();return}}w.save&&w.save();if(typeof w.dashboard==='function')w.dashboard()};
function modal(title,head,body,buttons){const box=d.getElementById('modal'),mc=d.getElementById('mc');d.getElementById('mt').textContent=title;d.getElementById('mh').textContent=head;d.getElementById('mb').innerHTML=body;mc.innerHTML='';buttons.forEach(x=>{const b=d.createElement('button');b.className='option';b.innerHTML=x[0];b.onclick=x[1];mc.appendChild(b)});box.style.display='flex'}
function close(){const x=d.getElementById('modal');if(x)x.style.display='none'}
function showFightOffer(){const opponent=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg'][Math.floor(Math.random()*4)];modal('NOWY EVENT','📩 OFERTA WALKI',`<p>Organizacja: <b>${w.league?w.league():'Lokalna gala'}</b></p><p>Przeciwnik: <b>${opponent}</b></p><p>Data propozycji: dzień <b>${w.s.day}</b></p><p>Po akceptacji wybierzesz obóz przygotowawczy i termin walki.</p>`,[['🥊 PRZYJMIJ WALKĘ',()=>acceptFight(opponent)],['❌ ODRZUĆ',()=>{close();w.s.log=w.s.log||[];w.s.log.push('Odrzucono ofertę walki.');w.save&&w.save()}]])}
function acceptFight(opponent){close();modal('DECYZJA SPORTOWA','🏕️ WYBIERZ OBÓZ PRZYGOTOWAWCZY','<p>Wybierz obóz. Data walki zostanie ustalona na podstawie długości obozu.</p>',[['Reykjavík Fight Lab — 1 200 zł / 10 dni',()=>camp(opponent,'Reykjavík Fight Lab',1200,10)],['WCA Fight Team — 3 500 zł / 14 dni',()=>camp(opponent,'WCA Fight Team',3500,14)],['ANKOS MMA — 4 200 zł / 14 dni',()=>camp(opponent,'ANKOS MMA',4200,14)],['UFC Performance Institute — 12 000 zł / 21 dni',()=>camp(opponent,'UFC Performance Institute',12000,21)]])}
function camp(opponent,name,cost,days){if(w.s.money<cost){modal('BRAK ŚRODKÓW','Nie stać Cię na ten obóz','Wybierz tańszy obóz.',[['WRÓĆ',()=>acceptFight(opponent)]]);return}w.s.money-=cost;w.s.fight={opponent,date:w.s.day+days+7,camp:name,campDays:days};w.s.log=w.s.log||[];w.s.log.push('Przyjęto walkę z '+opponent+'. Camp: '+name+'. Walka: dzień '+w.s.fight.date+'.');w.save&&w.save();close();if(typeof w.dashboard==='function')w.dashboard()}
function showManagerEvent(){modal('NOWY EVENT','🤝 OFERTA MENEDŻERA','<p>Masz już ponad 5 000 obserwujących na Instagramie. Agent chce z Tobą podpisać kontrakt.</p><p>To jednorazowa decyzja — po podpisaniu zostaje z Tobą.</p>',[['10% — negocjacje i matchmaking',()=>manager(10,'Negocjator')],['15% — matchmaking + sponsorzy',()=>manager(15,'Manager Pro')],['20% — pełny management + duże marki',()=>manager(20,'Elite Management')]])}
function manager(p,name){w.s.manager={name,pct:p};w.s.sponsors=w.s.sponsors||[];w.s.log=w.s.log||[];w.s.log.push('Podpisano agenta '+name+' ('+p+'%).');close();if(typeof w.dashboard==='function')w.dashboard()}
/* Always show Continue in the top-right, never replace the dashboard. */
function place(){if(!w.s||!w.s.created)return;const top=d.querySelector('.main .top');if(!top)return;let b=d.getElementById('v114Continue');if(!b){b=d.createElement('button');b.id='v114Continue';b.className='primary';b.textContent='▶ KONTYNUUJ';b.style.cssText='margin-left:auto;font-size:16px;padding:14px 22px;white-space:nowrap';b.onclick=w.continueCareer;top.appendChild(b)}if(w.s.screen!=='dashboard')b.style.display='none';else b.style.display='inline-block'}
}place()}catch(e){console.error(e)}}f.addEventListener('load',()=>setTimeout(patch,200));setInterval(patch,500)})();</script></body></html>
