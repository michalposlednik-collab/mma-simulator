<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V109</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.ov{position:fixed;inset:0;background:#000d;z-index:9;display:none;align-items:center;justify-content:center;padding:18px;font:15px Arial;color:#eef3f5}.box{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:25px}.gold{color:#d6ae51}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0b151d;color:#fff;border:1px solid #304955;border-radius:12px;padding:15px;text-align:left;cursor:pointer}.card:hover{border-color:#d6ae51}.btn{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}.primary{background:#80652a;border-color:#d6ae51}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><iframe id="g"></iframe><div id="ov" class="ov"><div class="box"><small id="ot" class="gold"></small><h1 id="oh"></h1><p id="ob"></p><div id="oc" class="cards"></div><div class="row"><button class="btn" onclick="hide()">PÓŹNIEJ / ZAMKNIJ</button></div></div></div><script>(function(){'use strict';try{Object.keys(localStorage).forEach(k=>{if(/^mmaCareerV10/.test(k))localStorage.removeItem(k)});localStorage.removeItem('mmaV109Extra')}catch(e){}const fr=document.getElementById('g');fr.src='./mma-v107.html?v=109clean';let w,d,done=false,extra={manager:null,sponsors:[],seen:{}};const camps=[['Reykjavík Fight Lab',1200,10,'Stójka + motoryka'],['WCA Fight Team',3500,14,'MMA/BJJ/zapasy'],['ANKOS MMA',4200,14,'Zapasy + klincz + sparingi'],['UFC Performance Institute',12000,21,'Pełny camp, specjaliści i regeneracja']];const managers=[['Marek Kowalski Management','10%','Negocjacje gaży, lokalni sponsorzy, organizacja walk'],['North Fight Management','15%','Negocjacje, media, sponsorzy, kontakty zagraniczne'],['Elite Combat Group','20%','Duże gale, PR, sponsorzy i plan kariery']];const sponsors=[['Fight Gear / odzież','500 zł/mies. + komplet odzieży'],['Supplements / odżywki','900 zł/mies. + suplementacja'],['Klinika fizjo','1200 zł/mies. + fizjoterapia'],['Marka żywieniowa','1800 zł/mies. + dieta pudełkowa'],['Duży sponsor odzieżowy','3500 zł/mies. + sprzęt']];function st(){try{return JSON.parse(localStorage.getItem('mmaCareerV107')||'null')}catch(e){}}function put(s){localStorage.setItem('mmaCareerV107',JSON.stringify(s))}function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(title,head,body,cards){document.getElementById('ot').textContent=title;document.getElementById('oh').textContent=head;document.getElementById('ob').innerHTML=body;const c=document.getElementById('oc');c.innerHTML='';cards.forEach(x=>{const b=document.createElement('button');b.className='card';b.innerHTML=x[0];b.onclick=x[1];c.appendChild(b)});document.getElementById('ov').style.display='flex'}function hide(){document.getElementById('ov').style.display='none'}window.hide=hide;function patch(){try{w=fr.contentWindow;d=w.document;if(!d.body||done)return;done=true;try{extra=Object.assign(extra,JSON.parse(localStorage.getItem('mmaV109Extra')||'{}'))}catch(e){}const oldNext=w.nextEvent,oldStart=w.startFight;w.nextEvent=function(){const s=st();if(!s||!s.created)return oldNext.apply(w,arguments);const opp=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek'][Math.floor(Math.random()*5)],org=s.w<2?'Lokalna gala':s.w<4?'Hybrid':s.w<7?'Babilon MMA / FEN':s.w<10?'KSW':s.w<13?'OKTAGON':s.w<16?'Cage Warriors':s.w<19?'PFL':'UFC';show('DASHBOARD — NOWA OFERTA','📩 Oferta walki','<b>'+opp+'</b> zaprasza Cię do walki w <b>'+org+'</b>.<br><br>Przyjmij ofertę, aby przejść do wyboru obozu przygotowawczego.',[['<b>PRZYJMIJ WALKĘ</b>',()=>camp(s,opp,org)],['Odrzuć / później',hide]])};w.startFight=function(){const s=st();if(s&&s.fight&&s.fight.date&&s.day<s.fight.date){alert('Walka jest zaplanowana na dzień '+s.fight.date+'. Przejdź przez kalendarz do tego dnia.');return}return oldStart.apply(w,arguments)};const side=d.querySelector('.side');if(side&&!side.querySelector('.v109m')){const b=d.createElement('button');b.className='v109m';b.textContent='💼 Menedżer';b.onclick=manager;side.appendChild(b);const n=d.createElement('button');n.textContent='＋ NASTĘPNY DZIEŃ';n.onclick=day;side.appendChild(n)}}catch(e){}}function camp(s,opp,org){const cards=camps.map(c=>['<b>'+c[0]+'</b><p>'+money(c[1])+' · '+c[2]+' dni</p><small>'+c[3]+'</small>',()=>{if(s.money<c[1]){alert('Za mało pieniędzy.');return}s.money-=c[1];s.fight={opponent:opp,league:org,purse:Math.max(2500,2500+s.rep*150+s.w*450),date:s.day+c[2]+1,camp:c[0],campCost:c[1],campDays:c[2],round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{}};s.log=s.log||[];s.log.push('📅 Walka z '+opp+' ustalona na dzień '+s.fight.date+'. Camp: '+c[0]+'.');put(s);hide();w.dashboard() }]);show('PRZYGOTOWANIE','Wybierz obóz przygotowawczy','Data walki zależy od długości campu. Czas wpływa na wiek zawodnika i kalendarz.',cards)}function manager(){const s=st();if(!s||!s.created)return;if(s.ig<5000){alert('Menedżerowie zaczynają się interesować zawodnikiem od 5 000 obserwujących.');return}if(extra.manager){sponsorsOffer(s);return}show('MENEDŻER','Wybierz reprezentanta','Podpisanie jest <b>jednorazowe</b>. Prowizja jest pobierana od gaży. Po podpisaniu nie możesz wybrać innego.',managers.map(m=>['<b>'+m[0]+'</b><p>Prowizja: '+m[1]+'</p><small>'+m[2]+'</small>',()=>{extra.manager={name:m[0],fee:m[1]};localStorage.setItem('mmaV109Extra',JSON.stringify(extra));hide();sponsorsOffer(s)}]))}function sponsorsOffer(s){const list=sponsors.filter((x,i)=>s.ig>=5000+i*5000);show('SPONSORZY','Oferty sponsorskie','Realne umowy zawodników często łączą gotówkę z odzieżą, suplementacją, fizjoterapią, dietą, sprzętem i ekspozycją w social media. Przykładowe modele są oparte na realnych praktykach sponsoringowych.',['<b>Odrzuć wszystkie</b>',hide],...list.map(x=>['<b>'+x[0]+'</b><p>'+x[1]+'</p>',()=>{extra.sponsors.push(x);localStorage.setItem('mmaV109Extra',JSON.stringify(extra));hide()}]))}function day(){const s=st();if(!s)return;if(s.fight&&s.day>=s.fight.date){alert('Dzisiaj jest dzień walki.');return}s.day++;if(s.day%365===0)s.age++;s.money=Math.max(0,s.money-200);s.log=s.log||[];s.log.push('📅 Dzień '+s.day+'. Koszt życia: 200 zł.');put(s);w.dashboard()}function social(){const s=st();if(!s||!s.created||!d.querySelector('.main'))return;const k='social'+s.day;if(extra.seen[k])return;if(Math.random()>.1)return;extra.seen[k]=1;localStorage.setItem('mmaV109Extra',JSON.stringify(extra));const e=Math.random()>.5?['💬 Zaczepka w social mediach','Rywal prowokuje Cię publicznie. Odpowiedz pozytywnie albo negatywnie.']:['👏 Pochwała','Zawodnik z większym nazwiskiem chwali Twój ostatni występ.'];show('DODATKOWE WYDARZENIE',e[0],e[1],[['<b>POZYTYWNIE</b><p>„Dzięki. Szacunek, ale spotkamy się w klatce.”</p>',()=>react(true)],['<b>NEGATYWNIE</b><p>„Najpierw zasłuż na odpowiedź.”</p>',()=>react(false)]] )}function react(pos){const s=st();s.rep=Math.max(0,Math.min(100,s.rep+(pos?2:-1)));s.ig+=pos?150:50;s.log=s.log||[];s.log.push('📱 Odpowiedź na wydarzenie medialne.');put(s);hide();w.dashboard()}fr.addEventListener('load',()=>{setTimeout(patch,30);setTimeout(patch,300);setTimeout(patch,1000)});setInterval(()=>{if(!done)patch();else try{social()}catch(e){}},1500)})();</script></body></html>
