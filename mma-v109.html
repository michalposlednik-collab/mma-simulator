<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V109</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./mma-v107.html"></iframe><script>(function(){'use strict';
/* V109 is intentionally based on the last working fight implementation (V107).
   This wrapper only patches the broken/abusable parts; it does not replace the game. */
const f=document.getElementById('game');
try{if(!sessionStorage.getItem('mmaV109CreatorReset')){localStorage.removeItem('mmaCareerV107');sessionStorage.setItem('mmaV109CreatorReset','1')}}catch(e){}
let mediaUses={interview:0,post:0,controversy:0};let fightUses={jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0};let patched=false;let nativeRandom=null;
function resetFightUses(){fightUses={jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}}
function resetMediaUses(){mediaUses={interview:0,post:0,controversy:0}}
function addPatchStyle(d){if(d.getElementById('mmaV109Style'))return;const st=d.createElement('style');st.id='mmaV109Style';st.textContent='.wlabel{display:none!important}.wheel{background:conic-gradient(#69cf72 0 33.333%,#f3b44e 33.333% 66.666%,#d94b3d 66.666% 100%)!important}.pointer{top:-3px!important}.wheelbox p{font-size:0}.wheelbox p:after{content:"Zielony = PEŁNY SUKCES · Pomarańczowy = CZĘŚCIOWY SUKCES · Czerwony = NIEUDANA TECHNIKA";font-size:14px}.actionLimit{display:block;font-size:10px;color:#91a3ac;margin-top:3px}';d.head.appendChild(st)}
function patch(){try{const d=f.contentWindow.document,w=f.contentWindow;if(!d||!d.body)return;addPatchStyle(d);if(!patched){patched=true;resetFightUses();resetMediaUses();
/* The old creator was correct, but an old V107 local save could reopen it. V109 clears that save once per tab session. */
const oldStart=w.startFight;if(typeof oldStart==='function'){w.startFight=function(){resetFightUses();resetMediaUses();return oldStart.apply(this,arguments)}}
/* Exact wheel/result synchronisation. The original fight engine still decides the damage/result. */
const spin=d.getElementById('spinBtn');if(spin&&spin.onclick){const oldSpin=spin.onclick;spin.onclick=function(){
 if(!w.pendingAction && !d.getElementById('wheelAction')){};
 nativeRandom=nativeRandom||Math.random;const r=nativeRandom();let outcome=r<.45?'FULL':r<.78?'PARTIAL':'FAIL';
 /* Original thresholds: <.45 full, <.78 partial, otherwise fail. We only control the visual angle. */
 const center=outcome==='FULL'?60:outcome==='PARTIAL'?180:300;const second=(360-center)/360;
 let n=0;Math.random=function(){n++;return n===1?r:second};
 try{return oldSpin.apply(this,arguments)}finally{Math.random=nativeRandom}
}}
/* Hard limits: basic attacks 3 each; every special technique 2 per fight. */
 d.addEventListener('click',function(ev){const b=ev.target.closest('[data-basic],[data-special]');if(!b)return;let key=null,max=0;if(b.hasAttribute('data-basic')){key=b.getAttribute('data-basic')==='Low kick'?'low':'jab';max=3}else{const x=b.getAttribute('data-special');key={'High kick':'high','Latające kolano':'flying','Spinning backfist':'spin','Obalenie':'takedown','Balacha':'armbar','Trójkąt':'triangle','RNC':'rnc'}[x];max=2}if(!key)return;if(fightUses[key]>=max){ev.preventDefault();ev.stopImmediatePropagation();return}fightUses[key]++;const label=b.textContent.trim();b.innerHTML=label+'<span class="actionLimit">Użyto '+fightUses[key]+'/'+max+'</span>';},true);
/* Media limits: interview once, post twice, va banque once between fights. */
 d.addEventListener('click',function(ev){const b=ev.target.closest('[data-media]');if(!b)return;const vals=(b.getAttribute('data-media')||'').split(',');const type=vals[0]==='3'?'interview':vals[0]==='2'?'post':'controversy';const max=type==='post'?2:1;if(mediaUses[type]>=max){ev.preventDefault();ev.stopImmediatePropagation();return}
 /* V107's league() randomly chooses Babilon/FEN for 4-6 wins. Preserve the currently displayed organisation while media rerenders. */
 let org='';const stats=[...d.querySelectorAll('.stat')];const orgStat=stats.find(x=>/ORGANIZACJA/i.test(x.textContent));if(orgStat)org=orgStat.textContent;
 const oldR=Math.random; if(/Babilon/i.test(org))Math.random=()=>0.1;else if(/FEN/i.test(org))Math.random=()=>0.9;
 mediaUses[type]++;try{}finally{setTimeout(()=>{Math.random=oldR},0)}
},true);
/* After a fight V107 reopens the media system; the wrapper resets its media quota at the next fight. */
}
}catch(e){}}
f.addEventListener('load',()=>{setTimeout(patch,20);setTimeout(patch,250);setTimeout(patch,1000)});setInterval(patch,1000);
})();</script></body></html>
