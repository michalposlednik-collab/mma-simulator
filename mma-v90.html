<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V90</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#060b10}iframe{display:block}</style></head><body><iframe id="game" src="./mma-v89.html"></iframe><script>const f=document.getElementById('game');f.addEventListener('load',()=>{try{const w=f.contentWindow;const d=w.document;w.start=function(){const first=d.getElementById('fn'),last=d.getElementById('ln');const t=d.querySelector('[name="type"]:checked'),b=d.querySelector('[name="budget"]:checked'),weight=d.querySelector('[name="weight"]:checked');if(!first||!last||!first.value.trim()||!last.value.trim()||!t||!b||!weight){w.alert('Uzupełnij imię, nazwisko, typ, budżet i kategorię wagową.');return}w.s.first=first.value.trim();w.s.last=last.value.trim();w.s.type=t.value;w.s.budget=+b.value;w.s.weight=weight.value;w.s.logs=['🥊 Kariera rozpoczęta.'];w.dashboard();w.event('NOWA KARIERA','Masz '+w.s.budget.toLocaleString('pl-PL')+' ISK. Najpierw budujesz formę, reputację i rekord.',['WEJDŹ DO DASHBOARDU',()=>w.dashboard()])};}catch(e){console.error('V90 patch',e)}});</script></body></html>
