<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V119</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="game"></iframe><script>(function(){'use strict';const KEY='mmaCareerV111',f=document.getElementById('game');let offer=null,modalOpen=false,cleaned=false;const camps=[{name:'Reykjavík Fight Lab',days:10,cost:1200,desc:'Lokalny camp. Kondycja + szybkość.'},{name:'WCA Fight Team',days:14,cost:3500,desc:'Mocny przekrojowy camp. Boks + BJJ.'},{name:'ANKOS MMA',days:14,cost:4200,desc:'Dużo zapasów i pracy pod klatką.'},{name:'American Top Team',days:21,cost:12000,desc:'Pełny profesjonalny camp. Wszystkie główne obszary.'}];function D(){return f.contentDocument}function W(){return f.contentWindow}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}}function close(){const d=D(),m=d&&d.getElementById('modal');if(m)m.style.display='none';modalOpen=false}function show(title,head,body,buttons){const d=D();if(!d)return;const m=d.getElementById('modal'),mc=d.getElementById('mc');if(!m||!mc)return;d.getElementById('mt').textContent=title;d.getElementById('mh').textContent=head;d.getElementById('mb').innerHTML=body;mc.innerHTML='';buttons.forEach(([label,fn])=>{const b=d.createElement('button');b.type='button';b.className='option';b.innerHTML=label;b.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();fn()});mc.appendChild(b)});m.style.display='flex';modalOpen=true}function acceptFight(){if(!offer)return;close();setTimeout(chooseCamp,30)}function rejectFight(){const s=read();if(!s||!offer)return;s.log=s.log||[];s.log.push('❌ Odrzucono ofertę walki z '+offer.opp+'.');write(s);offer=null;close();if(typeof W().dashboard==='function')W().dashboard()}function fightOffer(){const s=read();if(!s||s.fight||offer)return;const names=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk'];const opp=names[Math.floor(Math.random()*names.length)];const org=typeof W().league==='function'?W().league():'Lokalna gala';const purse=2500+(s.rep||0)*150+(s.w||0)*450;offer={opp,org,purse};show('EVENT · OFERTA WALKI','📩 TELEFON OD MATCHMAKERA','<p>Propozycja walki: <b>'+opp+'</b></p><p>Organizacja: <b>'+org+'</b></p><p>Gaża: <b>'+Math.round(purse).toLocaleString('pl-PL')+' zł</b></p><p class="muted">Najpierw akceptujesz kontrakt. Dopiero potem wybierasz obóz przygotowawczy.</p>',[['🥊 PRZYJMIJ WALKĘ',acceptFight],['❌ ODRZUĆ WALKĘ',rejectFight]])}function chooseCamp(){if(!offer)return;show('EVENT · CAMP PRZYGOTOWAWCZY','🏕️ WYBIERZ OBÓZ','<p>Rywal: <b>'+offer.opp+'</b> · '+offer.org+'</p><p>Wybierz miejsce przygotowań. Cena i długość campu ustalają termin walki.</p>',camps.map((c,i)=>['🏋️ <b>'+c.name+'</b><br>'+c.days+' dni · '+c.cost.toLocaleString('pl-PL')+' zł<br><small>'+c.desc+'</small>',()=>acceptCamp(i)]))}function acceptCamp(i){const s=read(),c=camps[i];if(!s||!offer)return;if((s.money||0)<c.cost){alert('Za mało pieniędzy na ten camp.');return}const start=s.day+1,date=start+c.days;const sk=s.sk||{};sk.Kondycja=Math.min(100,(sk.Kondycja||50)+Math.round(c.days/5));sk.Boks=Math.min(100,(sk.Boks||50)+Math.round(c.days/8));sk.Zapasy=Math.min(100,(sk.Zapasy||50)+Math.round(c.days/9));sk.BJJ=Math.min(100,(sk.BJJ||50)+Math.round(c.days/9));s.sk=sk;s.money-=c.cost;s.fight={opponent:offer.opp,league:offer.org,purse:offer.purse,date,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0},camp:c.name,campStart:start,campDays:c.days,comment:'JURAS: Camp wybrany. Teraz najważniejsze — zdrowie, dyscyplina i dobrze zaplanowany szczyt formy.'};s.log=s.log||[];s.log.push('🏕️ Wybrano '+c.name+' ('+c.days+' dni) za '+c.cost.toLocaleString('pl-PL')+' zł. Walka z '+offer.opp+' została zaplanowana na dzień '+date+'.');write(s);offer=null;close();if(typeof W().dashboard==='function')W().dashboard()}function install(){try{const d=D();if(!d||!d.body)return;const s=read();if(!s||!s.created){if(!cleaned){cleaned=true;try{localStorage.removeItem(KEY)}catch(e){}f.src='./mma-v111.html?v=119creator'+Date.now();return}}/* Robustly catch the accept button even if the base page replaces its modal handlers. */if(!d.__v119ClickPatch){d.__v119ClickPatch=true;d.addEventListener('click',function(ev){const el=ev.target.closest('button');if(!el)return;const txt=(el.textContent||'').trim().toUpperCase();if(txt.includes('PRZYJMIJ WALKĘ')){ev.preventDefault();ev.stopImmediatePropagation();acceptFight()}},true)}/* Keep the Continue control in the dashboard top-right without altering the dashboard layout. */const top=d.querySelector('.main .top');if(top&&s&&s.created){let b=d.getElementById('v119Continue');if(!b){b=d.createElement('button');b.id='v119Continue';b.className='primary';b.type='button';b.textContent='▶ KONTYNUUJ DO NASTĘPNEGO EVENTU';b.style.cssText='margin-left:auto;font-size:15px;padding:13px 18px;white-space:nowrap';top.appendChild(b);b.onclick=function(){const st=read();if(!st)return;if(st.fight&&st.day>=st.fight.date){W().startFight();return}for(let i=0;i<365;i++){st.day++;if(st.day%365===0)st.age++;st.money=Math.max(0,(st.money||0)-200);if(st.fight&&st.day>=st.fight.date){write(st);W().dashboard();setTimeout(()=>W().startFight(),50);return}if(!st.fight&&st.day%10===0){write(st);fightOffer();return}if((st.ig||0)>=1000&&st.day%17===0){write(st);socialEvent();return}if(!st.manager&&(st.ig||0)>=5000&&st.day%7===0){write(st);managerEvent();return}}write(st);W().dashboard()}}b.style.display=st.screen==='dashboard'?'inline-block':'none'}}catch(e){}}f.addEventListener('load',()=>setTimeout(install,100));setInterval(install,500);})();</script></body></htm
