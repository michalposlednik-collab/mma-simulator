<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V89</title><style>*{box-sizing:border-box}body{margin:0;background:#060b10;color:#edf2f4;font:14px Arial,sans-serif}button,input{font:inherit}.screen{min-height:100vh;padding:28px;background:radial-gradient(circle at 20% 0,#173c50,#05090d 65%)}.card,.panel{background:#0d1821;border:1px solid #294654;border-radius:16px;box-shadow:0 18px 55px #0009}.card{max-width:1100px;margin:auto;padding:28px}.gold{color:#d6af55}.muted{color:#8497a0}.field{margin:15px 0}.field label{display:block;font-size:11px;color:#9aabb4;margin-bottom:7px}.field input{width:100%;padding:13px;background:#071017;color:#fff;border:1px solid #294554;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.budget{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:14px;background:#101e27;border:1px solid #294554;border-radius:10px;cursor:pointer;min-height:78px}.pick:checked+label{border-color:#d6af55;background:#211f15}.pick+label small{display:block;color:#899aa3;margin-top:6px;line-height:1.4}.btn{padding:11px 15px;background:#12222c;color:#fff;border:1px solid #405866;border-radius:9px;cursor:pointer}.primary{background:#80662b;border-color:#d6af55;font-weight:800}.layout{display:grid;grid-template-columns:215px 1fr;min-height:100vh}.side{background:#060c12;border-right:1px solid #203642;padding:14px}.side button{width:100%;margin:4px 0;padding:12px;text-align:left;background:#0b151d;color:#b8c4c9;border:1px solid #203642;border-radius:8px;cursor:pointer}.main{padding:23px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:15px 0}.stat{padding:14px;background:linear-gradient(145deg,#101e27,#091219);border:1px solid #263f4d;border-radius:10px}.stat small{color:#748792}.stat strong{display:block;font-size:19px;margin-top:7px}.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.tabs button{padding:11px 6px;background:#0d1921;color:#b9c5ca;border:1px solid #294352;border-radius:8px;cursor:pointer}.dashboardGrid{display:grid;grid-template-columns:1.55fr .8fr;gap:12px}.hero{padding:25px;min-height:210px;background:radial-gradient(circle at 80% 0,#3a301a,#101a21 60%);border:1px solid #80662d;border-radius:16px}.miniGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mini{padding:13px;background:#101c25;border:1px solid #263f4d;border-radius:10px}.feed{padding:9px 0;border-bottom:1px solid #1b303b}.bar{height:8px;background:#1b2b33;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#3dca84}.modal{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:50;padding:20px}.modalbox{width:min(850px,94vw);background:#0d1821;border:1px solid #d6af55;border-radius:18px;padding:28px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle,#173b4d,#050a0e 65%)}.fighters{display:grid;grid-template-columns:1fr 190px 1fr;gap:15px;align-items:center;max-width:1100px;margin:auto;text-align:center}.fighter{padding:17px;background:#0b161f;border:1px solid #294554;border-radius:12px}.hp{height:14px;background:#29171b;border-radius:6px;overflow:hidden}.hp i{display:block;height:100%;background:#3dcc84;transition:.35s}.opp i{background:#df5964}.clock{width:150px;height:150px;border:7px solid #d6af55;border-radius:50%;display:grid;place-items:center;margin:auto}.time{font:700 28px monospace}.comment{max-width:1100px;height:220px;overflow:auto;margin:12px auto;background:#050c11;border:1px solid #294352;border-radius:10px;padding:12px}.comment p{margin:0;padding:7px;border-bottom:1px solid #172a35}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{padding:12px;min-height:60px;text-align:left;background:#101f29;color:#fff;border:1px solid #294554;border-radius:9px;cursor:pointer}.wheelwrap{position:relative;width:290px;height:290px;margin:18px auto}.wheel{width:290px;height:290px;border-radius:50%;background:conic-gradient(#36c77b 0 8%,#d84f5b 8% 16%,#36c77b 16% 24%,#d84f5b 24% 32%,#36c77b 32% 40%,#d84f5b 40% 48%,#36c77b 48% 56%,#d84f5b 56% 64%,#36c77b 64% 72%,#d84f5b 72% 80%,#36c77b 80% 88%,#d84f5b 88%);border:7px solid #65747d;transition:transform 1.8s cubic-bezier(.12,.75,.08,1)}.pointer{position:absolute;z-index:2;top:-20px;left:50%;transform:translateX(-50%);font-size:30px}@media(max-width:950px){.grid,.budget,.stats,.dashboardGrid,.fighters,.acts,.tabs{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.clock{order:-1}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:115px}}@media(max-width:600px){.grid,.budget,.stats,.dashboardGrid,.acts,.tabs,.choices{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const A=document.getElementById('app');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:'Młody talent — szybkość i potencjał.','Osiedlowy bijok':'Twardy charakter — presja i chaos.',Fizol:'Siła — klincz i brutalna presja.',Zapaśnik:'Obalenia — kontrola i siatka.',Striker:'Stójka — boks i nokauty.',Gumiarz:'BJJ — poddania i przetrwanie.',Allrounder:'Równy rozwój całego MMA.'};const BUDGETS=[[5000,'Normalny etat','Praca po godzinach i trening z oszczędności.'],[10000,'Etat + oszczędności','Pierwszy sprzęt i okazjonalny obóz.'],[25000,'Rodzina pomaga','Finansowy oddech na rozwój.'],[50000,'Bogata rodzina','Możesz inwestować w najlepszych ludzi.'],[100000,'Rodzinny biznes','Mocne zaplecze, ale wielkie oczekiwania.']];let s={day:1,age:18,ig:100,rep:5,mot:55,budget:10000,w:0,l:0,d:0,fat:8,sk:{boks:50,zapasy:50,bjj:50,kondycja:50,sila:50,szybkosc:50},logs:['Kariera gotowa do rozpoczęcia.'],gym:'Lokalny klub',fight:null};function creator(){A.innerHTML='<div class="screen"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Stwórz zawodnika i rozpocznij drogę od lokalnych gal do największych federacji.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="np. Michał"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="np. Kowalski"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.entries(TYPES).map((x,i)=>'<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x[0]+'"><label for="t'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="budget">'+BUDGETS.map((x,i)=>'<input class="pick" id="b'+i+'" name="budget" type="radio" value="'+x[0]+'" '+(i===1?'checked':'')+'><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' ISK</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>').join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.entries(KG).map((x,i)=>'<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x[0]+'"><label for="w'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><br><button class="btn primary" onclick="start()">STWÓRZ KARIERĘ →</button></div></div>'}function start(){let t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=budget]:checked'),w=document.querySelector('[name=weight]:checked');if(!fn.value.trim()||!ln.value.trim()||!t||!b||!w)return alert('Uzupełnij wszystkie pola.');s.first=fn.value.trim();s.last=ln.value.trim();s.type=t.value;s.budget=+b.value;s.weight=w.value;s.logs=['🥊 Kariera rozpoczęta.'];dashboard();event('NOWA KARIERA','Masz '+s.budget.toLocaleString('pl-PL')+' ISK. Najpierw budujesz formę, reputację i rekord.',['WEJDŹ DO DASHBOARDU',()=>dashboard()])}function side(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="day()">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fight()">🏆 Walki</button><button onclick="media()">📱 Media</button><button onclick="career()">📋 Kariera</button><button onclick="manager()">💼 Menedżer</button><button onclick="stats()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){A.innerHTML='<div class="layout">'+side()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button class="btn" onclick="day()">＋ 1 DZIEŃ</button> <button class="btn primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><strong>'+s.w+'-'+s.l+'-'+s.d+'</strong></div><div class="stat"><small>INSTAGRAM</small><strong>'+s.ig.toLocaleString()+'</strong></div><div class="stat"><small>REPUTACJA</small><strong>'+s.rep+'/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>'+s.mot+'/100</strong></div><div class="stat"><small>BUDŻET</small><strong>'+s.budget.toLocaleString()+' ISK</strong></div><div class="stat"><small>WIEK</small><strong>'+s.age+'</strong></div></div><div class="tabs"><button onclick="training()">🥊 Trening</button><button onclick="fight()">🏆 Walka</button><button onclick="media()">📱 Media</button><button onclick="career()">📋 Kariera</button><button onclick="manager()">💼 Menedżer</button><button onclick="stats()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button><button onclick="nextEvent()">⏩ Event</button></div><div class="dashboardGrid"><section><div class="hero"><small class="gold">NAJBLIŻSZY CEL</small><h2>Buduj nazwisko krok po kroku</h2><p>Najpierw lokalne gale i rozwój. Potem większe federacje, obozy, sponsorzy i kontrakty.</p><div class="miniGrid"><div class="mini"><b>Obecny klub</b><br>'+s.gym+'</div><div class="mini"><b>Forma</b><br>'+s.fat+'% zmęczenia</div><div class="mini"><b>Najlepsza umiejętność</b><br>'+best()+'</div><div class="mini"><b>Droga kariery</b><br>'+careerLevel()+'</div></div><br><button class="btn primary" onclick="nextEvent()">PRZEWIŃ DO NASTĘPNEGO EVENTU</button></div><div class="panel"><h3>📰 OŚ CZASU KARIERY</h3>'+s.logs.slice(0,12).map(x=>'<div class="feed">'+x+'</div>').join('')+'</div></section><aside><div class="panel"><h3>📈 ROZWÓJ ZAWODNIKA</h3>'+Object.entries(s.sk).map(x=>'<div class="feed"><b>'+x[0].toUpperCase()+'</b> '+x[1]+'<div class="bar"><i style="width:'+x[1]+'%"></i></div></div>').join('')+'</div><div class="panel"><h3>🗺️ DRABINA KARIERY</h3>'+['Hybrid/Babylon/FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map((x,i)=>'<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'✅':'🔒')+' '+x+' <span class="muted">REP '+[5,20,35,50,65,80][i]+'</span></div>').join('')+'</div></aside></div></main></div>'}function best(){return Object.entries(s.sk).sort((a,b)=>b[1]-a[1])[0][0]}function careerLevel(){if(s.rep>=80)return'UFC';if(s.rep>=65)return'PFL';if(s.rep>=50)return'Cage Warriors';if(s.rep>=35)return'OKTAGON';if(s.rep>=20)return'KSW';return'lokalne gale'}function event(title,text,choices){A.innerHTML='<div class="modal"><div class="modalbox"><small class="gold">EVENT KARIERY</small><h1>'+title+'</h1><p style="font-size:18px;line-height:1.6">'+text+'</p><div class="choices">'+choices.map(c=>'<button class="btn" id="c'+choices.indexOf(c)+'">'+c[0]+'</button>').join('')+'</div></div></div>';choices.forEach((c,i)=>document.getElementById('c'+i).onclick=c[1])}function day(){s.day++;if(s.day%365===0){s.age++;s.logs.unshift('🎂 Urodziny. Twój zawodnik ma teraz '+s.age+' lat.');}s.fat=Math.max(0,s.fat-2);s.mot=Math.min(100,s.mot+1);dashboard()}function nextEvent(){s.day++;if(s.day%365===0)s.age++;let r=Math.random();if(r<.25)event('ZAPROSZENIE NA TRENING','Masz propozycję obozu. Reputacja i pieniądze decydują, gdzie możesz trenować.',[['ANKOS — 6000 ISK · REP 15',()=>camp('Ankos',6000,15,6,4,2)],['LOKALNY OBÓZ — 1500 ISK',()=>camp('Lokalny obóz',1500,0,3,3,3)],['ODMAWIAM',()=>dashboard()]]);else if(r<.5)event('PROPOZYCJA WALKI','Promotor proponuje walkę dopasowaną do obecnego poziomu kariery.',[['BIORĘ WALKĘ',()=>fight()],['ODMAWIAM',()=>{s.mot=Math.max(0,s.mot-3);dashboard()}]]);else if(r<.72)event('VIRAL','Fragment treningu został zauważony. Internet zaczyna kojarzyć Twoje nazwisko.',[['WRZUCAM — +100 IG',()=>{s.ig+=100;s.rep=Math.min(100,s.rep+1);s.logs.unshift('🔥 Viral treningowy: +100 IG.');dashboard()}],['IGNORUJĘ',()=>dashboard()]]);else event('ZAPROSZENIE NA GALĘ','Możesz pokazać się promotorom i mediom.',[['IDĘ — +60 IG / +2 REP',()=>{s.ig+=60;s.rep=Math.min(100,s.rep+2);s.logs.unshift('🎟️ Pojawiłeś się na gali. +60 IG, +2 REP.');dashboard()}],['ODPUSZCZAM',()=>dashboard()]])}function camp(name,cost,req,b,z,k){if(s.rep<req)return event('BRAK REPUTACJI','Na '+name+' jeszcze Cię nie stać sportowo. Potrzebujesz REP '+req+'.',['WRÓĆ',()=>dashboard()]);if(s.budget<cost)return event('BRAK BUDŻETU','Potrzebujesz '+cost+' ISK, a masz '+s.budget+' ISK.',['WRÓĆ',()=>dashboard()]);s.budget-=cost;s.gym=name;s.sk.boks=Math.min(99,s.sk.boks+b);s.sk.zapasy=Math.min(99,s.sk.zapasy+z);s.sk.kondycja=Math.min(99,s.sk.kondycja+k);s.fat=Math.min(80,s.fat+12);s.day+=14;s.logs.unshift('🥊 '+name+' · 14 dni · +'+b+' boks, +'+z+' zapasy, +'+k+' kondycja.');dashboard()}function training(){event('TRENING','Krótki trening poprawia konkretny element, ale zwiększa zmęczenie.',[['BOKS +2',()=>train('boks')],['ZAPASY +2',()=>train('zapasy')],['BJJ +2',()=>train('bjj')],['KONDYCJA +2',()=>train('kondycja')]])}function train(k){s.sk[k]=Math.min(99,s.sk[k]+2);s.fat=Math.min(80,s.fat+5);s.mot=Math.min(100,s.mot+1);s.logs.unshift('🥋 Trening '+k+' +2.');dashboard()}function media(){event('MEDIA','Budujesz medialność. Każdy ruch może zmienić reputację.',[['WYWIAD — +40 IG',()=>{s.ig+=40;s.logs.unshift('🎙️ Wywiad: +40 IG.');dashboard()}],['VIRAL — +150 IG',()=>{s.ig+=150;s.rep=Math.min(100,s.rep+2);s.logs.unshift('🔥 Viral medialny: +150 IG, +2 REP.');dashboard()}]])}function career(){event('ŚCIEŻKA KARIERY','Poziom federacji rośnie razem z reputacją. Każdy kolejny krok wymaga lepszego rekordu i przygotowania.',[['LOKALNE — HYBRID / BABYLON / FEN',()=>dashboard()],['KSW — REP 20',()=>careerTry(20,'KSW')],['OKTAGON — REP 35',()=>careerTry(35,'OKTAGON')],['CAGE WARRIORS — REP 50',()=>careerTry(50,'Cage Warriors')],['PFL — REP 65',()=>careerTry(65,'PFL')],['UFC — REP 80',()=>careerTry(80,'UFC')]])}function careerTry(req,name){if(s.rep<req)return event('ZA WCZEŚNIE','Do '+name+' potrzebujesz REP '+req+'.',['WRÓĆ',()=>dashboard()]);s.logs.unshift('📨 Wysłano zgłoszenie do '+name+'.');s.rep=Math.min(100,s.rep+1);dashboard()}function manager(){event('MENEDŻER KARIERY','Menedżer pilnuje ofert, sponsorów, federacji i negocjacji.',[['SZUKAJ SPONSORA',()=>{s.budget+=2500;s.logs.unshift('💰 Sponsor: +2500 ISK.');dashboard()}],['PROŚ O WALKĘ W WIĘKSZEJ FEDERACJI',()=>{s.rep=Math.min(100,s.rep+2);s.logs.unshift('📨 Menedżer wysłał prośby do promotorów.');dashboard()}]])}function stats(){event('STATYSTYKI','Rekord '+s.w+'-'+s.l+'-'+s.d+' · '+s.ig+' IG · REP '+s.rep+' · wiek '+s.age+' · klub '+s.gym,[['WRÓĆ',()=>dashboard()]])}function events(){nextEvent()}function fight(){let f={sec:300,me:100,op:100,st:100,stopped:false};s.fight=f;A.innerHTML='<div class="fight"><div class="top"><div><b>'+s.first+' '+s.last+'</b><div class="muted">'+s.weight+' · '+KG[s.weight]+'</div></div><button class="btn" onclick="dashboard()">WYJDŹ</button></div><div class="fighters"><div class="fighter"><b>'+s.first+' '+s.last+'</b><p>STAMINA / WITALNOŚĆ</p><div class="hp"><i id="me" style="width:100%"></i></div></div><div class="clock"><div><div class="time" id="time">05:00</div><small>RUNDA 1</small></div></div><div class="fighter"><b>RYWAL</b><p>WITALNOŚĆ</p><div class="hp opp"><i id="op" style="width:100%"></i></div></div></div><div class="comment" id="comment"><p>JURAS: „Zaczynamy! Spokojny początek, obaj badają dystans.”</p></div><div class="acts">'+['JAB','LOW KICK','CROSS','CLINCH','HIGH KICK','SPINNING BACKFIST','LATAJĄCE KOLANO','ŁOKIEĆ','SINGLE LEG','DOUBLE LEG','BALACHA','TRÓJKĄT NOGAMI','TRÓJKĄT RĘKOMA','RNC'].map(x=>'<button class="act" onclick="act(\''+x+'\')"><b>'+x+'</b></button>').join('')+'</div></div>';f.timer=setInterval(tick,400)}function tick(){let f=s.fight;if(!f||f.stopped)return;f.sec--;f.st=Math.max(0,f.st-Math.random()*1.5);f.me=Math.max(0,f.me-Math.random()*.8);f.op=Math.max(0,f.op-Math.random()*.65);let tm=document.getElementById('time');if(!tm)return;tm.textContent=Math.floor(f.sec/60).toString().padStart(2,'0')+':'+(f.sec%60).toString().padStart(2,'0');document.getElementById('me').style.width=f.st+'%';document.getElementById('op').style.width=f.op+'%';if(Math.random()<.22)comment(['JURAS: „Dobra praca na nogach.”','JURAS: „Rywal zaczyna oddychać ciężej.”','JURAS: „Mocny low kick.”','JURAS: „Presja pod siatką.”','JURAS: „Dobre czytanie dystansu.”','JURAS: „Próba obalenia, dobra obrona.”'][Math.floor(Math.random()*6)]);if(f.sec<=0)finish('decision');if(f.op<=8&&Math.random()<.04)finish('tko')}function comment(x){let c=document.getElementById('comment');if(c){c.innerHTML+='<p>'+x+'</p>';c.scrollTop=c.scrollHeight}}function act(n){let f=s.fight;if(!f||f.stopped)return;if(/HIGH KICK|SPINNING|LATAJĄCE|ŁOKIEĆ|BALACHA|TRÓJKĄT|RNC/.test(n))return wheel(n);f.op=Math.max(0,f.op-(3+Math.random()*7));f.st=Math.max(0,f.st-(2+Math.random()*4));comment('JURAS: „'+n+'! Dobra akcja, walka płynie dalej.”')}function wheel(n){let o=document.createElement('div');o.className='modal';o.innerHTML='<div class="modalbox" style="text-align:center"><b class="gold">JURAS · MOMENT W WALCE</b><h2>'+n+'</h2><p>Wskaźnik stoi. Koło się obraca.</p><div class="wheelwrap"><div class="pointer">▼</div><div class="wheel"></div></div><div id="wr">LOSOWANIE...</div></div>';document.body.appendChild(o);let ok=Math.random()<.55;requestAnimationFrame(()=>o.querySelector('.wheel').style.transform='rotate('+(2160+Math.random()*720)+'deg)');setTimeout(()=>{o.querySelector('#wr').textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';if(ok){let f=s.fight;f.op=Math.max(0,f.op-15-Math.random()*20);comment(/HIGH KICK|SPINNING|LATAJĄCE/.test(n)?'JURAS: „ŁOOOOOO! Ależ weszło!”':'JURAS: „Ooo! Kapitalnie wykonana technika!”');if(/BALACHA|TRÓJKĄT|RNC/.test(n)&&Math.random()<.3)finish('submission');else if(f.op<8)finish('tko')}setTimeout(()=>o.remove(),900)},1850)}function finish(type){let f=s.fight;if(!f||f.stopped)return;f.stopped=true;clearInterval(f.timer);s.w++;s.rep=Math.min(100,s.rep+2);s.fat=Math.min(80,s.fat+20);s.logs.unshift(type==='decision'?'🏆 Zwycięstwo decyzją.':type==='submission'?'🥋 Zwycięstwo przez poddanie.':'💥 Zwycięstwo przez nokaut/TKO.');event('WALKA ZAKOŃCZONA',type==='decision'?'Sędziowie punktują walkę.':'Zwycięstwo przed czasem!',[['WRÓĆ DO KARIERY',()=>dashboard()]])}creator();</script></body></html>
