<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V121</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99999;padding:18px}.box{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#101c25;color:#eef3f5;border:1px solid #d6ae51;border-radius:18px;padding:24px;font:15px Arial,sans-serif}.box h1{margin-top:6px}.camp{display:block;width:100%;margin:9px 0;padding:15px;background:#142833;color:#fff;border:1px solid #526873;border-radius:10px;text-align:left;cursor:pointer}.camp:hover{border-color:#d6ae51}.gold{color:#d6ae51}.muted{color:#91a3ac}.danger{color:#df5045}.ok{color:#5fd37a}</style></head><body><iframe id="game"></iframe><div id="overlay" class="overlay"><div class="box"><small class="gold">EVENT · PRZYGOTOWANIE DO WALKI</small><h1 id="title">Wybierz obóz</h1><div id="details"></div><div id="camps"></div><button id="cancel">ANULUJ</button></div></div><script>(function(){'use strict';const KEY='mmaCareerV111';const frame=document.getElementById('game'),overlay=document.getElementById('overlay'),details=document.getElementById('details'),campsBox=document.getElementById('camps');const camps=[['Reykjavík Fight Lab',10,1200,'Kondycja + szybkość'],['WCA Fight Team',14,3500,'Boks + BJJ'],['ANKOS MMA',14,4200,'Zapasy + praca pod klatką'],['American Top Team',21,12000,'Pełny profesjonalny camp']];let active=false,offer=null,fresh=false;function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function closeBaseModal(){try{const d=frame.contentDocument;const m=d&&d.getElementById('modal');if(m)m.style.display='none'}catch(e){}}function start(){try{if(!sessionStorage.getItem('mmaV121Started')){localStorage.removeItem(KEY);sessionStorage.setItem('mmaV121Started','1');fresh=true}}catch(e){}frame.src='./mma-v111.html?v=121base&x='+Date.now()}function extractOffer(){const d=frame.contentDocument,s=load();let text='';try{text=(d&&d.body?d.body.innerText:'')}catch(e){}let opp='Nieznany rywal',org='Lokalna gala',purse=2500;const modal=d&&d.getElementById('modal');if(modal){const h=modal.querySelector('#mh');const b=modal.querySelector('#mb');text=((h?h.innerText:'')+' '+(b?b.innerText:'')).trim()}const m=text.match(/(?:RYWAL|PRZECIWNIK)\s*[:\-]\s*([^\n]+)/i);if(m)opp=m[1].trim();const o=text.match(/(?:ORGANIZACJA|GALA)\s*[:\-]\s*([^\n]+)/i);if(o)org=o[1].trim();const p=text.match(/([0-9][0-9 .]*)\s*(?:zł|PLN)/i);if(p)purse=parseInt(p[1].replace(/[ .]/g,''),10)||purse;if(s&&s.fight&&s.fight.opponent){opp=s.fight.opponent}if(s&&s.fight&&s.fight.league){org=s.fight.league}if(s&&s.fight&&s.fight.purse){purse=s.fight.purse}return{opp,org,purse}}function openCamp(){if(active)return;active=true;offer=extractOffer();details.innerHTML='<p><b>'+escape(offer.opp)+'</b> · '+escape(offer.org)+'</p><p class="muted">Najpierw wybierz obóz. Po zatwierdzeniu campu walka zostanie wpisana do kalendarza z konkretną datą.</p>';campsBox.innerHTML='';camps.forEach(function(c,i){const b=document.createElement('button');b.className='camp';b.innerHTML='<b>'+escape(c[0])+'</b><br>'+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł<br><small>'+escape(c[3])+'</small>';b.addEventListener('click',function(){acceptCamp(i)});campsBox.appendChild(b)});overlay.style.display='flex';closeBaseModal()}function acceptCamp(i){const s=load();const c=camps[i];if(!s){alert('Nie znaleziono kariery.');return}if(Number(s.money||0)<c[2]){alert('Za mało pieniędzy na ten camp.');return}s.money-=c[2];const date=Number(s.day||1)+c[1]+1;s.fight={opponent:offer.opp,league:offer.org,purse:offer.purse,date:date,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0},camp:c[0],campDays:c[1],comment:'JURAS: Camp wybrany. Teraz robimy robotę.'};s.log=s.log||[];s.log.push('🏕️ '+c[0]+' · '+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł. Walka z '+offer.opp+' zaplanowana na dzień '+date+'.');save(s);overlay.style.display='none';active=false;offer=null;try{if(typeof frame.contentWindow.dashboard==='function'){frame.contentWindow.s.money=s.money;frame.contentWindow.s.fight=s.fight;frame.contentWindow.s.log=s.log;frame.contentWindow.dashboard()}}catch(e){frame.src='./mma-v111.html?v=121refresh&x='+Date.now()}}function escape(x){return String(x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}function hook(){try{const d=frame.contentDocument;if(!d||!d.body)return;if(d.__v121)return;d.__v121=true;const handler=function(ev){const el=ev.target&&ev.target.closest?ev.target.closest('button'):null;if(!el)return;const txt=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim().toUpperCase();if(txt.indexOf('PRZYJMIJ WALKĘ')!==-1||txt.indexOf('PRZYJMIJ WALKE')!==-1){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();openCamp()}};d.addEventListener('click',handler,true);const mo=new MutationObserver(function(){if(active)return;const buttons=[...d.querySelectorAll('button')];for(const b of buttons){const txt=(b.innerText||b.textContent||'').replace(/\s+/g,' ').trim().toUpperCase();if((txt.indexOf('PRZYJMIJ WALKĘ')!==-1||txt.indexOf('PRZYJMIJ WALKE')!==-1)&&!b.__v121Bound){b.__v121Bound=true;b.addEventListener('click',function(ev){ev.preventDefault();ev.stopImmediatePropagation();openCamp()},true)}}});mo.observe(d.body,{subtree:true,childList:true,characterData:true})}catch(e){}}frame.addEventListener('load',function(){setTimeout(hook,50);setTimeout(hook,300);setTimeout(hook,1000)});setInterval(hook,1000);document.getElementById('cancel').onclick=function(){overlay.style.display='none';active=false;offer=null};start()})();</script></body></html>
