<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V108</title><style>*{box-sizing:border-box}body{margin:0;background:#060b10;color:#eef3f5;font:15px Arial}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}button:hover{border-color:#d6ae51}.primary{background:#80652a;border-color:#d6ae51}button:disabled{opacity:.35}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.side .active{border-color:#d6ae51;background:#211f15}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile,.panel{background:#101e27;border:1px solid #304955;border-radius:14px;padding:15px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:5px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#36c77b}.muted{color:#91a3ac}.wrap{padding:28px}.card{max-width:1100px;margin:auto;background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{display:none}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer}.pick:checked+label{border-color:#d6ae51;background:#211f15}.pick+label small{display:block;color:#9eb0b8;margin-top:6px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#293a44,#070c11)}.fighttop{display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;gap:20px;max-width:1250px;margin:auto}.fighter{text-align:center;padding:18px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:14px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.comment{min-height:105px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;font-size:17px;line-height:1.5}.timer{width:270px;height:270px;margin:auto;position:relative;border-radius:50%;display:grid;place-items:center}.timer:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#d6ae51 var(--pct),#26343b 0);box-shadow:0 0 0 8px #111d24}.timer:after{content:'';position:absolute;inset:18px;border-radius:50%;background:#081016;border:1px solid #304955}.timerText{position:relative;z-index:2;text-align:center}.clock{font-size:44px;font-weight:900}.round{font-size:13px;letter-spacing:2px;color:#d6ae51}.actions{display:flex;flex-wrap:wrap;gap:8px;max-width:1250px;margin:14px auto}.wheelwrap,.modal{display:none;position:fixed;inset:0;background:#000e;z-index:100;place-items:center;padding:18px}.box{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px;width:min(720px,96vw);max-height:94vh;overflow:auto;text-align:center}.wheelstage{width:340px;height:340px;margin:14px auto;position:relative}.wheel{position:absolute;left:10px;top:10px;width:320px;height:320px;border-radius:50%;background:conic-gradient(#d94b3d 0 12.5%,#69cf72 12.5% 25%,#f3b44e 25% 37.5%,#d94b3d 37.5% 50%,#69cf72 50% 62.5%,#f3b44e 62.5% 75%,#d94b3d 75% 87.5%,#69cf72 87.5% 100%);border:9px solid #17252d;transition:transform 2.6s cubic-bezier(.12,.7,.15,1);box-shadow:0 8px 30px #0008}.pointer{position:absolute;z-index:5;top:-3px;left:50%;transform:translateX(-50%);border-left:19px solid transparent;border-right:19px solid transparent;border-top:38px solid #d6ae51}.result{font-size:34px;color:#d6ae51;font-weight:900;min-height:45px}.winner{font-size:40px;color:#d6ae51;font-weight:900}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{text-align:left;min-height:85px}.target{padding:12px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;margin:5px}.target.sel{border-color:#d6ae51;background:#211f15}.hidden{display:none}.notice{padding:15px;border:1px solid #80652a;background:#211f15;border-radius:12px;margin:12px 0}.income{border-left:4px solid #36c77b}.careerDoc{background:#0b151d;border:1px solid #304955;padding:18px;border-radius:12px;line-height:1.6}@media(max-width:950px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.cols,.fighttop{grid-template-columns:1fr}.timer{width:230px;height:230px}.choices{grid-template-columns:1fr}}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}.top{display:block}.timer{width:210px;height:210px}.clock{font-size:34px}}</style></head><body><div id="app" class="app"></div><div id="wheel" class="wheelwrap"><div class="box"><div class="muted">CZAS ZATRZYMANY — DODATKOWA AKCJA</div><h2 id="wa" class="gold">HIGH KICK</h2><p>Bez napisów na polach. Kolor oznacza wynik: 🟢 sukces · 🟠 częściowy · 🔴 nieudana.</p><div class="wheelstage"><div class="pointer"></div><div id="we" class="wheel"></div></div><div id="wr" class="result">GOTOWE</div><button id="spin" class="primary">LOSUJ EFEKT</button></div></div><div id="modal" class="modal"><div class="box"><div class="muted">OFICJALNY WYNIK</div><div id="win" class="winner"></div><h2 id="method"></h2><p id="sum"></p><hr><h2>🎙️ WYWIAD W KLATCE</h2><div id="choices" class="choices"><button class="choice" data-k="challenge">🔥 <b>Wyzwanie rywala</b><br><small>Wybierz konkretnego zawodnika.</small></button><button class="choice" data-k="corner">🙏 <b>Podziękuj narożnikowi</b><br><small>Trenerzy, rodzina, team.</small></button><button class="choice" data-k="joke">😂 <b>Rzuć żart</b><br><small>Rozładuj emocje.</small></button><button class="choice" data-k="respect">🤝 <b>Szacunek dla rywala</b><br><small>Sportowa odpowiedź.</small></button><button class="choice" data-k="fans">❤️ <b>Podziękuj kibicom</b><br><small>Buduj więź z fanami.</small></button><button class="choice" data-k="ambition">🏆 <b>Idę po pas</b><br><small>Duża deklaracja.</small></button></div><div id="targets" class="hidden"><h3>Wybierz rywala</h3><div id="targetList"></div><button id="confirm" class="primary">WYZWANIE NA ŻYWO</button></div><div id="iv" class="notice hidden"></div><button id="back" class="primary hidden">WRÓĆ DO DASHBOARDU</button></div></div><script>(function(){'use strict';const app=document.getElementById('app'),wheel=document.getElementById('wheel'),we=document.getElementById('we'),spin=document.getElementById('spin'),wr=document.getElementById('wr'),modal=document.getElementById('modal');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:'Talent, refleks i głód zwycięstw.',Bijok:'Szczęka, presja i moc.',Fizol:'Siła, klincz i presja.',Zapaśnik:'Obalenia, siatka i kontrola.',Striker:'Dystans, timing i nokaut.',Gumiarz:'Chaos, parter i kreatywność.',Allrounder:'Wszechstronność.'};const BUD=[[5000,'Normalny etat'],[10000,'Etat + oszczędności'],[25000,'Rodzina pomaga'],[50000,'Bogata rodzina'],[100000,'Rodzinny biznes']];const OPP=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk','Alex Pereira Jr.','Michał „Bizon” Kowal'];let s={created:false,day:1,age:18,money:10000,rep:5,ig:100,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',club:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,lastResult:null,history:[],log:[],media:{interview:0,post:0,controversy:0},agent:null,jobs:{weekly:false,monthly:false},screen:'dashboard'};try{let x=localStorage.getItem('mmaCareerV108');if(x)s=Object.assign(s,JSON.parse(x))}catch(e){}let raf=0,last=0,pending=null,selected='';const money=n=>Math.round(n).toLocaleString('pl-PL')+' zł',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('mmaCareerV108',JSON.stringify(s))}catch(e){}}function league(){if(s.w<2)return'Lokalna gala';if(s.w<4)return'Hybrid';if(s.w<7)return'Babilon MMA / FEN';if(s.w<10)return'KSW';if(s.w<13)return'OKTAGON';if(s.w<16)return'Cage Warriors';if(s.w<19)return'PFL';return'UFC'}function creator(){let t=Object.keys(TYPES).map((x,i)=>`<input class="pick" id="t${i}" name="type" type="radio" value="${x}"><label for="t${i}"><b>${x}</b><small>${TYPES[x]}</small></label>`).join(''),b=BUD.map((x,i)=>`<input class="pick" id="b${i}" name="bud" type="radio" value="${x[0]}"><label for="b${i}"><b>${money(x[0])}</b><small>${x[1]}</small></label>`).join(''),w=Object.keys(KG).map((x,i)=>`<input class="pick" id="w${i}" name="weight" type="radio" value="${x}"><label for="w${i}"><b>${x}</b><small>${KG[x]}</small></label>`).join('');app.innerHTML=`<div class="wrap"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od lokalnej gali do UFC.</p><div class="field"><label>IMIĘ</label><input id="fn"></div><div class="field"><label>NAZWISKO</label><input id="ln"></div><h3>TYP ZAWODNIKA</h3><div class="grid">${t}</div><h3>BUDŻET STARTOWY</h3><div class="grid">${b}</div><h3>KATEGORIA WAGOWA</h3><div class="grid">${w}</div><br><button class="primary" onclick="startCareer()">STWÓRZ KARIERĘ →</button></div></div>`}function nav(){let a=[['dashboard','⌂ Dashboard'],['training','🥊 Trening'],['fights','🏆 Walki'],['career','📋 Kariera'],['media','📱 Media'],['manager','💼 Menedżer'],['statistics','📊 Statystyki'],['finance','💰 Finanse'],['events','◉ Eventy']];return'<aside class="side">'+a.map(x=>`<button class="${s.screen===x[0]?'active':''}" onclick="${x[0]}()">${x[1]}</button>`).join('')+'</aside>'}function stats(){return`<div class="stats"><div class="stat"><small>REKORD</small><b>${s.w}-${s.l}-${s.d}</b></div><div class="stat"><small>REPUTACJA</small><b>${s.rep}/100</b></div><div class="stat"><small>INSTAGRAM</small><b>${s.ig.toLocaleString('pl-PL')}</b></div><div class="stat"><small>GOTÓWKA</small><b>${money(s.money)}</b></div><div class="stat"><small>ORGANIZACJA</small><b>${league()}</b></div><div class="stat"><small>AGENT</small><b>${s.agent?s.agent.name:'brak'}</b></div></div>`}function shell(c){app.innerHTML=`<div class="layout">${nav()}<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>${esc(s.first)} ${esc(s.last)}</h1><p class="muted">Dzień ${s.day} · ${s.age} lat · ${esc(s.type)} · ${s.weight}</p></div><button onclick="nextEvent()" class="primary">⏩ NASTĘPNY EVENT</button></div>${stats()}${c}</main></div>`}function dashboard(){if(!s.created)return creator();s.screen='dashboard';let result=s.lastResult?`<div class="notice"><b>OSTATNIA WALKA:</b> ${s.lastResult.win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA'} — ${s.lastResult.method} vs ${s.lastResult.opponent}.<br><small>${s.lastResult.interview||'Wybór wypowiedzi po walce zapisany.'}</small></div>`:'',event=s.fight?`<div class="hero"><h2>🏆 WALKA W KALENDARZU</h2><p>${s.fight.league} · ${s.fight.opponent}</p><button class="primary" onclick="startFight()">WEJDŹ DO WALKI</button></div>`:`<div class="hero"><h2>📅 BUDOWANIE KARIERY</h2><p>Aktualnie: <b>${league()}</b>. Generuj kolejny event, aby otrzymać nowe możliwości.</p><button class="primary" onclick="nextEvent()">NASTĘPNY EVENT</button></div>`;shell(result+event+`<div class="cols"><section class="panel"><h2>OŚ KARIERY</h2>${s.log.slice(-10).reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section><section class="panel"><h2>UMIEJĘTNOŚCI</h2>${Object.entries(s.sk).map(([k,v])=>`<div class="feed"><b>${k}</b> ${v}<div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</section></div>`)}function startCareer(){let f=fn.value.trim(),l=ln.value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w)return alert('Uzupełnij wszystkie pola.');s.created=true;s.first=f;s.last=l;s.type=t.value;s.money=+b.value;s.weight=w.value;s.log.push('🥊 Rozpoczęto karierę.');save();dashboard()}function nextEvent(){if(s.fight)return dashboard();if(Math.random()<.22){s.log.push('📣 Dodatkowy event: ktoś wyzwał Cię do walki. Możesz odpowiedzieć tutaj.');shell(`<div class="notice"><h2>📣 ZOSTAŁEŚ WYZWANY!</h2><p>Daniel „Kosa” Cruz: „Jeżeli naprawdę jesteś taki dobry, podpiszmy walkę.”</p><div class="actions"><button class="primary" onclick="acceptChallenge()">PRZYJMUJĘ WYZWANIE</button><button onclick="rejectChallenge()">ODMAWIAM / ODPOWIEM PÓŹNIEJ</button></div></div>`);return}let o=OPP[Math.floor(Math.random()*OPP.length)],p=2500+s.rep*180+s.w*500;s.fight={opponent:o,league:league(),purse:p};s.log.push(`📅 Oferta walki: ${o} w ${league()}.`);save();dashboard()}function acceptChallenge(){let o='Daniel „Kosa” Cruz';s.fight={opponent:o,league:league(),purse:3000+s.rep*200};s.log.push('🔥 Przyjęto wyzwanie.');save();dashboard()}function rejectChallenge(){s.log.push('↩️ Odrzucono wyzwanie.');save();dashboard()}function training(){s.screen='training';shell(`<section class="panel"><h2>🥊 TRENING</h2><p class="muted">Ten moduł pozostaje bez zmian.</p><div class="tiles"><div class="tile"><b>Boks</b><h2>${s.sk.Boks}</h2><button onclick="train('Boks',600)">TRENING · 600 zł</button></div><div class="tile"><b>Zapasy</b><h2>${s.sk.Zapasy}</h2><button onclick="train('Zapasy',700)">TRENING · 700 zł</button></div><div class="tile"><b>BJJ</b><h2>${s.sk.BJJ}</h2><button onclick="train('BJJ',700)">TRENING · 700 zł</button></div><div class="tile"><b>Kondycja</b><h2>${s.sk.Kondycja}</h2><button onclick="train('Kondycja',500)">TRENING · 500 zł</button></div></div></section>`)}function train(k,c){if(s.money<c)return alert('Za mało pieniędzy.');s.money-=c;s.sk[k]=Math.min(100,s.sk[k]+2);save();training()}function fights(){s.screen='fights';shell(`<section class="panel"><h2>🏆 WALKI</h2>${s.fight?`<div class="hero"><b>${s.fight.opponent}</b> · ${s.fight.league}<br><button class="primary" onclick="startFight()">WEJDŹ DO WALKI</button></div>`:''}<table style="width:100%"><tr><th>Rywal</th><th>Wynik</th><th>Metoda</th></tr>${s.history.map(h=>`<tr><td>${esc(h.opponent)}</td><td>${h.win?'WIN':'LOSS'}</td><td>${h.method}</td></tr>`).join('')}</table></section>`)}function career(){s.screen='career';shell(`<div class="cols"><section class="panel"><h2>📋 PROFIL</h2><p>${esc(s.first)} ${esc(s.last)}</p><p>Rekord ${s.w}-${s.l}-${s.d}</p><p>${s.weight} · ${s.type}</p></section><section class="panel"><h2>📄 SHAREDOK</h2><div class="careerDoc"><b>SHAREDOK KARIERY — ${esc(s.first)} ${esc(s.last)}</b><p>Aktualna organizacja: ${league()}</p><p>Reputacja: ${s.rep}/100</p><p>Instagram: ${s.ig}</p><p>Ostatni wynik: ${s.lastResult?s.lastResult.method:'brak'}</p><p>Historia i kluczowe wydarzenia kariery są przechowywane tutaj jako dokument zawodnika.</p></div></section></div>`)}function media(){s.screen='media';let d=new Date().getTime(),canI=s.media.interview===0||d-s.media.interview>=14*864e5,canP=s.media.post===0||d-s.media.post>=7*864e5,canC=s.media.controversy===0||d-s.media.controversy>=60*864e5;shell(`<section class="panel"><h2>📱 MEDIA</h2><div class="tiles"><div class="tile"><h3>🎙️ Wywiad</h3><p>Raz na 14 dni.</p><button ${canI?'':'disabled'} onclick="mediaAct('interview',2,250)">${canI?'UDZIEL WYWIADU':'DOSTĘPNE ZA KILKA DNI'}</button></div><div class="tile"><h3>📲 Post</h3><p>Raz na 7 dni.</p><button ${canP?'':'disabled'} onclick="mediaAct('post',1,150)">${canP?'OPUBLIKUJ POST':'NIEDOSTĘPNE'}</button></div><div class="tile"><h3>🔥 Kontrowersja</h3><p>Raz na 2 miesiące.</p><button ${canC?'':'disabled'} onclick="mediaAct('controversy',4,600)">${canC?'WYWOŁAJ KONTROWERSJĘ':'NIEDOSTĘPNE'}</button></div></div></section>`)}function mediaAct(k,r,i){let now=Date.now();s.media[k]=now;s.rep=Math.min(100,s.rep+r);s.ig+=i;s.log.push(`📱 Media: ${k} (+${r} reputacji, +${i} IG).`);save();media()}function manager(){s.screen='manager';let a=s.agent;if(!a){shell(`<section class="panel"><h2>💼 MENEDŻER</h2><p>Po odpowiedniej reputacji możesz podpisać agenta.</p><div class="tiles"><div class="tile"><h3>Agent Nowak</h3><p>15% gaży · negocjuje lepsze walki.</p><button onclick="signAgent('Agent Nowak',15,'negocjacje')">PODPISZ 15%</button></div><div class="tile"><h3>Agent „Kosa”</h3><p>10% · mniej prowizji, mniej dodatków.</p><button onclick="signAgent('Agent Kosa',10,'kontrakty')">PODPISZ 10%</button></div><div class="tile"><h3>Super Agent</h3><p>20% · pełny pakiet sponsorki.</p><button onclick="signAgent('Super Agent',20,'sponsorzy')">PODPISZ 20%</button></div></div></section>`);return}shell(`<section class="panel"><h2>💼 ${a.name}</h2><p>Prowizja: <b>${a.pct}%</b></p><p>Pakiet: <b>${a.benefit}</b></p><h3>Negocjacje</h3><button onclick="negAgent()">SPRÓBUJ ZBIĆ PROWIZJĘ</button><div class="tiles"><div class="tile">🚗 Samochód oklejony Twoją twarzą</div><div class="tile">🥗 Dieta pudełkowa</div><div class="tile">💊 Odżywki</div><div class="tile">📺 Sponsoring</div><div class="tile">🥟 Pierogi u babci Haliny</div><div class="tile">🧴 Reklama na plecach</div><div class="tile">🪟 OKNOPLAST</div><div class="tile">🦵 StrefaHIT.pl</div></div></section>`)}function signAgent(n,p,b){s.agent={name:n,pct:p,benefit:b};s.log.push(`💼 Podpisano ${n}: ${p}% prowizji.`);save();manager()}function negAgent(){if(s.agent.pct>7){s.agent.pct--;s.rep=Math.min(100,s.rep+1);s.log.push(`🤝 Wynegocjowano prowizję agenta do ${s.agent.pct}%.`)}else alert('Agent nie zejdzie niżej.');save();manager()}function statistics(){s.screen='statistics';shell(`<div class="tiles"><div class="tile">Walki<h2>${s.w+s.l+s.d}</h2></div><div class="tile">Win rate<h2>${s.w+s.l+s.d?Math.round(s.w/(s.w+s.l+s.d)*100):0}%</h2></div><div class="tile">Reputacja<h2>${s.rep}</h2></div></div><section class="panel"><h2>STATYSTYKI</h2>${Object.entries(s.sk).map(([k,v])=>`<div class="feed"><b>${k}</b> ${v}<div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</section>`)}function finance(){s.screen='finance';shell(`<section class="panel"><h2>💰 FINANSE — ŹRÓDŁA ZAROBKU</h2><div class="tiles"><div class="tile income"><h3>💪 Bramka / ochrona</h3><p>Raz w tygodniu.</p><b>+700 zł</b><br><button onclick="job('weekly',700)">WEŹ ZMIANĘ</button></div><div class="tile income"><h3>🧰 Etat miesięczny</h3><p>Stały dochód, możesz zrezygnować.</p><b>+4 000 zł / miesiąc</b><br><button onclick="job('monthly',4000)">${s.jobs.monthly?'ZREZYGNUJ':'PODEJMIJ ETAT'}</button></div><div class="tile income"><h3>📺 Reklama</h3><p>Dostępna przy reputacji 45+.</p><b>+15 000 zł</b><br><button ${s.rep>=45?'':'disabled'} onclick="job('ad',15000)">WEŹ UDZIAŁ</button></div></div></section>`)}function job(k,v){if(k==='monthly'){s.jobs.monthly=!s.jobs.monthly}else{s.money+=v;s.log.push(`💰 Zarobiono ${money(v)}.`)}save();finance()}function events(){s.screen='events';shell(`<section class="panel"><h2>◉ EVENTY</h2>${s.log.slice().reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section>`)}function startFight(){if(!s.fight)return;let f=s.fight;f.round=1;f.time=300;f.st=100;f.hp=100;f.ost=100;f.ohp=100;f.score=[];f.comment='JURAS: Zaczynamy! Zobaczymy, kto pierwszy narzuci tempo.';renderFight();last=performance.now();raf=requestAnimationFrame(loop)}function loop(t){if(!s.fight||paused)return;let dt=Math.min(.05,(t-last)/1000);last=t;s.fight.time-=dt*4;s.fight.st=Math.max(0,s.fight.st-dt*.7);s.fight.ost=Math.max(0,s.fight.ost-dt*.55);if(Math.random()<dt*.7)exchange();if(s.fight.time<=0)roundEnd();updateFight();raf=requestAnimationFrame(loop)}function exchange(){let f=s.fight;f.ohp=Math.max(0,f.ohp-Math.max(1,Math.round(Math.random()*2+1)));f.hp=Math.max(0,f.hp-Math.max(1,Math.round(Math.random()*1.5)));f.comment=['JURAS: Dobra praca na nogach.','JURAS: Ładny prosty, rywal to poczuł.','JURAS: Presja pod siatką.','JURAS: Obaj przyspieszają.'][Math.floor(Math.random()*4)];if(Math.random()<.008)opportunity()}function opportunity(){paused=true;pending=['High kick','Latające kolano','Spinning backfist','Obalenie','Balacha','Trójkąt','RNC'][Math.floor(Math.random()*7)];document.getElementById('wa').textContent=pending;wr.textContent='GOTOWE';wheel.style.display='grid'}function renderFight(){let f=s.fight;app.innerHTML=`<div class="fight"><div class="fighttop"><div class="fighter"><h2>${esc(s.first)}</h2><p>Witalność</p><div class="hp"><i id="hp" style="width:${f.hp}%"></i></div><p>Stamina</p><div class="hp"><i id="st" style="width:${f.st}%"></i></div></div><div class="timer" id="timer" style="--pct:100%"><div class="timerText"><div class="round">RUNDA ${f.round}/3</div><div class="clock">05:00</div><small>CZAS WALKI</small></div></div><div class="fighter"><h2>${esc(f.opponent)}</h2><p>Witalność</p><div class="hp"><i id="ohp" style="width:${f.ohp}%"></i></div><p>Stamina</p><div class="hp"><i id="ost" style="width:${f.ost}%"></i></div></div></div><div class="comment" id="comment">${f.comment}</div><div class="actions"><button onclick="normalAction('Prosty',4)">Prosty</button><button onclick="normalAction('Low kick',5)">Low kick</button></div></div>`}function updateFight(){let f=s.fight;if(!f)return;let t=document.getElementById('timer');if(t)t.style.setProperty('--pct',Math.max(0,f.time/300*100)+'%');let c=document.querySelector('.clock');if(c)c.textContent=String(Math.floor(f.time/60)).padStart(2,'0')+':'+String(Math.ceil(f.time%60)).padStart(2,'0');[['hp',f.hp],['st',f.st],['ohp',f.ohp],['ost',f.ost]].forEach(([id,v])=>{let e=document.getElementById(id);if(e)e.style.width=v+'%'});let cm=document.getElementById('comment');if(cm)cm.textContent=f.comment;if(f.ohp<=0)finish(true,'KO/TKO');if(f.hp<=0)finish(false,'KO/TKO')}function normalAction(n,d){if(!s.fight||paused)return;let f=s.fight;f.ohp=Math.max(0,f.ohp-d);f.st=Math.max(0,f.st-2);f.comment='JURAS: '+n+'! Dobra akcja.';updateFight()}spin.onclick=function(){if(!pending)return;spin.disabled=true;let r=Math.random(),kind=r<.5?'SUKCES':r<.8?'CZĘŚCIOWY SUKCES':'NIEUDANA TECHNIKA';we.style.transform='rotate('+(1440+Math.floor(Math.random()*360))+'deg)';setTimeout(()=>{wr.textContent=kind;let f=s.fight,d={'High kick':17,'Latające kolano':15,'Spinning backfist':14,'Obalenie':9,'Balacha':18,'Trójkąt':17,'RNC':20}[pending];if(kind==='SUKCES'){f.ohp=Math.max(0,f.ohp-Math.round(d*1.5));f.st=Math.max(0,f.st-5);f.comment='JURAS: PEŁNY SUKCES! Kapitalne wykonanie '+pending+'!'}else if(kind==='CZĘŚCIOWY SUKCES'){f.ohp=Math.max(0,f.ohp-Math.round(d*.7));f.st=Math.max(0,f.st-8);f.comment='JURAS: Częściowy sukces. Jest efekt, ale koszt był spory.'}else{f.hp=Math.max(0,f.hp-3);f.st=Math.max(0,f.st-14);f.comment='JURAS: Nieudana technika! Rywal wykorzystał moment.'}updateFight();setTimeout(()=>{wheel.style.display='none';spin.disabled=false;pending=null;paused=false;last=performance.now();raf=requestAnimationFrame(loop)},900)},2500)};function roundEnd(){let f=s.fight,my=(100-f.ohp)+(f.st>f.ost?8:0),op=(100-f.hp)+(f.ost>f.st?8:0);f.score.push(my>=op?10:9);if(f.round>=3){finish(f.score.filter(x=>x===10).length>=2,'DECYZJA');return}f.round++;f.time=300;f.st=Math.min(100,f.st+25);f.ost=Math.min(100,f.ost+22);f.comment='JURAS: Koniec rundy. Do narożników!';renderFight();last=performance.now();raf=requestAnimationFrame(loop)}function finish(win,method){if(!s.fight)return;cancelAnimationFrame(raf);let f=s.fight,p=f.purse;if(win){s.w++;s.rep=Math.min(100,s.rep+6);s.ig+=200}else{s.l++;s.rep=Math.max(0,s.rep-2)}s.money+=p;s.history.push({opponent:f.opponent,win,method});s.lastResult={win,method,opponent:f.opponent,interview:''};s.fight=null;save();document.getElementById('win').textContent=win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA';document.getElementById('method').textContent=method;document.getElementById('sum').textContent=`${s.first} ${win?'wygrywa':'przegrywa'} z ${f.opponent}. Gaża: ${money(p)}.`;document.getElementById('choices').classList.remove('hidden');document.getElementById('targets').classList.add('hidden');document.getElementById('iv').classList.add('hidden');document.getElementById('back').classList.add('hidden');modal.style.display='grid'}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>interview(b.dataset.k));function interview(k){if(k==='challenge'){document.getElementById('choices').classList.add('hidden');let tl=document.getElementById('targetList');tl.innerHTML=OPP.filter(x=>x!==s.lastResult.opponent).slice(0,6).map(x=>`<div class="target" data-t="${esc(x)}">${x}</div>`).join('');document.querySelectorAll('.target').forEach(x=>x.onclick=()=>{selected=x.dataset.t;document.querySelectorAll('.target').forEach(y=>y.classList.remove('sel'));x.classList.add('sel')});document.getElementById('targets').classList.remove('hidden');return}let text={corner:'„Dziękuję mojemu narożnikowi. To ich robota tak samo jak moja.”',joke:'„Mówili, że zabraknie mi cardio. Na szczęście zabrakło go rywalowi wcześniej.”',respect:'„Szacunek dla rywala. Dał mi dobrą walkę.”',fans:'„Dziękuję wszystkim, którzy byli ze mną.”',ambition:'„Jestem tutaj po pas. Kto stoi na drodze, ten ma problem.”'}[k];let r={corner:2,joke:3,respect:2,fans:2,ambition:4}[k];s.rep=Math.min(100,s.rep+r);s.ig+=k==='joke'?500:250;s.lastResult.interview=text;save();showInterview(text)}document.getElementById('confirm').onclick=function(){if(!selected)return alert('Wybierz rywala.');let text=`„${selected}, słyszałeś mnie. Chcę tej walki. Spotkajmy się w klatce.”`;s.rep=Math.min(100,s.rep+5);s.ig+=700;s.lastResult.interview=text;s.log.push(`🔥 Wyzwanie dla ${selected} po walce.`);save();showInterview(text)};function showInterview(t){document.getElementById('choices').classList.add('hidden');document.getElementById('targets').classList.add('hidden');let e=document.getElementById('iv');e.classList.remove('hidden');e.innerHTML='<b>Twój wywiad:</b><br>'+t;document.getElementById('back').classList.remove('hidden')}document.getElementById('back').onclick=()=>{modal.style.display='none';dashboard()};window.startCareer=startCareer;window.dashboard=dashboard;window.training=training;window.fights=fights;window.career=career;window.media=media;window.manager=manager;window.statistics=statistics;window.finance=finance;window.events=events;window.nextEvent=nextEvent;window.acceptChallenge=acceptChallenge;window.rejectChallenge=rejectChallenge;window.startFight=startFight;window.normalAction=normalAction;window.train=train;if(!s.created)creator();else dashboard()})();</script></body></html>
