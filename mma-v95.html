<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V95</title><style>body{margin:0;background:#071018;color:#eee;font:15px Arial}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;margin:12px 0}.creator{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer}.pick:checked+label{border-color:#d6ae51}.field input{width:100%;padding:13px;margin:7px 0 15px;background:#071018;color:white;border:1px solid #304955;border-radius:8px;box-sizing:border-box}button{padding:12px 16px;margin:4px;border-radius:9px;border:1px solid #526873;background:#162833;color:white;cursor:pointer}.primary{background:#80652a;border-color:#d6ae51}.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#050b10;padding:12px}.side button{width:100%;text-align:left}.main{padding:22px;max-width:1400px;width:100%;margin:auto}.stats,.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:15px}.stat b{display:block;font-size:20px;margin-top:5px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px}.bar i{display:block;height:100%;background:#36c77b;border-radius:8px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:10}.modalbox{width:min(800px,90vw);background:#101c25;border:1px solid #d6ae51;border-radius:16px;padding:25px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:800px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:120px}.grid,.stats,.tiles,.cols{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.stats,.tiles,.choices{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>(function(){'use strict';var app=document.getElementById('app');var kg={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};var types=['Wonderkid','Osiedlowy bijok','Fizol','Zapaśnik','Striker','Gumiarz','Allrounder'];var budgets=[[5000,'Normalny etat'],[10000,'Etat + oszczędności'],[25000,'Rodzina pomaga'],[50000,'Bogata rodzina'],[100000,'Rodzinny biznes']];var s={day:1,age:18,ig:100,rep:5,mot:55,money:10000,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',fight:null,sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},log:[]};function creator(){app.innerHTML='<div class="wrap creator"><div class="card"><h1>MMA <span style="color:#d6ae51">CAREER SIMULATOR</span></h1><p>Od osiedlowej sali do UFC.</p><div class="field">IMIĘ *<input id="fn" placeholder="Michał"></div><div class="field">NAZWISKO *<input id="ln" placeholder="Kowalski"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+types.map(function(x,i){return '<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x+'"><label for="t'+i+'"><b>'+x+'</b><br><small>Specjalizacja i charakter</small></label>'}).join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="grid">'+budgets.map(function(x,i){return '<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'"><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' ISK</b><br><small>'+x[1]+'</small></label>'}).join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.keys(kg).map(function(x,i){return '<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x+'"><label for="w'+i+'"><b>'+x+'</b><br><small>'+kg[x]+'</small></label>'}).join('')+'</div><br><button id="start" class="primary">STWÓRZ KARIERĘ →</button></div></div>';document.getElementById('start').onclick=start}function start(){var f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('input[name="type"]:checked'),b=document.querySelector('input[name="bud"]:checked'),w=document.querySelector('input[name="weight"]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.first=f;s.last=l;s.type=t.value;s.money=Number(b.value);s.weight=w.value;s.log=['🥊 Kariera rozpoczęta: '+f+' '+l+'.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance()">＋ Jeden dzień</button><button onclick="eventNext()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fights()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="statistics()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div><small style="color:#d6ae51">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p>Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+kg[s.weight]+')</p></div><div class="stats"><div class="stat">REKORD<b>'+s.w+'-'+s.l+'-'+s.d+'</b></div><div class="stat">INSTAGRAM<b>'+s.ig.toLocaleString('pl-PL')+'</b></div><div class="stat">REPUTACJA<b>'+s.rep+'/100</b></div><div class="stat">BUDŻET<b>'+s.money.toLocaleString('pl-PL')+' ISK</b></div></div><div class="hero"><h2>'+(s.fight?'🏆 AKTYWNA WALKA':'📅 CENTRUM KARIERY')+'</h2><p>'+(s.fight?'Rywal: '+s.fight.opponent+' · pozostało '+s.fight.days+' dni obozu.':'Nie czekaj na telefon. Trenuj, buduj reputację i przewijaj wydarzenia.')+'</p><button class="primary" onclick="advance()">＋ JEDEN DZIEŃ</button><button class="primary" onclick="eventNext()">⏩ NASTĘPNY EVENT</button></div><div class="cols"><section><div class="panel"><h3>📰 OŚ KARIERY</h3>'+s.log.slice(0,12).map(function(x){return '<div class="feed">'+x+'</div>'}).join('')+'</div><div class="panel"><h3>🎯 ŚCIEŻKA KARIERY</h3>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map(function(x,i){return '<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'✅ ':'🔒 ')+x+'</div>'}).join('')+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+Object.keys(s.sk).map(function(k){return '<div class="feed"><b>'+k+'</b> '+s.sk[k]+'<div class="bar"><i style="width:'+s.sk[k]+'%"></i></div></div>'}).join('')+'</div><div class="tiles"><div class="tile">Motywacja<br><b>'+s.mot+'</b></div><div class="tile">Wiek<br><b>'+s.age+'</b></div></div></aside></div></main></div>'}function advance(){s.day++;if(s.day%365===0)s.age++;if(s.fight)s.fight.days--;s.log.unshift('📅 Minął dzień '+s.day+'.');if(s.fight&&s.fight.days<=0)s.log.unshift('🥊 Obóz zakończony. Walka jest gotowa.');dashboard()}function eventNext(){advance();var r=Math.random();if(s.fight){modal('DZIEŃ OBOZU','Masz aktywną walkę. Wybierz działanie.');return}if(r<.34)modalChoices('PROPOZYCJA WALKI','Lokalny promotor proponuje pojedynek. Po akceptacji nie przyjmiesz kolejnej walki.',[['PRZYJMUJĘ',function(){s.fight={opponent:['Marek „Kosa” Nowak','Paweł „Beton” Zieliński','Igor „Kret” Wrona'][Math.floor(Math.random()*3)],days:21};s.log.unshift('🏆 Przyjęto walkę. Obóz: 21 dni.');dashboard()}],['ODRZUCAM',dashboard]]);else if(r<.67)modalChoices('SPOTKANIE NA GALI','Spotykasz Mameda Khalidova. Internet czeka na Twoją reakcję.',[['ZDJĘCIE + MUZYKA',function(){s.ig+=1000;s.rep+=2;s.log.unshift('🔥 Zdjęcie z Mamedem + muzyka poszło viralem. +1000 IG.');dashboard()}],['UDASZ, ŻE NIE POZNAJESZ',function(){s.ig+=600;s.log.unshift('😂 Udajesz, że nie rozpoznajesz Mameda. +600 IG.');dashboard()}]]);else modalChoices('JURAS ZAUWAŻYŁ AKCJĘ','Fragment Twojego treningu trafia do mediów.',[['UDOSTĘPNIAM',function(){s.ig+=250;s.rep++;s.log.unshift('📱 Fragment treningu zrobił mały viral.');dashboard()}],['NIC NIE ROBIĘ',dashboard]])}function modalChoices(t,txt,cs){var d=document.createElement('div');d.className='modal';d.innerHTML='<div class="modalbox"><small style="color:#d6ae51">EVENT</small><h1>'+t+'</h1><p>'+txt+'</p><div class="choices"></div></div>';document.body.appendChild(d);cs.forEach(function(c){var b=document.createElement('button');b.className='primary';b.textContent=c[0];b.onclick=function(){d.remove();c[1]()};d.querySelector('.choices').appendChild(b)})}function modal(t,txt){modalChoices(t,txt,[['WRÓĆ',dashboard]])}function training(){modalChoices('TRENING','Wybierz sposób rozwoju.',[['LOKALNY · +1 BOKS',function(){s.sk.Boks++;s.mot=Math.min(100,s.mot+2);dashboard()}],['ADT · 3000 ISK · +3 ZAPASY',function(){if(s.money<3000)return alert('Za mało pieniędzy.');s.money-=3000;s.sk.Zapasy+=3;dashboard()}],['ANKOS · 6000 ISK · REP 15 · +6 ZAPASY',function(){if(s.money<6000||s.rep<15)return alert('Potrzebujesz 6000 ISK i 15 reputacji.');s.money-=6000;s.sk.Zapasy+=6;s.sk.Kondycja+=2;dashboard()}],['BJJ CAMP · 5000 ISK · +5 BJJ',function(){if(s.money<5000)return alert('Za mało pieniędzy.');s.money-=5000;s.sk.BJJ+=5;dashboard()}]])}function fights(){if(!s.fight)return modal('WALKI','Brak aktywnej walki. Użyj „Następny event”.');modalChoices('AKTYWNA WALKA','Rywal: '+s.fight.opponent+' · '+Math.max(0,s.fight.days)+' dni przygotowania.',[['TRENUJ',training],['PRZEWIŃ DZIEŃ',advance],['WEJDŹ DO WALKI',function(){if(s.fight.days>0)return alert('Najpierw zakończ okres przygotowawczy.');modal('WALKA','Tutaj zostanie uruchomiona pełna mechanika walki.')}]])}function career(){modal('ŚCIEŻKA KARIERY','Lokalne → Hybrid/Babylon/FEN → KSW → OKTAGON → Cage Warriors → PFL → UFC. Reputacja odblokowuje kolejne poziomy.')}function media(){modal('MEDIA','Instagram: '+s.ig.toLocaleString('pl-PL')+' · Reputacja: '+s.rep+'.')}function manager(){modal('MENEDŻER','Kontrakty, sponsorzy, negocjacje i wybór federacji.')}function statistics(){modal('STATYSTYKI',Object.keys(s.sk).map(function(k){return k+': '+s.sk[k]}).join('<br>')+'<br><br>Rekord: '+s.w+'-'+s.l+'-'+s.d)}function events(){modal('EVENTY','Kalendarz kariery i wydarzenia medialne.')}creator()})();</script></body></html>
