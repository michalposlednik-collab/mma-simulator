name: Patch fight engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fight engine
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          /* V73 fight engine upgrade */
          .fight-finish{margin:10px auto;max-width:1050px;padding:10px 14px;border:1px solid #6f302f;background:#201013;border-radius:6px;color:#f1c1c1;font-weight:800;text-align:center}
          .fightlock .finishflash{animation:finishFlash .45s ease-out 2}
          @keyframes finishFlash{50%{box-shadow:0 0 35px #d54b4b88}}
          .technique-tag{display:inline-block;margin-left:7px;padding:3px 6px;border:1px solid #735d2d;border-radius:3px;color:#d8b85d;font-size:8px;letter-spacing:.7px}
          '''
          if '/* V73 fight engine upgrade */' not in s:
              s=s.replace('</style>', css+'\n</style>',1)

          old_score=re.search(r'function currentRoundScore\(\)\{.*?\n\}\n\nfunction ensureFinance',s,re.S)
          new_score='''function currentRoundScore(){\n const a=G.fight?Number(G.fight.roundAdv||0):0;\n if(a>=4)return "10-8";\n if(a>0)return "10-9";\n if(a<0 && a<=-4)return "8-10";\n if(a<0)return "9-10";\n // A true 10-10 is deliberately not used in normal scoring.\n return G.fight && G.fight.roundLead < 0 ? "9-10" : "10-9";\n}\n\nfunction ensureFinance'''
          if not old_score: raise SystemExit('currentRoundScore marker not found')
          s=s[:old_score.start()]+new_score+s[old_score.end():]

          old_init=re.search(r'function initFightState\(\)\{.*?\n\}\nfunction record',s,re.S)
          new_init='''function initFightState(){\n const level=G.fights.length;\n const opponents=[\n   ["Kamil Wrona","Lokalna gala","0-1"],["Adrian Zieliński","HYBRID","2-1"],\n   ["Michał Sobiech","HYBRID","4-2"],["Patryk Nowak","Babilon MMA","6-3"]\n ];\n const o=opponents[Math.min(level,opponents.length-1)];\n return {\n   opp:o[0],org:o[1],round:1,t:0,events:0,prompt:false,started:false,\n   score:0,roundAdv:0,roundLead:0,roundScores:[],fightScores:[],\n   finishMethod:null,finishReason:"",finishBy:"",wheelBusy:false,\n   lastFinishCheck:0,nextComment:18+Math.random()*8,\n   log:[\n    "🎙️ KOMENTATOR: Obaj zawodnicy są już w klatce.",\n    "🎙️ KOMENTATOR: Sędzia sprawdza rękawice i daje ostatnie instrukcje.",\n    "🎙️ KOMENTATOR: Zaczynamy pojedynek — pierwsze sekundy należą do rozpoznania dystansu."\n   ]\n };\n}\nfunction record'''
          if not old_init: raise SystemExit('initFightState marker not found')
          s=s[:old_init.start()]+new_init+s[old_init.end():]

          old_tick=re.search(r'function fightTick\(\)\{.*?\n\}\n\nfunction endRound',s,re.S)
          new_tick=r'''function fightTick(){
 const f=G.fight;if(!f||f.prompt||!f.started||f.finishMethod)return;
 const now=performance.now(),dt=Math.min(.1,(now-f.last)/1000);f.last=now;
 f.t+=dt*5.8;

 if(!f.nextComment)f.nextComment=18+Math.random()*8;
 if(f.t>=f.nextComment){
   const comments=[
    "Obaj zawodnicy krążą po klatce i badają dystans.",
    "Dobry jab. Rywal nie może pozwolić sobie na bierne stanie w miejscu.",
    "Mocna praca na korpus — takie uderzenia wracają w późniejszych minutach.",
    "Krótka wymiana w półdystansie i natychmiastowe wyjście z linii ciosu.",
    "Coraz więcej walki przy siatce. Tutaj każdy centymetr ma znaczenie.",
    "Rywal zaczyna czytać rytm. Za chwilę może pojawić się kontra.",
    "Publiczność reaguje na tę wymianę! Tempo wyraźnie rośnie.",
    "Widać zmęczenie w nogach, ale nikt nie chce odpuścić środka klatki.",
    "Bardzo dobra kontrola pozycji — zawodnik nie daje rywalowi łatwej drogi ucieczki."
   ];
   f.log.unshift("🎙️ KOMENTATOR: "+comments[Math.floor(Math.random()*comments.length)]);
   f.nextComment=f.t+9+Math.random()*8;
   if(f.log.length>45)f.log.length=45;
 }

 const staminaPressure=(f.t/300)*0.65;
 f.visualAdv=(f.roundAdv||0)+Math.sin(f.t/31)*0.12-staminaPressure*(f.roundAdv<0?-1:1);

 // Automatic finish opportunities. They are uncommon, but a damaged opponent can be finished.
 if(f.t>24 && f.t-f.lastFinishCheck>=12){
   f.lastFinishCheck=f.t;
   const adv=Number(f.roundAdv||0);
   const hp=fightHealth(f,false);
   const playerSkill=Array.isArray(G.skills)?Number(G.skills[0]||50):50;
   const grappling=Array.isArray(G.skills)?Number(G.skills[1]||50):50;
   let koChance=Math.max(0,(adv-3)*0.012)+(hp<45?0.025:0)+(playerSkill>70?0.008:0);
   let subChance=Math.max(0,(adv-4)*0.009)+(hp<40?0.018:0)+(grappling>70?0.01:0);
   if(Math.random()<Math.min(.12,koChance)){
     f.finishMethod="KO";f.finishReason="Rywal nie odpowiada po czystej kombinacji";f.finishBy="ciosy";
     f.log.unshift("💥 NOKAUT! Sędzia natychmiast wkracza do akcji.");
     f.log.unshift("🎙️ JURAS: „ŁOOOOOOOO!”");
     f.log.unshift("🎙️ KOMENTATOR: Ależ skończenie! To może być kandydat do nokautu wieczoru!");
     finishFight();return;
   }
   if(Math.random()<Math.min(.10,subChance)){
     f.finishMethod="SUBMISSION";f.finishReason="Rywal odklepał po kontroli na macie";f.finishBy="submission";
     f.log.unshift("🔒 PODDANIE! Rywal odklepuje — sędzia przerywa pojedynek.");
     f.log.unshift("🎙️ KOMENTATOR: Kapitalna praca na macie i świetne wyczucie momentu!");
     finishFight();return;
   }
 }

 if(f.t>35+f.events*58&&f.events<4){
   f.events++;f.prompt=true;
   const situations=[
    "🎙️ KOMENTATOR: Rywal odsłania głowę po prostym — pojawia się okno na mocną akcję.",
    "🎙️ KOMENTATOR: Rywal cofa się pod siatkę. Jest miejsce na akcję z rotacji albo kolano.",
    "🎙️ KOMENTATOR: Po zmianie poziomu otworzył się parter — tutaj mogą pojawić się techniki kończące.",
    "🎙️ KOMENTATOR: Rywal zostaje wysoko po wymianie. To może być moment na high kick albo latające kolano."
   ];
   f.log.unshift(situations[f.events-1]);
   f.log.unshift("⏸️ CZAS ZATRZYMANY — WYBIERZ REAKCJĘ");
   fightScreen();return;
 }
 if(f.t>=300){endRound();return;}
 const timeEl=document.querySelector(".fightlock .time");
 if(timeEl)timeEl.textContent=timeLeft(f.t);
 const phaseEl=document.querySelector(".fightlock .clockin small:last-child");
 if(phaseEl)phaseEl.textContent="RUNDA "+f.round+" · ZEGAR BIEGNIE";
 updateFightBars();
 requestAnimationFrame(fightTick);
}

function endRound'''
          if not old_tick: raise SystemExit('fightTick marker not found')
          s=s[:old_tick.start()]+new_tick+s[old_tick.end():]

          old_dec=re.search(r'function decision\(\)\{.*?\n\}\n\nfunction corner',s,re.S)
          new_dec=r'''function decision(){
 const f=G.fight;
 if(f.prompt==="corner")return '<div class="decision"><b>🗣️ NAROŻNIK · PRZERWA</b><div class="acts"><button type="button" class="act corner-btn" data-corner="1">„Spokojnie, jab i dystans”<small>techniczna kontrola</small></button><button type="button" class="act corner-btn" data-corner="2">„Dociskaj go pod siatkę”<small>presja</small></button><button type="button" class="act corner-btn" data-corner="3">„KURWA, CIŚNIJ!”<small>charakter</small></button><button type="button" class="act corner-btn" data-corner="4">„Oddychaj, wróć do planu”<small>regeneracja</small></button></div></div>';
 return '<div class="decision"><b>⏸ ZEGAR ZATRZYMANY · REAKCJA '+f.events+'/4</b><p class="decisionhint">Wybierz akcję. Ryzykowne techniki mają mniejszą szansę powodzenia, ale mogą skończyć walkę.</p><div class="acts">'+
 '<button type="button" class="act risk fight-action" data-chance="42" data-action="HIGH KICK"><strong>HIGH KICK</strong><small>42% · KO</small></button>'+
 '<button type="button" class="act risk fight-action" data-chance="38" data-action="LATAJĄCE KOLANO"><strong>LATAJĄCE KOLANO</strong><small>38% · KO / TKO</small></button>'+
 '<button type="button" class="act risk fight-action" data-chance="48" data-action="SPINNING BACKFIST"><strong>SPINNING BACKFIST</strong><small>48% · KO</small></button>'+
 '<button type="button" class="act fight-action" data-chance="58" data-action="ŁOKIEĆ Z KLINCZU"><strong>ŁOKIEĆ Z KLINCZU</strong><small>58% · obrażenia</small></button>'+
 '<button type="button" class="act fight-action" data-chance="62" data-action="BALACHA"><strong>BALACHA</strong><small>62% · PODDANIE</small></button>'+
 '<button type="button" class="act fight-action" data-chance="58" data-action="TRÓJKĄT NOGAMI"><strong>TRÓJKĄT NOGAMI</strong><small>58% · PODDANIE</small></button>'+
 '<button type="button" class="act fight-action" data-chance="60" data-action="REAR NAKED CHOKE"><strong>RNC · DUSZENIE TYŁEM</strong><small>60% · PODDANIE</small></button>'+
 '<button type="button" class="act fight-action" data-chance="72" data-action="GROUND ELBOWS"><strong>GROUND & POUND · ŁOKCIE</strong><small>72% · kontrola</small></button>'+
 '<button type="button" class="act safe fight-action" data-chance="86" data-action="JAB · LOW KICK · WYJŚCIE"><strong>JAB · LOW KICK · WYJŚCIE</strong><small>86% · bezpieczne punkty</small></button>'+
 '</div></div>';
}

function corner'''
          if not old_dec: raise SystemExit('decision marker not found')
          s=s[:old_dec.start()]+new_dec+s[old_dec.end():]

          old_action=re.search(r'function action\(ch,name\)\{.*?\n\}\n\nfunction commentSuccess',s,re.S)
          new_action=r'''function action(ch,name){
 const f=G.fight;if(!f||f.wheelBusy||!f.prompt)return;
 f.wheelBusy=true;
 const chance=Math.max(25,Math.min(90,Number(ch)||25));
 const success=Math.random()*100<chance;
 const meta={
  "HIGH KICK":{kind:"KO",finish:.18,success:"High kick wchodzi! Rywal zatacza się po czystym trafieniu."},
  "LATAJĄCE KOLANO":{kind:"KO",finish:.16,success:"Latające kolano trafia! Publiczność eksploduje po tej akcji."},
  "SPINNING BACKFIST":{kind:"KO",finish:.15,success:"Spinning backfist siada idealnie! Rywal nie widział tego ciosu."},
  "ŁOKIEĆ Z KLINCZU":{kind:"KO",finish:.11,success:"Łokieć z klinczu rozcina dystans. Rywal wyraźnie odczuwa trafienie."},
  "BALACHA":{kind:"SUBMISSION",finish:.22,success:"Balacha! Ramię jest w pułapce — rywal próbuje się wydostać."},
  "TRÓJKĄT NOGAMI":{kind:"SUBMISSION",finish:.20,success:"Trójkąt nogami jest zapięty! Ciśnienie rośnie z każdą sekundą."},
  "REAR NAKED CHOKE":{kind:"SUBMISSION",finish:.24,success:"Duszenie zza pleców! Rywal szuka ręki i próbuje się obrócić."},
  "GROUND ELBOWS":{kind:"KO",finish:.10,success:"Łokcie z góry! To bardzo niebezpieczna pozycja."},
  "JAB · LOW KICK · WYJŚCIE":{kind:"POINTS",finish:0,success:"Spokojna, czysta kombinacja. Punkty bez niepotrzebnego ryzyka."}
 };
 const m=meta[name]||meta["JAB · LOW KICK · WYJŚCIE"];
 let pos=0,segments=[];
 for(let i=0;i<8;i++){const size=(i%2===0?chance:100-chance)/4;const color=i%2===0?"#35c77b":"#d94d5b";segments.push(color+" "+pos+"% "+(pos+size)+"%");pos+=size;}
 const o=document.createElement("div");o.className="overlay fight-wheel-overlay";
 o.innerHTML='<div class="modal fight-wheel-modal"><button type="button" class="fw-x" aria-label="Zamknij">×</button><div class="fw-kicker">REAKCJA W WALCE · ZEGAR ZATRZYMANY</div><h2>'+esc(name)+'</h2><div class="fw-scene">SZANSA REALIZACJI <b>'+chance+'%</b></div><div class="fw-wheel-wrap"><div class="fw-pointer"></div><div class="fw-wheel" id="fwWheel" style="background:conic-gradient('+segments.join(",")+')"></div><div class="fw-center">MMA<br><small>DECISION</small></div></div><div class="fw-legend"><span class="fw-green">SUKCES '+chance+'%</span><span class="fw-red">NIEPOWODZENIE '+(100-chance)+'%</span></div><div class="fw-status" id="fwStatus">LOSOWANIE...</div><div class="fw-comment" id="fwComment">Sprawdzamy wykonanie techniki.</div><button type="button" class="btn primary fw-close">WRÓĆ DO WALKI</button></div>';
 document.body.appendChild(o);
 o.querySelector(".fw-x").addEventListener("click",()=>resumeFightFromWheel(o));o.querySelector(".fw-close").addEventListener("click",()=>resumeFightFromWheel(o));
 const wheel=o.querySelector("#fwWheel"),target=success?Math.random()*chance:chance+Math.random()*(100-chance);requestAnimationFrame(()=>wheel.style.transform="rotate("+(2160+(360-target))+"deg)");
 setTimeout(()=>{
   if(!o.isConnected)return;
   const status=o.querySelector("#fwStatus"),comment=o.querySelector("#fwComment");
   if(success){
     status.textContent="🟢 TECHNIKA WYKONANA";status.className="fw-status fw-success";
     comment.textContent=m.success;
     f.roundAdv += m.kind==="SUBMISSION"?3:(m.kind==="KO"?3:1);
     f.log.unshift("🎙️ "+m.success);
     if(m.kind!=="POINTS" && Math.random()<m.finish && f.t>22){
       f.finishMethod=m.kind;f.finishBy=name;f.finishReason=m.kind==="KO"?"Czyste trafienie kończące akcję":"Technika poddania zapięta do końca";
       f.log.unshift(m.kind==="KO"?"💥 NOKAUT! Sędzia przerywa walkę.":"🔒 PODDANIE! Rywal odklepuje.");
       if(m.kind==="KO")f.log.unshift("🎙️ JURAS: „ŁOOOOOOOOOOO!”");
       setTimeout(()=>{if(o.isConnected)o.remove();finishFight();},700);
     }
   }else{
     status.textContent="🔴 TECHNIKA NIEUDANA";status.className="fw-status fw-fail";
     comment.textContent="Rywal dobrze odczytał zamiar i odpowiada kontrą.";
     f.roundAdv-=name.includes("BALACHA")||name.includes("TRÓJKĄT")||name.includes("CHOKE")?1:0.5;
     f.log.unshift("🎙️ "+comment.textContent);
   }
 },2300);
}

function commentSuccess'''
          if not old_action: raise SystemExit('action marker not found')
          s=s[:old_action.start()]+new_action+s[old_action.end():]

          old_finish=re.search(r'function finishFight\(\)\{.*?\n\}\n\ncreator\(\);',s,re.S)
          new_finish=r'''function finishFight(){
 const f=G.fight;if(!f)return;
 clearInterval(f.timer);
 let my=f.roundScores.reduce((s,x)=>s+x[0],0),opp=f.roundScores.reduce((s,x)=>s+x[1],0);
 const finished=!!f.finishMethod;
 if(finished){my=99;opp=0;}
 const win=finished||my>opp;
 const method=f.finishMethod==="KO"?"KO/TKO":f.finishMethod==="SUBMISSION"?"Submission":"Decision";
 const methodLabel=f.finishMethod==="KO"?"💥 NOKAUT / TKO":f.finishMethod==="SUBMISSION"?"🔒 PODDANIE":win?"🏆 ZWYCIĘSTWO":"PORAŻKA";
 G.fights.push({r:win?"W":"L",o:f.opp,org:f.org,m:method,rd:f.round});
 G.rep=Math.max(0,Math.min(100,G.rep+(win?5:-2)));
 G.money+=win?1000:500;
 G.logs.unshift((win?"🏆 WYGRANA ":"❌ PORAŻKA ")+f.opp+" · "+method);
 if(finished&&f.finishMethod==="KO"){
   G.ig+=Math.floor(20+Math.random()*140);G.media.unshift("🔥 Twój nokaut trafia do mediów. Reakcja Jurasa zaczyna krążyć po social mediach.");
   const likes=Math.floor(500+Math.random()*9500),followers=Math.floor(15+Math.random()*120);
   G.ig+=followers;G.logs.unshift("📱 VIRAL: reakcja Jurasa „ŁOOOO!” · +"+followers+" followersów · ~"+likes.toLocaleString("pl-PL")+" polubień.");
 }else if(finished&&f.finishMethod==="SUBMISSION"){
   G.ig+=Math.floor(15+Math.random()*80);G.media.unshift("🔒 Efektowne poddanie zostaje zauważone przez środowisko MMA.");
 }else if(win){G.media.unshift("📺 Zawodnik wygrywa decyzją sędziów.");}
 if(!win)G.media.unshift("📰 Porażka — czas wyciągnąć wnioski.");
 G.fight=null;
 app.innerHTML='<div class="result"><div class="resultbox"><div class="tag">OFICJALNY WYNIK</div><h1 class="'+(win?"win":"loss")+'">'+methodLabel+'</h1><h2>'+esc(S.name)+' vs '+esc(f.opp)+'</h2><p>'+method+(f.finishMethod?" · runda "+f.round:" · po "+f.round+" rundach")+'</p><div class="fight-score"><div class="scorebox"><small>WYNIK</small><b>'+my+' – '+opp+'</b></div><div class="scorebox"><small>REKORD</small><b>'+record()+'</b></div></div><p class="decisionhint">'+esc(f.finishReason||"Walka zakończona na pełnym dystansie.")+'</p><button type="button" class="btn primary" onclick="dashboard()">KONTYNUUJ KARIERĘ</button></div></div>';
}

creator();'''
          if not old_finish: raise SystemExit('finishFight marker not found')
          s=s[:old_finish.start()]+new_finish+s[old_finish.end():]

          p.write_text(s,encoding='utf-8')
          print('Fight engine patched successfully')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "feat: diversify MMA fight outcomes [skip ci]"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/patch-fight.yml
          git commit -m "chore: remove temporary patch workflow [skip ci]"
          git push
