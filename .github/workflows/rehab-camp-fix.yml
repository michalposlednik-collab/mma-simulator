name: Fix rehab and camp flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch continue progression only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('mma-v127.html')
          s=p.read_text(encoding='utf-8')
          def replace_func(src,name,new):
              pat=r'function '+re.escape(name)+r'\([^)]*\)\{.*?\}(?=function )'
              out,n=re.subn(pat,new,src,count=1,flags=re.S)
              if n!=1: raise SystemExit(name+' marker not found')
              return out
          new_continue="""function continueToEvent(){if(!s.created){creator();return}if(s.careerFreezeUntil&&s.day<s.careerFreezeUntil){let left=s.careerFreezeUntil-s.day;openEvent('KONSEKWENCJE','⏳ KARIERA ZAMROŻONA',`<p>Kariera jest zamrożona jeszcze przez <b>${left} dni</b>.</p>`,[['OK',closeEvent]]);return}if(s.injuryUntil&&s.day<s.injuryUntil){let left=s.injuryUntil-s.day;openEvent('REHABILITACJA','🩹 KONTUZJA',`<p>Potrzebujesz jeszcze <b>${left} dni</b> rehabilitacji.</p>`,[['🩹 REHABILITACJA — PRZEWIŃ '+left+' DNI',rehabilitate]]);return}if(s.fight&&s.day<s.fight.date){campDaily();return}if(s.fight&&s.day>=s.fight.date){startFight();return}let target=nextEvent();if(!Number.isFinite(target)||target<=s.day)target=s.day+1;s.day=target;save();if(!s.fight&&s.day%35===0){dashboard();offerFight();return}if(s.day%21===0&&typeof socialEvent==='function'){dashboard();socialEvent();return}if(typeof specialEvent==='function'&&Math.random()<.35){dashboard();specialEvent();return}dashboard();if(typeof genericEvent==='function')genericEvent()}"""
          s=replace_func(s,'continueToEvent',new_continue)
          s=s.replace('onclick="continueToEvent()"','onclick="window.continueToEvent()"')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mma-v127.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix continue to next career event'
          git push
