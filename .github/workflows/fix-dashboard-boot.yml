name: Fix dashboard boot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure dashboard starts after career creation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('mma-v127.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          patch='''<script>(function(){try{var raw=localStorage.getItem('mmaCareerV127');if(!raw)return;var career=JSON.parse(raw);if(!career||!career.created)return;setTimeout(function(){try{if(typeof dashboard==='function'&&!document.querySelector('.layout'))dashboard()}catch(e){console.error('Dashboard boot error:',e)}},0)}catch(e){console.error('Career boot error:',e)}})();</script>'''
          if patch not in s:
              if marker not in s: raise SystemExit('body marker not found')
              s=s.replace(marker,patch+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mma-v127.html
          git diff --cached --quiet || git commit -m 'Fix dashboard boot after career creation'
          git push
