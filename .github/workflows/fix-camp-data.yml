name: Fix camp data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix camp selection and confirmation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('mma-v127.html')
          s=p.read_text(encoding='utf-8')
          def replace_func(src,name,new):
              pat=r'function '+re.escape(name)+r'\([^)]*\)\{.*?\}(?=function )'
              out,n=re.subn(pat,new,src,count=1,flags=re.S)
              if n!=1: raise SystemExit(name+' marker not found')
              return out
          s=replace_func(s,'chooseCamp',"""function chooseCamp(opp,org,purse){let camps=[['Reykjavík Fight Lab',1200,10,['Cardio','Sparingi','Boks','MMA','Regeneracja','Sparingi','Gameplan','Lekki trening','Regeneracja','Waga']],['WCA Fight Team',3500,14,['Cardio','BJJ','Boks','Sparingi','Zapasy','Regeneracja','MMA','Sparingi','BJJ','Cardio','Gameplan','Sparingi','Lekki trening','Regeneracja']],['ANKOS MMA',4200,14,['Cardio','Zapasy','Boks','Sparingi','BJJ','Regeneracja','MMA','Sparingi','Zapasy','Cardio','BJJ','Sparingi','Gameplan','Regeneracja']],['American Top Team',12000,21,['Cardio','BJJ','Boks','Sparingi','Zapasy','Regeneracja','MMA','Sparingi','BJJ','Cardio','Worek','Sparingi','Gameplan','Regeneracja','Zapasy','MMA','Sparingi','Lekki trening','Waga','Regeneracja','Gameplan']]];mb.innerHTML='';mt.textContent='PRZYGOTOWANIE';mh.textContent='🏕️ WYBIERZ CAMP';mc.innerHTML='';camps.forEach(c=>{let b=document.createElement('button');b.className='camp';b.innerHTML=`<b>${c[0]}</b><br>${money(c[1])} · ${c[2]} dni`;b.onclick=()=>acceptCamp(opp,org,purse,c);mc.appendChild(b)});let free=document.createElement('button');free.className='camp';free.innerHTML='<b>PRZYGOTOWANIE WŁASNE — 0 zł</b><br>7 dni · obecny klub';free.onclick=()=>acceptCamp(opp,org,purse,['Przygotowanie własne',0,7,['Cardio','Boks','BJJ','Sparingi','Regeneracja','Gameplan','Waga']]);mc.appendChild(free);modal.style.display='flex'}""")
          s=replace_func(s,'acceptCamp',"""function acceptCamp(opp,org,purse,c){let cost=Number(c[1])||0;let days=Number(c[2])||1;let plan=Array.isArray(c[3])?c[3]:[];if(s.money<cost){alert('Za mało pieniędzy na ten camp. Potrzebujesz '+money(cost)+', a masz '+money(s.money)+'.');return}s.money-=cost;s.campPlan=plan.map((x,i)=>({day:s.day+i+1,activity:x}));s.fight={opponent:opp,league:org,purse,date:s.day+days,camp:c[0],campDays:days,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}};s.log.push('🥊 Zaakceptowano walkę z '+opp+'. Camp: '+c[0]+'. Koszt: '+money(cost)+'.');save();document.getElementById('modal').style.display='none';calendar()}""")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mma-v127.html
          git diff --cached --quiet || git commit -m 'Fix camp data and zero-cost camp'
          git push