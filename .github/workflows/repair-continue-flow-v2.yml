name: Repair continue flow v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for other repair workflows
        run: sleep 45
      - name: Guarantee next event opens after continuing
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('mma-v127.html')
          s=p.read_text(encoding='utf-8')
          marker='/* GUARANTEED CONTINUE HANDLER V3 */'
          if marker not in s:
              patch=r'''\n<script>\n/* GUARANTEED CONTINUE HANDLER V3 */\nwindow.continueToEvent=function(){\n try{\n  if(!s.created){creator();return}\n  if(s.careerFreezeUntil&&s.day<s.careerFreezeUntil){let left=s.careerFreezeUntil-s.day;s.day=s.careerFreezeUntil;save();openEvent('KONSEKWENCJE','⏳ KARIERA ZAMROŻONA',`<p>Przewinięto <b>${left} dni</b>. Kariera została odmrożona.</p>`,[['OK',closeEvent]]);return}\n  if(s.injuryUntil&&s.day<s.injuryUntil){let left=s.injuryUntil-s.day;openEvent('REHABILITACJA','🩹 KONTUZJA',`<p>Potrzebujesz jeszcze <b>${left} dni</b> rehabilitacji.</p>`,[['🩹 REHABILITACJA — PRZEWIŃ '+left+' DNI',rehabilitate]]);return}\n  if(s.fight&&s.day<s.fight.date){campDaily();return}\n  if(s.fight&&s.day>=s.fight.date){startFight();return}\n  let target=nextEvent();\n  if(!Number.isFinite(target)||target<=s.day)target=s.day+1;\n  s.day=target;\n  save();\n  if(!s.fight&&s.day%35===0&&typeof offerFight==='function'){try{offerFight();return}catch(e){console.error(e)}}\n  if(s.day%21===0&&typeof socialEvent==='function'){try{socialEvent();return}catch(e){console.error(e)}}\n  if(typeof specialEvent==='function'&&Math.random()<.35){try{specialEvent();return}catch(e){console.error(e)}}\n  if(typeof genericEvent==='function'){try{genericEvent();return}catch(e){console.error(e)}}\n  openEvent('KARIERA','📨 NOWE WYDARZENIE','<p>Nadszedł <b>dzień '+s.day+'</b>.</p><p>Twoja kariera idzie dalej. Podejmij decyzję i kontynuuj.</p>',[['KONTYNUUJ',closeEvent]]);\n }catch(e){\n  console.error('CONTINUE V3 ERROR',e);\n  try{save()}catch(_){}\n  openEvent('KARIERA','📨 NOWE WYDARZENIE','<p>Nadszedł <b>'+s.day+'</b>.</p><p>Wydarzenie zostało otwarte w trybie awaryjnym.</p>',[['OK',closeEvent]]);\n }\n};\n</script>\n'''
              s=s.replace('</body>',patch+'</body>') if '</body>' in s else s+patch
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mma-v127.html
          git diff --cached --quiet || git commit -m 'Guarantee event modal after continue'
          git push
