name: Apply V81
on:
  push:
    paths:
      - 'patch-v81.js'
      - '.github/workflows/apply-v81.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V81 script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="patch-v81.js"></script>'
          if marker not in s:
              s=s.replace('</body>', marker+'</body>')
              s=s.replace('<title>MMA Career Simulator V80</title>','<title>MMA Career Simulator V81</title>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V81
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: enable V81 dynamic fight system'
          git push
