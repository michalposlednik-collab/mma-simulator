name: Install V82 patch
on:
  push:
    paths:
      - 'v82-patch.js'
      - '.github/workflows/v82-install.yml'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V82 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- V82 PATCH -->'
          if marker not in s:
              patch=Path('v82-patch.js').read_text(encoding='utf-8')
              s=s.replace('</body>', marker+'<script>'+patch+'</script></body>')
              s=s.replace('<title>MMA Career Simulator V81</title>','<title>MMA Career Simulator V82</title>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit installed patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: install V82 fight patch [skip ci]'
          git push