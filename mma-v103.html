<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V103</title><style>*{box-sizing:border-box}body{margin:0;background:#060b10;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#80652a;border-color:#d6ae51}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 16px 45px #0006}.creator{max-width:1100px;margin:auto}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{display:none}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:76px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.pick+label small{display:block;color:#9eb0b8;margin-top:6px}.gold{color:#d6ae51}.muted{color:#91a3ac}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b}.modal{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:50;padding:18px}.modalbox{width:min(1000px,96vw);max-height:92vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:26px}.club{padding:16px;border:1px solid #304955;border-radius:12px;background:#0b151d;margin:9px 0}.locked{opacity:.45}.fight{background:radial-gradient(circle at 50% 0,#293a44,#070c11);min-height:100vh;padding:18px}.fighthead{display:flex;justify-content:space-between;align-items:center}.round{font-size:28px;color:#d6ae51}.clock{font-size:42px;font-weight:800}.fighters{display:grid;grid-template-columns:1fr 250px 1fr;gap:15px;align-items:center;margin:18px 0}.fighter{text-align:center;padding:18px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:14px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.comment{min-height:105px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;font-size:17px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actionhint{margin-top:12px;color:#9eb0b8}.wheelwrap{display:none;position:fixed;inset:0;background:#000d;z-index:100;place-items:center}.wheelbox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:22px;text-align:center;width:min(520px,95vw)}.wheel{width:280px;height:280px;margin:12px auto;border-radius:50%;background:conic-gradient(#c33 0 12.5%,#2e9d5b 12.5% 25%,#c33 25% 37.5%,#2e9d5b 37.5% 50%,#c33 50% 62.5%,#2e9d5b 62.5% 75%,#c33 75% 87.5%,#2e9d5b 87.5% 100%);border:8px solid #17252d;transition:transform 2s cubic-bezier(.12,.7,.15,1);position:relative}.wheel:after{content:'▲';position:absolute;top:-27px;left:50%;transform:translateX(-50%);color:#d6ae51;font-size:25px}.ring{width:220px;height:220px;border-radius:50%;margin:0 auto 10px;background:conic-gradient(#36c77b calc(var(--p)*1%),#26343b 0);position:relative}.ring:after{content:'';position:absolute;inset:18px;border-radius:50%;background:#101c25}.ring b{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:28px}.hidden{display:none}@media(max-width:900px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.grid,.cols{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}@media(max-width:600px){.grid,.cols,.stats{grid-template-columns:1fr}.top{display:block}.clock{font-size:34px}}</style></head><body><div id="app" class="app"></div><div id="wheel" class="wheelwrap"><div class="wheelbox"><h2 class="gold">KOŁO FORTUNY</h2><p id="wheelText">Timing decyduje...</p><div id="wheelEl" class="wheel"></div><button class="primary" onclick="spinWheel()">LOSOWANIE</button></div></div><script>(function(){'use strict';var app=document.getElementById('app'),wheel=document.getElementById('wheel'),wheelEl=document.getElementById('wheelEl'),wheelText=document.getElementById('wheelText');var KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};var TYPES={Wonderkid:'Talent, refleks i głód zwycięstw. Potencjał ogromny, doświadczenie jeszcze nie.',Bijok:'Szczęka ze stali, ręce z żelaza, a mózg czasem na urlopie.',Fizol:'Siła, klincz i presja. Jeśli nie działa plan A, jest jeszcze ciężar właściwy.',Zapaśnik:'Najpierw nogi rywala, potem pytania. Siatka to jego drugi dom.',Striker:'Dystans, timing i przekonanie, że każda runda może skończyć się przed czasem.',Gumiarz:'Im większy chaos, tym lepiej. Na macie czuje się jak ryba w wodzie.',Allrounder:'Nie ma jednej supermocy. Ma za to odpowiedź na większość problemów.'};var BUD=[[5000,'Normalny etat','Praca po godzinach. Każdy wydatek boli.'],[10000,'Etat + oszczędności','Trochę oddechu, ale nadal trzeba liczyć.'],[25000,'Rodzina pomaga','Masz zaplecze na pierwszy poważny krok.'],[50000,'Bogata rodzina','Możesz inwestować w obozy i sprzęt.'],[100000,'Rodzinny biznes','Sport jest finansowany jak drugi biznes.']];var CLUBS=[['Uniq Fight Club','Warszawa',0,6000,'Stójka, boks i kickboxing.',{Boks:5,Szybkość:3}],['ANKOS MMA','Poznań',10,8000,'Zapasy, MMA i praca pod presją.',{Zapasy:6,Kondycja:3}],['WCA Fight Team','Warszawa',20,9000,'BJJ, grappling i praca w parterze.',{BJJ:6,Zapasy:2}],['Czerwony Smok','Poznań',30,11000,'Przekrojowy camp MMA.',{Boks:3,BJJ:3,Zapasy:3}],['American Top Team','Coconut Creek',65,25000,'Międzynarodowy camp dla zawodników z reputacją.',{Boks:4,BJJ:4,Zapasy:4,Kondycja:4}]];var s={created:false,day:1,age:18,money:10000,rep:5,ig:100,mot:70,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,log:[],history:[],timer:null,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,comment:'',wheelAction:null,wheelCost:0,roundScore:[],usedActions:0};function esc(x){return String(x).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}function creator(){var types='',bud='',weights='';Object.keys(TYPES).forEach(function(k,i){types+='<input class="pick" id="t'+i+'" name="type" type="radio" value="'+k+'"><label for="t'+i+'"><b>'+k+'</b><small>'+TYPES[k]+'</small></label>'});BUD.forEach(function(x,i){bud+='<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'"><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' zł</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>'});Object.keys(KG).forEach(function(k,i){weights+='<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+k+'"><label for="w'+i+'"><b>'+k+'</b><small>'+KG[k]+'</small></label>'});app.innerHTML='<div class="wrap creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do wielkich gal.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="Michał"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="Kowalski"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+types+'</div><h3>BUDŻET STARTOWY</h3><div class="grid">'+bud+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+weights+'</div><br><button class="primary" onclick="startCareer()">STWÓRZ KARIERĘ →</button></div></div>'}function startCareer(){var f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.created=true;s.first=f;s.last=l;s.type=t.value;s.money=+b.value;s.weight=w.value;s.log=['🥊 Rozpoczęto karierę '+f+' '+l+'.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance(1)">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fights()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="statistics()">📊 Statystyki</button><button onclick="finance()">💰 Finanse</button><button onclick="events()">◉ Eventy</button></aside>'}function league(){var wins=s.w;if(wins<2)return 'Lokalna gala';if(wins<4)return 'Hybrid';if(wins<7)return Math.random()<.5?'Babilon MMA':'FEN';if(s.rep<45)return 'FEN';if(s.rep<60)return 'KSW';if(s.rep<72)return 'OKTAGON';if(s.rep<85)return 'Cage Warriors';if(s.rep<94)return 'PFL';return 'UFC'}function reqName(){var w=s.w;if(w<2)return 5;if(w<4)return 12;if(w<7)return 20;if(w<10)return 35;if(w<13)return 50;if(w<16)return 65;if(w<19)return 80;return 94}function dashboard(){if(!s.created){creator();return}var paths=['Lokalna gala','Hybrid','Babilon MMA / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'],req=[0,2,4,7,10,13,16,19],html='';paths.forEach(function(x,i){html+='<div class="feed">'+(s.w>=req[i]?'🟢':'🔒')+' '+x+' <span class="muted">min. '+req[i]+' zwycięstw</span></div>'});var skills='';Object.keys(s.sk).forEach(function(k){skills+='<div class="feed"><b>'+k+'</b> '+s.sk[k]+'<div class="bar"><i style="width:'+Math.min(100,s.sk[k])+'%"></i></div></div>'});var hero=s.fight?'<h2>🏆 '+(s.fight.days?'PRZYGOTOWANIE DO WALKI':'WALKA GOTOWA')+'</h2><p>'+s.fight.level+' · Rywal: <b>'+s.fight.opponent+'</b></p><button class="primary" onclick="'+(s.fight.days?'training()':'startFight()')+'">'+(s.fight.days?'WYBIERZ CAMP':'WEJDŹ DO WALKI')+'</button>':'<h2>📅 BUDOWANIE KARIERY</h2><p>Aktualny poziom: <b>'+league()+'</b>. Kolejna oferta pojawi się po rozwoju kariery.</p><button class="primary" onclick="nextEvent()">NASTĘPNY EVENT</button>';app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+esc(s.first)+' '+esc(s.last)+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button onclick="advance(1)">＋ 1 DZIEŃ</button> <button class="primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><b>'+s.w+'-'+s.l+'-'+s.d+'</b></div><div class="stat"><small>INSTAGRAM</small><b>'+s.ig.toLocaleString('pl-PL')+'</b></div><div class="stat"><small>REPUTACJA</small><b>'+s.rep+'/100</b></div><div class="stat"><small>BUDŻET</small><b>'+s.money.toLocaleString('pl-PL')+' zł</b></div><div class="stat"><small>MOTYWACJA</small><b>'+s.mot+'/100</b></div><div class="stat"><small>WIEK</small><b>'+s.age+'</b></div></div><div class="hero"><small class="gold">NAJBLIŻSZY CEL</small>'+hero+'</div><div class="cols"><section><div class="panel"><h3>📰 OŚ KARIERY</h3>'+s.log.slice(0,12).map(function(x){return '<div class="feed">'+x+'</div>'}).join('')+'</div><div class="panel"><h3>🎯 ŚCIEŻKA KARIERY</h3>'+html+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+skills+'</div><div class="tiles"><div class="tile">🏋️ Klub<br><b>'+(s.gym||'Lokalny')+'</b></div><div class="tile">💼 Menedżer<br><b>'+(s.rep>=20?'Aktywny':'Brak')+'</b></div><div class="tile">🎟️ Poziom<br><b>'+league()+'</b></div></div></aside></div></main></div>'}function advance(n){for(var i=0;i<n;i++){s.day++;if(s.day%365===0){s.age++;s.log.unshift('🎂 Urodziny — '+s.age+' lat.')}if(s.day%7===0)s.money+=900;if(s.day%30===1&&s.day>1)s.money+=3000}s.mot=Math.max(0,s.mot-1);dashboard()}function nextEvent(){if(s.fight){if(s.fight.days){training();return}startFight();return}var level=league(),names=['Marek „Kruk” Zieliński','Kacper „Raptor” Nowak','Patryk „Diesel” Wrona','Adrian „Sęp” Maj','Łukasz „Młot” Kaczmarek','Dawid „Viper” Lis'];var opponent=names[Math.floor(Math.random()*names.length)];s.fight={opponent:opponent,days:21,level:level};s.log.unshift('📩 OFERTA: '+level+' — '+opponent+'. 21 dni na przygotowanie.');if(s.rep>=20&&s.rep<25)s.log.unshift('💼 Zainteresował się Tobą agent. Możesz zacząć negocjować lepsze walki.');dashboard()}function training(){if(!s.fight){modal('TRENING','Możesz trenować lokalnie. Po otrzymaniu walki wybierzesz jeden klub na cały obóz.');return}var h='<div class="modal"><div class="modalbox"><small class="gold">OBÓZ PRZYGOTOWAWCZY · 21 DNI</small><h1>Wybierz jeden klub</h1><p class="muted">Płacisz raz. Camp rozwija konkretne umiejętności, a po 21 dniach od razu przechodzisz do walki.</p>';CLUBS.forEach(function(c,i){var ok=s.rep>=c[2]&&s.money>=c[3];h+='<div class="club '+(ok?'':'locked')+'"><h3>'+c[0]+' · '+c[1]+'</h3><p>'+c[4]+'</p><p><span class="gold">REP '+c[2]+'</span> · '+c[3].toLocaleString('pl-PL')+' zł</p><p>'+Object.keys(c[5]).map(function(k){return '+'+c[5][k]+' '+k}).join(' · ')+'</p><button '+(ok?'':'disabled')+' class="'+(ok?'primary':'')+'" onclick="startCamp('+i+')">'+(ok?'ROZPOCZNIJ CAMP':'NIEDOSTĘPNY')+'</button></div>'});h+='<button onclick="closeModal()">WRÓĆ</button></div></div>';app.insertAdjacentHTML('beforeend',h)}function startCamp(i){var c=CLUBS[i];if(!s.fight||s.rep<c[2]||s.money<c[3])return;s.money-=c[3];s.gym=c[0];Object.keys(c[5]).forEach(function(k){s.sk[k]=Math.min(100,s.sk[k]+c[5][k])});s.sk.Kondycja=Math.min(100,s.sk.Kondycja+2);s.day+=21;s.fight.days=0;s.log.unshift('🥋 21-dniowy camp w '+c[0]+' zakończony.');closeModal();startFight()}function fights(){if(!s.fight){modal('WALKI','Kliknij Następny event, aby dostać ofertę.');return}if(s.fight.days){training();return}startFight()}function startFight(){s.round=1;s.time=300;s.stamina=100;s.vitality=100;s.oppStamina=100;s.oppVitality=100;s.roundScore=[];s.usedActions=0;s.comment='JURAS: Panowie, zaczynamy. Pierwsze sekundy są jak otwieranie szachownicy — każdy chce zobaczyć, co ma do zaoferowania rywal. Tu nie wygrywa się walki jednym ciosem, ale jednym błędem można ją przegrać.';renderFight();clearInterval(s.timer);s.timer=setInterval(tickFight,250)}function tickFight(){if(!s.fight)return;s.time-=2;s.stamina=Math.max(0,s.stamina-(.22+(100-s.stamina)*.001));s.oppStamina=Math.max(0,s.oppStamina-(.18+(100-s.oppStamina)*.001));var phase=1-s.time/300;if(Math.random()<.12){var drain=1+Math.random()*2;s.oppStamina=Math.max(0,s.oppStamina-drain);s.stamina=Math.max(0,s.stamina-drain*.65);s.comment=autoComment()}if(Math.random()<.025){var hit=1+Math.random()*3;s.vitality=Math.max(0,s.vitality-hit);s.comment='JURAS: Rywal trafia! Niby pojedynczy cios, ale takich rzeczy nie można lekceważyć. '+(s.vitality<65?'Widać już, że zaczyna to odbijać się na odporności zawodnika.':'Na razie bez paniki, ale trzeba wrócić do własnej gry.')}if(s.time<=0){scoreRound();if(s.round<3){s.round++;s.time=300;s.stamina=Math.min(100,s.stamina+12);s.oppStamina=Math.min(100,s.oppStamina+10);s.comment='JURAS: Koniec rundy. Jest minuta, żeby złapać oddech, wysłuchać narożnika i poukładać plan. Tylko pytanie brzmi: kto naprawdę potrafi go wykonać?'}else{finishFight('DECYZJA');return}}renderFight()}function autoComment(){var p=s.oppStamina;if(p<30)return 'JURAS: Rywal zaczyna oddychać ciężko. To jest ten moment, kiedy doświadczenie i kondycja wychodzą na pierwszy plan. Jeszcze jedna dobra sekwencja może otworzyć drogę do skończenia walki.';if(p<60)return 'JURAS: Tempo jest naprawdę wysokie. Obaj pracują, ale każdy kolejny ruch kosztuje. Tu nie chodzi już o pojedynczy cios, tylko o to, kto lepiej zarządza energią.';return 'JURAS: Spokojny początek, dużo badania dystansu. W MMA czasem najważniejsza akcja to ta, której jeszcze nie wykonasz.'}function renderFight(){var pct=Math.max(0,Math.min(100,s.time/300*100)),circ=314.16,offset=circ*(1-pct/100),min=Math.floor(s.time/60),sec=String(s.time%60).padStart(2,'0');var act=s.usedActions<3?'Ryzyko rośnie wraz z czasem. Wybieraj akcje świadomie — kosztują staminę, a skuteczność zależy od sytuacji.':'';app.innerHTML='<div class="fight"><div class="fighthead"><div><small class="gold">'+esc(s.fight.level)+'</small><h1>'+esc(s.first+' '+s.last)+' vs '+esc(s.fight.opponent)+'</h1><p class="muted">Runda '+s.round+' / 3</p></div><div style="text-align:center"><div class="ring" style="--p:'+pct+'"><b>'+min+':'+sec+'</b></div><div class="round">Runda '+s.round+'</div></div></div><div class="fighters"><div class="fighter"><h2>'+esc(s.first+' '+s.last)+'</h2><p>STAMINA '+Math.round(s.stamina)+'%</p><div class="hp"><i style="width:'+s.stamina+'%"></i></div><p>WITALNOŚĆ '+Math.round(s.vitality)+'%</p><div class="hp"><i style="width:'+s.vitality+'%"></i></div></div><div class a[3]*(s.stamina<35?.8:1)*(s.oppStamina<40?1.15:1);var cost=data[2];s.stamina=Math.max(0,s.stamina-cost);if(ok){var dmg=(data[1]*(.65+Math.random()*.65))*(s.sk.Boks/70);var sd=(data[0]+Math.random()*data[0])*(s.sk.Kondycja/70);s.oppVitality=Math.max(0,s.oppVitality-dmg);s.oppStamina=Math.max(0,s.oppStamina-sd);s.comment=jurasAction(name,Math.round(dmg),Math.round(sd));if(s.oppVitality<=0){finishFight('KO');return}}else{s.comment='JURAS: '+name+' nie siadł. Rywal przeczytał zamiar, a za takie błędy płaci się energią. '+name+' kosztował '+cost+' pkt staminy.';s.oppStamina=Math.max(0,s.oppStamina-1);if(Math.random()<.22)s.vitality=Math.max(0,s.vitality-2)}renderFight()}function jurasAction(name,dmg,sd){var tail=s.oppVitality<35?' Rywal jest już mocno naruszony. Teraz trzeba jednak zachować zimną głowę, bo pogoń za nokautem często kończy się utratą kontroli.':s.oppStamina<35?' Widać, że ten ruch kosztował rywala dużo tlenu. Każda następna akcja może być przez to bardziej bolesna.':' Dobra robota, ale to jeszcze nie jest moment na świętowanie.';return 'JURAS: '+name+' wszedł czysto! Około '+dmg+'% witalności zabrane i '+sd+'% staminy. To nie jest kosmetyka — rywal musi teraz odpowiedzieć. '+tail}function spinWheel(){var r=Math.random(),success=r<.62,partial=!success&&r<.82;wheelEl.style.transform='rotate('+(1440+Math.floor(Math.random()*720))+'deg)';setTimeout(function(){wheel.style.display='none';var n=s.wheelAction;var cost=s.wheelCost;s.stamina=Math.max(0,s.stamina-cost);if(success){if(['Balacha','Trójkąt','RNC'].indexOf(n)>=0){s.comment='JURAS: '+n+'! Kapitalny timing, rywal jest w pułapce! Nie ma gdzie uciec. To jest koniec!';finishFight('SUBMISSION');return}var base=n==='High Kick'?30:n==='Latające kolano'?34:n==='Spinning Backfist'?27:18;s.oppVitality=Math.max(0,s.oppVitality-base);s.oppStamina=Math.max(0,s.oppStamina-22);s.comment='JURAS: ŁOOOO! '+n+'! Ależ weszło! To była technika z kategorii ryzyko kontra nagroda i dzisiaj ryzyko się opłaciło. Rywal traci mnóstwo witalności i oddechu.';if(s.oppVitality<=0){finishFight('KO');return}}else if(partial){s.oppVitality=Math.max(0,s.oppVitality-10);s.oppStamina=Math.max(0,s.oppStamina-8);s.comment='JURAS: Jest częściowo! Nie idealnie, ale wystarczająco, żeby rywal poczuł ciężar tej techniki. Taki wynik też ma znaczenie w długiej walce.'}else{s.comment='JURAS: Nie weszło! Rywal wyczuł zamiar i wybronił technikę. To właśnie cena widowiskowych rozwiązań — płacisz energią, jeśli timing jest zły.'}renderFight()},2100)}function scoreRound(){var ours=(100-s.stamina)+(100-s.oppStamina)*.2+(100-s.oppVitality)*.9;var theirs=(100-s.oppStamina)+(100-s.stamina)*.2+(100-s.vitality)*.9;var score=ours>theirs*1.35?'10-8':ours>theirs?'10-9':theirs>ours*1.35?'8-10':'9-10';s.roundScore.push(score)}function finishFight(method){clearInterval(s.timer);var win;if(method==='KO'||method==='TKO'||method==='SUBMISSION')win=true;else{var a=s.roundScore.filter(function(x){return x==='10-9'||x==='10-8'}).length,b=s.roundScore.filter(function(x){return x==='9-10'||x==='8-10'}).length;win=a>=b;if(a===b)win=Math.random()<.5}if(win){s.w++;var gain=league()==='Lokalna gala'?3:league()==='Hybrid'?4:7;s.rep=Math.min(100,s.rep+gain);s.ig+=method==='DECYZJA'?200:1200;s.money+=method==='DECYZJA'?2500:6000;s.log.unshift('🏆 ZWYCIĘSTWO — '+method+' z '+s.fight.opponent+' na '+s.fight.level+'.');if(s.w===2)s.log.unshift('📈 Dwa zwycięstwa! Otwierają się walki w Hybrid.');if(s.w===4)s.log.unshift('🔥 Seria zwycięstw! Możesz dostać Babilon MMA lub FEN.');if(s.w===7)s.log.unshift('💼 Reputacja rośnie — pojawia się oferta profesjonalnego agenta.')}else{s.l++;s.rep=Math.max(0,s.rep-2);s.log.unshift('❌ PORAŻKA — '+method+' z '+s.fight.opponent+'.')}s.history.unshift({day:s.day,level:s.fight.level,op:s.fight.opponent,result:win?'W':'L',method:method,scores:s.roundScore.slice()});var h=s.history[0];s.fight=null;app.innerHTML='<div class="wrap"><div class="card"><small class="gold">WYNIK WALKI</small><h1>'+(win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA
