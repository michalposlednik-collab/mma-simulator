<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V123</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.v123event{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99999;padding:18px;font-family:Arial,sans-serif;color:#eef3f5}.v123box{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px;box-shadow:0 20px 60px #000}.v123box h1{margin-top:5px}.v123gold{color:#d6ae51}.v123muted{color:#91a3ac}.v123actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v123actions button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:13px;border-radius:9px;font-weight:700}.v123actions button:hover{border-color:#d6ae51}.v123primary{background:#80652a!important;border-color:#d6ae51!important}.v123continue{position:fixed;right:24px;top:20px;z-index:5000;display:none;cursor:pointer;color:#fff;background:#80652a;border:1px solid #d6ae51;padding:12px 18px;border-radius:10px;font-weight:900;box-shadow:0 8px 25px #0008}.v123camp{display:block;width:100%;text-align:left;margin:9px 0;cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:15px;border-radius:9px}.v123camp:hover{border-color:#d6ae51}@media(max-width:600px){.v123actions{grid-template-columns:1fr}.v123continue{right:10px;top:10px}}</style></head><body><iframe id="game"></iframe><button id="continue" class="v123continue">▶ KONTYNUUJ DO NASTĘPNEGO EVENTU</button><div id="event" class="v123event"><div class="v123box"><small id="etype" class="v123gold"></small><h1 id="etitle"></h1><div id="ebody"></div><div id="eactions" class="v123actions"></div></div></div><script>(function(){'use strict';const KEY='mmaCareerV111',frame=document.getElementById('game'),cont=document.getElementById('continue'),modal=document.getElementById('event'),etype=document.getElementById('etype'),etitle=document.getElementById('etitle'),ebody=document.getElementById('ebody'),actions=document.getElementById('eactions');let state=null,busy=false,initialized=false;
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(s){localStorage.setItem(KEY,JSON.stringify(s))}function game(){try{return frame.contentWindow}catch(e){return null}}function hideBaseModal(){try{const d=frame.contentDocument,m=d&&d.getElementById('modal');if(m)m.style.display='none'}catch(e){}}
function renderGame(){try{const w=game();if(w&&typeof w.dashboard==='function')w.dashboard();else if(w)w.location.reload()}catch(e){}}
function show(title,type,body,buttons){etype.textContent=type;etitle.textContent=title;ebody.innerHTML=body;actions.innerHTML='';buttons.forEach(x=>{const b=document.createElement('button');b.textContent=x[0];if(x[2])b.className='v123primary';b.onclick=x[1];actions.appendChild(b)});modal.style.display='flex';busy=true;hideBaseModal()}
function close(){modal.style.display='none';busy=false;renderGame()}
function validCareer(s){return s&&s.created===true&&s.first&&s.last&&s.type&&s.weight&&Number.isFinite(Number(s.day))}
function resetForV123(){try{if(sessionStorage.getItem('mmaV123Fresh')!=='1'){localStorage.removeItem(KEY);sessionStorage.setItem('mmaV123Fresh','1')}}catch(e){}}
function nextReactionDay(s){let d=Number(s.day)||1, candidates=[];if(s.fight&&s.fight.date&&s.fight.date>d)candidates.push(Number(s.fight.date));const events=[{day:3,type:'social'},{day:7,type:'fight'},{day:14,type:'praise'},{day:21,type:'social'},{day:30,type:'fight'}];events.forEach(e=>{if(e.day>d)candidates.push(e.day)});return Math.min.apply(null,candidates.length?candidates:[d+7])}
function advanceToEvent(){state=read();if(!validCareer(state)){return}let target=nextReactionDay(state);let days=Math.max(1,target-Number(state.day));state.day=target;state.age=18+Math.floor((target-1)/365);state.money=Number(state.money||0)-days*100;state.log=state.log||[];state.log.push('📅 Czas przesunięty o '+days+' dni. Dzień kariery: '+target+'.');write(state);renderGame();const ev=({3:'social',7:'fight',14:'praise',21:'social',30:'fight'})[target];if(ev==='fight')fightOffer();else if(ev==='social')socialEvent();else if(ev==='praise')praiseEvent();else genericEvent()}
function fightOffer(){const opp=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek'][Math.floor(Math.random()*5)],org=state.w<2?'Lokalna gala':state.w<4?'Hybrid':state.w<7?'Babilon MMA / FEN':state.w<10?'KSW':'OKTAGON',purse=state.w<2?1800:state.w<4?3000:state.w<7?5000:8000;show('OFERTA WALKI','EVENT · PROPOZYCJA WALKI','<p>Promotor dzwoni: <b>'+opp+'</b> czeka na Ciebie w organizacji <b>'+org+'</b>.</p><p>Gaża: <b>'+purse.toLocaleString('pl-PL')+' zł</b>.</p><p class="v123muted">Najpierw podejmujesz decyzję. Dopiero po akceptacji wybierasz obóz i termin.</p>',[['AKCEPTUJ WALKĘ',()=>campOffer(opp,org,purse),true],['ODRZUĆ WALKĘ',()=>{state.log.push('❌ Odrzucono ofertę walki z '+opp+'.');write(state);close()}]])}
function campOffer(opp,org,purse){const camps=[['Reykjavík Fight Lab',10,1200,'Kondycja + szybkość'],['WCA Fight Team',14,3500,'Boks + BJJ'],['ANKOS MMA',14,4200,'Zapasy + praca pod klatką'],['American Top Team',21,12000,'Pełny profesjonalny camp']];etype.textContent='EVENT · CAMP';etitle.textContent='WYBIERZ OBÓZ PRZYGOTOWAWCZY';ebody.innerHTML='<p>Rywal: <b>'+opp+'</b> · '+org+'</p><p>Gaża: <b>'+purse.toLocaleString('pl-PL')+' zł</b></p><p class="v123muted">Data walki zostanie wyliczona po wyborze campu. Koszt jest pobierany teraz.</p>';actions.innerHTML='';camps.forEach(c=>{const b=document.createElement('button');b.className='v123camp';b.innerHTML='<b>'+c[0]+'</b><br>'+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł<br><small>'+c[3]+'</small>';b.onclick=()=>{if(Number(state.money||0)<c[2]){alert('Za mało pieniędzy na ten camp.');return}const date=Number(state.day)+c[1]+1;state.money-=c[2];state.fight={opponent:opp,league:org,purse,date,camp:c[0],campDays:c[1],round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}};state.log.push('🏕️ '+c[0]+' · '+c[1]+' dni. Walka z '+opp+' zaplanowana na dzień '+date+'.');write(state);close()};actions.appendChild(b)});}
function socialEvent(){show('KOLEJNA DRAMA W SOCIALACH','EVENT · SOCIAL MEDIA','<p>Pod postem pojawia się komentarz: <b>„Dużo mówisz jak na kogoś, kto jeszcze nie ma kogo pokonać.”</b></p><p class="v123muted">Nie ma tu odpowiedzi „pozytywna/negatywna”. Wybierasz konkretny styl reakcji.</p>',[['„Spokojnie. Najpierw wyślij mi numer do menadżera.”',()=>react(2),true],['„Zrobię to w klatce, nie w komentarzach.”',()=>react(1)],['„Dzięki za darmową reklamę 😎”',()=>react(1)],['Nie odpowiadam — nie każdy bait zasługuje na konferencję.',()=>react(0)]])}
function praiseEvent(){show('KTOŚ CIĘ DOCENIŁ','EVENT · SOCIAL MEDIA','<p>Popularny profil MMA wrzuca: <b>„Ten zawodnik robi progres. Warto go obserwować.”</b></p>',[['„Dzięki! Robimy swoje.”',()=>react(1),true],['„Jeszcze nie widzieliście najlepszego.”',()=>react(2)],['Udostępnij bez komentarza.',()=>react(0)]])}
function react(n){state.rep=Math.max(0,Math.min(100,Number(state.rep||0)+n));state.ig=Math.max(0,Number(state.ig||0)+n*150);state.log.push('📱 Reakcja social media: +'+n+' reputacji.');write(state);close()}
function genericEvent(){show('WAŻNY MOMENT','EVENT · KARIERA','<p>W karierze pojawiło się nowe wydarzenie. Czas zatrzymuje się do Twojej decyzji.</p>',[['KONTYNUUJ',close,true]])}
function hook(){try{const s=read();if(!s)return;state=s;const inCreator=!s.created;cont.style.display=inCreator?'none':'block';if(!initialized&&inCreator){hideBaseModal()}initialized=true}catch(e){}}
cont.onclick=()=>{if(!busy)advanceToEvent()};frame.addEventListener('load',()=>{setTimeout(hook,50);setTimeout(hook,500);setTimeout(hook,1200)});setInterval(hook,700);resetForV123();frame.src='./mma-v111.html?v=123base&x='+Date.now();})();</script></body></html>
