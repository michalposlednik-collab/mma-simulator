<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V97</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 16px 45px #0006}.creator{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:72px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.primary{background:#80652a;border-color:#d6ae51;font-weight:bold;color:#fff;padding:12px 16px;border-radius:9px}.btn{background:#162833;color:#fff;border:1px solid #526873;padding:11px 15px;border-radius:9px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;padding:12px;text-align:left;background:#0b151d;color:#c8d2d6;border:1px solid #203642;border-radius:8px}.side button:hover{border-color:#d6ae51}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.gold{color:#d6ae51}.muted{color:#91a3ac}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small{color:#82949d}.stat b{display:block;font-size:19px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.45fr .85fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b;border-radius:8px}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50;padding:18px}.modalbox{width:min(950px,95vw);max-height:90vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:26px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.club{padding:15px;border:1px solid #304955;border-radius:12px;background:#0b151d;margin:7px 0}.locked{opacity:.5}.money{font-size:24px;color:#d6ae51}.fight{min-height:100vh;padding:22px}.fightgrid{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 160px 1fr;gap:12px;align-items:center}.fighter{padding:18px;background:#0b171f;border:1px solid #304955;border-radius:12px;text-align:center}.hp{height:14px;background:#35191e;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.clock{width:135px;height:135px;border:7px solid #d6ae51;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:22px}.comment{max-width:1100px;height:190px;overflow:auto;margin:14px auto;background:#050c11;border:1px solid #304955;border-radius:10px;padding:10px}.comment p{margin:0;padding:8px;border-bottom:1px solid #172a34}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{padding:12px;background:#101f29;color:#fff;border:1px solid #294653;border-radius:9px}.wheel{width:290px;height:290px;position:relative;margin:10px auto}.disk{width:290px;height:290px;border-radius:50%;background:conic-gradient(#36c77b 0 8%,#d84f5b 8% 16%,#36c77b 16% 24%,#d84f5b 24% 32%,#36c77b 32% 40%,#d84f5b 40% 48%,#36c77b 48% 56%,#d84f5b 56% 64%,#36c77b 64% 72%,#d84f5b 72% 80%,#36c77b 80% 88%,#d84f5b 88%);border:7px solid #65747d;transition:transform 2s cubic-bezier(.12,.75,.08,1)}.pointer{position:absolute;z-index:2;top:-25px;left:50%;transform:translateX(-50%);font-size:30px}@media(max-width:950px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.grid,.cols{grid-template-columns:1fr 1fr}.fightgrid{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}}@media(max-width:600px){.stats,.grid,.tiles,.choices,.cols,.acts{grid-template-columns:1fr}.top{display:block}}</style></head><body><div id="app" class="app"></div><script>(function(){'use strict';var app=document.getElementById('app');var PLN='zł';var KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};var TYPE={Wonderkid:'Talent, refleks i głód zwycięstw.','Osiedlowy bijok':'Szczęka ze stali, ręce z żelaza, mózg czasem na urlopie.','Fizol':'Siła, klincz i argumenty, których nie trzeba długo tłumaczyć.','Zapaśnik':'Najpierw nogi rywala, potem pytania. Siatka to jego drugi dom.','Striker':'Dystans, timing i przekonanie, że każda runda może skończyć się przed czasem.','Gumiarz':'Na macie czuje się jak w domu. Im bardziej chaotycznie, tym weselej.','Allrounder':'Nic spektakularnego na papierze — za to wszystko działa.'};var BUD=[[5000,'Normalny etat','Pracujesz po godzinach i liczysz każdą złotówkę.'],[10000,'Etat + oszczędności','Trochę oddechu, ale nadal trzeba pracować.'],[25000,'Rodzina pomaga','Masz zaplecze, żeby zacząć trenować poważniej.'],[50000,'Bogata rodzina','Możesz inwestować w obozy i sprzęt.'],[100000,'Rodzinny biznes','Kariera sportowa dostaje mocne finansowe wsparcie.']];var CLUBS=[{n:'Uniq Fight Club',city:'Warszawa',req:0,cost:250,days:7,desc:'Stójka, boks i kickboxing.',g:{Boks:3,Szybkość:2}},{n:'ANKOS MMA',city:'Poznań',req:15,cost:600,days:14,desc:'Zapasy, MMA i praca pod presją.',g:{Zapasy:6,Kondycja:2}},{n:'WCA Fight Team',city:'Warszawa',req:25,cost:700,days:14,desc:'Grappling, BJJ i przekrojowe MMA.',g:{BJJ:5,Zapasy:2}},{n:'Czerwony Smok',city:'Poznań',req:35,cost:850,days:14,desc:'MMA i wszechstronny rozwój.',g:{Boks:2,BJJ:3,Zapasy:3}},{n:'American Top Team',city:'USA',req:65,cost:2500,days:21,desc:'Międzynarodowy camp dla zawodników z wysoką reputacją.',g:{Boks:4,Zapasy:4,BJJ:4,Kondycja:4}}];var s={day:1,age:18,ig:100,rep:5,mot:55,money:10000,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',fight:null,manager:false,gym:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},log:[],history:[],camp:null,jobPay:3000,gatePay:900,supplements:false};function money(n){return n.toLocaleString('pl-PL')+' '+PLN}function creator(){app.innerHTML='<div class="wrap creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do wielkich gal.</p><div class="field"><label>IMIĘ *</label><input id="fn"></div><div class="field"><label>NAZWISKO *</label><input id="ln"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.keys(TYPE).map(function(x,i){return '<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x+'"><label for="t'+i+'"><b>'+x+'</b><small>'+TYPE[x]+'</small></label>'}).join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="grid">'+BUD.map(function(x,i){return '<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'"><label for="b'+i+'"><b>'+money(x[0])+'</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>'}).join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.keys(KG).map(function(x,i){return '<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x+'"><label for="w'+i+'"><b>'+x+'</b><small>'+KG[x]+'</small></label>'}).join('')+'</div><br><button id="start" class="primary">STWÓRZ KARIERĘ →</button></div></div>';document.getElementById('start').onclick=start}function start(){var f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('input[name="type"]:checked'),b=document.querySelector('input[name="bud"]:checked'),w=document.querySelector('input[name="weight"]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.first=f;s.last=l;s.type=t.value;s.money=Number(b.value);s.weight=w.value;s.log=['🥊 Kariera rozpoczęta: '+f+' '+l+'.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance()">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fights()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="statistics()">📊 Statystyki</button><button onclick="finance()">💰 Finanse</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button class="btn" onclick="advance()">＋ 1 DZIEŃ</button><button class="primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><b>'+s.w+'-'+s.l+'-'+s.d+'</b></div><div class="stat"><small>INSTAGRAM</small><b>'+s.ig.toLocaleString('pl-PL')+'</b></div><div class="stat"><small>REPUTACJA</small><b>'+s.rep+'/100</b></div><div class="stat"><small>BUDŻET</small><b>'+money(s.money)+'</b></div><div class="stat"><small>MOTYWACJA</small><b>'+s.mot+'/100</b></div><div class="stat"><small>WIEK</small><b>'+s.age+'</b></div></div><div class="hero"><small class="gold">NAJBLIŻSZY CEL</small><h2>'+(s.fight?'🏆 PRZYGOTOWANIE DO WALKI':'📅 BUDOWANIE KARIERY')+'</h2><p>'+(s.fight?'Rywal: <b>'+s.fight.opponent+'</b> · '+(s.camp?s.camp.days:0)+' dni obozu.':'Trenuj, zarabiaj, buduj reputację i czekaj na odpowiednią ofertę.')+'</p><button class="primary" onclick="nextEvent()">PRZEWIŃ DO NASTĘPNEGO EVENTU</button></div><div class="cols"><section><div class="panel"><h3>📰 OŚ KARIERY</h3>'+s.log.slice(0,14).map(function(x){return '<div class="feed">'+x+'</div>'}).join('')+'</div><div class="panel"><h3>🎯 ŚCIEŻKA KARIERY</h3>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map(function(x,i){return '<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'🟢 ':'🔒 ')+x+'</div>'}).join('')+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+Object.keys(s.sk).map(function(k){return '<div class="feed"><b>'+k+'</b> '+s.sk[k]+'<div class="bar"><i style="width:'+Math.min(100,s.sk[k])+'%"></i></div></div>'}).join('')+'</div><div class="tiles"><div class="tile">🏋️ Klub<br><b>'+s.gym+'</b></div><div class="tile">💼 Menedżer<br><b>'+(s.manager?'Tak':'Brak')+'</b></div><div class="tile">🥤 Suplementy<br><b>'+(s.supplements?'Aktywne':'Brak')+'</b></div></div></aside></div></main></div>'}function advance(){s.day++;if(s.day%365===0){s.age++;s.log.unshift('🎂 Urodziny — zawodnik ma '+s.age+' lat.')}if(s.day%7===0){s.money+=s.gatePay;s.log.unshift('🚪 Weekendowa brama: +'+money(s.gatePay)+'.')}if(s.day%30===1&&s.day>1){s.money+=s.jobPay;s.log.unshift('💼 Miesięczna wypłata: +'+money(s.jobPay)+'.')}if(s.camp){s.camp.days--;s.mot=Math.max(0,s.mot-1);if(s.camp.days<=0){finishCamp()}}else{s.mot=Math.max(0,s.mot-1)}dashboard()}function nextEvent(){if(s.fight){if(s.camp&&s.camp.days>0){modal('DZIEŃ OBOZU','Walka jest już zakontraktowana. Wybierz trening dla obozu albo przejdź o dzień.',[['TRENING OBOZOWY',training],['+1 DZIEŃ',advance]])}else{startFight()};return}advance();var r=Math.random();if(r<.42){modalChoices('PROPOZYCJA WALKI','Promotor oferuje pojedynek. Po przyjęciu nie możesz przyjąć kolejnej walki aż do zakończenia obozu i walki.',[['PRZYJMUJĘ',function(){s.fight={opponent:['Marek „Kosa” Nowak','Paweł „Beton” Zieliński','Igor „Kret” Wrona'][Math.floor(Math.random()*3)]};s.camp={days:21,club:null,bonus:{}};s.log.unshift('🏆 Przyjęto walkę z '+s.fight.opponent+'. Rozpoczyna się 21-dniowy obóz.');dashboard()}],['ODRZUCAM',dashboard]])}else if(r<.72){modalChoices('SPOTKANIE NA GALI','Spotykasz Mameda Khalidova. Internet czeka na Twoją reakcję.',[['ZDJĘCIE + MUZYKA',function(){s.ig+=1000;s.rep+=2;s.log.unshift('🔥 Zdjęcie z Mamedem i muzyką zrobiło viral. +1000 IG.');dashboard()}],['UDASZ, ŻE NIE POZNAJESZ',function(){s.ig+=600;s.log.unshift('😂 Udajesz, że nie rozpoznajesz Mameda. +600 IG.');dashboard()}]])}else modalChoices('MEDIA','Juras wspomina Twój ostatni trening.',[['UDOSTĘPNIAM',function(){s.ig+=250;s.rep++;s.log.unshift('📱 Juras wspomniał o Tobie. +250 IG.');dashboard()}],['ODPUSZCZAM',dashboard]])}function training(){var html='<h2>🥊 OBOZOWY TRENING</h2><p>Wybierz klub. Każdy wybór zużywa 1 dzień obozu i daje konkretne bonusy.</p>';CLUBS.forEach(function(c){var locked=s.rep<c.req||s.money<c.cost;html+='<div class="club '+(locked?'locked':'')+'"><h3>'+c.n+' — '+c.city+'</h3><p>'+c.desc+'</p><p><b>'+money(c.cost)</b> · '+c.days+' dni · REP '+c.req+'</p><p>Bonus: '+Object.keys(c.g).map(function(k){return k+' +'+c.g[k]}).join(', ')+'</p><button class="primary" '+(locked?'disabled':'')+' onclick="campTrain('+CLUBS.indexOf(c)+')">WYBIERAM TEN KLUB</button></div>'});modalHTML(html)}function campTrain(i){if(!s.fight||!s.camp)return;var c=CLUBS[i];if(s.rep<c.req||s.money<c.cost){alert('Brakuje pieniędzy lub reputacji.');return}s.money-=c.cost;s.camp.club=c.n;s.camp.days=Math.max(1,s.camp.days-1);Object.keys(c.g).forEach(function(k){s.sk[k]=Math.min(99,s.sk[k]+c.g[k])});s.gym=c.n;s.log.unshift('🥋 Obóz: trening w '+c.n+'.');if(s.camp.days<=0)finishCamp();else dashboard()}function finishCamp(){s.log.unshift('🏕️ Obóz zakończony. Forma gotowa do walki.');s.camp.days=0;dashboard()}function startFight(){if(!s.fight){return}fightScreen()}function fightScreen(){var t=0,round=1,max=900,done=false,me=100,opp=100;app.innerHTML='<div class="fight"><div class="fightgrid"><div class="fighter"><h2>'+s.first+' '+s.last+'</h2><div class="hp"><i id="mehp" style="width:100%"></i></div></div><div class="clock"><b id="clock">5:00</b></div><div class="fighter"><h2>'+s.fight.opponent+'</h2><div class="hp"><i id="opphp" style="width:100%"></i></div></div></div><div class="comment" id="comments"></div><div class="acts"><button class="act" onclick="special("high kick")">🥋 High Kick</button><button class="act" onclick="special("spinning backfist")">🌀 Spinning Backfist</button><button class="act" onclick="special("latające kolano")">🦵 Latające kolano</button><button class="act" onclick="special("balacha")">🔒 Balacha</button></div><div style="text-align:center;margin:15px"><button class="primary" onclick="finishFight()">SYMULUJ DO KOŃCA RUNDY</button></div></div>';function tick(){if(done)return;t+=5;if(t>=max){finishFight();return}var sec=300-Math.floor(t%300);document.getElementById('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');me=Math.max(20,me-(Math.random()*1.8));opp=Math.max(20,opp-(Math.random()*1.8));document.getElementById('mehp').style.width=me+'%';document.getElementById('opphp').style.width=opp+'%';if(Math.random()<.35)addComment();if(Math.random()<.01&&opp<55){finishFight('TKO');return}setTimeout(tick,120)}function addComment(){var arr=['Juras: Dobra praca na nogach!','Juras: Teraz zaczyna się robić ciekawie.','Juras: Mocny low kick, rywal to czuje.','Juras: Presja pod siatką, bardzo dobre tempo.','Juras: Ależ wymiana!','Juras: On już zaczyna opuszczać ręce.'];var p=document.createElement('p');p.textContent=arr[Math.floor(Math.random()*arr.length)];document.getElementById('comments').prepend(p)}window.special=function(name){var success=Math.random()<.58;if(success){opp=Math.max(0,opp-(18+Math.random()*25));addCommentText('Juras: '+name.toUpperCase()+'! Ale weszło!');if(opp<=10){finishFight('KO');return}}else addCommentText('Juras: Próba '+name+', ale nie trafił.');};window.addCommentText=function(x){var p=document.createElement('p');p.textContent=x;document.getElementById('comments').prepend(p)};window.finishFight=function(method){if(done)return;done=true;var result=method||(opp<me?'DECYZJA — WYGRANA':'DECYZJA — PRZEGRANA');if(result==='KO'||result==='TKO'||result.indexOf('WYGRANA')>=0){s.w++;s.rep+=3;s.ig+=300}else{s.l++;s.rep=Math.max(0,s.rep-1)}s.history.unshift({op:s.fight.opponent,result:result,day:s.day});s.log.unshift('🏆 Walka z '+s.fight.opponent+': '+result+'.');s.fight=null;s.camp=null;setTimeout(dashboard,500)}tick()}function modalChoices(t,txt,cs){var d=document.createElement('div');d.className='modal';d.innerHTML='<div class="modalbox"><small class="gold">EVENT KARIERY</small><h1>'+t+'</h1><p>'+txt+'</p><div class="choices"></div></div>';document.body.appendChild(d);cs.forEach(function(c){var b=document.createElement('button');b.className='primary';b.textContent=c[0];b.onclick=function(){d.remove();c[1]()};d.querySelector('.choices').appendChild(b)})}function modal(t,txt,cs){modalChoices(t,txt,cs||[['WRÓĆ',dashboard]])}function modalHTML(html){var d=document.createElement('div');d.className='modal';d.innerHTML='<div class="modalbox">'+html+'<br><button class="btn" onclick="this.closest(\'.modal\').remove()">ZAMKNIJ</button></div>';document.body.appendChild(d)}function fights(){if(!s.fight){modal('WALKI','Nie masz aktywnej walki. Przewiń do kolejnego eventu, aby dostać ofertę.');return}if(s.camp&&s.camp.days>0){training();return}modal('WALKA GOTOWA','Obóz zakończony. Możesz wejść do walki.',[['WEJDŹ DO WALKI',startFight],['WRÓĆ',dashboard]])}function career(){modalHTML('<h2>📋 ŚCIEŻKA KARIERY</h2>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map(function(x,i){return '<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'🟢 ':'🔒 ')+x+'</div>'}).join(''))}function media(){modalHTML('<h2>📱 MEDIA</h2><p>Instagram: <b>'+s.ig.toLocaleString('pl-PL')+'</b></p><p>Reputacja: <b>'+s.rep+'</b></p><div class="feed">Juras: „Coraz częściej o nim słychać.”</div>')}function manager(){modalHTML('<h2>💼 MENEDŻER</h2><p>'+(s.manager?'Menedżer prowadzi negocjacje, sponsorów i przygotowanie.':'Menedżer pojawi się po osiągnięciu 20 reputacji.')+'</p>')}function statistics(){modalHTML('<h2>📊 STATYSTYKI</h2>'+Object.keys(s.sk).map(function(k){return '<div class="feed"><b>'+k+'</b> '+s.sk[k]+'</div>'}).join(''))}function finance(){modalHTML('<h2>💰 FINANSE</h2><div class="money">'+money(s.money)+'</div><div class="feed">Etat: +'+money(s.jobPay)+' / miesiąc</div><div class="feed">Brama: +'+money(s.gatePay)+' / weekend</div><button class="primary" onclick="buySupplements()">KUP SUPLEMENTY — 500 '+PLN+'</button>')}function buySupplements(){if(s.money<500){alert('Za mało pieniędzy.');return}s.money-=500;s.supplements=true;s.log.unshift('🥤 Kupiono suplementy — regeneracja poprawiona.');dashboard()}function events(){modalHTML('<h2>◉ EVENTY</h2>'+s.log.map(function(x){return '<div class="feed">'+x+'</div>'}).join(''))}window.dashboard=dashboard;window.advance=advance;window.nextEvent=nextEvent;window.training=training;window.fights=fights;window.career=career;window.media=media;window.manager=manager;window.statistics=statistics;window.finance=finance;window.events=events;creator()})();</script></body></html>
