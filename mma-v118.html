<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V118</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="game" src="./mma-v111.html?v=118"></iframe><script>(function(){'use strict';const f=document.getElementById('game'),KEY='mmaCareerV111';let modalOpen=false,offer=null;const camps=[{name:'Reykjavík Fight Lab',days:10,cost:1200,desc:'Lokalny camp. Kondycja + szybkość.'},{name:'WCA Fight Team',days:14,cost:3500,desc:'Mocny przekrojowy camp. Boks + BJJ.'},{name:'ANKOS MMA',days:14,cost:4200,desc:'Dużo zapasów i pracy pod klatką.'},{name:'American Top Team',days:21,cost:12000,desc:'Pełny profesjonalny camp. Wszystkie główne obszary.'}];function W(){return f.contentWindow}function D(){return f.contentDocument}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}}function close(){const d=D();const m=d&&d.getElementById('modal');if(m)m.style.display='none';modalOpen=false}function show(title,head,body,buttons){const d=D();if(!d)return;const m=d.getElementById('modal'),mc=d.getElementById('mc');if(!m||!mc)return;d.getElementById('mt').textContent=title;d.getElementById('mh').textContent=head;d.getElementById('mb').innerHTML=body;mc.innerHTML='';buttons.forEach(x=>{const b=d.createElement('button');b.className='option';b.innerHTML=x[0];b.addEventListener('click',x[1]);mc.appendChild(b)});m.style.display='flex';modalOpen=true}function acceptFight(){const s=read();if(!s||!offer)return;close();setTimeout(()=>chooseCamp(),50)}function rejectFight(){const s=read();if(!s||!offer)return;s.log=s.log||[];s.log.push('❌ Odrzucono ofertę walki z '+offer.opp+'.');write(s);offer=null;close();W().dashboard()}function fightOffer(){const s=read();if(!s||s.fight)return;const names=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk'];const opp=names[Math.floor(Math.random()*names.length)];const org=W().league();const purse=2500+(s.rep||0)*150+(s.w||0)*450;offer={opp,org,purse};show('EVENT · OFERTA WALKI','📩 TELEFON OD MATCHMAKERA',`<p>Propozycja walki: <b>${opp}</b></p><p>Organizacja: <b>${org}</b></p><p>Gaża: <b>${Math.round(purse).toLocaleString('pl-PL')} zł</b></p><p class="muted">Akceptacja przenosi Cię do wyboru obozu przygotowawczego.</p>`,[['🥊 PRZYJMIJ WALKĘ',acceptFight],['❌ ODRZUĆ WALKĘ',rejectFight]])}function chooseCamp(){if(!offer)return;show('EVENT · CAMP PRZYGOTOWAWCZY','🏕️ WYBIERZ OBÓZ',`<p>Rywal: <b>${offer.opp}</b> · ${offer.org}</p><p>Wybierz camp. Cena i długość wpływają na termin walki i upływ czasu kariery.</p>`,camps.map((c,i)=>[`🏋️ <b>${c.name}</b><br>${c.days} dni · ${c.cost.toLocaleString('pl-PL')} zł<br><small>${c.desc}</small>`,()=>acceptCamp(i)]))}function acceptCamp(i){const s=read(),c=camps[i];if(!s||!offer)return;if((s.money||0)<c.cost){alert('Za mało pieniędzy na ten camp.');return}const start=s.day+1;const date=start+c.days;const sk=s.sk||{};sk.Kondycja=Math.min(100,(sk.Kondycja||50)+Math.round(c.days/5));sk.Boks=Math.min(100,(sk.Boks||50)+Math.round(c.days/8));sk.Zapasy=Math.min(100,(sk.Zapasy||50)+Math.round(c.days/9));sk.BJJ=Math.min(100,(sk.BJJ||50)+Math.round(c.days/9));s.sk=sk;s.money-=c.cost;s.fight={opponent:offer.opp,league:offer.org,purse:offer.purse,date,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0},camp:c.name,campStart:start,campDays:c.days,comment:'JURAS: Camp wybrany. Teraz najważniejsze — zdrowie, dyscyplina i dobrze zaplanowany szczyt formy.'};s.log=s.log||[];s.log.push(`🏕️ Wybrano ${c.name} (${c.days} dni) za ${c.cost.toLocaleString('pl-PL')} zł. Walka z ${offer.opp} została zaplanowana na dzień ${date}.`);write(s);offer=null;close();W().dashboard()}function continueCareer(){const s=read();if(!s||!s.created){W().creator();return}if(modalOpen)return;if(s.fight&&s.day>=s.fight.date){W().startFight();return}for(let i=0;i<365;i++){s.day++;if(s.day%365===0)s.age++;s.money=Math.max(0,(s.money||0)-200);if(s.fight&&s.day>=s.fight.date){write(s);W().dashboard();setTimeout(()=>W().startFight(),50);return}if(!s.fight&&s.day%10===0){write(s);fightOffer();return}if((s.ig||0)>=1000&&s.day%17===0){write(s);socialEvent();return}if(!s.manager&&(s.ig||0)>=5000&&s.day%7===0){write(s);managerEvent();return}}write(s);W().dashboard()}function socialEvent(){show('EVENT · SOCIAL MEDIA','💬 ZACZEPKA','<p><b>„Widziałem ostatnią walkę. Dużo gadania, mało roboty. Może czas to sprawdzić?”</b></p>',[['🥊 Sportowa kontra',()=>react(2,250,'Sportowa kontra')],['😂 Żart i szpilka',()=>react(3,500,'Żartobliwa kontra')],['🔥 Mocny callout',()=>react(5,800,'Mocny callout')],['🙏 Odpowiedź z klasą',()=>react(2,200,'Odpowiedź z klasą')]])}function react(rep,ig,text){const s=read();s.rep=Math.min(100,(s.rep||0)+rep);s.ig=(s.ig||0)+ig;s.log=s.log||[];s.log.push('📱 '+text);write(s);close();W().dashboard()}function managerEvent(){const s=read();if(!s||s.manager||s.ig<5000)return;show('EVENT · MENEDŻER','🤝 OFERTA REPREZENTACJI','Masz ponad 5 000 obserwujących. Podpisanie jest jednorazowe.',[['10% · lokalni sponsorzy',()=>sign('Marek Kowalski Management',10)],['15% · sponsorzy + media + matchmaking',()=>sign('North Fight Management',15)],['20% · duże marki + pełny management',()=>sign('Elite Combat Group',20)]])}function sign(name,fee){const s=read();s.manager={name,fee};s.log=s.log||[];s.log.push('💼 Podpisano managera: '+name+' ('+fee+'%).');write(s);close();W().dashboard()}function install(){try{const d=D(),s=read();if(!d)return;if(!s||!s.created){if(!d.getElementById('fn')){try{localStorage.removeItem(KEY)}catch(e){}f.src='./mma-v111.html?v=118new'+Date.now()}return}const top=d.querySelector('.main .top');if(!top)return;let b=d.getElementById('v118Continue');if(!b){b=d.createElement('button');b.id='v118Continue';b.className='primary';b.textContent='▶ KONTYNUUJ DO NASTĘPNEGO EVENTU';b.style.cssText='margin-left:auto;font-size:15px;padding:13px 18px;white-space:nowrap';top.appendChild(b)}b.style.display=s.screen==='dashboard'?'inline-block':'none';b.onclick=continueCareer}catch(e){}}f.addEventListener('load',()=>setTimeout(install,150));setInterval(install,700)})();</script></body></html>
