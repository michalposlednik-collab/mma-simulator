<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V93</title><style>body{margin:0;background:#071017;color:#eef3f5;font:14px Arial}*{box-sizing:border-box}button{cursor:pointer}.wrap{min-height:100vh;padding:24px;background:radial-gradient(circle at 15% 0,#174156,#05090d 65%)}.card,.panel{background:#0d1922;border:1px solid #294653;border-radius:16px;box-shadow:0 18px 55px #0008}.card{max-width:1100px;margin:auto;padding:28px}.gold{color:#d7b258}.muted{color:#8fa1aa}.field{margin:14px 0}.field label{display:block;font-size:11px;color:#9aabb4;margin-bottom:6px}.field input{width:100%;padding:13px;background:#071017;color:#fff;border:1px solid #294653;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.budget{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:13px;background:#101e27;border:1px solid #294653;border-radius:9px;cursor:pointer;min-height:72px}.pick:checked+label{border-color:#d7b258;background:#211f15}.pick+label small{display:block;color:#91a1a9;margin-top:5px;line-height:1.35}.btn{padding:11px 15px;background:#12232d;color:#fff;border:1px solid #45606d;border-radius:8px}.primary{background:#80672e;border-color:#d7b258;font-weight:bold}.layout{display:grid;grid-template-columns:215px 1fr;min-height:100vh}.side{background:#060c12;border-right:1px solid #203642;padding:12px}.side button{width:100%;margin:4px 0;padding:12px;text-align:left;background:#0b151d;color:#c2cdd1;border:1px solid #203642;border-radius:8px}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:15px 0}.stat{padding:13px;background:#101e27;border:1px solid #263f4d;border-radius:10px}.stat small{color:#778b95}.stat strong{display:block;font-size:18px;margin-top:6px}.dashgrid{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.hero{padding:23px;min-height:180px;background:radial-gradient(circle at 80% 0,#3a301a,#101a21 60%);border:1px solid #80672e;border-radius:16px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.tile{padding:15px;background:#101d26;border:1px solid #294653;border-radius:10px}.feed{padding:9px 0;border-bottom:1px solid #1d303a}.bar{height:7px;background:#1c2c34;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#3dc982}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:100;padding:18px}.modalbox{width:min(850px,95vw);max-height:90vh;overflow:auto;background:#0d1922;border:1px solid #d7b258;border-radius:18px;padding:26px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#183d4d,#05090d 68%)}.fighthead{max-width:1100px;margin:auto;display:flex;justify-content:space-between}.arena{max-width:1100px;margin:15px auto;display:grid;grid-template-columns:1fr 170px 1fr;gap:12px;align-items:center}.fighter{padding:16px;background:#0b171f;border:1px solid #294653;border-radius:12px;text-align:center}.hp{height:13px;background:#35191e;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#3dc982;transition:.3s}.opp i{background:#df5965}.clock{width:140px;height:140px;border:7px solid #d7b258;border-radius:50%;display:grid;place-items:center;margin:auto}.time{font:700 28px monospace}.comment{max-width:1100px;height:190px;overflow:auto;margin:12px auto;background:#050c11;border:1px solid #294653;border-radius:10px;padding:10px}.comment p{margin:0;padding:7px;border-bottom:1px solid #172a34}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{padding:12px;min-height:58px;background:#101f29;color:#fff;border:1px solid #294653;border-radius:9px}.wheel{position:relative;width:290px;height:290px;margin:18px auto}.disk{width:290px;height:290px;border-radius:50%;background:conic-gradient(#36c77b 0 8%,#d84f5b 8% 16%,#36c77b 16% 24%,#d84f5b 24% 32%,#36c77b 32% 40%,#d84f5b 40% 48%,#36c77b 48% 56%,#d84f5b 56% 64%,#36c77b 64% 72%,#d84f5b 72% 80%,#36c77b 80% 88%,#d84f5b 88%);border:7px solid #65747d;transition:transform 1.9s cubic-bezier(.12,.75,.08,1)}.pointer{position:absolute;z-index:2;top:-25px;left:50%;transform:translateX(-50%);font-size:30px}@media(max-width:900px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.main{padding:15px}.stats,.grid,.budget,.dashgrid,.tiles{grid-template-columns:1fr 1fr}.arena{grid-template-columns:1fr}.clock{order:-1}.acts{grid-template-columns:1fr 1fr}}@media(max-width:600px){.stats,.grid,.budget,.tiles,.choices,.acts{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>(()=>{const A=document.getElementById('app');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:'Talent, refleks, potencjał.',Bijok:'Twarda głowa, presja, chaos.',Fizol:'Siła, klincz, brutalność.',Zapaśnik:'Obalenia, kontrola, siatka.',Striker:'Boks, kopnięcia, nokauty.',Gumiarz:'BJJ, garda, poddania.',Allrounder:'Równy rozwój MMA.'};const BUD=[[5000,'Normalny etat','Trening po pracy.'],[10000,'Etat + oszczędności','Trochę oddechu.'],[25000,'Rodzina pomaga','Możesz inwestować.'],[50000,'Bogata rodzina','Dobre obozy na start.'],[100000,'Rodzinny biznes','Mocne zaplecze i oczekiwania.']];let s={day:1,age:18,ig:100,rep:5,mot:55,money:10000,w:0,l:0,d:0,weight:'Middleweight',type:'',first:'',last:'',gym:'Lokalny klub',fight:null,sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},log:[]};function creator(){A.innerHTML='<div class="wrap"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do UFC. Twoje decyzje budują karierę.</p><div class="field"><label>IMIĘ *</label><input id="fn"></div><div class="field"><label>NAZWISKO *</label><input id="ln"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.entries(TYPES).map((x,i)=>'<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x[0]+'"><label for="t'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><h3>BUDŻET</h3><div class="budget">'+BUD.map((x,i)=>'<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'" '+(i===1?'checked':'')+'><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' ISK</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>').join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.entries(KG).map((x,i)=>'<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x[0]+'"><label for="w'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><br><button id="start" class="btn primary">STWÓRZ KARIERĘ →</button></div></div>';document.getElementById('start').onclick=start}function start(){const f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.first=f;s.last=l;s.type=t.value;s.money=+b.value;s.weight=w.value;s.log=['🥊 Kariera rozpoczęta. Czas zbudować nazwisko.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance(1)">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fightHub()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="stats()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){A.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button class="btn" onclick="advance(1)">＋ 1 DZIEŃ</button> <button class="btn primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><strong>'+s.w+'-'+s.l+'-'+s.d+'</strong></div><div class="stat"><small>INSTAGRAM</small><strong>'+s.ig.toLocaleString()+'</strong></div><div class="stat"><small>REPUTACJA</small><strong>'+s.rep+'/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>'+s.mot+'/100</strong></div><div class="stat"><small>BUDŻET</small><strong>'+s.money.toLocaleString()+' ISK</strong></div><div class="stat"><small>WIEK</small><strong>'+s.age+'</strong></div></div><div class="dashgrid"><section><div class="hero"><small class="gold">NASTĘPNY KROK</small><h2>'+ (s.fight?'OBÓZ PRZYGOTOWAWCZY':'ZNAJDŹ SWOJĄ DROGĘ')+'</h2><p>'+ (s.fight?'Masz przyjętą walkę. Trenuj i odpoczywaj — druga walka nie może zostać przyjęta przed zakończeniem tej.':'Buduj reputację, rozwijaj skille i poluj na pierwszą ofertę.')+'</p><div class="tiles"><div class="tile"><b>Klub</b><br>'+s.gym+'</div><div class="tile"><b>Najlepsza umiejętność</b><br>'+best()+'</div><div class="tile"><b>Poziom kariery</b><br>'+level()+'</div></div></div><div class="panel"><h3>📰 OŚ CZASU</h3>'+s.log.slice(0,14).map(x=>'<div class="feed">'+x+'</div>').join('')+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+Object.entries(s.sk).map(x=>'<div class="feed"><b>'+x[0]+'</b> '+x[1]+'<div class="bar"><i style="width:'+x[1]+'%"></i></div></div>').join('')+'</div><div class="panel"><h3>🗺️ ŚCIEŻKA</h3>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map((x,i)=>'<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'✅':'🔒')+' '+x+'</div>').join('')+'</div></aside></div></main></div>'}function best(){return Object.entries(s.sk).sort((a,b)=>b[1]-a[1])[0][0]}function level(){if(s.rep>=80)return'UFC';if(s.rep>=65)return'PFL';if(s.rep>=50)return'Cage Warriors';if(s.rep>=35)return'OKTAGON';if(s.rep>=20)return'KSW';return'lokalne gale'}function advance(n){for(let i=0;i<n;i++){s.day++;if(s.day%365===0)s.age++}s.log.unshift('📅 Minął dzień '+s.day+'.');dashboard()}function nextEvent(){advance(1);if(s.fight){modal('DZIEŃ OBOZU','Masz zakontraktowaną walkę. Dzisiaj możesz trenować albo odpocząć.',[['TRENING',()=>training()],['ODPOCZYNEK',()=>{s.mot=Math.min(100,s.mot+3);dashboard()}]]);return}const r=Math.random();if(r<.4)modal('PROPOZYCJA WALKI','Promotor oferuje lokalną walkę. Przyjęcie blokuje kolejne oferty aż do zakończenia pojedynku.',[['PRZYJMUJĘ WALKĘ',()=>{s.fight={opponent:['Marek „Kosa” Nowak','Paweł „Beton” Zieliński','Igor „Kret” Wrona'][Math.floor(Math.random()*3)],days:21};s.log.unshift('🏆 Przyjęto walkę z '+s.fight.opponent+'. Okres przygotowawczy: 21 dni.');dashboard()}],['ODRZUCAM',()=>dashboard()]]);else if(r<.7)modal('EVENT MEDIALNY','Na gali spotykasz Mameda Khalidova. Masz trzy sekundy na decyzję.',[['ZDJĘCIE + MUZYKA',()=>{s.ig+=1000;s.rep+=2;s.log.unshift('🔥 Zdjęcie z Mamedem + muzyka „Eta Kaukaz” poszło viralem. +1000 IG.');dashboard()}],['UDASZ, ŻE NIE POZNAJESZ',()=>{s.ig+=600;s.log.unshift('😂 Udajesz, że nie rozpoznajesz Mameda. Internet oszalał. +600 IG.');dashboard()}]]);else modal('MEDIA','Juras wrzuca fragment Twojej akcji z treningu.',[['UDOSTĘPNIAM',()=>{s.ig+=250;s.rep++;s.log.unshift('📱 Fragment treningu rozniósł się po Instagramie.');dashboard()}],['NIC NIE ROBIĘ',()=>dashboard()]])}function modal(title,text,bs){document.getElementById('modal')?.remove();const d=document.createElement('div');d.id='modal';d.className='modal';d.innerHTML='<div class="modalbox"><small class="gold">EVENT KARIERY</small><h1>'+title+'</h1><p style="font-size:17px">'+text+'</p><div class="choices"></div></div>';document.body.appendChild(d);bs.forEach(x=>{const b=document.createElement('button');b.className='btn primary';b.textContent=x[0];b.onclick=()=>{d.remove();x[1]()};d.querySelector('.choices').appendChild(b)})}function training(){modal('CENTRUM TRENINGOWE','Wybierz sposób rozwoju. Płatne obozy wymagają pieniędzy i reputacji.',[['LOKALNY KLUB · +1 BOKS',()=>{s.sk.Boks=Math.min(100,s.sk.Boks+1);s.mot=Math.min(100,s.mot+2);dashboard()}],['ADT · 3000 ISK · +3 ZAPASY',()=>{if(s.money<3000)return alert('Za mało pieniędzy.');s.money-=3000;s.sk.Zapasy=Math.min(100,s.sk.Zapasy+3);s.log.unshift('🥋 Obóz ADT: +3 zapasy.');dashboard()}],['ANKOS · 6000 ISK · REP 15 · +6 ZAPASY',()=>{if(s.money<6000||s.rep<15)return alert('Potrzebujesz 6000 ISK i 15 reputacji.');s.money-=6000;s.sk.Zapasy=Math.min(100,s.sk.Zapasy+6);s.sk.Kondycja=Math.min(100,s.sk.Kondycja+2);s.log.unshift('🥋 ANKOS: +6 zapasy, +2 kondycja.');dashboard()}],['BJJ CAMP · 5000 ISK · +5 BJJ',()=>{if(s.money<5000)return alert('Za mało pieniędzy.');s.money-=5000;s.sk.BJJ=Math.min(100,s.sk.BJJ+5);s.log.unshift('🥋 BJJ Camp: +5 BJJ.');dashboard()}]])}function fightHub(){if(!s.fight){modal('WALKI','Nie masz aktywnej walki. Przejdź do „Następny event”, aby otrzymać ofertę.',[['OK',()=>dashboard()]]);return}modal('AKTYWNA WALKA','Rywal: '+s.fight.opponent+' · przygotowanie: '+s.fight.days+' dni.',[['TRENUJ',()=>training()],['PRZESUŃ DZIEŃ',()=>{s.fight.days--;advance(1);if(s.fight.days<=0)startFight()}],['START WALKI',()=>{if(s.fight.days>0)alert('Najpierw zakończ okres przygotowawczy.');else startFight()}]])}function startFight(){const opp=s.fight.opponent;A.innerHTML='<div class="fight"><div class="fighthead"><b>'+s.first+' '+s.last+'</b><b>Runda <span id="rnd">1</span>/3</b><b>'+opp+'</b></div><div class="arena"><div class="fighter"><h2>'+s.first+'</h2><div class="hp"><i id="mh" style="width:100%"></i></div></div><div class="clock"><div class="time" id="clock">5:00</div></div><div class="fighter"><h2>'+opp+'</h2><div class="hp opp"><i id="eh" style="width:100%"></i></div></div></div><div class="comment" id="comments"></div><div class="acts">'+['Jab / low kick','Presja pod siatką','Obalenie','High kick','Spinning backfist','Latające kolano','Łokieć','Balacha / trójkąt'].map(x=>'<button class="act" onclick="fightAction(\''+x+'\')">'+x+'</button>').join('')+'</div></div>';window.fightState={sec:0,round:1,me:100,enemy:100,opp:opp};addComment('JURAS: Zaczynamy. Zawodnicy badają dystans.');window.ft=setInterval(()=>{const f=window.fightState;if(!f)return;f.sec++;if(f.sec>=300){if(f.round<3){f.round++;f.sec=0;addComment('JURAS: Koniec rundy. Narożnik ma robotę.')}else endFight('decision')}renderFight()},250)}function addComment(t){const c=document.getElementById('comments');if(c){const p=document.createElement('p');p.textContent=t;c.prepend(p)}}function renderFight(){const f=window.fightState;if(!f)return;document.getElementById('rnd').textContent=f.round;const left=300-f.sec;document.getElementById('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');document.getElementById('mh').style.width=f.me+'%';document.getElementById('eh').style.width=f.enemy+'%'}window.fightAction=function(a){const f=window.fightState;if(!f)return;if(/High|Spinning|Latające|Łokieć|Balacha|trójkąt/.test(a)){showWheel(a);return}let impact=Math.random()*8;let line='JURAS: Dobra wymiana, zawodnicy pracują.';if(a==='Obalenie'){impact+=5;line='JURAS: Próba wejścia w nogi! Jest kontrola przy siatce.'}if(a.includes('Presja')){impact+=3;line='JURAS: Presja rośnie, rywal nie ma miejsca na oddech.'}f.enemy=Math.max(0,f.enemy-impact);f.me=Math.max(5,f.me-Math.random()*3);addComment(line);renderFight();if(f.enemy<=0)endFight('tko')};function showWheel(a){const ok=Math.random()<.55,d=document.createElement('div');d.className='modal';d.innerHTML='<div class="modalbox" style="text-align:center"><h2>'+a+'</h2><p>Moment specjalny — powodzenie zależy od timingu.</p><div class="wheel"><span class="pointer">▼</span><div class="disk" id="disk"></div></div><h2 id="wr">LOSOWANIE...</h2></div>';document.body.appendChild(d);requestAnimationFrame(()=>document.getElementById('disk').style.transform='rotate('+(1800+(ok?Math.random()*360:180+Math.random()*360))+'deg)');setTimeout(()=>{document.getElementById('wr').textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';if(ok){window.fightState.enemy=Math.max(0,window.fightState.enemy-18);addComment(/High|Latające|Spinning/.test(a)?'JURAS: ŁOOOO! Ależ weszła ta technika!':'JURAS: Ooo, bardzo dobra akcja!');renderFight();if(window.fightState.enemy<=0){d.remove();endFight('ko');return}}else addComment('JURAS: Nie siadło. Rywal zdążył się wycofać.');setTimeout(()=>d.remove(),900)},2100)}function endFight(type){clearInterval(window.ft);const win=type!=='decision'||Math.random()>.25;s.fight=null;if(win){s.w++;s.rep+=type==='decision'?3:5;s.ig+=type==='decision'?100:300;s.log.unshift('🏆 Zwycięstwo: '+(type==='decision'?'decyzja':type==='ko'?'KO':'TKO')+'.')}else{s.l++;s.log.unshift('❌ Porażka decyzją.')}modal('KONIEC WALKI',win?'JURAS: Koniec! Twoja ręka idzie w górę.':'JURAS: Sędziowie wskazali rywala.',[['WRÓĆ DO DASHBOARDU',()=>dashboard()]])}function career(){modal('ŚCIEŻKA KARIERY','Lokalne gale → Hybrid/Babylon/FEN → KSW → OKTAGON → Cage Warriors → PFL → UFC.',[['OK',()=>dashboard()]])}function media(){modal('MEDIA','Instagram: '+s.ig.toLocaleString('pl-PL')+' · reputacja: '+s.rep+'. Virale i wywiady wpływają na oferty.',[['OK',()=>dashboard()]])}function manager(){modal('MENEDŻER KARIERY','Kontrakty, sponsorzy, negocjacje i federacje. Jedna aktywna walka na raz.',[['OK',()=>dashboard()]])}function stats(){modal('STATYSTYKI',Object.entries(s.sk).map(x=>x[0]+': '+x[1]).join('<br>')+'<br><br>Rekord: '+s.w+'-'+s.l+'-'+s.d,[['OK',()=>dashboard()]])}function events(){modal('KALENDARZ EVENTÓW','Dzień '+s.day+'. Eventy zatrzymują symulację i dają Ci realny wybór.',[['OK',()=>dashboard()]])}creator()})();</script></body></html>
