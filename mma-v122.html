<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V122</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99999;padding:18px}.box{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#101c25;color:#eef3f5;border:1px solid #d6ae51;border-radius:18px;padding:24px;font:15px Arial,sans-serif}.gold{color:#d6ae51}.muted{color:#91a3ac}.camp{display:block;width:100%;margin:9px 0;padding:15px;background:#142833;color:#fff;border:1px solid #526873;border-radius:10px;text-align:left;cursor:pointer}.camp:hover{border-color:#d6ae51}.camp:disabled{opacity:.45;cursor:not-allowed}.error{color:#df5045;font-weight:700}</style></head><body><iframe id="game" title="MMA Career Simulator"></iframe><div id="overlay" class="overlay"><div class="box"><small class="gold">EVENT · PRZYGOTOWANIE DO WALKI</small><h1>Zaakceptowano ofertę</h1><div id="details"></div><h2>Wybierz obóz przygotowawczy</h2><p class="muted">Wybór campu rozpoczyna przygotowania. Koszt zostanie pobrany od razu, a termin walki zostanie wpisany do kalendarza.</p><div id="camps"></div><button id="cancel">ANULUJ</button></div></div><script>(function(){'use strict';
const KEY='mmaCareerV111',frame=document.getElementById('game'),overlay=document.getElementById('overlay'),details=document.getElementById('details'),campsBox=document.getElementById('camps');
const camps=[['Reykjavík Fight Lab',10,1200,'Kondycja + szybkość'],['WCA Fight Team',14,3500,'Boks + BJJ'],['ANKOS MMA',14,4200,'Zapasy + praca pod klatką'],['American Top Team',21,12000,'Pełny profesjonalny camp']];
let opened=false,offer=null;
function getState(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function putState(s){localStorage.setItem(KEY,JSON.stringify(s))}
function clean(t){return String(t||'').replace(/\s+/g,' ').trim()}
function esc(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function extract(){const d=frame.contentDocument,s=getState();let text='';let modal=null;try{modal=d&&d.getElementById('modal');text=modal?clean(modal.innerText):''}catch(e){}let opp=s&&s.fight&&s.fight.opponent?s.fight.opponent:'Nieznany rywal';let org=s&&s.fight&&s.fight.league?s.fight.league:'Lokalna gala';let purse=s&&s.fight&&s.fight.purse?s.fight.purse:2500;let m=text.match(/(?:RYWAL|PRZECIWNIK)\s*[:\-]\s*([^\n]+)/i);if(m)opp=clean(m[1]);let o=text.match(/(?:ORGANIZACJA|GALA)\s*[:\-]\s*([^\n]+)/i);if(o)org=clean(o[1]);let p=text.match(/([0-9][0-9 .]*)\s*(?:zł|PLN)/i);if(p)purse=parseInt(p[1].replace(/[ .]/g,''),10)||purse;return{opp,org,purse}}
function showCamp(){if(opened)return;opened=true;offer=extract();details.innerHTML='<p><b>'+esc(offer.opp)+'</b> · '+esc(offer.org)+'</p><p>Gaża za walkę: <b>'+Number(offer.purse).toLocaleString('pl-PL')+' zł</b></p>';campsBox.innerHTML='';camps.forEach((c,i)=>{const b=document.createElement('button');b.className='camp';b.innerHTML='<b>'+esc(c[0])+'</b><br>'+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł<br><small>'+esc(c[3])+'</small>';b.addEventListener('click',()=>acceptCamp(i));campsBox.appendChild(b)});overlay.style.display='flex';try{const m=frame.contentDocument.getElementById('modal');if(m)m.style.display='none'}catch(e){}}
function acceptCamp(i){const s=getState(),c=camps[i];if(!s||!s.created){alert('Brak aktywnej kariery.');return}if(Number(s.money||0)<c[2]){alert('Za mało pieniędzy na ten camp.');return}const date=Number(s.day||1)+c[1]+1;s.money-=c[2];s.fight={opponent:offer.opp,league:offer.org,purse:Number(offer.purse||2500),date,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0},camp:c[0],campDays:c[1],comment:'JURAS: Camp wybrany. Teraz robimy robotę.'};s.log=s.log||[];s.log.push('🏕️ '+c[0]+' · '+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł. Walka z '+offer.opp+' zaplanowana na dzień '+date+'.');putState(s);overlay.style.display='none';opened=false;offer=null;try{const w=frame.contentWindow;Object.assign(w.s,{money:s.money,fight:s.fight,log:s.log});if(typeof w.save==='function')w.save();if(typeof w.dashboard==='function')w.dashboard();else frame.src='./mma-v111.html?v=122refresh&x='+Date.now()}catch(e){frame.src='./mma-v111.html?v=122refresh&x='+Date.now()}}
function isFightOfferModal(){try{const d=frame.contentDocument,m=d&&d.getElementById('modal');if(!m||getComputedStyle(m).display==='none')return false;const t=clean(m.innerText).toUpperCase();return /OFERTA WALKI|WALKA|RYWAL|PRZECIWNIK/.test(t)&&![...m.querySelectorAll('button')].every(b=>/PÓŹNIEJ|POZNEJ|ZAMKNIJ|ANULUJ/i.test(clean(b.innerText)))}catch(e){return false}}
function hook(){try{const d=frame.contentDocument;if(!d||!d.body)return;if(!d.__v122Capture){d.__v122Capture=true;d.addEventListener('click',function(ev){if(!isFightOfferModal())return;const b=ev.target.closest&&ev.target.closest('button');if(!b)return;const txt=clean(b.innerText).toUpperCase();if(/ODRZU|NIE|PÓŹNIEJ|POZNEJ|ZAMKNIJ|ANULUJ/.test(txt))return;ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();showCamp()},true)}if(isFightOfferModal()&&!opened){const m=d.getElementById('modal');if(m&&!m.__v122Scan){m.__v122Scan=true;[...m.querySelectorAll('button')].forEach(b=>{const txt=clean(b.innerText).toUpperCase();if(!/ODRZU|NIE|PÓŹNIEJ|POZNEJ|ZAMKNIJ|ANULUJ/.test(txt)){b.addEventListener('click',function(ev){ev.preventDefault();ev.stopImmediatePropagation();showCamp()},true)}})}}}catch(e){}}
function start(){frame.src='./mma-v111.html?v=122base&x='+Date.now()}
frame.addEventListener('load',()=>{setTimeout(hook,30);setTimeout(hook,300);setTimeout(hook,1000)});setInterval(hook,500);document.getElementById('cancel').onclick=()=>{overlay.style.display='none';opened=false;offer=null};start();
})();</script></body></html>
