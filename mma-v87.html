<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator — V87</title><style>*{box-sizing:border-box}body{margin:0;background:#050a0f;color:#eef2f4;font:14px Arial,sans-serif}button,input{font:inherit}.screen{min-height:100vh;padding:28px;background:radial-gradient(circle at 20% 5%,#173b4d,#050a0f 55%)}.card,.panel{background:#0c171f;border:1px solid #294352;border-radius:16px;box-shadow:0 15px 50px #0008}.card{max-width:1150px;margin:auto;padding:30px}.brand{font-size:29px;font-weight:900;letter-spacing:1px}.brand span,.gold{color:#d5ad4e}.muted{color:#82949e}.field{margin:16px 0}.field label{display:block;color:#9aaab2;font-size:11px;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:9px;border:1px solid #294554;background:#071017;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:15px;border:1px solid #294554;background:#101e27;border-radius:10px;cursor:pointer;min-height:88px}.pick:checked+label{border-color:#d5ad4e;background:#211f15}.pick+label small{display:block;color:#83949d;margin-top:7px;line-height:1.4}.budget{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{padding:11px 16px;border-radius:9px;border:1px solid #405866;background:#101f29;color:#fff;cursor:pointer}.btn:hover{border-color:#d5ad4e}.primary{background:#80662b;border-color:#d5ad4e;font-weight:800}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#060c12;border-right:1px solid #1d3440;padding:15px}.side button{width:100%;margin:4px 0;text-align:left;background:transparent;border:1px solid transparent;color:#9aabb4;padding:12px;border-radius:8px;cursor:pointer}.side button:hover,.side button.active{border-color:#6d592e;color:#e2bd5b;background:#111a20}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{color:#d5ad4e;font-size:10px;font-weight:900;letter-spacing:2px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:15px 0}.stat{padding:15px;background:linear-gradient(145deg,#101d26,#091218);border:1px solid #263f4d;border-radius:11px}.stat small{color:#718692}.stat strong{display:block;font-size:20px;margin-top:8px}.cols{display:grid;grid-template-columns:1.6fr .8fr;gap:12px}.panel{padding:17px;margin-bottom:12px}.hero{min-height:220px;padding:24px;border-radius:16px;border:1px solid #80662d;background:radial-gradient(circle at 80% 0,#332b18,#101a21 55%)}.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.tabs button{padding:11px 6px;background:#0d1921;border:1px solid #294352;color:#9aacb4;border-radius:8px;cursor:pointer}.tabs button.active{color:#e4c267;border-color:#9a7933;background:#191a15}.feed{padding:11px 0;border-bottom:1px solid #192d38}.bar{height:9px;background:#1a2931;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#3dca84}.alert{position:fixed;inset:0;background:#020609dd;z-index:500;display:grid;place-items:center;padding:20px}.alertbox{width:min(850px,94vw);background:#0c171f;border:1px solid #d5ad4e;border-radius:18px;padding:28px;box-shadow:0 30px 100px #000;text-align:left;animation:pop .25s}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choicegrid button{padding:15px;text-align:left}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#173a4d,#050b10 60%)}.fighters{max-width:1150px;margin:18px auto;display:grid;grid-template-columns:1fr 210px 1fr;gap:16px;align-items:center;text-align:center}.fighter{padding:18px;background:#0b161f;border:1px solid #2a4656;border-radius:12px}.hp{height:14px;background:#2b171b;border-radius:5px;overflow:hidden}.hp i{display:block;height:100%;background:#42cf85;transition:.45s}.opp i{background:#e25b66}.clock{width:170px;height:170px;border:8px solid #d5ad4e;border-radius:50%;display:grid;place-items:center;margin:auto;background:#081117}.time{font:700 29px monospace}.comment{max-width:1150px;height:245px;overflow:auto;margin:12px auto;background:#050c11;border:1px solid #294352;border-radius:10px;padding:12px}.comment p{padding:7px 0;margin:0;border-bottom:1px solid #172a35}.acts{max-width:1150px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{min-height:70px;text-align:left;background:#101f29;border:1px solid #294554;color:#fff;border-radius:9px;padding:11px;cursor:pointer}.act small{display:block;color:#d5ad4e;margin-top:5px}.overlay{position:fixed;inset:0;background:#000d;z-index:600;display:grid;place-items:center}.wheelbox{width:min(520px,94vw);padding:25px;text-align:center;background:#0c171f;border:1px solid #d5ad4e;border-radius:18px}.wheelwrap{position:relative;width:300px;height:300px;margin:18px auto}.wheel{width:300px;height:300px;border-radius:50%;background:conic-gradient(#35c77b 0 8%,#d94d5b 8% 16%,#35c77b 16% 24%,#d94d5b 24% 32%,#35c77b 32% 40%,#d94d5b 40% 48%,#35c77b 48% 56%,#d94d5b 56% 64%,#35c77b 64% 72%,#d94d5b 72% 80%,#35c77b 80% 88%,#d94d5b 88%);border:7px solid #65747d;transition:transform 2.3s cubic-bezier(.12,.75,.08,1);box-shadow:0 20px 50px #000}.pointer{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:31px;color:#fff;z-index:2;text-shadow:0 2px 5px #000}.result{font-size:23px;font-weight:900;min-height:30px}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.tabs{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:130px}.grid,.cols,.fighters,.acts,.budget{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.clock{order:-1}}@media(max-width:600px){.grid,.stats,.cols,.acts,.budget,.choicegrid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="app"></div><script>const A=document.getElementById('app');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:['Młody talent, szybkość i potencjał.','Najlepszy rozwój szybkości i kondycji.'], 'Osiedlowy bijok':['Twardy charakter, presja i chaos.','Bonus do siły, odporności i agresji.'],Fizol:['Siła, klincz i brutalna presja.','Bonus do siły i zapasów.'],Zapaśnik:['Kontrola, obalenia i praca przy siatce.','Bonus do zapasów i grapplingu.'],Striker:['Czysta stójka i polowanie na nokaut.','Bonus do boksu i szybkości.'],Gumiarz:['BJJ, przetrwanie i polowanie na poddania.','Bonus do BJJ i grapplingu.'],Allrounder:['Równy rozwój całego MMA.','Brak słabych stron.']};const BUDGETS=[[5000,'Normalny etat','Zaczynasz od zera. Praca na pełen etat opłaca życie, a treningi robisz po godzinach.'],[10000,'Normalny etat + oszczędności','Trochę odłożonego kapitału. Możesz pozwolić sobie na pierwsze obozy i sprzęt.'],[25000,'Dobra robota / rodzina pomaga','Masz finansowy oddech i możesz szybciej wejść w poważny trening.'],[50000,'Bogata rodzina','Pieniądze nie są problemem. Możesz od początku inwestować w najlepszych ludzi.'],[100000,'Rodzinny biznes','Masz zaplecze finansowe, ale presja oczekiwań jest ogromna.']];let s={first:'',last:'',type:'',budget:10000,weight:'',day:1,age:18,ig:100,rep:5,mot:55,fat:8,w:0,l:0,d:0,sk:{boks:50,zapasy:50,bjj:50,grappling:50,kondycja:50,szybkosc:50,sila:50,odpornosc:50},logs:[],next:null,fight:null};function creator(){A.innerHTML='<div class="screen"><div class="card"><div class="brand">MMA <span>CAREER SIMULATOR</span></div><p class="muted">Zbuduj zawodnika od pierwszego treningu do największej gali.</p><div class="field"><label>IMIĘ *</label><input id="first" placeholder="np. Michał"></div><div class="field"><label>NAZWISKO *</label><input id="last" placeholder="np. Kowalski"></div><h3>TYP ZAWODNIKA *</h3><div class="grid">'+Object.entries(TYPES).map(([k,v],i)=>'<input class="pick" id="t'+i+'" name="type" type="radio" value="'+k+'"><label for="t'+i+'"><b>'+k+'</b><small>'+v[0]+'<br><span class="gold">'+v[1]+'</span></small></label>').join('')+'</div><h3>BUDŻET STARTOWY *</h3><div class="budget">'+BUDGETS.map((b,i)=>'<input class="pick" id="b'+i+'" name="budget" type="radio" value="'+b[0]+'" '+(i===1?'checked':'')+'><label for="b'+i+'"><b>'+b[0].toLocaleString('pl-PL')+' ISK</b><small><strong>'+b[1]+'</strong><br>'+b[2]+'</small></label>').join('')+'</div><h3>KATEGORIA WAGOWA *</h3><div class="grid">'+Object.entries(KG).map(([k,v],i)=>'<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+k+'"><label for="w'+i+'"><b>'+k+'</b><small>'+v+'</small></label>').join('')+'</div><br><button class="btn primary" onclick="start()">STWÓRZ KARIERĘ →</button></div></div>'}function start(){let f=document.getElementById('first').value.trim(),l=document.getElementById('last').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=budget]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w)return alert('Uzupełnij imię, nazwisko, typ, budżet i kategorię.');Object.assign(s,{first:f,last:l,type:t.value,budget:+b.value,weight:w.value,logs:['Kariera rozpoczęta.'],day:1});dashboard();eventScreen('NOWA KARIERA','Pierwszy dzień. Masz budżet '+s.budget.toLocaleString('pl-PL')+' ISK i całe MMA przed sobą.','PRZEJDŹ DO DASHBOARDU',()=>dashboard())}function side(){return '<aside class="side"><button class="active" onclick="dashboard()">⌂ Dashboard</button><button onclick="training()">🥊 Trening</button><button onclick="fightIntro()">🏆 Walki</button><button onclick="media()">📱 Media</button><button onclick="career()">📋 Kariera</button><button onclick="manager()">💼 Menedżer</button><button onclick="sh()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){A.innerHTML='<div class="layout">'+side()+'<main class="main"><div class="top"><div><div class="eyebrow">CENTRUM KARIERY</div><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><button class="btn primary" onclick="nextEvent()">⏩ PRZEWIŃ DO NASTĘPNEGO EVENTU</button></div><div class="stats"><div class="stat"><small>REKORD</small><strong>'+s.w+'-'+s.l+'-'+s.d+'</strong></div><div class="stat"><small>INSTAGRAM</small><strong>'+s.ig.toLocaleString()+'</strong></div><div class="stat"><small>REPUTACJA</small><strong>'+s.rep+'/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>'+s.mot+'/100</strong></div><div class="stat"><small>BUDŻET</small><strong>'+s.budget.toLocaleString()+' ISK</strong></div><div class="stat"><small>WIEK</small><strong>'+s.age+'</strong></div></div><div class="tabs"><button onclick="training()">Trening</button><button onclick="fightIntro()">Walka</button><button onclick="media()">Media</button><button onclick="career()">Kariera</button><button onclick="manager()">Menedżer</button><button onclick="sh()">Statystyki</button><button onclick="events()">Eventy</button><button onclick="nextEvent()">Następny event</button></div><div class="cols"><section><div class="hero"><div class="eyebrow">NAJBLIŻSZY MOMENT</div><h2>'+((s.next&&s.next.title)||'Czekasz na swoją szansę')+'</h2><p>'+((s.next&&s.next.text)||'Trening, media i budowanie reputacji otwierają kolejne drzwi.')+'</p><button class="btn primary" onclick="nextEvent()">OTWÓRZ EVENT</button></div><div class="panel"><h3>📰 OŚ CZASU KARIERY</h3>'+s.logs.slice(0,9).map(x=>'<div class="feed">'+x+'</div>').join('')+'</div></section><aside><div class="panel"><h3>📈 FORMA</h3><div class="feed">Zmęczenie: '+s.fat+'%</div><div class="bar"><i style="width:'+(100-s.fat)+'%"></i></div><div class="feed">Najlepsza umiejętność: '+best()+'</div></div><div class="panel"><h3>🎯 KARIERA</h3><div class="feed">Kolejny cel: debiut / kolejna walka</div><div class="feed">Media: '+s.ig+' obserwujących</div></div></aside></div></main></div>'}function best(){return Object.entries(s.sk).sort((a,b)=>b[1]-a[1])[0][0]}function eventScreen(title,text,button,fn,choices){let body=choices?'<div class="choicegrid">'+choices.map(c=>'<button class="btn" onclick="'+c[1]+'">'+c[0]+'</button>').join('')+'</div>':'<button class="btn primary" id="eventgo">'+button+'</button>';A.innerHTML='<div class="alert"><div class="alertbox"><div class="eyebrow">EVENT KARIERY</div><h1>'+title+'</h1><p style="font-size:18px;line-height:1.6">'+text+'</p>'+body+'</div></div>';if(fn){document.getElementById('eventgo').onclick=fn}}function nextEvent(){let r=Math.random();if(r<.2){s.next={title:'Zaproszenie na trening',text:'Doświadczony trener zaprasza Cię na dwutygodniowy obóz. Możesz poświęcić czas na konkretny element.'};eventScreen('ZAPROSZENIE NA TRENING','Masz dwa tygodnie przygotowań. Wybierz priorytet treningowy.',null,null,[['STÓJKA — + BOKS','trainCamp(\'boks\')'],['ZAPASY — + ZAPASY','trainCamp(\'zapasy\')'],['BJJ — + BJJ','trainCamp(\'bjj\')'],['KONDYCJA — + KONDYCJA','trainCamp(\'kondycja\')']])}else if(r<.4){s.next={title:'Zaproszenie na galę',text:'Organizator chce, żebyś pojawił się na wydarzeniu. Nie ma walki, ale jest okazja medialna.'};eventScreen('GALA','Promotor proponuje występ medialny. Możesz budować rozpoznawalność albo odpuścić.',null,null,[['IDĘ NA GALĘ','gala(1)'],['ODPUSZCZAM','gala(0)']])}else if(r<.58){s.next={title:'PROPOZYCJA WALKI',text:'Dostałeś konkretną ofertę walki. Masz czas na przygotowania.'};eventScreen('PROPOZYCJA WALKI','Promotor chce podpisać walkę. Bierzesz ją czy czekasz na lepszą ofertę?',null,null,[['BIORĘ WALKĘ','acceptFight()'],['ODMAWIAM','declineFight()']])}else if(r<.76){let names=['Mamed Khalidov','znany dziennikarz MMA','promotor lokalnej gali'];s.next={title:'SPOTKANIE NA EVENCIE',text:'Na wydarzeniu spotykasz '+names[Math.floor(Math.random()*names.length)]+'.';};eventScreen('SPOTKANIE','Masz chwilę na reakcję i możesz zbudować medialny moment.',null,null,[['ZDJĘCIE + MUZYKA ESKA KAFKAS','viral(100)'],['UDASZ, ŻE NIE ROZPOZNAJESZ','viral(180)'],['NORMALNIE SIĘ WITASZ','viral(25)']])}else{s.next={title:'MEDIA ZAUWAŻYŁY TWOJĄ AKCJĘ',text:'Krótki fragment treningu lub walki zaczyna krążyć w sieci.'};eventScreen('VIRAL','Twój klip zdobywa zainteresowanie. Wybierz reakcję.',null,null,[['WRZUCAM TO NA INSTAGRAM','viral(80)'],['ROBĘ Z TEGO ŻART','viral(130)'],['NIC NIE ROBIĘ','viral(10)']])}}function trainCamp(k){s.sk[k]=Math.min(99,s.sk[k]+8);s.fat=Math.min(70,s.fat+15);s.day+=14;s.logs.unshift('🥊 Dwutygodniowy obóz: +8 '+k+'.');s.next=null;dashboard()}function gala(x){if(x){s.ig+=60;s.rep+=2;s.logs.unshift('🎟️ Pojawiłeś się na gali. +60 IG, +2 reputacji.')}else s.logs.unshift('📅 Odpuściłeś galę.');s.next=null;dashboard()}function acceptFight(){s.logs.unshift('📨 Przyjąłeś propozycję walki.');s.next=null;fight()}function declineFight(){s.mot=Math.max(0,s.mot-3);s.logs.unshift('📨 Odrzuciłeś propozycję walki.');s.next=null;dashboard()}function viral(n){s.ig+=n;s.rep=Math.min(100,s.rep+Math.ceil(n/60));s.logs.unshift('🔥 Viral! +'+n+' obserwujących.');s.next=null;dashboard()}function training(){eventScreen('CENTRUM TRENINGOWE','Masz dostęp do krótkich bloków treningowych. Każdy trening poprawia umiejętność, ale zwiększa zmęczenie.',null,null,[['BOKS','quickTrain(\'boks\')'],['ZAPASY','quickTrain(\'zapasy\')'],['BJJ','quickTrain(\'bjj\')'],['KONDYCJA','quickTrain(\'kondycja\')']])}function quickTrain(k){s.sk[k]=Math.min(99,s.sk[k]+2);s.fat=Math.min(80,s.fat+5);s.mot=Math.min(100,s.mot+1);s.logs.unshift('🥋 Trening '+k+' +2.');dashboard()}function fightIntro(){eventScreen('DZIEŃ WALKI','Walka jest gotowa. Zwykłe akcje będą płynąć w czasie rzeczywistym i będą komentowane przez JURASA. Koło fortuny pojawi się tylko przy efektownych technikach.',null,null,[['WEJDŹ DO WALKI','fight()'],['WRÓĆ','dashboard()']])}function fight(){let f={sec:300,me:100,op:100,st:100,round:1,stopped:false};s.fight=f;A.innerHTML='<div class="fight"><div class="top"><div><b>'+s.first+' '+s.last+'</b><div class="muted">'+s.weight+' · '+KG[s.weight]+'</div></div><button class="btn" onclick="dashboard()">WYJDŹ</button></div><div class="fighters"><div class="fighter"><b>'+s.first+' '+s.last+'</b><p>STAMINA / WITALNOŚĆ</p><div class="hp"><i id="me" style="width:100%"></i></div></div><div class="clock"><div><div class="time" id="time">05:00</div><small>RUNDA 1</small></div></div><div class="fighter"><b>RYWAL</b><p>WITALNOŚĆ</p><div class="hp opp"><i id="op" style="width:100%"></i></div></div></div><div class="comment" id="comment"><p>JURAS: „Zaczynamy! Spokojny początek, obaj badają dystans.”</p></div><div class="acts">'+[['JAB','szybka ręka'],['LOW KICK','kopnięcie na nogę'],['CROSS','prosty z tylnej ręki'],['CLINCH','praca w zwarciu'],['HIGH KICK','efektowna technika'],['SPINNING BACKFIST','efektowna technika'],['LATAJĄCE KOLANO','efektowna technika'],['ŁOKIEĆ','efektowna technika'],['SINGLE LEG','obalenie'],['DOUBLE LEG','obalenie'],['BALACHA','poddanie'],['TRÓJKĄT NOGAMI','poddanie'],['TRÓJKĄT RĘKOMA','poddanie'],['RNC','poddanie']].map(a=>'<button class="act" onclick="act(\''+a[0]+'\')"><b>'+a[0]+'</b><small>'+a[1]+'</small></button>').join('')+'</div></div>';f.timer=setInterval(()=>tick(),1000)}function tick(){let f=s.fight;if(!f||f.stopped)return;f.sec--;f.st=Math.max(0,f.st-Math.random()*1.5);f.me=Math.max(0,f.me-Math.random()*.8);f.op=Math.max(0,f.op-Math.random()*.65);document.getElementById('time').textContent=Math.floor(f.sec/60).toString().padStart(2,'0')+':'+(f.sec%60).toString().padStart(2,'0');document.getElementById('me').style.width=f.st+'%';document.getElementById('op').style.width=f.op+'%';if(Math.random()<.16)comment(randComment());if(f.sec<=0)finishFight('decision');if(f.op<=8&&Math.random()<.06)finishFight('tko')}function randComment(){return ['JURAS: „Dobra praca na nogach, nie stoi w miejscu.”','JURAS: „Rywal zaczyna oddychać ciężej, to może być ważne.”','JURAS: „Mocny low kick, noga rywala zaczyna pracować coraz gorzej.”','JURAS: „Jest presja pod siatką, tutaj każdy centymetr ma znaczenie.”','JURAS: „Dobre czytanie dystansu, bez niepotrzebnego szaleństwa.”','JURAS: „Próba obalenia, ale rywal dobrze broni biodra.”','JURAS: „Publiczność reaguje, bo tempo wyraźnie rośnie.”'][Math.floor(Math.random()*7)]}function act(name){let f=s.fight;if(!f||f.stopped)return;let special=/HIGH KICK|SPINNING|LATAJĄCE|ŁOKIEĆ|BALACHA|TRÓJKĄT|RNC/.test(name);if(special){let ch=/HIGH KICK|SPINNING|LATAJĄCE/.test(name)?55:/BALACHA|TRÓJKĄT|RNC/.test(name)?50:65;wheel(name,ch);return}f.op=Math.max(0,f.op-(3+Math.random()*7));f.st=Math.max(0,f.st-(2+Math.random()*4));comment('JURAS: „'+name+'! Dobra akcja, walka cały czas się rozwija.”');if(f.op<10&&Math.random()<.08)finishFight('tko')}function wheel(name,ch){let o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="wheelbox"><b class="gold">JURAS · MOMENT W WALCE</b><h2>'+name+'</h2><p>Wskaźnik zostaje na górze. Koło losuje powodzenie.</p><div class="wheelwrap"><div class="pointer">▼</div><div class="wheel"></div></div><div class="result">LOSOWANIE...</div><br><button class="btn" disabled>WRÓĆ DO WALKI</button></div>';document.body.appendChild(o);let ok=Math.random()*100<ch;requestAnimationFrame(()=>o.querySelector('.wheel').style.transform='rotate('+(2160+(Math.random()*720))+'deg)');setTimeout(()=>{o.querySelector('.result').textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';o.querySelector('.result').style.color=ok?'#35c77b':'#d94d5b';if(ok){let f=s.fight;if(/BALACHA|TRÓJKĄT|RNC/.test(name)&&Math.random()<.28)finishFight('submission');else{f.op=Math.max(0,f.op-(12+Math.random()*20));comment(/HIGH KICK|SPINNING|LATAJĄCE/.test(name)?'JURAS: „ŁOOOOOO! Ależ weszło! To może być viral!”':'JURAS: „Ooo! Kapitalnie wykonana technika!”');if(/HIGH KICK|SPINNING|LATAJĄCE/.test(name)){s.ig+=30;s.logs.unshift('🔥 Fragment efektownej akcji zaczyna zdobywać zasięgi. +30 IG.')}}}o.querySelector('button').disabled=false;o.querySelector('button').onclick=()=>o.remove();},2350)}function finishFight(type){let f=s.fight;if(!f||f.stopped)return;f.stopped=true;clearInterval(f.timer);if(type==='decision'){s.w++;s.logs.unshift('🏆 Zwycięstwo decyzją sędziów.');}else if(type==='submission'){s.w++;s.logs.unshift('🥋 Zwycięstwo przez poddanie.')}else{s.w++;s.logs.unshift('💥 Zwycięstwo przed czasem: '+type+'.')}s.rep=Math.min(100,s.rep+(type==='decision'?2:4));s.fat=Math.min(80,s.fat+20);eventScreen('WALKA ZAKOŃCZONA',type==='decision'?'Sędziowie punktują walkę.':'Zwycięstwo przed czasem! '+type.toUpperCase()+'.','WRÓĆ DO KARIERY',()=>dashboard())}function media(){eventScreen('MEDIA','Twoja medialność rośnie wraz z występami. Wybierz ruch.',null,null,[['WYWIAD — + REPUTACJI','viral(35)'],['SHORT Z TRENINGU — VIRAL','viral(90)'],['NIC','dashboard()']])}function career(){dashboard()}function manager(){eventScreen('MENEDŻER KARIERY','Tu docelowo będą kontrakty, sponsoringi i ścieżki federacji. Na tym etapie możesz zwiększać gotowość do negocjacji.',null,null,[['SZUKAJ SPONSORA','sponsor()'],['PROŚBA O WALKĘ W NOWEJ FEDERACJI','repPush()'],['WRÓĆ','dashboard()']])}function sponsor(){if(s.rep<10)return eventScreen('ZA MAŁA REPUTACJA','Na razie sponsorzy odpowiadają: pokaż się najpierw w klatce.','WRÓĆ',()=>dashboard());s.budget+=3000;s.logs.unshift('💰 Mały sponsor wpłacił 3000 ISK.');dashboard()}function repPush(){s.rep=Math.min(100,s.rep+1);s.logs.unshift('📨 Wysłano prośbę o angaż do promotora.');dashboard()}function sh(){eventScreen('STATYSTYKI','Rekord: '+s.w+'-'+s.l+'-'+s.d+' · IG: '+s.ig+' · Reputacja: '+s.rep+' · Najlepsze: '+best(),'WRÓĆ',()=>dashboard())}function events(){nextEvent()}creator();</script></body></html>
