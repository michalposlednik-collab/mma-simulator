<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V92</title><style>*{box-sizing:border-box}body{margin:0;background:#060b10;color:#edf2f4;font:14px Arial}.screen{min-height:100vh;padding:28px;background:radial-gradient(circle at 20% 0,#173c50,#05090d 65%)}.card,.panel{background:#0d1821;border:1px solid #294654;border-radius:16px;box-shadow:0 18px 55px #0009}.card{max-width:1100px;margin:auto;padding:28px}.gold{color:#d6af55}.muted{color:#82949e}.field{margin:15px 0}.field label{display:block;font-size:11px;color:#9aabb4;margin-bottom:7px}.field input{width:100%;padding:13px;background:#071017;color:#fff;border:1px solid #294554;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.budget{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:14px;background:#101e27;border:1px solid #294554;border-radius:10px;cursor:pointer;min-height:78px}.pick:checked+label{border-color:#d6af55;background:#211f15}.pick+label small{display:block;color:#899aa3;margin-top:6px;line-height:1.4}.btn{padding:11px 15px;background:#12222c;color:#fff;border:1px solid #405866;border-radius:9px;cursor:pointer}.primary{background:#80662b;border-color:#d6af55;font-weight:800}.layout{display:grid;grid-template-columns:215px 1fr;min-height:100vh}.side{background:#060c12;border-right:1px solid #203642;padding:14px}.side button{width:100%;margin:4px 0;padding:12px;text-align:left;background:#0b151d;color:#b8c4c9;border:1px solid #203642;border-radius:8px;cursor:pointer}.main{padding:23px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:15px 0}.stat{padding:14px;background:linear-gradient(145deg,#101e27,#091219);border:1px solid #263f4d;border-radius:10px}.stat small{color:#748792}.stat strong{display:block;font-size:19px;margin-top:7px}.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.tabs button{padding:11px 6px;background:#0d1921;color:#b9c5ca;border:1px solid #294352;border-radius:8px;cursor:pointer}.cols{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.hero{padding:25px;min-height:200px;background:radial-gradient(circle at 80% 0,#3a301a,#101a21 60%);border:1px solid #80662d;border-radius:16px}.panel{padding:18px;margin-bottom:12px}.feed{padding:9px 0;border-bottom:1px solid #1b303b}.bar{height:8px;background:#1b2b33;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#3dca84}.modal{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:50;padding:20px}.modalbox{width:min(900px,94vw);max-height:92vh;overflow:auto;background:#0d1821;border:1px solid #d6af55;border-radius:18px;padding:28px}.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle,#173b4d,#050a0e 65%)}.fighters{display:grid;grid-template-columns:1fr 180px 1fr;gap:15px;align-items:center;max-width:1100px;margin:auto;text-align:center}.fighter{padding:17px;background:#0b161f;border:1px solid #294554;border-radius:12px}.hp{height:14px;background:#29171b;border-radius:6px;overflow:hidden}.hp i{display:block;height:100%;background:#3dcc84;transition:.3s}.opp i{background:#df5964}.clock{width:145px;height:145px;border:7px solid #d6af55;border-radius:50%;display:grid;place-items:center;margin:auto}.time{font:700 27px monospace}.comment{max-width:1100px;height:220px;overflow:auto;margin:12px auto;background:#050c11;border:1px solid #294352;border-radius:10px;padding:12px}.comment p{margin:0;padding:7px;border-bottom:1px solid #172a35}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{padding:12px;min-height:60px;text-align:left;background:#101f29;color:#fff;border:1px solid #294554;border-radius:9px;cursor:pointer}.wheelwrap{position:relative;width:290px;height:290px;margin:18px auto}.wheel{width:290px;height:290px;border-radius:50%;background:conic-gradient(#36c77b 0 8%,#d84f5b 8% 16%,#36c77b 16% 24%,#d84f5b 24% 32%,#36c77b 32% 40%,#d84f5b 40% 48%,#36c77b 48% 56%,#d84f5b 56% 64%,#36c77b 64% 72%,#d84f5b 72% 80%,#36c77b 80% 88%,#d84f5b 88%);border:7px solid #65747d;transition:transform 1.8s cubic-bezier(.12,.75,.08,1)}.pointer{position:absolute;z-index:2;top:-20px;left:50%;transform:translateX(-50%);font-size:30px}@media(max-width:900px){.grid,.budget,.stats,.cols,.fighters,.acts,.tabs,.choice{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:115px}}@media(max-width:600px){.grid,.budget,.stats,.cols,.acts,.tabs,.choice{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>
const A=document.getElementById('app');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:'Młody talent — szybkość i potencjał.','Osiedlowy bijok':'Twardy charakter — presja i chaos.',Fizol:'Siła — klincz i brutalna presja.',Zapaśnik:'Obalenia — kontrola i siatka.',Striker:'Stójka — boks i nokauty.',Gumiarz:'BJJ — poddania i przetrwanie.',Allrounder:'Równy rozwój całego MMA.'};const BUDGETS=[[5000,'Normalny etat','Trening po pracy, liczysz każdą złotówkę.'],[10000,'Etat + oszczędności','Masz podstawowy sprzęt i pierwszy obóz.'],[25000,'Rodzina pomaga','Możesz pozwolić sobie na lepszy klub.'],[50000,'Bogata rodzina','Pieniądze pozwalają szybciej inwestować.'],[100000,'Rodzinny biznes','Mocne zaplecze i duże oczekiwania.']];let s={day:1,age:18,ig:100,rep:5,mot:55,budget:10000,w:0,l:0,d:0,fat:8,sk:{boks:50,zapasy:50,bjj:50,kondycja:50,sila:50,szybkosc:50},gym:'Lokalny klub',logs:['Kariera gotowa do rozpoczęcia.'],offer:null,camp:null,contract:null};
function creator(){A.innerHTML='<div class="screen"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Stwórz zawodnika i rozpocznij drogę od lokalnych gal do największych federacji.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="np. Michał"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="np. Kowalski"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.entries(TYPES).map((x,i)=>'<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x[0]+'"><label for="t'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="budget">'+BUDGETS.map((x,i)=>'<input class="pick" id="b'+i+'" name="budget" type="radio" value="'+x[0]+'" '+(i===1?'checked':'')+'><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' ISK</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>').join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.entries(KG).map((x,i)=>'<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x[0]+'"><label for="w'+i+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></label>').join('')+'</div><br><button class="btn primary" onclick="start()">STWÓRZ KARIERĘ →</button></div></div>'}
function start(){const fn=document.getElementById('fn'),ln=document.getElementById('ln'),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=budget]:checked'),w=document.querySelector('[name=weight]:checked');if(!fn.value.trim()||!ln.value.trim()||!t||!b||!w)return alert('Uzupełnij wszystkie pola.');s.first=fn.value.trim();s.last=ln.value.trim();s.type=t.value;s.budget=+b.value;s.weight=w.value;s.logs=['🥊 Kariera rozpoczęta.'];dashboard()}
function side(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance(1)">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fight()">🏆 Walka</button><button onclick="media()">📱 Media</button><button onclick="career()">📋 Kariera</button><button onclick="manager()">💼 Menedżer</button><button onclick="stats()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button></aside>'}
function dashboard(){A.innerHTML='<div class="layout">'+side()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button class="btn" onclick="advance(1)">＋ 1 DZIEŃ</button> <button class="btn primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><strong>'+s.w+'-'+s.l+'-'+s.d+'</strong></div><div class="stat"><small>INSTAGRAM</small><strong>'+s.ig.toLocaleString()+'</strong></div><div class="stat"><small>REPUTACJA</small><strong>'+s.rep+'/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>'+s.mot+'/100</strong></div><div class="stat"><small>BUDŻET</small><strong>'+s.budget.toLocaleString()+' ISK</strong></div><div class="stat"><small>AKTYWNA WALKA</small><strong>'+(s.camp?'TAK':'NIE')+'</strong></div></div><div class="tabs"><button onclick="training()">🥊 Trening</button><button onclick="fight()">🏆 Walka</button><button onclick="media()">📱 Media</button><button onclick="career()">📋 Kariera</button><button onclick="manager()">💼 Menedżer</button><button onclick="stats()">📊 Statystyki</button><button onclick="events()">◉ Eventy</button><button onclick="nextEvent()">⏩ Event</button></div><div class="cols"><section><div class="hero"><small class="gold">NAJBLIŻSZY CEL</small><h2>'+(s.camp?'Przygotowanie do walki: '+s.camp.promo:'Buduj nazwisko krok po kroku')+'</h2><p>'+(s.camp?'Pozostało '+Math.max(0,s.camp.date-s.day)+' dni obozu. Nie możesz przyjąć drugiej walki, dopóki ta się nie skończy.':'Szukaj treningów, buduj reputację i czekaj na pierwszą ofertę.')+'</p><button class="btn primary" onclick="'+(s.camp?'training()':'nextEvent()')+'">'+(s.camp?'ZARZĄDZAJ OBOZEM':'PRZEWIŃ DO EVENTU')+'</button></div><div class="panel"><h3>📰 OŚ CZASU</h3>'+s.logs.slice(0,12).map(x=>'<div class="feed">'+x+'</div>').join('')+'</div></section><aside><div class="panel"><h3>📈 SKILLE</h3>'+Object.entries(s.sk).map(x=>'<div class="feed"><b>'+x[0].toUpperCase()+'</b> '+x[1]+'<div class="bar"><i style="width:'+x[1]+'%"></i></div></div>').join('')+'</div><div class="panel"><h3>🗺️ DROGA KARIERY</h3>'+['Hybrid/Babylon/FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map((x,i)=>'<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'✅':'🔒')+' '+x+'</div>').join('')+'</div></aside></div></main></div>'}
function advance(n){for(let i=0;i<n;i++){s.day++;if(s.day%365===1)s.age++;if(s.camp&&s.day>=s.camp.date){s.logs.unshift('📅 Obóz zakończony. Jesteś gotowy do walki.');s.camp.ready=true}}dashboard()}
function modal(title,text,buttons){A.innerHTML='<div class="modal"><div class="modalbox"><small class="gold">CENTRUM KARIERY</small><h1>'+title+'</h1><p style="font-size:18px;line-height:1.6">'+text+'</p><div class="choice">'+buttons.map((b,i)=>'<button class="btn '+(i===0?'primary':'')+'" id="c'+i+'">'+b[0]+'</button>').join('')+'</div></div></div>';buttons.forEach((b,i)=>document.getElementById('c'+i).onclick=b[1])}
function nextEvent(){if(s.camp){modal('AKTYWNY OKRES PRZYGOTOWAWCZY','Masz już zakontraktowaną walkę z '+s.camp.opp+' na gali '+s.camp.promo+'. Najpierw skończ ten obóz.',[['ZARZĄDZAJ TRENINGIEM',training],['WRÓĆ',dashboard]]);return}const r=Math.random();if(r<.55)offer();else if(r<.75)mediaEvent();else modal('ZAPROSZENIE NA GALIĘ','Promotor chce Cię zobaczyć na wydarzeniu. To dobra okazja na networking i media.',[['IDĘ',()=>{s.ig+=40;s.rep+=1;s.logs.unshift('🎟️ Gala: +40 IG, +1 reputacji.');dashboard()}],['ODMAWIAM',dashboard]])}
function offer(){const promos=s.rep>=35?['OKTAGON','KSW','FEN']:s.rep>=20?['KSW','FEN','Babylon']:['Hybrid','Babylon','FEN'];const promo=promos[Math.floor(Math.random()*promos.length)];const opp=['Marek Kowal','Piotr Wilk','Kamil Zięba','Patryk Nowak'][Math.floor(Math.random()*4)];const days=21+Math.floor(Math.random()*22);s.offer={promo,opp,date:s.day+days};modal('PROPOZYCJA WALKI',promo+' proponuje walkę z '+opp+'. Termin za '+days+' dni. Przyjęcie rozpocznie okres przygotowawczy i blokuje kolejne oferty.',[['PRZYJMIJ WALKĘ',()=>acceptOffer()],['ODRZUĆ',()=>{s.logs.unshift('📨 Odrzucono ofertę '+promo+'.');dashboard()}]])}
function acceptOffer(){if(s.camp){modal('MASZ JUŻ WALKĘ','Nie możesz przyjąć drugiej walki przed zakończeniem obecnej.',[['OK',dashboard]]);return}const o=s.offer;s.offer=null;s.camp={promo:o.promo,opp:o.opp,date:o.date,ready:false};s.logs.unshift('🥊 Przyjęto walkę: '+o.promo+' vs '+o.opp+'.');dashboard()}
function training(){if(!s.camp){modal('TRENING','Nie masz jeszcze aktywnego obozu. Możesz trenować w klubie albo wykupić zewnętrzny obóz.',[['ANKOS — 6000 ISK',()=>campGym('ANKOS')],['ADAM TRAINING — 4000 ISK',()=>campGym('ADT')],['LOKALNY KLUB — 500 ISK',()=>campGym('LOCAL')],['WRÓĆ',dashboard]]);return}modal('OKRES PRZYGOTOWAWCZY','Walka: '+s.camp.promo+' vs '+s.camp.opp+'. Wybierz blok treningowy. Każdy blok zużywa 3 dni.',[['ZAPASY +5',()=>campTrain('zapasy',5)],['BOKS +5',()=>campTrain('boks',5)],['BJJ +5',()=>campTrain('bjj',5)],['KONDYCJA +5',()=>campTrain('kondycja',5)],['REGENERACJA',()=>{s.fat=Math.max(0,s.fat-15);advance(3)}]])}
function campGym(g){const data={ANKOS:[6000,15,6,4,2],ADT:[4000,8,4,3,2],LOCAL:[500,0,2,2,2]}[g];if(s.budget<data[0])return modal('BRAK ŚRODKÓW','Nie stać Cię na ten obóz.',[['OK',dashboard]]);if(s.rep<data[1])return modal('ZA MAŁA REPUTACJA','Ten klub oczekuje większej reputacji.',[['OK',dashboard]]);s.budget-=data[0];s.gym=g==='ANKOS'?'Ankos MMA':g==='ADT'?'ADT':'Lokalny klub';s.sk.zapasy=Math.min(100,s.sk.zapasy+data[2]);s.sk.boks=Math.min(100,s.sk.boks+data[3]);s.sk.kondycja=Math.min(100,s.sk.kondycja+data[4]);s.fat+=10;s.logs.unshift('🥋 Obóz '+s.gym+': rozwój statystyk.');advance(7)}
function campTrain(k,n){s.sk[k]=Math.min(100,s.sk[k]+n);s.fat=Math.min(100,s.fat+6);advance(3)}
function fight(){if(!s.camp)return modal('BRAK WALKI','Najpierw przyjmij konkretną ofertę. Nie losujemy walki bez oferty.',[['SZUKAJ OFERTY',nextEvent],['WRÓĆ',dashboard]]);if(s.day<s.camp.date&&!s.camp.ready)return modal('JESZCZE NIE','Do walki zostało '+(s.camp.date-s.day)+' dni. Trenuj albo regeneruj.',[['TRENING',training],['WRÓĆ',dashboard]]);fightScreen()}
let fs=null;function fightScreen(){fs={t:0,hp:100,ohp:100,round:1,score:0};renderFight();fs.timer=setInterval(()=>tick(),220)}function tick(){if(!fs)return;fs.t+=1;if(fs.t>=300){fs.t=0;fs.round++;if(fs.round>3){clearInterval(fs.timer);finishFight();return}}const dmg=Math.random()*3;fs.hp=Math.max(0,fs.hp-dmg*.7);fs.ohp=Math.max(0,fs.ohp-dmg*(.7+Math.random()));if(Math.random()<.1)comment('JURAS: Dobre tempo, ale jeszcze dużo czasu. Zawodnicy nie chcą teraz spalić kondycji.');if(fs.ohp<25&&Math.random()<.01){clearInterval(fs.timer);finishFight(true);return}renderFight()}
function renderFight(){A.innerHTML='<div class="fight"><div class="fighters"><div class="fighter"><h2>'+s.first+' '+s.last+'</h2><div class="hp"><i style="width:'+fs.hp+'%"></i></div><p>Witalność '+Math.round(fs.hp)+'%</p></div><div class="clock"><div><div class="time">R'+fs.round+'</div><small> '+Math.floor(fs.t/60)+':'+String(fs.t%60).padStart(2,'0')+' </small></div></div><div class="fighter"><h2>'+s.camp.opp+'</h2><div class="hp"><i class="opp" style="width:'+fs.ohp+'%"></i></div><p>Witalność '+Math.round(fs.ohp)+'%</p></div></div><div id="comments" class="comment"></div><div class="acts"><button class="act" onclick="special('High Kick')">🦵 High Kick</button><button class="act" onclick="special('Spinning Backfist')">🌀 Spinning Backfist</button><button class="act" onclick="special('Latające kolano')">🦵 Latające kolano</button><button class="act" onclick="special('Balacha')">🔒 Balacha</button><button class="act" onclick="comment('JURAS: Praca na nogach, zmiana pozycji i szukanie kąta.')">👊 Stójka</button><button class="act" onclick="comment('JURAS: Próba wejścia po jedną nogę. Dobre wyczucie momentu.')">🤼 Zapasy</button><button class="act" onclick="comment('JURAS: Krótkie ciosy w klinczu, rywal jest dociskany do siatki.')">🧱 Klincz</button><button class="act" onclick="comment('JURAS: Spokojnie, metodycznie. Nie ma potrzeby szaleć.')">🎯 Kontrola</button></div></div>;comment('JURAS: Zaczynamy rundę '+fs.round+'. Ciekawe, kto pierwszy narzuci swoje tempo.')}
function comment(x){const c=document.getElementById('comments');if(c){const p=document.createElement('p');p.textContent=x;c.appendChild(p);c.scrollTop=c.scrollHeight}}
function special(name){const ok=Math.random()<.55;if(ok){fs.ohp=Math.max(0,fs.ohp-(12+Math.random()*20));comment('JURAS: ŁOOOO! '+name+' wszedł idealnie!');if(fs.ohp<=0){clearInterval(fs.timer);finishFight(true)}}else comment('JURAS: Próba '+name+', ale rywal to przeczytał!')}
function finishFight(ko){const win=ko||fs.ohp<fs.hp;const method=ko?'KO/TKO':'DEC';if(win)s.w++;else s.l++;s.rep+=win?3:0;s.ig+=win?100:20;s.logs.unshift('🏆 '+s.camp.promo+': '+(win?'WYGRANA':'PORAŻKA')+' przez '+method+' z '+s.camp.opp+'.');s.budget+=win?7000:3000;s.camp=null;s.offer=null;dashboard()}
function media(){modal('MEDIA','Twoja medialność wpływa na oferty i reputację. Możesz budować zasięg albo zachować spokój.',[['VIRAL +150 IG',()=>{s.ig+=150;s.rep++;s.logs.unshift('📱 Viral: +150 IG.');dashboard()}],['SPOKOJNIE',()=>{s.mot+=3;dashboard()}]])}
function career(){modal('ŚCIEŻKA KARIERY',''+['Hybrid/Babylon/FEN — REP 5','KSW — REP 20','OKTAGON — REP 35','Cage Warriors — REP 50','PFL — REP 65','UFC — REP 80'].map(x=>'<p>'+x+'</p>').join(''),[['WRÓĆ',dashboard]])}
function manager(){modal('MENEDŻER KARIERY','Menedżer negocjuje lepsze walki i kontrakty. System będzie rozwijany o prowizję, sponsorów i relacje z federacjami.',[['WRÓĆ',dashboard]])}
function stats(){modal('STATYSTYKI','<p>Rekord: '+s.w+'-'+s.l+'-'+s.d+'</p><p>Reputacja: '+s.rep+'</p><p>Instagram: '+s.ig+'</p><p>Klub: '+s.gym+'</p><p>Wiek: '+s.age+'</p>'+Object.entries(s.sk).map(x=>'<p>'+x[0]+': '+x[1]+'</p>').join(''),[['WRÓĆ',dashboard]])}
function events(){modal('EVENTY','<p>Eventy są generowane w toku kariery. Oferta walki blokuje kolejne walki aż do jej zakończenia.</p><p>Możliwe: gale, media, treningi, walki, virale.</p>',[['WRÓĆ',dashboard]])}
creator();
</script></body></html>
