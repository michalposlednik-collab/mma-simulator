<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V106</title><style>body{margin:0;background:#05090d;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 50% 0,#173744,#05090d 70%)}button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}.primary{background:#80652a;border-color:#d6ae51}.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:20px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 15%,#273f49,#060b0f 65%)}.head{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto}.clockbox{position:relative;width:190px;height:190px;display:grid;place-items:center}.ring{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#d6ae51 var(--p),#25343b 0)}.ring:after{content:'';position:absolute;inset:13px;border-radius:50%;background:#081016}.clocktext{position:relative;z-index:2;text-align:center}.clock{font-size:36px;font-weight:900}.round{color:#d6ae51;font-size:12px;letter-spacing:2px}.fighters{display:grid;grid-template-columns:1fr 230px 1fr;gap:18px;align-items:center;max-width:1200px;margin:10px auto}.fighter{text-align:center;padding:18px;background:#101c25;border:1px solid #304955;border-radius:16px}.comment{min-height:110px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;line-height:1.5}.hp{height:12px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.actions{display:flex;flex-wrap:wrap;gap:8px;max-width:1200px;margin:14px auto}.wheelwrap,.modal{display:none;position:fixed;inset:0;background:#000e;z-index:100;place-items:center;padding:18px}.wheelbox,.modalbox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:22px;width:min(600px,95vw);text-align:center}.wheelstage{position:relative;width:310px;height:310px;margin:15px auto}.wheel{width:300px;height:300px;border-radius:50%;background:conic-gradient(#c33 0 12.5%,#2e9d5b 12.5% 25%,#c33 25% 37.5%,#2e9d5b 37.5% 50%,#c33 50% 62.5%,#2e9d5b 62.5% 75%,#c33 75% 87.5%,#2e9d5b 87.5% 100%);border:8px solid #17252d;transition:transform 2.2s cubic-bezier(.12,.7,.15,1);position:absolute;left:5px;top:5px}.pointer{position:absolute;z-index:5;top:-7px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #d6ae51}.result{font-size:21px;font-weight:800;color:#d6ae51;min-height:30px}.winner{font-size:30px;color:#d6ae51}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{text-align:left;min-height:80px}.muted{color:#91a3ac}.dash{padding:28px;max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:#101e27;border:1px solid #304955;border-radius:12px;padding:13px}.stat b{display:block;font-size:18px;margin-top:5px}.feed{padding:9px 0;border-bottom:1px solid #20333c}@media(max-width:800px){.fighters{grid-template-columns:1fr}.head{display:block}.clockbox{margin:10px auto}.choices{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app" class="app"></div><div id="wheel" class="wheelwrap"><div class="wheelbox"><div class="muted">DODATKOWA AKCJA — CZAS ZATRZYMANY</div><h2 id="wtitle">HIGH KICK</h2><div class="wheelstage"><div class="pointer"></div><div id="wheelEl" class="wheel"></div></div><div id="wresult" class="result">Wskaźnik jest zawsze na górze.</div><button id="spin" class="primary">LOSUJ EFEKT</button></div></div><div id="modal" class="modal"><div class="modalbox"><div class="muted">KONIEC WALKI</div><div id="winner" class="winner"></div><p id="summary"></p><h3>🎙️ Wywiad po walce</h3><div class="choices"><button class="choice" data-kind="challenge">🔥 <b>Wyzwanie rywala</b><br><span class="muted">Zapowiadasz następną walkę.</span></button><button class="choice" data-kind="corner">🙏 <b>Podziękuj narożnikowi</b><br><span class="muted">Doceniasz trenerów i team.</span></button><button class="choice" data-kind="joke">😂 <b>Żart / luz</b><br><span class="muted">Rozładowujesz emocje.</span></button><button class="choice" data-kind="respect">🤝 <b>Szacunek dla rywala</b><br><span class="muted">Sportowa odpowiedź.</span></button></div><p id="interview"></p><button id="back" class="primary">WRÓĆ DO DASHBOARDU</button></div></div><script>(function(){'use strict';let s={first:'Michał',last:'Kowalski',w:0,l:0,rep:5,ig:100,money:10000},f=null,raf=0,last=0,paused=false,pending=null;const app=document.getElementById('app'),wheel=document.getElementById('wheel'),we=document.getElementById('wheelEl'),wr=document.getElementById('wresult'),modal=document.getElementById('modal');function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}function league(){return s.w<2?'Localna gala':s.w<4?'Hybrid':s.w<7?'Babilon MMA / FEN':s.w<10?'KSW':s.w<13?'OKTAGON':s.w<16?'Cage Warriors':s.w<19?'PFL':'UFC'}function dash(){app.innerHTML='<div class="dash"><div class="top"><div><div class="muted">CENTRUM KARIERY</div><h1>'+s.first+' '+s.last+'</h1></div><button class="primary" id="fightBtn">🏆 NASTĘPNY EVENT</button></div><div class="stats"><div class="stat">REKORD<b>'+s.w+'-'+s.l+'</b></div><div class="stat">REPUTACJA<b>'+s.rep+'</b></div><div class="stat">GOTÓWKA<b>'+money(s.money)+'</b></div><div class="stat">ORGANIZACJA<b>'+league()+'</b></div></div><div class="panel"><h2>Ostatni wynik</h2><p>Po walce wynik jest pokazany tutaj na głównym oknie.</p></div></div>';document.getElementById('fightBtn').onclick=newFight}function newFight(){if(f)return;f={opponent:['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek'][Math.floor(Math.random()*5)],round:1,time:300,st:100,hp:100,ost:100,ohp:100,score:[],comment:'JURAS: Zaczynamy! Zobaczymy, kto pierwszy narzuci tempo.',purse:Math.max(2500,2500+s.rep*180+s.w*500)};render();last=performance.now();raf=requestAnimationFrame(loop)}function loop(t){if(!f||paused)return;const dt=Math.min(.05,(t-last)/1000);last=t;f.time-=dt*4;f.st=Math.max(0,f.st-dt*.7);f.ost=Math.max(0,f.ost-dt*.55);if(Math.random()<dt*.7)exchange();if(f.time<=0)roundEnd();update();raf=requestAnimationFrame(loop)}function exchange(){f.ohp=Math.max(0,f.ohp-Math.max(1,Math.round(Math.random()*2+1)));f.hp=Math.max(0,f.hp-Math.max(1,Math.round(Math.random()*1.5)));f.comment=['JURAS: Dobra praca na nogach.','JURAS: Ładny prosty, rywal to poczuł.','JURAS: Presja pod siatką.','JURAS: Obaj przyspieszają.'][Math.floor(Math.random()*4)];if(f.ohp<=0)finish(true,'KO/TKO')}function update(){if(!f)return;const r=document.querySelector('.ring');if(r)r.style.setProperty('--p',Math.max(0,f.time/300*100)+'%');const c=document.querySelector('.clock');if(c)c.textContent=String(Math.floor(f.time/60)).padStart(2,'0')+':'+String(Math.ceil(f.time%60)).padStart(2,'0');[['.mhp',f.hp],['.ohp',f.ohp],['.mst',f.st],['.ost',f.ost]].forEach(x=>{const e=document.querySelector(x[0]);if(e)e.style.width=x[1]+'%'});const e=document.querySelector('.comment');if(e)e.textContent=f.comment}function render(){app.innerHTML='<div class="fight"><div class="head"><div><div class="muted">'+league()+'</div><h1>'+s.first+' vs '+f.opponent+'</h1></div><div class="clockbox"><div class="ring" style="--p:100%"></div><div class="clocktext"><div class="round">RUNDA '+f.round+'/3</div><div class="clock">05:00</div><small>czas walki</small></div></div></div><div class="fighters"><div class="fighter"><h2>'+s.first+'</h2><p>Witalność</p><div class="hp"><i class="mhp" style="width:100%"></i></div><p>Stamina</p><div class="hp"><i class="mst" style="width:100%"></i></div></div><div class="comment">'+f.comment+'</div><div class="fighter"><h2>'+f.opponent+'</h2><p>Witalność</p><div class="hp"><i class="ohp" style="width:100%"></i></div><p>Stamina</p><div class="hp"><i class="ost" style="width:100%"></i></div></div></div><div class="panel"><h3>AKCJE</h3><div class="actions">'+['Prosty','Low kick','High kick','Latające kolano','Spinning backfist','Obalenie','Balacha','Trójkąt','RNC'].map((x,i)=>'<button class="act" data-a="'+x+'">'+x+(i>1?' 🎡':'')+'</button>').join('')+'</div><p class="muted">Zegar jest centralnie między zawodnikami, płynie płynnie i jest przyspieszony 4×. Dodatkowa akcja zatrzymuje czas.</p></div></div>';document.querySelectorAll('.act').forEach(b=>b.onclick=()=>action(b.dataset.a))}function action(n){if(!f)return;const extra=['High kick','Latające kolano','Spinning backfist','Obalenie','Balacha','Trójkąt','RNC'].includes(n);if(extra){paused=true;pending=n;document.getElementById('wtitle').textContent=n;wr.textContent='Wskaźnik u góry. Losuj efekt.';we.style.transform='rotate(0deg)';wheel.style.display='grid';return}apply(n,'normal')}document.getElementById('spin').onclick=function(){if(!pending)return;this.disabled=true;const r=Math.random(),kind=r<.52?'PEŁNY SUKCES':r<.82?'CZĘŚCIOWY SUKCES':'NIEUDANA TECHNIKA';we.style.transform='rotate('+(1440+Math.floor(Math.random()*360))+'deg)';setTimeout(()=>{wr.textContent='WYNIK: '+kind;apply(pending,kind==='PEŁNY SUKCES'?'full':kind==='CZĘŚCIOWY SUKCES'?'partial':'fail');setTimeout(()=>{wheel.style.display='none';this.disabled=false;pending=null;paused=false;last=performance.now();if(f)raf=requestAnimationFrame(loop)},800)},2300)};function apply(n,t){const base={Highkick:14,'Latające kolano':12,'Spinning backfist':13,Obalenie:9,Balacha:16,Trójkąt:15,RNC:18}[n]||4;if(t==='full'){f.ohp=Math.max(0,f.ohp-Math.round(base*1.5));f.comment='JURAS: '+n+'! PEŁNY SUKCES! Kapitalne wykonanie.';f.st=Math.max(0,f.st-5)}else if(t==='partial'){f.ohp=Math.max(0,f.ohp-Math.round(base*.7));f.comment='JURAS: '+n+' częściowo trafiony. Jest efekt, ale koszt był spory.';f.st=Math.max(0,f.st-8)}else{f.hp=Math.max(0,f.hp-3);f.st=Math.max(0,f.st-14);f.comment='JURAS: Nieudana próba '+n+'. Rywal wykorzystał moment.'}if(f.ohp<=0)finish(true,'KO/TKO');else if(f.hp<=0)finish(false,'KO/TKO');update()}function roundEnd(){const my=(100-f.ohp)+(f.st>f.ost?8:0),op=(100-f.hp)+(f.ost>f.st?8:0);f.score.push(my>=op?10:9);if(f.round>=3){finish(f.score.filter(x=>x===10).length>=2,'DECYZJA');return}f.round++;f.time=300;f.st=Math.min(100,f.st+25);f.ost=Math.min(100,f.ost+22);f.comment='JURAS: Koniec rundy. '+f.score[f.score.length-1]+'-'+(f.score[f.score.length-1]===10?9:10)+'. Wracamy do narożników.';render();last=performance.now()}function finish(win,method){if(!f)return;cancelAnimationFrame(raf);const old=f;s.money+=old.purse;if(win){s.w++;s.rep=Math.min(100,s.rep+(method==='KO/TKO'?6:4));s.ig+=200}else{s.l++;s.rep=Math.max(0,s.rep-2)}document.getElementById('winner').textContent=win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA';document.getElementById('summary').textContent=s.first+(win?' wygrywa':' przegrywa')+' z '+old.opponent+' przez '+method+'. Gaża: '+money(old.purse)+'.';document.getElementById('interview').textContent='Wybierz wypowiedź po walce.';f=null;modal.style.display='grid'}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{const k=b.dataset.kind,text={challenge:'„Jeśli ma odwagę, spotkajmy się w następnej walce!”',corner:'„To zwycięstwo jest dla mojego narożnika. Bez nich nie byłoby mnie tutaj.”',joke:'„Mówili, że cardio będzie problemem. Chyba zapomnieli, że mam plan B.”',respect:'„Szacunek dla rywala. Dał mi ciężką walkę i dzięki niemu będę lepszy.”'}[k],r={challenge:4,corner:2,joke:3,respect:2}[k],ig=k==='challenge'?400:200;s.rep=Math.min(100,s.rep+r);s.ig+=ig;document.getElementById('interview').innerHTML='<b>Twój wywiad:</b><br>'+text+'<br><span class="muted">Reputacja +'+r+' · Instagram +'+ig+'</span>'});document.getElementById('back').onclick=()=>{modal.style.display='none';dash()};window.newFight=newFight;dash()})();</script></body></html>
