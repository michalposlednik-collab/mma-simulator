<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V126</title><style>*{box-sizing:border-box}body{margin:0;background:#070c11;color:#edf2f4;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 20% 0,#173b49,#060a0e 68%)}button{cursor:pointer;background:#142833;color:#fff;border:1px solid #526873;border-radius:9px;padding:11px 14px;font-weight:800}button:hover{border-color:#d6ae51}button:disabled{opacity:.35;cursor:not-allowed}.gold{color:#d6ae51}.muted{color:#91a3ac}.primary{background:#80652a;border-color:#d6ae51}.wrap{padding:28px;max-width:1200px;margin:auto}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 14px 40px #0007}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{display:none}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:78px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.pick+label small{display:block;color:#9eb0b8;margin-top:6px}.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.main{padding:20px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:13px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:5px}.hero{padding:23px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.35fr .9fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:75px;padding:8px;background:#0b151d;border:1px solid #243b46;border-radius:8px}.day.fight{border-color:#d6ae51;background:#211f15}.day.today{box-shadow:inset 0 0 0 2px #36c77b}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:1000;align-items:center;justify-content:center;padding:18px}.modalbox{position:relative;width:min(780px,96vw);max-height:92vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{text-align:left;min-height:75px}.close{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:25px}.camp{display:block;width:100%;text-align:left;margin:8px 0}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#293a44,#070c11)}.fighttop{display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;gap:18px;max-width:1250px;margin:auto}.fighter{text-align:center;padding:18px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:13px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.comment{min-height:95px;padding:17px;background:#101c25;border:1px solid #304955;border-radius:14px;font-size:17px;line-height:1.5;max-width:1250px;margin:14px auto}.timer{width:270px;height:270px;margin:auto;position:relative;border-radius:50%;display:grid;place-items:center}.timer:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#d6ae51 var(--pct),#26343b 0);box-shadow:0 0 0 8px #111d24}.timer:after{content:'';position:absolute;inset:18px;border-radius:50%;background:#081016;border:1px solid #304955}.timerText{position:relative;z-index:2;text-align:center}.clock{font-size:44px;font-weight:900}.round{font-size:13px;letter-spacing:2px;color:#d6ae51}.actions{display:flex;flex-wrap:wrap;gap:8px;max-width:1250px;margin:14px auto}.log{max-width:1250px;margin:14px auto;max-height:150px;overflow:auto}.wheelModal,.resultModal{display:none;position:fixed;inset:0;background:#000e;z-index:2000;place-items:center;padding:18px}.wheelbox,.resultBox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px;width:min(700px,96vw);text-align:center}.wheelstage{width:350px;height:350px;margin:10px auto;position:relative}.wheel{position:absolute;left:15px;top:15px;width:320px;height:320px;border-radius:50%;border:9px solid #17252d;transition:transform 2.7s cubic-bezier(.12,.7,.15,1);background:conic-gradient(#5fd37a 0 45deg,#df5045 45deg 90deg,#f0ad4e 90deg 135deg,#df5045 135deg 180deg,#5fd37a 180deg 225deg,#f0ad4e 225deg 270deg,#df5045 270deg 315deg,#5fd37a 315deg 360deg)}.wheel:after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(transparent 0 43deg,#fff 43deg 45deg);opacity:.8}.pointer{position:absolute;z-index:5;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid #d6ae51}.wheelResult{font-size:30px;font-weight:900;color:#d6ae51;min-height:44px}.winner{font-size:40px;color:#d6ae51;font-weight:900}.hidden{display:none}@media(max-width:950px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:120px}.stats{grid-template-columns:repeat(3,1fr)}.cols,.fighttop{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid,.stats,.modalgrid,.tiles{grid-template-columns:1fr}.timer{width:220px;height:220px}.wheelstage{transform:scale(.85);margin:-8px auto}.top{display:block}}</style></head><body><div id="app" class="app"></div><div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeEvent()">×</button><small id="mt" class="gold"></small><h1 id="mh"></h1><div id="mb"></div><div id="mc" class="modalgrid"></div></div></div><div id="wheelModal" class="wheelModal"><div class="wheelbox"><small class="gold">CZAS WALKI ZATRZYMANY</small><h2 id="wa"></h2><div class="wheelstage"><div class="pointer"></div><div id="wheel" class="wheel"></div></div><div class="wheelResult" id="wr">LOSUJ EFEKT</div><button class="primary" id="spin">LOSUJ EFEKT</button></div></div><div id="resultModal" class="resultModal"><div class="resultBox"><small class="gold">OFICJALNY WYNIK</small><div id="winner" class="winner"></div><h2 id="method"></h2><p id="summary"></p><hr><h2>🎙️ WYWIAD W KLATCE</h2><div id="postfight" class="modalgrid"><button onclick="postfight('challenge')">🔥 Wyzwij rywala</button><button onclick="postfight('corner')">🙏 Podziękuj narożnikowi</button><button onclick="postfight('joke')">😂 Rzuć żart</button><button onclick="postfight('respect')">🤝 Oddaj szacunek</button><button onclick="postfight('fans')">❤️ Podziękuj kibicom</button><button onclick="postfight('belt')">🏆 Powiedz, że idziesz po pas</button></div><div id="challenge" class="hidden"></div><div id="ptext" class="panel hidden"></div><button id="back" class="primary hidden" onclick="closeResult()">WRÓĆ DO DASHBOARDU</button></div></div><script>
const KEY='mmaCareerV126';const types={Wonderkid:'Talent, refleks i głód zwycięstw.',Bijok:'Szczęka, presja i moc.',Fizol:'Siła, klincz i presja.',Zapaśnik:'Obalenia, siatka i kontrola.',Striker:'Dystans, timing i nokaut.',Gumiarz:'Chaos, parter i kreatywność.',Allrounder:'Wszechstronność.'};const weights=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];const kg={'Flyweight':'56,7 kg','Bantamweight':'61,2 kg','Featherweight':'65,8 kg','Lightweight':'70,3 kg','Welterweight':'77,1 kg','Middleweight':'83,9 kg','Light Heavyweight':'93,0 kg','Heavyweight':'120,2 kg'};const budgets=[[5000,'Normalny etat','praca po godzinach'],[10000,'Etat + oszczędności','trochę oddechu'],[25000,'Rodzina pomaga','zaplecze na pierwszy krok'],[50000,'Bogata rodzina','inwestycje w obozy'],[100000,'Rodzinny biznes','sport finansowany jak drugi biznes']];const opps=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk','Michał „Bizon” Kowal'];let s=load()||{created:false};let timerRAF=0,last=0,paused=false,pending=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}function league(){if(s.w<2)return'Lokalna gala';if(s.w<4)return'Hybrid';if(s.w<7)return'Babilon MMA / FEN';if(s.w<10)return'KSW';if(s.w<13)return'OKTAGON';if(s.w<16)return'Cage Warriors';if(s.w<19)return'PFL';return'UFC'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function creator(){let t=Object.keys(types).map((x,i)=>`<input class="pick" id="t${i}" name="type" type="radio" value="${x}"><label for="t${i}"><b>${x}</b><small>${types[x]}</small></label>`).join(''),b=budgets.map((x,i)=>`<input class="pick" id="b${i}" name="bud" type="radio" value="${x[0]}"><label for="b${i}"><b>${money(x[0])}</b><small><b>${x[1]}</b><br>${x[2]}</small></label>`).join(''),w=weights.map((x,i)=>`<input class="pick" id="w${i}" name="weight" type="radio" value="${x}"><label for="w${i}"><b>${x}</b><small>${kg[x]}</small></label>`).join('');document.getElementById('app').innerHTML=`<div class="wrap"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Stwórz zawodnika i prowadź go od lokalnej gali do UFC.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="Imię"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="Nazwisko"></div><h3>TYP ZAWODNIKA</h3><div class="grid">${t}</div><h3>BUDŻET STARTOWY</h3><div class="grid">${b}</div><h3>KATEGORIA WAGOWA</h3><div class="grid">${w}</div><br><button class="primary" onclick="createCareer()">STWÓRZ KARIERĘ →</button></div></div>`}function createCareer(){let f=fn.value.trim(),l=ln.value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s={created:true,first:f,last:l,type:t.value,weight:w.value,money:+b.value,day:1,age:18,rep:5,ig:100,w:0,l:0,d:0,club:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,history:[],log:['🥊 Start kariery: '+f+' '+l+'. Budżet '+money(+b.value)+'.'],media:{interviewUntil:0,postUntil:0,controversyUntil:0},manager:null,sponsors:[],income:{gateUntil:0,job:false,adUntil:0}};save();dashboard()}
function nav(){return`<aside class="side">${[['dashboard','⌂ Dashboard'],['calendar','📅 Kalendarz'],['training','🥊 Trening'],['fights','🏆 Walki'],['career','📋 Kariera / Sharedok'],['media','📱 Media'],['manager','💼 Menedżer'],['finance','💰 Finanse'],['statistics','📊 Statystyki'],['events','◉ Eventy']].map(x=>`<button class="${s.screen===x[0]?'primary':''}" onclick="${x[0]}()">${x[1]}</button>`).join('')}</aside>`}function stats(){return`<div class="stats"><div class="stat"><small>REKORD</small><b>${s.w}-${s.l}-${s.d}</b></div><div class="stat"><small>REPUTACJA</small><b>${s.rep}/100</b></div><div class="stat"><small>INSTAGRAM</small><b>${s.ig.toLocaleString('pl-PL')}</b></div><div class="stat"><small>GOTÓWKA</small><b>${money(s.money)}</b></div><div class="stat"><small>ORGANIZACJA</small><b>${league()}</b></div><div class="stat"><small>DZIEŃ / WIEK</small><b>${s.day} / ${s.age}</b></div></div>`}function shell(c){document.getElementById('app').innerHTML=`<div class="layout">${nav()}<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>${esc(s.first)} ${esc(s.last)}</h1><p class="muted">${s.age} lat · dzień ${s.day} · ${esc(s.type)} · ${esc(s.weight)}</p></div><button class="primary" onclick="continueToEvent()">▶ KONTYNUUJ DO NASTĘPNEGO EVENTU</button></div>${stats()}${c}</main></div>`}function dashboard(){if(!s.created)return creator();s.screen='dashboard';let f=s.fight?`<div class="hero"><h2>🥊 WALKA ZAPLANOWANA</h2><p><b>${esc(s.fight.opponent)}</b> · ${esc(s.fight.league)}</p><p>Camp: ${esc(s.fight.camp)} · dzień <b>${s.fight.date}</b> · gaża ${money(s.fight.purse)}</p>${s.day>=s.fight.date?'<button class="primary" onclick="startFight()">WEJDŹ DO KLATKI</button>':'<p class="muted">KONTYNUUJ przesunie kalendarz do dnia walki.</p>'}</div>`:'<div class="panel"><h2>Brak zakontraktowanej walki</h2><p class="muted">Oferta walki pojawi się jako event wymagający decyzji.</p></div>';shell(f+`<div class="cols"><section class="panel"><h2>Oś kariery</h2>${s.log.slice(-12).reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section><section class="panel"><h2>Umiejętności</h2>${Object.entries(s.sk).map(([k,v])=>`<div class="feed"><b>${k}</b> ${v}/100<div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</section></div>`)}
function nextEvent(){let candidates=[];if(s.fight&&s.fight.date>s.day)candidates.push(s.fight.date);let base=s.day+1;for(let i=base;i<=s.day+365;i++){if(i%21===0)candidates.push(i);if(i%35===0&&!s.fight)candidates.push(i);if(i===s.day+14&&s.rep>=8)candidates.push(i)}return Math.min(...candidates.filter(x=>x>s.day),s.day+7)}function continueToEvent(){if(!s.created||s.fight&&s.day>=s.fight.date)return;let target=nextEvent();advance(target-s.day);if(s.fight&&s.day===s.fight.date){startFight();return}if(!s.fight&&s.day%35===0){offerFight();return}if(s.day%21===0){socialEvent();return}if(s.day===14&&s.rep>=8)praiseEvent();else genericEvent()}function advance(n){n=Math.max(0,n);s.day+=n;s.age=18+Math.floor((s.day-1)/365);s.money=Math.max(0,s.money-(s.income&&s.income.job?0:Math.round(n*150)));if(s.income&&s.income.job){let oldMonth=Math.floor((s.day-n)/30),newMonth=Math.floor(s.day/30);if(newMonth>oldMonth)s.money+=3000*(newMonth-oldMonth)}save();dashboard()}
function openEvent(title,head,body,opts){mt.textContent=title;mh.textContent=head;mb.innerHTML=body;mc.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.innerHTML=o[0];b.onclick=o[1];mc.appendChild(b)});modal.style.display='flex'}function closeEvent(){modal.style.display='none';dashboard()}function offerFight(){if(s.fight){return}let opp=opps[Math.floor(Math.random()*opps.length)],purse=2200+s.rep*140+s.w*400;openEvent('EVENT · PROPOZYCJA WALKI','📩 OFERTA WALKI',`<p>Promotor proponuje walkę z <b>${opp}</b> w <b>${league()}</b>.</p><p>Gaża: <b>${money(purse)}</b>.</p><p class="muted">Oferta nie zostanie zaakceptowana automatycznie. Najpierw Twoja decyzja, potem przygotowania.</p>`,[['🥊 AKCEPTUJ WALKĘ',()=>chooseCamp(opp,league(),purse)],['ODRZUĆ WALKĘ',()=>{s.log.push('❌ Odrzucono ofertę z '+opp+'.');save();closeEvent()}]])}function chooseCamp(opp,org,purse){let camps=[['Reykjavík Fight Lab',1200,10,'Kondycja + szybkość'],['WCA Fight Team',3500,14,'Boks + BJJ'],['ANKOS MMA',4200,14,'Zapasy + klincz'],['American Top Team',12000,21,'Pełny profesjonalny camp']];mt.textContent='EVENT · PRZYGOTOWANIE';mh.textContent='🏕️ WYBIERZ CAMP';mb.innerHTML='<p>Rywal: <b>'+opp+'</b> · '+org+' · gaża <b>'+money(purse)+'</b></p><p class="muted">Jeśli nie stać Cię na camp, możesz wybrać przygotowanie własne za 0 zł albo zamknąć okno ×.</p>';mc.innerHTML='';camps.forEach(c=>{let b=document.createElement('button');b.className='camp';b.innerHTML='<b>'+c[0]+'</b><br>'+money(c[1])+' · '+c[2]+' dni · '+c[3];b.onclick=()=>acceptCamp(opp,org,purse,c);mc.appendChild(b)});let free=document.createElement('button');free.className='camp';free.innerHTML='<b>PRZYGOTOWANIE WŁASNE — 0 zł</b><br>7 dni · obecny klub';free.onclick=()=>acceptCamp(opp,org,purse,['Przygotowanie własne',7,0,'Obecny klub']);mc.appendChild(free);modal.style.display='flex'}function acceptCamp(opp,org,purse,c){if(s.money<c[2]){alert('Za mało pieniędzy na ten camp. Wybierz tańszy, przygotowanie własne albo zamknij okno.');return}let date=s.day+c[1]+1;s.money-=c[2];s.fight={opponent:opp,league:org,purse:purse,date:date,camp:c[0],campDays:c[1],round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}};s.log.push('🥊 Zaakceptowano walkę z '+opp+'. Camp: '+c[0]+'. Walka: dzień '+date+'.');save();closeEvent();calendar()}
function socialEvent(){openEvent('EVENT · SOCIAL MEDIA','💬 ZACZEPKA','<p>Rywal wrzuca: <b>„Dużo szczekasz jak na kogoś, kto jeszcze nie ma kogo pokonać.”</b></p><p class="muted">Wybierz konkretną odpowiedź — ton buduje Twoją medialną personę.</p>',[['„Szczekanie zostawmy Tobie. Ja robię to rękami.”',()=>social(3,500)],['„Podpisz kontrakt, to odpowiem bez klawiatury.”',()=>social(2,350)],['„Dzięki za zasięg. Następnym razem oznacz mnie, będzie taniej.”',()=>social(2,450)],['Nie odpowiadam. Nie każdy bait zasługuje na konferencję.',()=>social(0,50)]])}function praiseEvent(){openEvent('EVENT · SOCIAL MEDIA','👏 POCHWAŁA','<p>Popularny profil pisze: <b>„Ten zawodnik zaczyna wyglądać jak poważny problem.”</b></p>',[['„Zaczyna? Poczekajcie na następną walkę.”',()=>social(2,400)],['„Niech mówią. Ja mam robotę do zrobienia.”',()=>social(1,250)],['„W końcu ktoś się zorientował 😂”',()=>social(2,450)]])}function social(r,i){s.rep=Math.min(100,s.rep+r);s.ig+=i;s.log.push('📱 Reakcja medialna.');save();closeEvent()}function genericEvent(){openEvent('EVENT · KARIERA','📨 NOWE ZDARZENIE','<p>Pojawiło się wydarzenie wymagające Twojej decyzji.</p>',[['KONTYNUUJ KARIĘ',closeEvent]])}
function calendar(){s.screen='calendar';let start=Math.max(1,s.day-3),cells='';for(let i=start;i<start+28;i++){let f=s.fight&&s.fight.date===i;cells+=`<div class="day ${f?'fight':''} ${i===s.day?'today':''}"><b>Dzień ${i}</b>${f?`<div class="gold">🥊 ${esc(s.fight.opponent)}</div><small>${esc(s.fight.camp)}</small>`:''}</div>`}shell(`<section class="panel"><h2>📅 Kalendarz kariery</h2><p>Aktualny dzień: <b>${s.day}</b> · wiek: <b>${s.age}</b></p><div class="calendar">${cells}</div></section>`)}function training(){s.screen='training';let cs=[['Lokalny klub',0,{Boks:2,Szybkość:1}],['ANKOS MMA',10,{Zapasy:3,Kondycja:2}],['WCA Fight Team',20,{BJJ:3,Zapasy:2}],['American Top Team',65,{Boks:2,BJJ:2,Kondycja:3}]];shell(`<section class="panel"><h2>🥊 Trening</h2><div class="tiles">${cs.map(c=>`<div class="tile"><h3>${c[0]}</h3><p>Wymagana reputacja: ${c[1]}</p><p>${Object.entries(c[2]).map(x=>x[0]+' +'+x[1]).join(' · ')}</p><button ${s.rep<c[1]?'disabled':''} onclick="train('${c[0]}')">TRENUJ · 500 zł</button></div>`).join('')}</div></section>`);window.cs=cs}function train(n){let c=cs.find(x=>x[0]===n);if(s.money<500){alert('Za mało pieniędzy.');return}s.money-=500;Object.entries(c[2]).forEach(([k,v])=>s.sk[k]=Math.min(100,s.sk[k]+v));s.club=n;s.log.push('🏋️ Trening: '+n);save();training()}
function fights(){s.screen='fights';shell(`<section class="panel"><h2>🏆 Walki</h2>${s.fight?`<div class="hero"><b>${esc(s.fight.opponent)}</b> · ${esc(s.fight.league)} · dzień ${s.fight.date}<br>Camp: ${esc(s.fight.camp)}${s.day>=s.fight.date?'<br><button class="primary" onclick="startFight()">WEJDŹ DO KLATKI</button>':''}</div>`:'<p>Brak aktywnej walki. Oferta pojawi się przez KONTYNUUJ.</p>'}${s.history.slice().reverse().map(h=>`<div class="feed">${h.win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA'} · ${h.method} · ${esc(h.opponent)} · ${esc(h.league)}</div>`).join('')}</section>`)}function career(){s.screen='career';shell(`<section class="panel"><h2>📋 Kariera / Sharedok</h2><p>${esc(s.first)} ${esc(s.last)} · ${esc(s.type)} · ${esc(s.weight)}</p><p>Rekord: <b>${s.w}-${s.l}-${s.d}</b></p>${s.history.map((h,i)=>`<div class="feed">${i+1}. ${h.win?'WIN':'LOSS'} — ${esc(h.opponent)} — ${h.method}</div>`).join('')||'<p class="muted">Brak walk.</p>'}</section>`)}function media(){s.screen='media';let a=s.day>=s.media.interviewUntil,b=s.day>=s.media.postUntil,c=s.day>=s.media.controversyUntil;shell(`<section class="panel"><h2>📱 Media</h2><div class="tiles"><div class="tile"><h3>Wywiad</h3><p>Raz na 14 dni.</p><button ${a?'':'disabled'} onclick="useMedia('interview')">UDZIEL WYWIADU</button></div><div class="tile"><h3>Post</h3><p>Raz na 7 dni.</p><button ${b?'':'disabled'} onclick="useMedia('post')">WRZUĆ POST</button></div><div class="tile"><h3>Kontrowersja</h3><p>Raz na 60 dni.</p><button ${c?'':'disabled'} onclick="useMedia('controversy')">ZAGRAJ VA BANQUE</button></div></div></section>`)}function useMedia(k){if(k==='interview'&&s.day<s.media.interviewUntil||k==='post'&&s.day<s.media.postUntil||k==='controversy'&&s.day<s.media.controversyUntil)return;if(k==='interview'){s.media.interviewUntil=s.day+14;s.rep=Math.min(100,s.rep+2);s.ig+=250}else if(k==='post'){s.media.postUntil=s.day+7;s.rep=Math.min(100,s.rep+1);s.ig+=300}else{s.media.controversyUntil=s.day+60;s.rep=Math.min(100,s.rep+4);s.ig+=700}s.log.push('📱 Aktywność medialna.');save();media()}
function manager(){s.screen='manager';if(!s.manager&&s.ig>=5000)return managerOffer();shell(`<section class="panel"><h2>💼 Menedżer</h2>${s.manager?`<p><b>${esc(s.manager.name)}</b> · prowizja ${s.manager.fee}%</p><p>Umowa jednorazowa. Sponsorzy: ${s.sponsors.length}</p><button class="primary" onclick="sponsorOffer()">OFERTY SPONSORSKIE</button>`:`<p>Manager dostępny od <b>5000 obserwujących</b>.</p>`}</section>`)}function managerOffer(){openEvent('EVENT · MENEDŻER','💼 KTOŚ CHCE CIĘ REPREZENTOWAĆ','<p>Masz już 5000+ obserwujących. Trzech managerów chce wejść do gry.</p>',[['Marek Kowalski Management · 10% · lokalni sponsorzy',()=>signManager('Marek Kowalski Management',10)],['North Fight Management · 15% · media i kontakty zagraniczne',()=>signManager('North Fight Management',15)],['Elite Combat Group · 20% · duże gale i PR',()=>signManager('Elite Combat Group',20)]])}function signManager(n,f){s.manager={name:n,fee:f};s.log.push('💼 Podpisano managera: '+n+'.');save();closeEvent();sponsorOffer()}function sponsorOffer(){let sp=[['Fight Gear','500 zł/mies. + odzież'],['Suplementy','900 zł/mies. + suplementacja'],['Dieta pudełkowa','1800 zł/mies. + posiłki'],['Sponsor odzieżowy','3500 zł/mies. + sprzęt i ekspozycja'],['Partner lokalny','2500 zł/mies. + reklama']];openEvent('EVENT · SPONSOR','🤝 OFERTY SPONSORSKIE','<p>Manager przyniósł realne typy współprac: sprzęt, dieta, suplementacja i ekspozycja.</p>',sp.map(x=>[x[0]+' · '+x[1],()=>{s.sponsors.push(x[0]);s.log.push('🤝 Sponsor: '+x[0]);save();closeEvent();manager()}]))}
function finance(){s.screen='finance';let gate=s.day>=s.income.gateUntil,ad=s.day>=s.income.adUntil;shell(`<section class="panel"><h2>💰 Finanse</h2><div class="tiles"><div class="tile"><h3>🚪 Bramka / ochrona</h3><p>700 zł · raz na 7 dni</p><button ${gate?'':'disabled'} onclick="earn('gate')">WEŹ ZLECENIE</button></div><div class="tile"><h3>🧾 Etat miesięczny</h3><p>3000 zł/miesiąc · możesz zrezygnować</p>${s.income.job?'<button onclick="s.income.job=false;save();finance()">ZREZYGNUJ Z ETATU</button>':'<button onclick="s.income.job=true;save();finance()">PODEJMIJ ETAT</button>'}</div><div class="tile"><h3>📺 Reklama</h3><p>8000 zł · od 35 reputacji lub 10000 IG</p><button ${(s.rep>=35||s.ig>=10000)&&ad?'':'disabled'} onclick="earn('ad')">PRZYJMIJ REKLAMĘ</button></div></div><p class="muted">Dodatkowe źródła dochodu nie zmieniają organizacji sportowej.</p></section>`)}function earn(k){if(k==='gate'){s.money+=700;s.income.gateUntil=s.day+7;s.log.push('💰 Zlecenie: bramka/ochrona +700 zł')}else{s.money+=8000;s.income.adUntil=s.day+60;s.log.push('💰 Udział w reklamie +8000 zł')}save();finance()}function statistics(){s.screen='statistics';shell(`<section class="panel"><h2>📊 Statystyki</h2><div class="tiles"><div class="tile">Walki <b>${s.w+s.l+s.d}</b></div><div class="tile">Win rate <b>${s.w+s.l+s.d?Math.round(s.w/(s.w+s.l+s.d)*100):0}%</b></div><div class="tile">KO/TKO <b>${s.history.filter(x=>x.method==='KO/TKO').length}</b></div><div class="tile">Submission <b>${s.history.filter(x=>x.method==='SUBMISSION').length}</b></div></div></section>`)}function events(){s.screen='events';shell(`<section class="panel"><h2>◉ Eventy</h2>${s.log.slice().reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section>`)}
function startFight(){if(!s.fight)return;if(s.day<s.fight.date){alert('Walka jest dnia '+s.fight.date);return}paused=false;renderFight();last=performance.now();cancelAnimationFrame(timerRAF);timerRAF=requestAnimationFrame(fightLoop)}function renderFight(){let f=s.fight;document.getElementById('app').innerHTML=`<div class="fight"><div class="top"><div><small class="gold">${esc(f.league)}</small><h1>${esc(s.first)} vs ${esc(f.opponent)}</h1><p class="muted">Dzień ${s.day} · ${esc(f.camp)}</p></div><button onclick="dashboard()">OPUŚĆ</button></div><div class="fighttop"><div class="fighter"><h2>${esc(s.first)}</h2><p>Witalność <b id="hp1">100</b>%</p><div class="hp"><i id="bar1" style="width:100%"></i></div><p>Stamina <b id="st1">100</b>%</p><div class="hp"><i id="bars1" style="width:100%"></i></div></div><div class="timer" id="timer" style="--pct:100%"><div class="timerText"><div id="round" class="round">RUNDA 1 / 3</div><div id="clock" class="clock">05:00</div><small>ZEGAR ×4</small></div></div><div class="fighter"><h2>${esc(f.opponent)}</h2><p>Witalność <b id="hp2">100</b>%</p><div class="hp"><i id="bar2" style="width:100%"></i></div><p>Stamina <b id="st2">100</b>%</p><div class="hp"><i id="bars2" style="width:100%"></i></div></div></div><div id="comment" class="comment">JURAS: Zaczynamy. Zobaczymy, kto narzuci tempo.</div><div class="actions">${ab('Jab / prosty','jab',3)}${ab('Low kick','low',3)}${ab('High kick 🎡','high',2)}${ab('Latające kolano 🎡','flying',2)}${ab('Spinning backfist 🎡','spin',2)}${ab('Obalenie 🎡','takedown',2)}${ab('Balacha 🎡','armbar',2)}${ab('Trójkąt 🎡','triangle',2)}${ab('RNC 🎡','rnc',2)}</div><div id="flog" class="panel log"></div></div>`}function ab(n,k,m){return`<button id="a-${k}" onclick="fightAction('${k}')">${n}<small id="u-${k}">0/${m}</small></button>`}function fightLoop(now){if(!s.fight)return;if(paused){timerRAF=requestAnimationFrame(fightLoop);return}let dt=Math.min(.05,(now-last)/1000);last=now;let f=s.fight;f.time-=dt*4;f.stamina=Math.max(0,f.stamina-dt*.6);f.oppStamina=Math.max(0,f.oppStamina-dt*.5);if(Math.random()<dt*.65)exchange();updateFight();if(f.vitality<=0)return finishFight(false,'KO/TKO');if(f.oppVitality<=0)return finishFight(true,'KO/TKO');if(f.time<=0)return endRound();timerRAF=requestAnimationFrame(fightLoop)}function exchange(){let f=s.fight;f.oppVitality=Math.max(0,f.oppVitality-(.7+Math.random()*1.7));f.vitality=Math.max(0,f.vitality-(.5+Math.random()*1.4));f.comment=['JURAS: Rywal odpowiada, mamy wymianę w półdystansie.','JURAS: Presja pod siatką, ale dobrze pracujesz nogami.','JURAS: Tempo jest wysokie, trzeba pilnować staminy.'][Math.floor(Math.random()*3)];logF(f.comment)}function updateFight(){let f=s.fight,e=id=>document.getElementById(id);if(!e('timer'))return;e('timer').style.setProperty('--pct',Math.max(0,f.time/300*100)+'%');e('clock').textContent=String(Math.floor(f.time/60)).padStart(2,'0')+':'+String(Math.ceil(f.time%60)).padStart(2,'0');e('round').textContent=`RUNDA ${f.round} / 3`;[['hp1',f.vitality,'bar1'],['st1',f.stamina,'bars1'],['hp2',f.oppVitality,'bar2'],['st2',f.oppStamina,'bars2']].forEach(x=>{e(x[0]).textContent=Math.round(x[1]);e(x[2]).style.width=Math.max(0,x[1])+'%'});e('comment').textContent=f.comment||'';Object.entries({jab:3,low:3,high:2,flying:2,spin:2,takedown:2,armbar:2,triangle:2,rnc:2}).forEach(([k,m])=>{document.getElementById('u-'+k).textContent=(f.uses[k]||0)+'/'+m;document.getElementById('a-'+k).disabled=(f.uses[k]||0)>=m||paused})}function logF(x){let e=document.getElementById('flog');if(e)e.innerHTML='<div class="feed">'+esc(x)+'</div>'+e.innerHTML}function fightAction(k){let f=s.fight,max={jab:3,low:3,high:2,flying:2,spin:2,takedown:2,armbar:2,triangle:2,rnc:2}[k];if((f.uses[k]||0)>=max||paused)return;f.uses[k]=(f.uses[k]||0)+1;if(k==='jab'){f.oppVitality=Math.max(0,f.oppVitality-3.5);f.stamina=Math.max(0,f.stamina-2);f.comment='JURAS: Prosty dochodzi. Limitujemy go, żeby nie dało się spamować.';logF(f.comment);updateFight();return}if(k==='low'){f.oppVitality=Math.max(0,f.oppVitality-5);f.oppStamina=Math.max(0,f.oppStamina-3);f.stamina=Math.max(0,f.stamina-3);f.comment='JURAS: Low kick trafia w nogę.';logF(f.comment);updateFight();return}pending=k;paused=true;wa.textContent=({high:'HIGH KICK',flying:'LATAJĄCE KOLANO',spin:'SPINNING BACKFIST',takedown:'OBALENIE',armbar:'BALACHA',triangle:'TRÓJKĄT',rnc:'RNC'})[k];wr.textContent='LOSUJ EFEKT';wheel.style.transform='rotate(0deg)';spin.disabled=false;wheelModal.style.display='grid'}spin.onclick=()=>{if(!pending)return;spin.disabled=true;let r=Math.random(),out=r<.45?'FULL':r<.78?'PARTIAL':'FAIL',seg=out==='FULL'?[0,4,7][Math.floor(Math.random()*3)]:out==='PARTIAL'?[2,5][Math.floor(Math.random()*2)]:[1,3,6][Math.floor(Math.random()*3)],center=seg*45+22.5;wheel.style.transform=`rotate(${1800+(360-center)}deg)`;setTimeout(()=>{wr.textContent=out==='FULL'?'PEŁNY SUKCES':out==='PARTIAL'?'CZĘŚCIOWY SUKCES':'NIEUDANA TECHNIKA';applySpecial(out);setTimeout(()=>{wheelModal.style.display='none';pending=null;paused=false;last=performance.now();timerRAF=requestAnimationFrame(fightLoop)},1200)},2800)};function applySpecial(out){let f=s.fight,name=({high:'High kick',flying:'Latające kolano',spin:'Spinning backfist',takedown:'Obalenie',armbar:'Balacha',triangle:'Trójkąt',rnc:'RNC'})[pending],d={"High kick":17,"Latające kolano":15,"Spinning backfist":14,"Obalenie":9,"Balacha":18,"Trójkąt":17,RNC:20}[name];if(out==='FULL'){f.oppVitality=Math.max(0,f.oppVitality-d*1.45);f.oppStamina=Math.max(0,f.oppStamina-10);f.comment='JURAS: '+name+' — PEŁNY SUKCES! Kapitalne wykonanie.'}else if(out==='PARTIAL'){f.oppVitality=Math.max(0,f.oppVitality-d*.65);f.oppStamina=Math.max(0,f.oppStamina-5);f.comment='JURAS: '+name+' — CZĘŚCIOWY SUKCES. Jest efekt, ale nie weszło czysto.'}else{f.vitality=Math.max(0,f.vitality-4);f.stamina=Math.max(0,f.stamina-15);f.comment='JURAS: '+name+' — NIEUDANA TECHNIKA! Rywal wykorzystał moment.'}logF(f.comment);updateFight()}function endRound(){let f=s.fight,my=(100-f.oppVitality)+(f.stamina>f.oppStamina?6:0),op=(100-f.vitality)+(f.oppStamina>f.stamina?6:0);f.score.push(my>=op?10:9);if(f.round>=3)return finishFight(f.score.filter(x=>x===10).length>=2,'DECYZJA');f.round++;f.time=300;f.stamina=Math.min(100,f.stamina+25);f.oppStamina=Math.min(100,f.oppStamina+22);f.comment='JURAS: Koniec rundy. Punktacja: '+f.score[f.score.length-1]+'-'+(f.score[f.score.length-1]===10?9:10)+'.';logF(f.comment);updateFight()}
function finishFight(win,method){cancelAnimationFrame(timerRAF);let f=s.fight;s.money+=f.purse;if(win){s.w++;s.rep=Math.min(100,s.rep+(method==='KO/TKO'?6:4));s.ig+=300}else{s.l++;s.rep=Math.max(0,s.rep-2);s.ig=Math.max(0,s.ig-50)}s.media={interviewUntil:s.day+14,postUntil:s.day+7,controversyUntil:s.day+60};s.history.push({win,method,opponent:f.opponent,league:f.league,purse:f.purse});s.log.push((win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA')+' z '+f.opponent+' przez '+method+'.');s.fight=null;save();winner.textContent=win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA';methodEl=method;document.getElementById('method').textContent=method;summary.textContent=s.first+' '+s.last+' '+(win?'pokonuje':'przegrywa z')+' '+f.opponent+'.';postfight.style.display='grid';challenge.classList.add('hidden');ptext.classList.add('hidden');back.classList.add('hidden');resultModal.style.display='grid'}function postfight(k){if(k==='challenge'){postfightChoices();return}let txt={corner:'Dziękuję mojemu narożnikowi. Bez nich nie byłoby tej walki.',joke:'Mówili, że cardio będzie problemem. Chyba mam drugie płuca.',respect:'Szacunek dla rywala. To była dobra walka.',fans:'Dziękuję wszystkim kibicom.',belt:'Nie przyszedłem tutaj po jedną wygraną. Idę po pas.'}[k];s.rep=Math.min(100,s.rep+(k==='belt'?5:2));s.ig+=k==='joke'?800:300;s.log.push('🎙️ Wywiad po walce.');save();postfight.style.display='none';ptext.classList.remove('hidden');ptext.innerHTML='<b>Twój wywiad:</b><br>'+esc(txt);back.classList.remove('hidden')}function postfightChoices(){postfight.style.display='none';challenge.classList.remove('hidden');challenge.innerHTML='<h3>Wybierz rywala</h3>'+opps.map(o=>`<button onclick="challengeNow('${esc(o)}')">${esc(o)}</button>`).join('')}function challengeNow(o){s.rep=Math.min(100,s.rep+6);s.ig+=1000;s.log.push('🔥 Wyzwanie: '+o);save();challenge.classList.add('hidden');ptext.classList.remove('hidden');ptext.innerHTML='<b>Twój callout:</b><br>„Chcę walki z '+esc(o)+'. Zróbmy to w następnej gali.”';back.classList.remove('hidden')}function closeResult(){resultModal.style.display='none';dashboard()}function fightsDummy(){}
function init(){if(!s.created)creator();else dashboard()}init();</script></body></html>
