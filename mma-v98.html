<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V98</title><style>body{margin:0;background:#071018;color:#eee;font:15px Arial}.loading{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#173d4c,#05090d 65%)}.box{padding:32px;text-align:center;border:1px solid #d6ae51;border-radius:16px;background:#101c25;max-width:520px}h1{color:#d6ae51}.err{color:#ef6b72}</style></head><body><div class="loading"><div class="box"><h1>MMA CAREER SIMULATOR</h1><p>Uruchamiam stabilną bazę V96…</p><p>Przygotowuję walutę PLN i obóz przygotowawczy.</p></div></div><script>
(async function(){
try{
 const res=await fetch('./mma-v96.html?v98=1',{cache:'no-store'});
 if(!res.ok) throw new Error('Baza V96 nie jest dostępna.');
 let h=await res.text();
 h=h.replace(/MMA Career Simulator V96/g,'MMA Career Simulator V98');
 h=h.replace(/ISK/g,'PLN');
 h=h.replace(/function camp\(i\)\{[\s\S]*?\}function closeModal/,`function camp(i){var c=CLUBS[i];if(s.rep<c.req||s.money<c.cost)return;s.money-=c.cost;s.gym=c.n;s.mot=Math.min(100,s.mot+6);Object.keys(c.g).forEach(function(k){s.sk[k]=Math.min(100,s.sk[k]+c.g[k])});if(s.fight){var days=s.fight.days||21;s.camp={club:c.n,days:days};s.log.unshift('🥋 Rozpoczęto pełny '+days+'-dniowy obóz w '+c.n+'.');s.fight.days=0;}else{s.log.unshift('🥋 Trening w '+c.n+': '+Object.keys(c.g).map(function(k){return '+'+c.g[k]+' '+k}).join(', ')+'.');}closeModal();dashboard()}function closeModal`);
 h=h.replace(/function training\(\)\{[\s\S]*?\}function camp/,`function training(){var html='<div class="modal"><div class="modalbox"><small class="gold">OBÓZ PRZYGOTOWAWCZY</small><h1>'+(s.fight?'Wybierz klub na cały obóz':'Wybierz trening')+'</h1><p class="muted">'+(s.fight?'Wybierasz jeden główny klub na cały okres przygotowawczy. Po wyborze obóz jest rozliczany, statystyki rosną, a walka jest od razu gotowa do rozpoczęcia.':'Rozwijaj umiejętności przed walką.')+'</p>';CLUBS.forEach(function(c){var ok=s.rep>=c.req&&s.money>=c.cost;html+='<div class="club '+(ok?'':'locked')+'"><h3>'+c.n+' · '+c.city+'</h3><p>'+c.desc+'</p><span class="pill">REP '+c.req+'</span><span class="pill">'+c.cost+' PLN</span><span class="pill">'+(s.fight?(s.fight.days||21):c.days)+' dni</span><p class="green">'+Object.keys(c.g).map(function(k){return '+'+c.g[k]+' '+k}).join(' · ')+'</p><button class="'+(ok?'primary':'btn')+'" '+(ok?'':'disabled')+' onclick="camp('+CLUBS.indexOf(c)+')">'+(ok?'WYBIERAM TEN CAMP':'NIEDOSTĘPNY')+'</button></div>'});html+='<button class="btn" onclick="closeModal()">WRÓĆ</button></div></div>';app.insertAdjacentHTML('beforeend',html)}function camp`);
 h=h.replace(/function fights\(\)\{[\s\S]*?\}function startFight/,`function fights(){if(!s.fight)return modal('WALKI','Nie masz aktywnej walki. Kolejna oferta pojawi się w wydarzeniach.');if(s.fight.days>0)return modalChoices('OKRES PRZYGOTOWAWCZY','Najpierw wybierz klub na cały obóz przygotowawczy.',[['WYBIERZ CAMP',training],['WRÓĆ',dashboard]]);modalChoices('WALKA GOTOWA','Rywal: '+s.fight.opponent+' · obóz zakończony · gaża '+s.fight.purse+' PLN.',[['WEJDŹ DO WALKI',function(){startFight()}],['WRÓĆ',dashboard]])}function startFight`);
 document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><h1 class="err">Błąd uruchamiania</h1><p>'+e.message+'</p><p>Odśwież stronę za chwilę.</p></div></div>';}
})();</script></body></html>
