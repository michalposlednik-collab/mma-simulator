<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V125</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.event{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99999;padding:18px;font:15px Arial;color:#eef3f5}.box{position:relative;width:min(760px,96vw);max-height:90vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:25px;box-shadow:0 20px 60px #000}.box h1{margin:7px 0 15px}.gold{color:#d6ae51}.muted{color:#91a3ac}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button,.camp{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:14px;border-radius:9px;font-weight:700}.actions button:hover,.camp:hover{border-color:#d6ae51}.primary{background:#80652a!important;border-color:#d6ae51!important}.close{position:absolute;right:12px;top:10px;background:transparent!important;border:0!important;color:#a8b5ba!important;font-size:27px;padding:3px!important}.continue{position:fixed;right:24px;top:20px;z-index:5000;display:none;cursor:pointer;color:#fff;background:#80652a;border:1px solid #d6ae51;padding:12px 18px;border-radius:10px;font-weight:900;box-shadow:0 8px 25px #0008}.camp{display:block;width:100%;text-align:left;margin:9px 0}.free{background:#241918!important;border-color:#a8564d!important}@media(max-width:600px){.actions{grid-template-columns:1fr}.continue{right:10px;top:10px}}</style></head><body><iframe id="game"></iframe><button id="continue" class="continue">▶ KONTYNUUJ DO NASTĘPNEGO EVENTU</button><div id="event" class="event"><div class="box"><button id="close" class="close" aria-label="Zamknij">×</button><small id="type" class="gold"></small><h1 id="title"></h1><div id="body"></div><div id="actions" class="actions"></div></div></div><script>(function(){'use strict';const KEY='mmaCareerV111',frame=document.getElementById('game'),cont=document.getElementById('continue'),modal=document.getElementById('event'),type=document.getElementById('type'),title=document.getElementById('title'),body=document.getElementById('body'),actions=document.getElementById('actions'),close=document.getElementById('close');let paused=false,observer=null;const EVENT_DAYS=[7,14,21,30,45,60,75];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(s){localStorage.setItem(KEY,JSON.stringify(s))}function career(s){return s&&s.created===true&&s.first&&s.last&&s.type&&s.weight&&Number.isFinite(Number(s.day))}function hideBaseModal(){try{const d=frame.contentDocument;if(!d)return;const m=d.getElementById('modal');if(m)m.style.display='none';let st=d.getElementById('v125-hide-base-modal');if(!st){st=d.createElement('style');st.id='v125-hide-base-modal';st.textContent='#modal{display:none!important}';d.head.appendChild(st)}if(!observer){observer=new MutationObserver(()=>{const x=d.getElementById('modal');if(x)x.style.display='none'});observer.observe(d.body,{subtree:true,attributes:true,attributeFilter:['style','class']})}}catch(e){}}function redraw(){try{const w=frame.contentWindow;if(w&&typeof w.dashboard==='function')w.dashboard()}catch(e){}}function closeEvent(){modal.style.display='none';paused=false;redraw();sync()}close.addEventListener('click',closeEvent);function show(t,ty,b,buttons){type.textContent=ty;title.textContent=t;body.innerHTML=b;actions.innerHTML='';buttons.forEach(a=>{const el=document.createElement('button');el.textContent=a.label;el.dataset.action=a.id;if(a.primary)el.className='primary';actions.appendChild(el)});modal.style.display='flex';paused=true;hideBaseModal()}actions.addEventListener('click',function(e){const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.action;if(id==='accept-fight'){const p=pendingOffer;campOffer(p.opp,p.org,p.purse)}else if(id==='reject-fight'){const s=read();if(s){s.log=s.log||[];s.log.push('❌ Odrzucono ofertę walki.');write(s)}closeEvent()}else if(id==='social1'){react(3)}else if(id==='social2'){react(2)}else if(id==='social3'){react(1)}else if(id==='social0'){react(0)}else if(id==='generic-close'){closeEvent()}});let pendingOffer=null;function nextDay(s){const now=Number(s.day)||1;if(s.fight&&s.fight.managed&&Number(s.fight.date)>now)return Number(s.fight.date);return EVENT_DAYS.find(d=>d>now)||now+7}function advance(){const s=read();if(!career(s)||paused)return;if(s.fight&&s.fight.managed&&Number(s.fight.date)>Number(s.day)){const target=Number(s.fight.date);const days=target-Number(s.day);s.day=target;s.age=18+Math.floor((target-1)/365);s.money=Math.max(0,Number(s.money||0)-days*100);s.log=s.log||[];s.log.push('📅 Kalendarz przesunięty do dnia '+target+'.');write(s);redraw();startFight();return}const target=nextDay(s),days=target-Number(s.day);s.day=target;s.age=18+Math.floor((target-1)/365);s.money=Math.max(0,Number(s.money||0)-days*100);s.log=s.log||[];s.log.push('📅 Kalendarz przesunięty o '+days+' dni.');write(s);redraw();triggerEvent(target)}function triggerEvent(day){if([7,30,45,60,75].includes(day)){fightOffer();return}if([14,45].includes(day)){praise();return}if([21,60].includes(day)){social();return}generic()}function fightOffer(){const s=read();if(!career(s)|| (s.fight&&s.fight.managed&&Number(s.fight.date)>Number(s.day)))return;const opp=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek'][Math.floor(Math.random()*5)];const w=Number(s.w||0);const org=w<2?'Lokalna gala':w<4?'Hybrid':w<7?'Babilon MMA / FEN':w<10?'KSW':w<13?'OKTAGON':w<16?'Cage Warriors':w<19?'PFL':'UFC';const purse=w<2?1800:w<4?3000:w<7?5000:w<10?8000:12000;pendingOffer={opp,org,purse};show('OFERTA WALKI','EVENT · PROPOZYCJA WALKI','<p><b>'+opp+'</b> czeka na Ciebie w organizacji <b>'+org+'</b>.</p><p>Gaża: <b>'+purse.toLocaleString('pl-PL')+' zł</b>.</p><p class="muted">To jest oferta do Twojej decyzji. Nic nie zostaje zaakceptowane automatycznie.</p>',[{id:'accept-fight',label:'🥊 AKCEPTUJ WALKĘ',primary:true},{id:'reject-fight',label:'ODRZUĆ WALKĘ'}])}function campOffer(opp,org,purse){const s=read();const camps=[['Reykjavík Fight Lab',10,1200,'Kondycja + szybkość'],['WCA Fight Team',14,3500,'Boks + BJJ'],['ANKOS MMA',14,4200,'Zapasy + praca pod klatką'],['American Top Team',21,12000,'Pełny profesjonalny camp']];type.textContent='EVENT · PRZYGOTOWANIE';title.textContent='WYBIERZ OBÓZ PRZYGOTOWAWCZY';body.innerHTML='<p>Rywal: <b>'+opp+'</b> · '+org+' · gaża <b>'+purse.toLocaleString('pl-PL')+' zł</b></p><p class="muted">Jeśli nie stać Cię na camp, możesz zamknąć okno × albo wybrać przygotowanie własne za 0 zł.</p>';actions.innerHTML='';camps.forEach((c,i)=>{const b=document.createElement('button');b.className='camp';b.textContent=c[0]+' — '+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł · '+c[3];b.dataset.camp=String(i);actions.appendChild(b)});const free=document.createElement('button');free.className='camp free';free.textContent='PRZYGOTOWANIE WŁASNE — 7 dni · 0 zł';free.dataset.camp='free';actions.appendChild(free);actions.onclick=function(e){const b=e.target.closest('[data-camp]');if(!b)return;const c=b.dataset.camp==='free'?['Przygotowanie własne',7,0,'Trening w obecnym klubie']:camps[Number(b.dataset.camp)];const fresh=read();if(Number(fresh.money||0)<c[2]){body.innerHTML+='<p style="color:#df5045"><b>Brakuje Ci '+(c[2]-Number(fresh.money||0)).toLocaleString('pl-PL')+' zł.</b> Wybierz tańszy camp, przygotowanie własne albo ×.</p>';return}const date=Number(fresh.day)+c[1]+1;fresh.money-=c[2];fresh.fight={managed:true,opponent:opp,league:org,purse,date,camp:c[0],campDays:c[1],round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}};fresh.log=fresh.log||[];fresh.log.push('🥊 Zaakceptowano walkę z '+opp+'. Camp: '+c[0]+'. Dzień walki: '+date+'.');write(fresh);actions.onclick=null;closeEvent()};paused=true}function social(){show('KOLEJNA DRAMA W SOCIALACH','EVENT · SOCIAL MEDIA','<p>Rywal odpala komentarz: <b>„Dużo szczekasz jak na gościa, którego jeszcze nikt nie zna.”</b></p><p class="muted">Wybierz konkretną odpowiedź — od ostrej riposty po świadome przemilczenie.</p>',[{id:'social1',label:'„Szczekanie zostawmy Tobie. Ja robię to rękami.”',primary:true},{id:'social2',label:'„Podpisz kontrakt. Resztę załatwimy bez klawiatury.”'},{id:'social3',label:'„Dzięki za zasięg. Następnym razem oznacz mnie, będzie taniej.”'},{id:'social0',label:'„Nie będę robił kariery w komentarzach.”'}])}function praise(){show('POCHWAŁA W SOCIALACH','EVENT · SOCIAL MEDIA','<p>Popularny profil MMA pisze: <b>„Ten zawodnik zaczyna wyglądać jak poważny problem.”</b></p>',[{id:'social2',label:'„Zaczyna? Poczekajcie na następną walkę.”',primary:true},{id:'social3',label:'„W końcu ktoś się zorientował 😂”'},{id:'social0',label:'Udostępniam bez komentarza.'}])}function react(n){const s=read();s.rep=Math.max(0,Math.min(100,Number(s.rep||0)+n));s.ig=Math.max(0,Number(s.ig||0)+n*200);s.log=s.log||[];s.log.push('📱 Odpowiedź w social mediach.');write(s);closeEvent()}function generic(){show('WAŻNY MOMENT','EVENT · KARIERA','<p>Pojawiło się wydarzenie wymagające Twojej decyzji.</p>',[{id:'generic-close',label:'KONTYNUUJ',primary:true}])}function startFight(){try{const w=frame.contentWindow;if(w&&typeof w.startFight==='function')w.startFight()}catch(e){}}function sync(){const s=read();cont.style.display=career(s)?'block':'none';hideBaseModal();if(s&&s.fight&&!s.fight.managed){delete s.fight;write(s)}}cont.addEventListener('click',advance);function installBaseShield(){hideBaseModal();setTimeout(hideBaseModal,100);setTimeout(hideBaseModal,500)}frame.addEventListener('load',installBaseShield);const freshKey='mmaV125Fresh';if(sessionStorage.getItem(freshKey)!=='1'){localStorage.removeItem(KEY);sessionStorage.setItem(freshKey,'1')}frame.src='./mma-v111.html?v=125base&x='+Date.now();setInterval(sync,600);})();</script></body></html>
