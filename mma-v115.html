<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V115</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="game" src="./mma-v111.html?v=115"></iframe><script>(function(){'use strict';const f=document.getElementById('game');let modalOpen=false,lastDay=null;const KEY='mmaCareerV111';function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(s){localStorage.setItem(KEY,JSON.stringify(s))}function W(){return f.contentWindow}function D(){return f.contentDocument}function modal(title,head,body,buttons){const d=D(),box=d.getElementById('modal'),mc=d.getElementById('mc');if(!box||!mc)return;d.getElementById('mt').textContent=title;d.getElementById('mh').textContent=head;d.getElementById('mb').innerHTML=body;mc.innerHTML='';buttons.forEach(x=>{const b=d.createElement('button');b.className='option';b.innerHTML=x[0];b.addEventListener('click',x[1]);mc.appendChild(b)});box.style.display='flex';modalOpen=true}function close(){const x=D().getElementById('modal');if(x)x.style.display='none';modalOpen=false}function saveDashboard(){const w=W();if(typeof w.dashboard==='function')w.dashboard()}function acceptFight(opponent,offerDay){close();modal('DECYZJA SPORTOWA','🏕️ WYBIERZ OBÓZ PRZYGOTOWAWCZY','<p>Najpierw wybierz obóz. Termin walki zostanie wpisany do kalendarza i czas będzie płynął do tego dnia.</p>',[['🥊 Reykjavík Fight Lab<br><small>1 200 zł · 10 dni</small>',()=>camp(opponent,'Reykjavík Fight Lab',1200,10)],['🥊 WCA Fight Team<br><small>3 500 zł · 14 dni</small>',()=>camp(opponent,'WCA Fight Team',3500,14)],['🥊 ANKOS MMA<br><small>4 200 zł · 14 dni</small>',()=>camp(opponent,'ANKOS MMA',4200,14)],['🥊 UFC Performance Institute<br><small>12 000 zł · 21 dni</small>',()=>camp(opponent,'UFC Performance Institute',12000,21)]])}function camp(opponent,name,cost,days){const s=read();if(!s)return;if(s.money<cost){modal('BRAK ŚRODKÓW','Nie stać Cię na ten obóz','Wybierz krótszy lub tańszy camp.',[['WRÓĆ',()=>acceptFight(opponent,s.day)]]);return}s.money-=cost;s.fight={opponent:opponent,league:typeof W().league==='function'?W().league():'Lokalna gala',purse:Math.max(2500,s.rep*150+s.w*450+2500),round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0},comment:'JURAS: Camp rozpoczęty. Teraz liczy się konsekwencja.',date:s.day+days+7,camp:name,campDays:days};s.log=s.log||[];s.log.push('🥊 Przyjęto walkę z '+opponent+'. Camp: '+name+'. Walka: dzień '+s.fight.date+'.');write(s);saveDashboard()}function showFightOffer(){const s=read();if(!s||s.fight)return;const names=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk'];const opponent=names[Math.floor(Math.random()*names.length)];modal('NOWY EVENT · DZIEŃ '+s.day,'📩 TELEFON OD MATCHMAKERA',`<p><b>${opponent}</b> właśnie dostał kontrakt na lokalną galę.</p><p>Matchmaker mówi: „Macie podobny poziom. Jeśli chcesz się sprawdzić, termin jest wolny.”</p><p class="muted">To nie jest jeszcze walka — najpierw musisz ją przyjąć, potem ustalisz przygotowania.</p>`,[['🥊 „BIORĘ. DAJCIE MI KONTRAKT.”',()=>acceptFight(opponent,s.day)],['😏 „NIECH NAJPIERW ZASŁUŻY.”',()=>{s.log=s.log||[];s.log.push('Odrzucono ofertę walki z '+opponent+'.');write(s);close();saveDashboard()}]])}function showSocial(){const s=read();if(!s)return;const styles=[['🔥 ZAWODNIK WBIJA SZPILĘ','„Widziałem ostatnią walkę. Dużo krzyku, mało roboty. Może czas to sprawdzić?”'],['📱 KOMENTARZ POD TWOIM POSTEM','„Instagram to nie klatka. Pokaż coś poza pozowaniem.”'],['🎙️ WYWIAD RYWALA','„On jest dobry, ale jak trafi na kogoś, kto naprawdę naciska, zacznie szukać wymówek.”']];const x=styles[Math.floor(Math.random()*styles.length)];modal('NOWY EVENT · SOCIAL MEDIA',x[0],`<p><b>Rywalski komentarz:</b></p><p>„${x[1]}”</p><p class="muted">Nie ma tu przycisku „pozytywna/negatywna”. Wybierz konkretny sposób odpowiedzi — od sportowej klasy po pełny polski chaos medialny.</p>`,[['🥊 „WIDZIMY SIĘ W KLATCE, NIE W KOMENTARZACH.”',()=>react('Sportowa odpowiedź',2,250)],['😂 „NAJPIERW NAUCZ SIĘ TAGOWAĆ MÓJ PROFIL.”',()=>react('Żart i zaczepka',3,500)],['🔥 „SKORO MASZ TYLE DO POWIEDZENIA, PODAJ TERMIN.”',()=>react('Mocny callout',5,800)],['🙏 „SZANUJĘ GO, ALE KAŻDY MA SWÓJ MOMENT.”',()=>react('Klasa i szacunek',2,200)]])}function react(text,rep,ig){const s=read();if(!s)return;s.rep=Math.min(100,(s.rep||0)+rep);s.ig=(s.ig||0)+ig;s.log=s.log||[];s.log.push('📱 Reakcja: '+text+'.');write(s);close();saveDashboard()}function continueCareer(){if(modalOpen)return;const s=read();if(!s){return}if(!s.created){if(typeof W().creator==='function')W().creator();return}if(s.fight&&s.day>=s.fight.date){if(typeof W().startFight==='function')W().startFight();return}let stop=false;for(let i=0;i<365&&!stop;i++){s.day++;if(s.day%30===0)s.age++;s.money=Math.max(0,s.money-150);if(s.day%10===0&&!s.fight){write(s);showFightOffer();stop=true;break}if(s.day%17===0&&s.ig>=1000){write(s);showSocial();stop=true;break}if(s.fight&&s.day>=s.fight.date){write(s);stop=true;break}}if(!stop)write(s);saveDashboard()}function install(){try{const d=D(),s=read();if(!d||!s)return;const top=d.querySelector('.main .top');if(!top)return;let b=d.getElementById('v115Continue');if(!b){b=d.createElement('button');b.id='v115Continue';b.className='primary';b.textContent='▶ KONTYNUUJ DO NASTĘPNEGO EVENTU';b.style.cssText='margin-left:auto;font-size:15px;padding:13px 18px;white-space:nowrap';b.onclick=continueCareer;top.appendChild(b)}b.style.display=s.screen==='dashboard'?'inline-block':'none';b.onclick=continueCareer}catch(e){console.error(e)}}f.addEventListener('load',()=>setTimeout(install,300));setInterval(install,700)})();</script></body></html>
