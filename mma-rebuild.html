<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator — Rebuild</title><style>*{box-sizing:border-box}body{margin:0;background:#050a0f;color:#edf2f4;font:14px Arial,sans-serif}button,input{font:inherit}.screen{min-height:100vh;padding:28px}.card{max-width:1100px;margin:auto;background:#0c151d;border:1px solid #294352;border-radius:18px;padding:28px;box-shadow:0 20px 80px #000}.brand{font-size:28px;font-weight:900}.brand span,.gold{color:#d5ad4e}.muted{color:#81939d}.field{margin:18px 0}.field label{display:block;color:#9aaab2;font-size:11px;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:9px;border:1px solid #294554;background:#071017;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:15px;border:1px solid #294554;background:#101e27;border-radius:10px;cursor:pointer;min-height:80px}.pick:checked+label{border-color:#d5ad4e;background:#211f15}.pick+label small{display:block;color:#83949d;margin-top:6px;line-height:1.4}.budget{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{padding:12px 17px;border-radius:9px;border:1px solid #405866;background:#101f29;color:white;cursor:pointer}.primary{background:#80662b;border-color:#d5ad4e;font-weight:800}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#060c12;border-right:1px solid #1d3440;padding:15px}.side button{width:100%;margin:4px 0;text-align:left;background:transparent;border:1px solid transparent;color:#9aabb4;padding:12px;border-radius:8px}.side button:hover{border-color:#6d592e;color:#e2bd5b}.main{padding:24px;max-width:1400px;width:100%;margin:auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.stat{padding:16px;background:linear-gradient(145deg,#101d26,#091218);border:1px solid #263f4d;border-radius:11px}.stat small{color:#718692}.stat strong{display:block;font-size:22px;margin-top:8px}.cols{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.panel{padding:17px;background:#0c171f;border:1px solid #294352;border-radius:12px;margin-bottom:12px}.feed{padding:10px 0;border-bottom:1px solid #192d38}.alert{position:fixed;right:22px;top:22px;width:min(390px,calc(100vw - 44px));background:#101b23;border:1px solid #d5ad4e;border-radius:14px;padding:17px;z-index:50;box-shadow:0 20px 70px #000;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#173a4d,#050b10 60%)}.fighters{max-width:1100px;margin:18px auto;display:grid;grid-template-columns:1fr 200px 1fr;gap:16px;align-items:center;text-align:center}.fighter{padding:18px;background:#0b161f;border:1px solid #2a4656;border-radius:12px}.hp{height:14px;background:#2b171b;border-radius:5px;overflow:hidden}.hp i{display:block;height:100%;background:#42cf85;transition:.4s}.opp i{background:#e25b66}.clock{width:160px;height:160px;border:8px solid #d5ad4e;border-radius:50%;display:grid;place-items:center;margin:auto;background:#081117}.time{font:700 29px monospace}.comment{max-width:1100px;height:250px;overflow:auto;margin:12px auto;background:#050c11;border:1px solid #294352;border-radius:10px;padding:12px}.comment p{padding:7px 0;margin:0;border-bottom:1px solid #172a35}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{min-height:72px;text-align:left;background:#101f29;border:1px solid #294554;color:#fff;border-radius:9px;padding:11px;cursor:pointer}.act small{display:block;color:#d5ad4e;margin-top:5px}.overlay{position:fixed;inset:0;background:#000c;z-index:100;display:grid;place-items:center;padding:20px}.modal{width:min(480px,94vw);padding:24px;background:#0c171f;border:1px solid #d5ad4e;border-radius:16px;text-align:center}.wheel{width:280px;height:280px;border-radius:50%;margin:18px auto;background:conic-gradient(#35c77b 0 8%,#d94d5b 8% 16%,#35c77b 16% 24%,#d94d5b 24% 32%,#35c77b 32% 40%,#d94d5b 40% 48%,#35c77b 48% 56%,#d94d5b 56% 64%,#35c77b 64% 72%,#d94d5b 72% 80%,#35c77b 80% 88%,#d94d5b 88%);border:7px solid #65747d;transition:transform 2s cubic-bezier(.12,.75,.08,1);position:relative}.wheel:after{content:'▼';position:absolute;left:50%;top:-38px;transform:translateX(-50%);font-size:27px}.result{font-size:22px;font-weight:900}@media(max-width:900px){.grid,.stats,.cols,.fighters,.acts,.budget{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.clock{order:-1}}@media(max-width:600px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:130px}.grid,.stats,.cols,.acts,.budget{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const app=document.getElementById('app');const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const profiles={Wonderkid:'Szybki, młody talent.',Fizol:'Siła i presja.',Zapasiarz:'Obalenia i kontrola.',Striker:'Boks i nokauty.',Guma:'BJJ i poddania.',Allrounder:'Równy rozwój MMA.'};let s={first:'',last:'',type:'',budget:10000,weight:'',day:1,age:18,ig:100,rep:5,mot:50,fat:10,wins:0,loss:0,draw:0,events:[],fight:null};function creator(){app.innerHTML='<div class="screen"><div class="card"><div class="brand">MMA <span>CAREER SIMULATOR</span></div><p class="muted">Nowy start kariery</p><div class="field"><label>IMIĘ *</label><input id="first" placeholder="np. Michał"></div><div class="field"><label>NAZWISKO *</label><input id="last" placeholder="np. Kowalski"></div><h3>TYP ZAWODNIKA *</h3><div class="grid">'+Object.entries(profiles).map(([k,v],i)=>'<input class="pick" id="p'+i+'" type="radio" name="type" value="'+k+'"><label for="p'+i+'"><b>'+k+'</b><small>'+v+'</small></label>').join('')+'</div><h3>BUDŻET STARTOWY *</h3><div class="budget">'+[5000,10000,25000,50000].map((x,i)=>'<input class="pick" id="b'+i+'" type="radio" name="budget" value="'+x+'" '+(i===1?'checked':'')+'><label for="b'+i+'"><b>'+x.toLocaleString('pl-PL')+' ISK</b><small>kapitał kariery</small></label>').join('')+'</div><h3>KATEGORIA WAGOWA *</h3><div class="grid">'+Object.entries(KG).map(([k,v],i)=>'<input class="pick" id="w'+i+'" type="radio" name="weight" value="'+k+'"><label for="w'+i+'"><b>'+k+'</b><small>'+v+'</small></label>').join('')+'</div><br><button class="btn primary" onclick="start()">STWÓRZ KARIERĘ →</button></div></div>'}function start(){let f=first.value.trim(),l=last.value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=budget]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w)return alert('Uzupełnij wszystkie pola.');Object.assign(s,{first:f,last:l,type:t.value,budget:+b.value,weight:w.value});s.events=['Kariera utworzona. Czas zbudować rekord.'];dashboard();alertBox('KARIERA ROZPOCZĘTA','Pierwszy krok: trening, debiut i budowanie nazwiska.')}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="fightIntro()">🥊 Walka</button><button onclick="career()">📋 Kariera</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><div class="gold">CENTRUM KARIERY</div><h1>Dzień '+s.day+'</h1><p class="muted">'+s.first+' '+s.last+' · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><button class="btn primary" onclick="advance()">NASTĘPNY DZIEŃ</button></div><div class="stats"><div class="stat"><small>REKORD</small><strong>'+s.wins+'-'+s.loss+'-'+s.draw+'</strong></div><div class="stat"><small>INSTAGRAM</small><strong>'+s.ig+'</strong></div><div class="stat"><small>REPUTACJA</small><strong>'+s.rep+'/100</strong></div><div class="stat"><small>MOTYWACJA</small><strong>'+s.mot+'/100</strong></div><div class="stat"><small>BUDŻET</small><strong>'+s.budget.toLocaleString('pl-PL')+' ISK</strong></div></div><div class="cols"><section><div class="panel"><h2>🎯 Najbliższy cel</h2><p>Buduj formę i reputację. Losowe wydarzenia mogą zmienić kierunek kariery.</p><button class="btn primary" onclick="fightIntro()">WEJDŹ DO WALKI</button></div><div class="panel"><h3>📰 OSTATNIE WYDARZENIA</h3>'+s.events.slice(0,8).map(x=>'<div class="feed">'+x+'</div>').join('')+'</div></section><aside><div class="panel"><h3>📈 KARIERA</h3><div class="feed">Wiek: '+s.age+'</div><div class="feed">Dzień kariery: '+s.day+'</div><div class="feed">Zmęczenie: '+s.fat+'%</div></div></aside></div></main></div>'}function career(){dashboard()}function events(){dashboard()}function alertBox(t,m){let x=document.createElement('div');x.className='alert';x.innerHTML='<button style="float:right" class="btn">×</button><b class="gold">'+t+'</b><p>'+m+'</p>';x.querySelector('button').onclick=()=>x.remove();document.body.appendChild(x);setTimeout(()=>x.remove(),9000)}function advance(){s.day++;if(s.day%365===0)s.age++;if(Math.random()<.35){let e=Math.random();if(e<.33){s.ig+=40;s.events.unshift('📱 Urwany fragment walki został zauważony. +40 obserwujących.');alertBox('VIRAL!','Twój fragment walki zaczyna krążyć po Instagramie. +40 followów.')}else if(e<.66){s.events.unshift('🥊 Organizator zauważył Twoją serię treningową. Propozycja walki jest blisko.');alertBox('ZAINTERESOWANIE','Promotor pyta o Twoją dostępność do walki.')}else{s.mot=Math.min(100,s.mot+8);s.events.unshift('🎙️ Wywiad po treningu spodobał się kibicom.');alertBox('MEDIA','Twój wywiad zaczyna żyć własnym życiem.')}}dashboard()}function fightIntro(){fight()}function comment(t){let c=document.querySelector('.comment');if(c){let p=document.createElement('p');p.textContent=t;c.prepend(p)}}function fight(){let time=0,me=100,op=100,st=100;app.innerHTML='<div class="fight"><div class="top"><div><b>'+s.first+' '+s.last+'</b><div class="muted">'+s.weight+' · '+KG[s.weight]+'</div></div><button class="btn" onclick="dashboard()">WYJDŹ</button></div><div class="fighters"><div class="fighter"><b>'+s.first+' '+s.last+'</b><p>STAMINA</p><div class="hp"><i id="me" style="width:100%"></i></div></div><div class="clock"><div class="time" id="time">05:00</div></div><div class="fighter"><b>RYWAL</b><p>WITALNOŚĆ</p><div class="hp opp"><i id="op" style="width:100%"></i></div></div></div><div class="comment" id="comment"><p>JURAS: „Zaczynamy! Zobaczymy, kto pierwszy narzuci swoje warunki.”</p></div><div class="acts">'+[['JAB','szybka akcja'],['LOW KICK','kopnięcie na nogę'],['HIGH KICK','wysoka technika'],['SPINNING BACKFIST','trudna technika'],['LATAJĄCE KOLANO','bardzo trudna'],['ŁOKIEĆ','krótki dystans'],['SINGLE LEG','próba obalenia'],['DOUBLE LEG','mocne zapasy'],['BALACHA','dźwignia'],['TRÓJKĄT NOGAMI','duszenie'],['TRÓJKĄT RĘKOMA','duszenie'],['RNC','duszenie zza pleców']].map(a=>'<button class="act" onclick="action(\''+a[0]+'\')"><b>'+a[0]+'</b><small>'+a[1]+'</small></button>').join('')+'</div></div>';window.f={time,me,op,st,round:1}}function action(name){let hard=/HIGH|SPINNING|LATAJĄCE|BALACHA|TRÓJKĄT|RNC/.test(name);let chance=hard?55:78;wheel(name,chance)}function wheel(name,chance){let o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><b class="gold">JURAS · MOMENT W WALCE</b><h2>'+name+'</h2><p>Trudność techniki: '+(chance<60?'wysoka':'normalna')+'</p><div class="wheel"></div><div class="result">LOSOWANIE...</div><br><button class="btn" disabled>WRÓĆ DO WALKI</button></div>';document.body.appendChild(o);let ok=Math.random()*100<chance;requestAnimationFrame(()=>o.querySelector('.wheel').style.transform='rotate('+(1800+Math.random()*720)+'deg)');setTimeout(()=>{o.querySelector('.result').textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';o.querySelector('.result').style.color=ok?'#35c77b':'#d94d5b';let b=o.querySelector('button');b.disabled=false;b.onclick=()=>o.remove();resolveAction(name,ok)},2100)}function resolveAction(name,ok){if(!ok){comment('JURAS: Próba techniki nie wyszła. Rywal dobrze to przeczytał.');return}let dmg=/HIGH KICK|LATAJĄCE|SPINNING|ŁOKIEĆ/.test(name)?25:12;f.op=Math.max(0,f.op-dmg);f.me=Math.max(0,f.me-(name==='JAB'?3:7));document.getElementById('op').style.width=f.op+'%';document.getElementById('me').style.width=f.me+'%';let text='JURAS: Dobra akcja — '+name+'. '+(dmg>20?'To naprawdę mocno weszło!':'Buduje przewagę krok po kroku.');comment(text);if(dmg>20&&f.op<35&&Math.random()<.45){comment('JURAS: „ŁOOOOOO! To może być koniec!”');s.wins++;s.ig+=Math.floor(Math.random()*70)+30;alertBox('VIRAL','Efektowna akcja poszła w social media.');setTimeout(()=>result('KO/TKO'),500);return}if(f.op<=0){s.wins++;result('KO/TKO');return}if(f.me<=0){s.loss++;result('KO/TKO');return}advanceFightClock()}function advanceFightClock(){f.time+=Math.floor(Math.random()*18)+8;if(f.time>=300){s.wins+=Math.random()<.5?1:0;s.loss+=s.wins+s.loss===0?1:0;result('DECYZJA')}else{let sec=300-f.time;document.getElementById('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}}function result(method){app.innerHTML='<div class="screen"><div class="card" style="text-align:center"><div class="gold">KONIEC WALKI</div><h1>'+method+'</h1><h2>'+s.first+' '+s.last+'</h2><p>Rekord: '+s.wins+'-'+s.loss+'-'+s.draw+'</p><button class="btn primary" onclick="dashboard()">WRÓĆ DO DASHBOARDU</button></div></div>'}creator();</script></body></html>
