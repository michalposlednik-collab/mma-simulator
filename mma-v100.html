<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V100</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eef3f5;font:15px Arial}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 16px 45px #0006}.creator{max-width:1050px;margin:auto}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{display:none}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:70px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.pick+label small{display:block;color:#9eb0b8;margin-top:5px}.primary{background:#80652a;border:1px solid #d6ae51;color:#fff;padding:12px 16px;border-radius:9px;font-weight:bold}.btn{background:#162833;color:#fff;border:1px solid #526873;padding:11px 15px;border-radius:9px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;padding:12px;text-align:left;background:#0b151d;color:#c8d2d6;border:1px solid #203642;border-radius:8px}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.gold{color:#d6ae51}.muted{color:#91a3ac}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:20;padding:18px}.modalbox{width:min(900px,95vw);max-height:90vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:25px}.club{padding:15px;border:1px solid #304955;border-radius:12px;background:#0b151d;margin:8px 0}.locked{opacity:.45}.fight{min-height:100vh;padding:22px}.fightgrid{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 160px 1fr;gap:12px;align-items:center}.fighter{padding:18px;background:#0b171f;border:1px solid #304955;border-radius:12px;text-align:center}.hp{height:14px;background:#35191e;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.clock{width:135px;height:135px;border:7px solid #d6ae51;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:22px}.comment{max-width:1100px;height:180px;overflow:auto;margin:14px auto;background:#050c11;border:1px solid #304955;border-radius:10px;padding:10px}.comment p{margin:0;padding:7px;border-bottom:1px solid #172a34}.acts{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.act{padding:12px;background:#101f29;color:#fff;border:1px solid #294653;border-radius:9px}.wheel{width:290px;height:290px;position:relative;margin:10px auto}.disk{width:290px;height:290px;border-radius:50%;background:conic-gradient(#36c77b 0 8%,#d84f5b 8% 16%,#36c77b 16% 24%,#d84f5b 24% 32%,#36c77b 32% 40%,#d84f5b 40% 48%,#36c77b 48% 56%,#d84f5b 56% 64%,#36c77b 64% 72%,#d84f5b 72% 80%,#36c77b 80% 88%,#d84f5b 88%);border:7px solid #65747d;transition:transform 1.7s cubic-bezier(.12,.75,.08,1)}.pointer{position:absolute;z-index:2;top:-27px;left:50%;transform:translateX(-50%);font-size:30px}.result{text-align:center;padding:18px;border:1px solid #d6ae51;border-radius:12px;margin:12px 0}@media(max-width:900px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:120px}.stats{grid-template-columns:repeat(3,1fr)}.grid,.cols{grid-template-columns:1fr 1fr}.fightgrid{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}}@media(max-width:600px){.stats,.grid,.cols,.acts{grid-template-columns:1fr}.top{display:block}}</style></head><body><div id="app" class="app"></div><script>"use strict";var app=document.getElementById('app');var KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};var TYPE={Wonderkid:'Talent, refleks i głód zwycięstw.',Osiedlowy:'Szczęka ze stali, ręce z żelaza, mózg czasem na urlopie.',Fizol:'Siła, klincz i argumenty, których nie trzeba długo tłumaczyć.',Zapasnik:'Najpierw nogi rywala, potem pytania.',Striker:'Dystans, timing i wiara, że każda runda może skończyć się przed czasem.',Gumiarz:'Na macie czuje się jak w domu.',Allrounder:'Wszystko po trochu, nic przypadkowo.'};var CLUBS=[{n:'Uniq Fight Club',city:'Warszawa',req:0,cost:6000,g:{Boks:4,Szybkość:3},desc:'Stójka, boks i kickboxing.'},{n:'ANKOS MMA',city:'Poznań',req:15,cost:8000,g:{Zapasy:6,Kondycja:2},desc:'Zapasy i MMA.'},{n:'WCA Fight Team',city:'Warszawa',req:25,cost:9000,g:{BJJ:5,Zapasy:2},desc:'BJJ i grappling.'},{n:'Czerwony Smok',city:'Poznań',req:35,cost:11000,g:{Boks:2,BJJ:3,Zapasy:3},desc:'Wszechstronny MMA.'},{n:'American Top Team',city:'USA',req:65,cost:25000,g:{Boks:4,Zapasy:4,BJJ:4,Kondycja:4},desc:'Elitarny camp.'}];var s={day:1,age:18,ig:100,rep:5,mot:55,money:10000,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',fight:null,history:[],log:[],sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},gym:'Lokalny klub',fightState:null};function creator(){app.innerHTML='<div class="wrap creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do wielkich gal.</p><div class="field"><label>IMIĘ *</label><input id="fn"></div><div class="field"><label>NAZWISKO *</label><input id="ln"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.keys(TYPE).map(function(x,i){return '<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x+'"><label for="t'+i+'"><b>'+x+'</b><small>'+TYPE[x]+'</small></label>'}).join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="grid">'+[[5000,'Normalny etat'],[10000,'Etat + oszczędności'],[25000,'Rodzina pomaga'],[50000,'Bogata rodzina'],[100000,'Rodzinny biznes']].map(function(x,i){return '<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'"><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' PLN</b><small>'+x[1]+'</small></label>'}).join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.keys(KG).map(function(x,i){return '<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x+'"><label for="w'+i+'"><b>'+x+'</b><small>'+KG[x]+'</small></label>'}).join('')+'</div><br><button class="primary" onclick="start()">STWÓRZ KARIERĘ →</button></div></div>'}function start(){var f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('input[name=type]:checked'),b=document.querySelector('input[name=bud]:checked'),w=document.querySelector('input[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.first=f;s.last=l;s.type=t.value;s.money=+b.value;s.weight=w.value;s.log=['🥊 Kariera rozpoczęta.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance()">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fights()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="statistics()">📊 Statystyki</button><button onclick="finance()">💰 Finanse</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button class="btn" onclick="advance()">＋ 1 DZIEŃ</button><button class="primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><b>'+s.w+'-'+s.l+'-'+s.d+'</b></div><div class="stat"><small>INSTAGRAM</small><b>'+s.ig+'</b></div><div class="stat"><small>REPUTACJA</small><b>'+s.rep+'/100</b></div><div class="stat"><small>BUDŻET</small><b>'+s.money.toLocaleString('pl-PL')+' PLN</b></div><div class="stat"><small>MOTYWACJA</small><b>'+s.mot+'/100</b></div><div class="stat"><small>WIEK</small><b>'+s.age+'</b></div></div><div class="hero"><small class="gold">NAJBLIŻSZY CEL</small><h2>'+(s.fight?'🏆 PRZYGOTOWANIE DO WALKI':'📅 BUDOWANIE KARIERY')+'</h2><p>'+(s.fight?'Rywal: <b>'+s.fight.opponent+'</b> · '+(s.fight.camp?'camp wybrany':'czeka na camp')+'.':'Trenuj, buduj reputację i czekaj na ofertę walki.')+'</p><button class="primary" onclick="nextEvent()">PRZEWIŃ DO NASTĘPNEGO EVENTU</button></div><div class="cols"><section><div class="panel"><h3>📰 OŚ KARIERY</h3>'+s.log.slice(0,12).map(function(x){return '<div class="feed">'+x+'</div>'}).join('')+'</div><div class="panel"><h3>🎯 ŚCIEŻKA KARIERY</h3>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map(function(x,i){return '<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'🟢 ':'🔒 ')+x+'</div>'}).join('')+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+Object.keys(s.sk).map(function(k){return '<div class="feed"><b>'+k+'</b> '+s.sk[k]+'<div class="bar"><i style="width:'+s.sk[k]+'%"></i></div></div>'}).join('')+'</div></aside></div></main></div>'}function advance(){s.day++;if(s.day%365===0)s.age++;if(s.fight&&s.fight.campDays>0){s.fight.campDays--;if(s.fight.campDays===0){s.fight.ready=true;s.log.unshift('🥊 Obóz zakończony. Walka jest gotowa.')}}s.mot=Math.max(0,s.mot-1);dashboard()}function nextEvent(){if(!s.fight){s.fight={opponent:'Kamil "Turbo" Nowak',purse:5000,campDays:21,camp:false,ready:false};s.log.unshift('📩 Oferta walki: Kamil "Turbo" Nowak.');dashboard();return}if(!s.fight.camp){training();return}if(s.fight.ready){startFight();return}advance()}function training(){var h='<div class="modal"><div class="modalbox"><small class="gold">OBÓZ PRZYGOTOWAWCZY</small><h1>Wybierz klub na cały obóz</h1><p class="muted">Jedno kliknięcie. Płacisz raz, cały 21-dniowy camp odbywa się automatycznie, statystyki rosną, a po zakończeniu od razu wchodzisz do walki.</p>';CLUBS.forEach(function(c,i){var ok=s.rep>=c.req&&s.money>=c.cost;h+='<div class="club '+(ok?'':'locked')+'"><h3>'+c.n+' · '+c.city+'</h3><p>'+c.desc+'</p><span class="pill">REP '+c.req+'</span> <span class="pill">'+c.cost.toLocaleString('pl-PL')+' PLN</span> <span class="pill">21 dni</span><p class="gold">'+Object.keys(c.g).map(function(k){return '+'+c.g[k]+' '+k}).join(' · ')+'</p><button class="'+(ok?'primary':'btn')+'" '+(ok?'':'disabled')+' onclick="startCamp('+i+')">'+(ok?'ROZPOCZNIJ CAMP':'NIEDOSTĘPNY')+'</button></div>'});h+='<button class="btn" onclick="closeModal()">WRÓĆ</button></div></div>';app.insertAdjacentHTML('beforeend',h)}function startCamp(i){var c=CLUBS[i];if(!s.fight||s.fight.camp)return;s.money-=c.cost;s.gym=c.n;s.fight.camp=true;s.fight.campDays=0;s.fight.ready=true;Object.keys(c.g).forEach(function(k){s.sk[k]=Math.min(100,s.sk[k]+c.g[k])});s.day+=21;s.mot=Math.min(100,s.mot+8);s.log.unshift('🥋 '+c.n+': ukończono 21-dniowy camp za '+c.cost.toLocaleString('pl-PL')+' PLN.');closeModal();setTimeout(startFight,150)}function closeModal(){var m=document.querySelector('.modal');if(m)m.remove()}function fights(){if(!s.fight){modalMsg('Nie masz aktywnej walki.','Kliknij „Następny event”, aby otrzymać ofertę.');return}if(!s.fight.camp){training();return}if(s.fight.ready)startFight()}function modalMsg(a,b){app.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalbox"><h1>'+a+'</h1><p>'+b+'</p><button class="primary" onclick="closeModal()">OK</button></div></div>')}function startFight(){var r1=0,r2=0,round=1,time=0,st1=100,st2=100,over=false,rot=0;function render(){app.innerHTML='<div class="fight"><div class="top"><div><small class="gold">WALKA · '+s.weight+'</small><h1>'+s.first+' '+s.last+' vs '+s.fight.opponent+'</h1></div><button class="btn" onclick="dashboard()">OPUŚĆ</button></div><div class="fightgrid"><div class="fighter"><h2>'+s.first+'</h2><p>HP</p><div class="hp"><i style="width:'+st1+'%"></i></div><p>Stamina '+Math.round(st1)+'</p></div><div class="clock"><div>R'+round+'<br><b>'+Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0')+'</b></div></div><div class="fighter"><h2>'+s.fight.opponent+'</h2><p>HP</p><div class="hp"><i style="width:'+st2+'%"></i></div><p>Stamina '+Math.round(st2)+'</p></div></div><div class="comment" id="comments"></div><div class="acts"><button class="act" onclick="special('High kick')">🦵 High kick</button><button class="act" onclick="special('Spinning backfist')">🌀 Spinning backfist</button><button class="act" onclick="special('Latające kolano')">🦵 Latające kolano</button><button class="act" onclick="special('Łokieć')">💥 Łokieć</button><button class="act" onclick="special('Balacha')">🤼 Balacha</button><button class="act" onclick="special('Trójkąt')">🔺 Trójkąt</button><button class="act" onclick="special('RNC')">🔒 RNC</button><button class="act" onclick="special('Obalenie')">🤼 Obalenie</button></div></div>';var c=document.getElementById('comments');function say(x){if(c){c.innerHTML='<p>'+x+'</p>'+c.innerHTML}}function tick(){if(over)return;time+=1.6;st1=Math.max(0,st1-(Math.random()*0.7));st2=Math.max(0,st2-(Math.random()*0.8));if(Math.random()<0.22)say('<b>JURAS:</b> Dobra akcja! Widać, że zawodnik zaczyna czytać rywala.');if(time>=300){round++;time=0;if(round>3){over=true;var win=st1>st2;s.w+=win?1:0;s.l+=win?0:1;s.rep+=win?4:1;s.log.unshift(win?'🏆 Wygrana przez decyzję.':'❌ Porażka przez decyzję.');s.fight=null;setTimeout(function(){dashboard()},900);return}}render();say('<b>JURAS:</b> '+(Math.random()<.5?'Próba kombinacji w stójce.':'Rywal odpowiada i szuka swojej pozycji.'));setTimeout(tick,450)}window.special=function(name){if(over)return;var roll=Math.random();var modal='<div class="modal"><div class="modalbox"><small class="gold">KOŁO FORTUNY</small><h1>'+name+'</h1><div class="wheel"><div class="pointer">▼</div><div class="disk" id="disk"></div></div><p class="muted">Zielone = trafienie. Czerwone = nieudana próba.</p></div></div>';document.body.insertAdjacentHTML('beforeend',modal);setTimeout(function(){var d=document.getElementById('disk');rot+=720+Math.floor(Math.random()*360);d.style.transform='rotate('+rot+'deg)';setTimeout(function(){var ok=roll<0.55;if(ok){st2=Math.max(0,st2-(name==='High kick'?28:18));say('<b>JURAS:</b> ŁOOOO! '+name+' wchodzi! To może być viral!');if(st2<=5){over=true;s.w++;s.rep+=6;s.ig+=1000;s.log.unshift('🔥 KO po '+name+'. Viral +1000 IG.');closeModal();setTimeout(dashboard,900);return}}else say('<b>JURAS:</b> Nie weszło! Rywal zdążył zareagować.');closeModal()},1800)},50)}render();say('<b>JURAS:</b> Witamy w klatce! Zaczynamy.');setTimeout(tick,450)}function simple(title,text){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="panel"><small class="gold">'+title+'</small><h1>'+title+'</h1><p>'+text+'</p></div></main></div>'}function career(){simple('KARIERA','Hybrid / Babylon / FEN → KSW → OKTAGON → Cage Warriors → PFL → UFC. Reputacja odblokowuje kolejne poziomy.')}function media(){simple('MEDIA','Instagram: '+s.ig+' · X: '+Math.floor(s.ig/2)+' · JURAS i media MMA komentują Twoje występy.')}function manager(){simple('MENEDŻER',s.rep>=20?'Menedżer jest dostępny.':'Menedżer pojawi się po osiągnięciu 20 reputacji.')}function statistics(){simple('STATYSTYKI',Object.keys(s.sk).map(function(k){return k+': '+s.sk[k]}).join(' · '))}function finance(){simple('FINANSE','Budżet: '+s.money.toLocaleString('pl-PL')+' PLN · Etat: 3000 PLN/miesiąc · Brama: 900 PLN/tydzień.')}function events(){simple('EVENTY',s.log.join('<br>'))}creator();</script></body></html>
