<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V105</title><style>
*{box-sizing:border-box}body{margin:0;background:#05090d;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 50% 0,#173744,#05090d 70%)}button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}button:hover{border-color:#d6ae51}.primary{background:#80652a;border-color:#d6ae51}.wrap{padding:24px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.main{padding:22px;max-width:1450px;width:100%;margin:auto}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.gold{color:#d6ae51}.muted{color:#91a3ac}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat{background:#101e27;border:1px solid #304955;border-radius:12px;padding:13px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:5px}.hero{padding:22px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b}
.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 15%,#273f49,#060b0f 65%)}.fighthead{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto}.clockbox{position:relative;width:190px;height:190px;display:grid;place-items:center}.clockring{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#d6ae51 var(--progress),#25343b 0);box-shadow:0 0 30px #0008}.clockring:after{content:'';position:absolute;inset:13px;border-radius:50%;background:#081016}.clocktext{position:relative;z-index:2;text-align:center}.clock{font-size:36px;font-weight:900}.round{color:#d6ae51;font-size:12px;letter-spacing:2px}.arena{max-width:1200px;margin:10px auto}.fighters{display:grid;grid-template-columns:1fr 230px 1fr;gap:18px;align-items:center}.fighter{text-align:center;padding:16px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:12px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.comment{min-height:125px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.log{max-height:150px;overflow:auto;margin-top:10px}.wheelwrap{display:none;position:fixed;inset:0;background:#000e;z-index:100;place-items:center}.wheelbox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:22px;text-align:center;width:min(560px,95vw)}.wheelstage{position:relative;width:310px;height:310px;margin:15px auto}.wheel{width:300px;height:300px;border-radius:50%;background:conic-gradient(#c33 0 12.5%,#2e9d5b 12.5% 25%,#c33 25% 37.5%,#2e9d5b 37.5% 50%,#c33 50% 62.5%,#2e9d5b 62.5% 75%,#c33 75% 87.5%,#2e9d5b 87.5% 100%);border:8px solid #17252d;transition:transform 2.2s cubic-bezier(.12,.7,.15,1);position:absolute;left:5px;top:5px}.pointer{position:absolute;z-index:5;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #d6ae51;filter:drop-shadow(0 2px 3px #000)}.wheelresult{min-height:30px;font-size:20px;font-weight:800;color:#d6ae51}.modal{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:150;padding:18px}.modalbox{width:min(850px,95vw);background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:25px}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{padding:16px;text-align:left;min-height:80px}.winner{font-size:30px;color:#d6ae51;text-align:center;margin:10px 0}.interview{font-size:16px;line-height:1.55}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#182d38;color:#a9c1ca}
@media(max-width:900px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.fighters{grid-template-columns:1fr}.clockbox{width:150px;height:150px;margin:auto}.choicegrid{grid-template-columns:1fr}}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.top{display:block}.fighthead{display:block}.clockbox{margin:12px auto}}
</style></head><body><div id="app" class="app"></div><div id="wheel" class="wheelwrap"><div class="wheelbox"><div class="gold">DODATKOWA AKCJA</div><h2 id="wheelTitle">HIGH KICK</h2><p id="wheelHint">Czas zatrzymany. Losujemy efekt.</p><div class="wheelstage"><div class="pointer"></div><div id="wheelEl" class="wheel"></div></div><div id="wheelResult" class="wheelresult">Wskaźnik jest zawsze na górze.</div><button class="primary" id="spin">LOSUJ EFEKT</button></div></div><div id="result" class="modal"><div class="modalbox"><div class="gold">KONIEC WALKI</div><div id="winner" class="winner"></div><p id="resultText"></p><h3>🎙️ Wywiad po walce</h3><div class="choicegrid"><button class="choice" data-post="challenge">🔥 <b>Wyzwanie rywala</b><br><span class="muted">„Jeśli ma odwagę, spotkajmy się w następnej walce.”</span></button><button class="choice" data-post="corner">🙏 <b>Podziękowania dla narożnika</b><br><span class="muted">Doceniasz trenerów i ludzi, którzy byli z Tobą.</span></button><button class="choice" data-post="joke">😂 <b>Żart / luz</b><br><span class="muted">Rozładowujesz emocje i bawisz publiczność.</span></button><button class="choice" data-post="respect">🤝 <b>Szacunek dla rywala</b><br><span class="muted">Sportowe zachowanie i mocny, ale spokojny przekaz.</span></button></div><p id="interview" class="interview"></p><button id="back" class="primary">WRÓĆ DO DASHBOARDU</button></div></div>
<script>(function(){'use strict';const app=document.getElementById('app'),wheel=document.getElementById('wheel'),wheelEl=document.getElementById('wheelEl'),wheelResult=document.getElementById('wheelResult'),result=document.getElementById('result');let s={created:false,first:'',last:'',type:'',weight:'Middleweight',money:10000,w:0,l:0,d:0,rep:5,ig:100,day:1,club:'Brak',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},log:[],history:[]};try{s=Object.assign(s,JSON.parse(localStorage.getItem('mmaV104')||'{}'))}catch(e){}let fight=null,timer=null,lastTs=0,acc=0,paused=false,pending=null;const types=['Wonderkid','Bijok','Fizol','Zapaśnik','Striker','Gumiarz','Allrounder'];const weights=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];function save(){try{localStorage.setItem('mmaV104',JSON.stringify(s))}catch(e){}}function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function league(){if(s.w<2)return'Localna gala';if(s.w<4)return'Hybrid';if(s.w<7)return'Babilon MMA / FEN';if(s.w<10)return'KSW';if(s.w<13)return'OKTAGON';if(s.w<16)return'Cage Warriors';if(s.w<19)return'PFL';return'UFC'}function nav(){return'<aside class="side"><button onclick="dash()">⌂ Dashboard</button><button onclick="newFight()">🏆 Walki</button><button onclick="train()">🥊 Trening</button><button onclick="finance()">💰 Finanse</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button></aside>'}function stats(){return`<div class="stats"><div class="stat"><small>REKORD</small><b>${s.w}-${s.l}-${s.d}</b></div><div class="stat"><small>REPUTACJA</small><b>${s.rep}/100</b></div><div class="stat"><small>INSTAGRAM</small><b>${s.ig}</b></div><div class="stat"><small>GOTÓWKA</small><b>${money(s.money)}</b></div><div class="stat"><small>ORGANIZACJA</small><b>${league()}</b></div><div class="stat"><small>DZIEŃ</small><b>${s.day}</b></div></div>`}function shell(c){app.innerHTML=`<div class="layout">${nav()}<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>${esc(s.first)} ${esc(s.last)}</h1><p class="muted">${esc(s.type)} · ${esc(s.weight)} · ${esc(s.club)}</p></div><button class="primary" onclick="newFight()">Następny event</button></div>${stats()}${c}</main></div>`}function creator(){app.innerHTML=`<div class="wrap"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR V105</span></h1><p class="muted">Kreator + nowy system walki.</p><p><label>Imię<br><input id="fn" style="width:100%;padding:12px;background:#071018;color:white;border:1px solid #304955;border-radius:8px"></label></p><p><label>Nazwisko<br><input id="ln" style="width:100%;padding:12px;background:#071018;color:white;border:1px solid #304955;border-radius:8px"></label></p><h3>Typ</h3><select id="type" style="width:100%;padding:12px;background:#071018;color:white"><option>${types.join('</option><option>')}</option></select><h3>Budżet startowy</h3><select id="bud" style="width:100%;padding:12px;background:#071018;color:white"><option value="5000">5 000 zł — normalny etat</option><option value="10000" selected>10 000 zł — etat + oszczędności</option><option value="25000">25 000 zł — rodzina pomaga</option><option value="50000">50 000 zł — bogata rodzina</option><option value="100000">100 000 zł — rodzinny biznes</option></select><h3>Kategoria wagowa</h3><select id="weight" style="width:100%;padding:12px;background:#071018;color:white">${weights.map(x=>`<option ${x==='Middleweight'?'selected':''}>${x}</option>`).join('')}</select><br><br><button class="primary" onclick="start()">STWÓRZ KARIERĘ</button></div></div>`}function start(){s.created=true;s.first=fn.value.trim();s.last=ln.value.trim();s.type=type.value;s.money=+bud.value;s.weight=weight.value;if(!s.first||!s.last){alert('Podaj imię i nazwisko');return}s.log=['Rozpoczęto karierę z budżetem '+money(s.money)];save();dash()}function dash(){if(!s.created){creator();return}shell(`<div class="hero"><h2>🏆 ${league()}</h2><p>Kariera działa. Najbliższy krok: wejść do walki i budować rekord.</p><button class="primary" onclick="newFight()">WYZWIJ / OTRZYMAJ WALKĘ</button></div><div class="cols"><section class="panel"><h2>Droga do UFC</h2>${[['Localna gala',0],['Hybrid',2],['Babilon MMA / FEN',4],['KSW',7],['OKTAGON',10],['Cage Warriors',13],['PFL',16],['UFC',19]].map(x=>`<div class="feed">${s.w>=x[1]?'🟢':'🔒'} ${x[0]} — ${x[1]} zwycięstw</div>`).join('')}</section><section class="panel"><h2>Umiejętności</h2>${Object.entries(s.sk).map(x=>`<div class="feed"><b>${x[0]}</b> ${x[1]}<div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</section></div><section class="panel"><h2>Ostatni wynik</h2>${s.history.length?`<div class="winner">${s.history[s.history.length-1].result}</div><p>${esc(s.history[s.history.length-1].text)}</p>`:'<p class="muted">Pierwsza walka dopiero przed Tobą.</p>'}</section>`)}function newFight(){if(!s.created)return creator();if(fight){return}const opp=['Kamil Wrona','Marek Lis','Patryk Nowak','Daniel Cruz','Jonas Berg','Rafał Kaczmarek'][Math.floor(Math.random()*6)];fight={opponent:opp,league:league(),round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],comment:'JURAS: Zaczynamy! Zobaczymy, kto pierwszy narzuci tempo.',purse:Math.max(2500,2500+s.rep*180+s.w*500)};renderFight();startClock()}function startClock(){cancelAnimationFrame(timer);lastTs=performance.now();timer=requestAnimationFrame(loop)}function loop(ts){if(!fight||paused)return;const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;if(!pending){fight.time-=dt*4;fight.stamina=Math.max(0,fight.stamina-dt*.7);fight.oppStamina=Math.max(0,fight.oppStamina-dt*.55);if(Math.random()<dt*.7)exchange();}if(fight.time<=0){endRound()}renderClock();timer=requestAnimationFrame(loop)}function exchange(){const d=Math.max(1,Math.round(Math.random()*2+(s.sk.Boks+s.sk.Szybkość)/100));fight.oppVitality=Math.max(0,fight.oppVitality-d);fight.vitality=Math.max(0,fight.vitality-Math.max(1,Math.round(Math.random()*2)));fight.comment=['JURAS: Dobra praca na nogach.','JURAS: Ładny prosty, rywal to poczuł.','JURAS: Presja pod siatką.','JURAS: Obaj przyspieszają.'][Math.floor(Math.random()*4)];if(fight.oppVitality<=0)finish(true,'KO/TKO')}function renderClock(){if(!fight)return;const p=Math.max(0,Math.min(100,fight.time/300*100));const ring=document.querySelector('.clockring');if(ring)ring.style.setProperty('--progress',p+'%');const c=document.querySelector('.clock');if(c)c.textContent=String(Math.floor(fight.time/60)).padStart(2,'0')+':'+String(Math.ceil(fight.time%60)).padStart(2,'0');const a=document.querySelector('.mehp');if(a)a.style.width=fight.vitality+'%';const b=document.querySelector('.opphp');if(b)b.style.width=fight.oppVitality+'%';const st=document.querySelector('.mest');if(st)st.style.width=fight.stamina+'%';const os=document.querySelector('.oppst');if(os)os.style.width=fight.oppStamina+'%';const co=document.querySelector('.comment');if(co)co.textContent=fight.comment}function renderFight(){app.innerHTML=`<div class="fight"><div class="fighthead"><div><div class="gold">${esc(fight.league)}</div><h1>${esc(s.first)} vs ${esc(fight.opponent)}</h1></div><div class="clockbox"><div class="clockring" style="--progress:100%"></div><div class="clocktext"><div class="round">RUNDA ${fight.round}/3</div><div class="clock">05:00</div><small>czas walki</small></div></div></div><div class="arena"><div class="fighters"><div class="fighter"><h2>${esc(s.first)}</h2><p>Witalność</p><div class="hp"><i class="mehp" style="width:100%"></i></div><p>Stamina</p><div class="hp"><i class="mest" style="width:100%"></i></div></div><div class="comment">${esc(fight.comment)}</div><div class="fighter"><h2>${esc(fight.opponent)}</h2><p>Witalność</p><div class="hp"><i class="opphp" style="width:100%"></i></div><p>Stamina</p><div class="hp"><i class="oppst" style="width:100%"></i></div></div></div><section class="panel" style="margin-top:14px"><h3>AKCJE</h3><div class="actions">${['Prosty','Low kick','High kick','Latające kolano','Spinning backfist','Obalenie','Balacha','Trójkąt','RNC'].map((x,i)=>`<button class="action" data-action="${x}">${x}${i>1?' 🎡':''}</button>`).join('')}</div><p class="muted">Czas jest przyspieszony. Przy dodatkowej okazji czas zatrzymuje się i pojawia się koło fortuny.</p></section></div></div>`;document.querySelectorAll('.action').forEach(b=>b.addEventListener('click',()=>doAction(b.dataset.action)))}function doAction(name){if(!fight)return;const extra=['High kick','Latające kolano','Spinning backfist','Obalenie','Balacha','Trójkąt','RNC'].includes(name);if(extra){paused=true;pending=name;wheelTitle.textContent=name;wheelResult.textContent='Wskaźnik na górze — gotowy do losowania.';wheel.style.display='grid';wheelEl.style.transform='rotate(0deg)';return}apply(name,'normal')}document.getElementById('spin').addEventListener('click',spin);function spin(){if(!pending)return;document.getElementById('spin').disabled=true;const r=Math.random();const resultType=r<.52?'PEŁNY SUKCES':r<.82?'CZĘŚCIOWY SUKCES':'NIEUDANA TECHNIKA';const rotations=1440+Math.floor(Math.random()*360);wheelEl.style.transform=`rotate(${rotations}deg)`;setTimeout(()=>{wheelResult.textContent='WYNIK: '+resultType;if(resultType==='PEŁNY SUKCES')apply(pending,'full');else if(resultType==='CZĘŚCIOWY SUKCES')apply(pending,'partial');else apply(pending,'fail');setTimeout(()=>{wheel.style.display='none';document.getElementById('spin').disabled=false;pending=null;paused=false;lastTs=performance.now();if(fight)timer=requestAnimationFrame(loop)},800)},2300)}function apply(name,type){const base={Highkick:14,'Latające kolano':12,'Spinning backfist':13,Obalenie:9,Balacha:16,Trójkąt:15,RNC:18}[name]||4;let dmg=base,cost=4;if(type==='full'){dmg=Math.round(base*1.5);cost=5;fight.comment='JURAS: '+name+'! PEŁNY SUKCES! To była akcja z najwyższej półki.'}else if(type==='partial'){dmg=Math.round(base*.7);cost=8;fight.comment='JURAS: '+name+' częściowo trafiony. Jest efekt, ale koszt był spory.'}else{dmg=0;cost=14;fight.vitality=Math.max(0,fight.vitality-3);fight.comment='JURAS: Nieudana próba '+name+'. Rywal wykorzystał moment.'}fight.oppVitality=Math.max(0,fight.oppVitality-dmg);fight.stamina=Math.max(0,fight.stamina-cost);if(fight.oppVitality<=0)finish(true,'KO/TKO');else if(fight.vitality<=0)finish(false,'KO/TKO');renderClock()}function endRound(){if(!fight)return;const my=(100-fight.oppVitality)+(fight.stamina>fight.oppStamina?8:0),op=(100-fight.vitality)+(fight.oppStamina>fight.stamina?8:0);fight.score.push(my>=op?10:9);if(fight.round>=3){finish(fight.score.filter(x=>x===10).length>=2,'DECYZJA');return}fight.comment=`JURAS: Koniec rundy ${fight.round}. Punktacja ${fight.score[fight.score.length-1]}-${fight.score[fight.score.length-1]===10?9:10}. Wracamy do narożnika.`;fight.round++;fight.time=300;fight.stamina=Math.min(100,fight.stamina+25);fight.oppStamina=Math.min(100,fight.oppStamina+22);renderFight();startClock()}function finish(win,method){if(!fight)return;cancelAnimationFrame(timer);const f=fight;s.money+=f.purse;if(win){s.w++;s.rep=Math.min(100,s.rep+(method==='KO/TKO'?6:4));s.ig+=Math.round(100+s.rep*8)}else{s.l++;s.rep=Math.max(0,s.rep-2);s.ig=Math.max(0,s.ig-50)}const text=win?`${s.first} wygrywa z ${f.opponent} przez ${method}.`:`${s.first} przegrywa z ${f.opponent} przez ${method}.`;s.history.push({result:win?'ZWYCIĘSTWO':'PORAŻKA',text,opponent:f.opponent});s.log.push((win?'🏆 ':'❌ ')+text);fight=null;save();document.getElementById('winner').textContent=win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA';document.getElementById('resultText').textContent=text+` Gaża: ${money(f.purse)}.`;document.getElementById('interview').textContent='Wybierz ton wypowiedzi. Tak jak na prawdziwym evencie: możesz wyzwać rywala, podziękować narożnikowi, zażartować albo okazać szacunek.';result.style.display='grid'}document.querySelectorAll('[data-post]').forEach(b=>b.addEventListener('click',()=>postFight(b.dataset.post)));function postFight(kind){const names={challenge:`„${fight?fight.opponent:'rywal'}, jeśli oglądasz — nie uciekaj. Chcę tej walki!”`,corner:'„To zwycięstwo jest dla mojego narożnika. Bez nich nie byłoby mnie tutaj.”',joke:'„Mówili, że cardio będzie problemem. Chyba zapomnieli, że mam plan B: przetrwać.”',respect:'„Szacunek dla rywala. Dał mi ciężką walkę i dzięki niemu będę jeszcze lepszy.”'};const reps={challenge:4,corner:2,joke:3,respect:2};s.rep=Math.min(100,s.rep+reps[kind]);s.ig+=kind==='challenge'?400:200;s.log.push('🎙️ Wywiad: '+names[kind]);document.getElementById('interview').innerHTML='<b>Twój wywiad:</b><br>'+esc(names[kind])+`<br><span class="muted">Reputacja +${reps[kind]} · Instagram +${kind==='challenge'?400:200}</span>`;save()}document.getElementById('back').addEventListener('click',()=>{result.style.display='none';dash()});function train(){shell('<section class="panel"><h2>🥊 Trening</h2><p>Trening rozwija umiejętności i kosztuje pieniądze.</p><button onclick="trainSkill(\'Boks\')">Boks · 600 zł</button> <button onclick="trainSkill(\'Zapasy\')">Zapasy · 700 zł</button> <button onclick="trainSkill(\'BJJ\')">BJJ · 700 zł</button> <button onclick="trainSkill(\'Kondycja\')">Kondycja · 500 zł</button></section>')}window.trainSkill=function(k){const c=k==='Kondycja'?500:k==='Boks'?600:700;if(s.money<c)return alert('Za mało pieniędzy.');s.money-=c;s.sk[k]=Math.min(100,s.sk[k]+2);save();train()};function finance(){shell(`<section class="panel"><h2>💰 Finanse</h2><div class="hero"><h2>${money(s.money)}</h2><p>Wpływy z ostatnich walk i koszty treningów są rozliczane w karierze.</p></div></section>`)}function career(){shell(`<section class="panel"><h2>📋 Kariera</h2><p>Rekord: <b>${s.w}-${s.l}-${s.d}</b></p><p>Reputacja: <b>${s.rep}/100</b></p><p>Organizacja: <b>${league()}</b></p>${s.history.slice().reverse().map(h=>`<div class="feed">${esc(h.text)}</div>`).join('')}</section>`)}function media(){shell(`<section class="panel"><h2>📱 Media</h2><p>Instagram: <b>${s.ig}</b></p><button onclick="mediaBoost()">UDZIEL WYWIADU · +200</button></section>`)}window.mediaBoost=function(){s.ig+=200;s.rep=Math.min(100,s.rep+2);save();media()};window.start=start;window.dash=dash;window.newFight=newFight;window.train=train;window.finance=finance;window.career=career;window.media=media;if(!s.created)creator();else dash()})();</script></body></html>
