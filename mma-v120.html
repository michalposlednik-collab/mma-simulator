<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V120</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}.box{width:min(720px,94vw);max-height:90vh;overflow:auto;background:#101c25;color:#eef3f5;border:1px solid #d6ae51;border-radius:18px;padding:24px;font-family:Arial,sans-serif}.camp{display:block;width:100%;margin:9px 0;padding:15px;background:#142833;color:#fff;border:1px solid #526873;border-radius:10px;text-align:left;cursor:pointer}.camp:hover{border-color:#d6ae51}.gold{color:#d6ae51}.muted{color:#91a3ac}</style></head><body><iframe id="game"></iframe><div id="campOverlay" class="overlay"><div class="box"><small class="gold">EVENT · CAMP PRZYGOTOWAWCZY</small><h1>Wybierz obóz</h1><div id="campBody"></div><button id="campClose" style="margin-top:10px;padding:11px 15px;background:#142833;color:white;border:1px solid #526873;border-radius:9px">ANULUJ</button></div></div><script>(function(){'use strict';const KEY='mmaCareerV111',frame=document.getElementById('game'),overlay=document.getElementById('campOverlay'),body=document.getElementById('campBody');const camps=[['Reykjavík Fight Lab',10,1200,'Kondycja + szybkość'],['WCA Fight Team',14,3500,'Boks + BJJ'],['ANKOS MMA',14,4200,'Zapasy + praca pod klatką'],['American Top Team',21,12000,'Pełny profesjonalny camp']];let offer=null,ready=false;function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(s){localStorage.setItem(KEY,JSON.stringify(s))}function win(){return frame.contentWindow}function doc(){return frame.contentDocument}function freshStart(){try{if(!sessionStorage.getItem('mmaV120Fresh')){localStorage.removeItem(KEY);sessionStorage.setItem('mmaV120Fresh','1')}}catch(e){}frame.src='./mma-v111.html?v=120base'+Date.now()}freshStart();function openCamp(){if(!offer)return;body.innerHTML='<p>Rywal: <b>'+offer.opp+'</b> · '+offer.org+'</p><p class="muted">Cena i długość campu wyznaczają termin walki.</p>';camps.forEach(function(c,i){const b=document.createElement('button');b.className='camp';b.innerHTML='<b>'+c[0]+'</b><br>'+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł<br><small>'+c[3]+'</small>';b.onclick=function(){acceptCamp(i)};body.appendChild(b)});overlay.style.display='flex'}function acceptCamp(i){const s=read(),c=camps[i];if(!s||!offer)return;if((s.money||0)<c[2]){alert('Za mało pieniędzy na ten camp.');return}const date=(s.day||1)+c[1]+1;s.money-=c[2];s.fight={opponent:offer.opp,league:offer.org,purse:offer.purse,date,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0},camp:c[0],campDays:c[1],comment:'JURAS: Camp wybrany. Teraz szlifujemy formę pod konkretną walkę.'};s.log=s.log||[];s.log.push('🏕️ '+c[0]+' · '+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł. Walka zaplanowana na dzień '+date+'.');write(s);offer=null;overlay.style.display='none';if(typeof win().dashboard==='function')win().dashboard()}function intercept(){try{const d=doc();if(!d||!d.body)return;if(!d.__v120){d.__v120=true;d.addEventListener('click',function(ev){const el=ev.target.closest('button');if(!el)return;const txt=(el.textContent||'').trim().toUpperCase();if(txt.includes('PRZYJMIJ WALKĘ')){ev.preventDefault();ev.stopImmediatePropagation();const s=read();if(!s)return;offer=window.__v120Offer||{opp:(s.fight&&s.fight.opponent)||'Nieznany rywal',org:(s.fight&&s.fight.league)||'Lokalna gala',purse:(s.fight&&s.fight.purse)||2500};openCamp()}},true)} }catch(e){}}frame.addEventListener('load',function(){setTimeout(intercept,100);setTimeout(intercept,700);setTimeout(intercept,1800)});setInterval(intercept,1000);document.getElementById('campClose').onclick=function(){overlay.style.display='none';offer=null};})();</script></body></html>
