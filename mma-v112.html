<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V112</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./mma-v111.html?v=112"></iframe><script>(function(){'use strict';const f=document.getElementById('game');function patch(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||!d.body)return;
/* Fix modal callbacks: V111 used inline function serialization, which lost closures such as the fight offer. */
w.openModal=function(title,head,body,opts){d.getElementById('mt').textContent=title;d.getElementById('mh').textContent=head;d.getElementById('mb').innerHTML=body;const box=d.getElementById('mc');box.innerHTML='';opts.forEach((o,i)=>{const b=d.createElement('button');b.className='option';b.innerHTML=o[0];b.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();try{o[1]()}catch(e){console.error(e)}});box.appendChild(b)});d.getElementById('modal').style.display='flex'};
/* Offer fight is now a real modal event with working Accept/Reject buttons. */
w.offerFight=function(){if(w.s.fight){alert('Masz już zakontraktowaną walkę.');return}const opp=w.opponents[Math.floor(Math.random()*w.opponents.length)],org=w.league(),purse=2500+w.s.rep*150+w.s.w*450;w.openModal('OFERTA WALKI','📩 Propozycja walki',`<p><b>${opp}</b> · ${org}</p><p>Gaża: <b>${w.money(purse)}</b></p><p>Najpierw akceptujesz walkę. Dopiero potem wybierasz obóz i termin.</p>`,[['AKCEPTUJ WALKĘ',()=>w.chooseCamp(opp,org,purse)],['ODRZUĆ',w.closeModal]])};
/* FM-style CONTYNUUJ: advance days until a meaningful decision point. */
w.continueCareer=function(){if(!w.s.created||w.s.fight&&w.s.day>=w.s.fight.date){if(w.s.fight&&w.s.day>=w.s.fight.date)w.startFight();return}let start=w.s.day,limit=120;for(let i=0;i<limit;i++){if(w.s.fight&&w.s.day>=w.s.fight.date)break;const before=w.s.day;w.advanceDay();if(w.s.fight&&w.s.day>=w.s.fight.date)break;const modal=d.getElementById('modal');if(modal&&getComputedStyle(modal).display!=='none')break;if(!w.s.manager&&w.s.ig>=5000)break;if(w.s.day!==before+1)break}w.save();w.dashboard()};
/* Replace only the existing next-day control with CONTYNUUJ; the rest of the dashboard layout stays intact. */n=[...d.querySelectorAll('button')].find(b=>b.textContent.includes('NASTĘPNY DZIEŃ'));if(n){n.textContent='▶ KONTYNUUJ';n.onclick=function(){w.continueCareer()}}
/* Finance: extra income opportunities requested earlier. */
w.finance=function(){w.s.screen='finance';const job=w.s.extraIncome||{weekly:0,monthly:false,monthlyStarted:0,adUntil:0};w.s.extraIncome=job;const canAd=w.s.rep>=35||w.s.ig>=10000;w.shell(`<section class="panel"><h2>💰 Finanse</h2><p class="muted">Dodatkowe źródła dochodu. Wszystkie są dobrowolne i nie zmieniają organizacji.</p><div class="tiles"><div class="tile"><h3>🚪 Bramkarz / ochrona eventu</h3><p>Jednorazowo <b>700 zł</b>. Dostępne raz na 7 dni.</p><button ${w.s.day<job.weekly?'disabled':''} onclick="financeEarn('weekly')">WEŹ ZLECENIE</button></div><div class="tile"><h3>🧾 Etat miesięczny</h3><p><b>3 000 zł / miesiąc</b>. Możesz rozpocząć i zrezygnować w dowolnym momencie.</p><button onclick="financeEarn('monthly')">${job.monthly?'ZREZYGNUJ Z ETATU':'PODEJMIJ ETAT'}</button></div><div class="tile"><h3>📺 Udział w reklamie</h3><p><b>8 000 zł</b> za kampanię. Od 35 reputacji lub 10 000 IG.</p><button ${canAd&&w.s.day>=job.adUntil?'':'disabled'} onclick="financeEarn('ad')">WEŹ REKLAMĘ</button></div></div><div class="panel" style="margin-top:12px"><h3>Aktualny status</h3><p>Bramka: ${job.weekly&&w.s.day<job.weekly?'dostępna od dnia '+job.weekly:'dostępna'}</p><p>Etat: ${job.monthly?'AKTYWNY':'nieaktywny'}</p><p>Reklama: ${job.adUntil&&w.s.day<job.adUntil?'kolejna od dnia '+job.adUntil:'dostępna po spełnieniu wymagań'}</p></div></section>`)};
w.financeEarn=function(type){const j=w.s.extraIncome||{weekly:0,monthly:false,monthlyStarted:0,adUntil:0};if(type==='weekly'){if(w.s.day<j.weekly){alert('To zlecenie jest dostępne raz na tydzień.');return}w.s.money+=700;j.weekly=w.s.day+7;w.s.log.push('💰 Zlecenie ochrony/eventu: +700 zł.')}if(type==='monthly'){j.monthly=!j.monthly;j.monthlyStarted=j.monthly?w.s.day:0;w.s.log.push(j.monthly?'💼 Rozpoczęto etat miesięczny: +3000 zł.':'💼 Zrezygnowano z etatu miesięcznego.')}if(type==='ad'){if(!(w.s.rep>=35||w.s.ig>=10000)||w.s.day<j.adUntil)return;w.s.money+=8000;j.adUntil=w.s.day+30;w.s.ig+=500;w.s.rep=Math.min(100,w.s.rep+3);w.s.log.push('📺 Udział w reklamie: +8000 zł.')}w.s.extraIncome=j;w.save();w.finance()};
/* Monthly job pays automatically when a new month starts. */
if(!w.__v112DayPatch){w.__v112DayPatch=true;const oldAdvance=w.advanceDay;w.advanceDay=function(){const before=w.s.day;oldAdvance();if(w.s.extraIncome&&w.s.extraIncome.monthly&&Math.floor((w.s.day-1)/30)>Math.floor((before-1)/30)){w.s.money+=3000;w.s.log.push('💼 Wypłata z etatu miesięcznego: +3000 zł.');w.save()}}}
}catch(e){console.error('V112 patch',e)}}f.addEventListener('load',()=>setTimeout(patch,100));setInterval(patch,1000)})();</script></body></html>
