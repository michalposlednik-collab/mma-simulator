<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V112</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./mma-v111.html?v=112"></iframe><script>(function(){'use strict';const f=document.getElementById('game');function patch(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||!d.body)return;
w.openModal=function(title,head,body,opts){d.getElementById('mt').textContent=title;d.getElementById('mh').textContent=head;d.getElementById('mb').innerHTML=body;const box=d.getElementById('mc');box.innerHTML='';opts.forEach(o=>{const b=d.createElement('button');b.className='option';b.innerHTML=o[0];b.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();try{o[1]()}catch(e){console.error(e)}});box.appendChild(b)});d.getElementById('modal').style.display='flex'};
w.offerFight=function(){if(w.s.fight){alert('Masz już zakontraktowaną walkę.');return}const opp=w.opponents[Math.floor(Math.random()*w.opponents.length)],org=w.league(),purse=2500+w.s.rep*150+w.s.w*450;w.openModal('OFERTA WALKI','📩 Propozycja walki',`<p><b>${opp}</b> · ${org}</p><p>Gaża: <b>${w.money(purse)}</b></p><p>Najpierw akceptujesz walkę. Dopiero potem wybierasz obóz i termin.</p>`,[['AKCEPTUJ WALKĘ',()=>w.chooseCamp(opp,org,purse)],['ODRZUĆ',w.closeModal]])};
w.continueCareer=function(){if(!w.s.created)return;if(w.s.fight&&w.s.day>=w.s.fight.date){w.startFight();return}for(let i=0;i<120;i++){if(w.s.fight&&w.s.day>=w.s.fight.date)break;const before=w.s.day;w.advanceDay();const modal=d.getElementById('modal');if(modal&&getComputedStyle(modal).display!=='none')break;if(!w.s.manager&&w.s.ig>=5000)break;if(w.s.day!==before+1)break}w.save();w.dashboard()};
const n=[...d.querySelectorAll('button')].find(b=>b.textContent.includes('NASTĘPNY DZIEŃ'));if(n){n.textContent='▶ KONTYNUUJ';n.onclick=function(){w.continueCareer()}}
w.finance=function(){w.s.screen='finance';const job=w.s.extraIncome||{weekly:0,monthly:false,monthlyStarted:0,adUntil:0};w.s.extraIncome=job;const canAd=w.s.rep>=35||w.s.ig>=10000;w.shell(`<section class="panel"><h2>💰 Finanse</h2><p class="muted">Dodatkowe źródła dochodu. Nie wpływają na organizację sportową.</p><div class="tiles"><div class="tile"><h3>🚪 Bramkarz / ochrona eventu</h3><p><b>700 zł</b> · raz na 7 dni.</p><button ${w.s.day<job.weekly?'disabled':''} onclick="financeEarn('weekly')">WEŹ ZLECENIE</button></div><div class="tile"><h3>🧾 Etat miesięczny</h3><p><b>3 000 zł / miesiąc</b> · możesz zrezygnować.</p><button onclick="financeEarn('monthly')">${job.monthly?'ZREZYGNUJ Z ETATU':'PODEJMIJ ETAT'}</button></div><div class="tile"><h3>📺 Udział w reklamie</h3><p><b>8 000 zł</b> · od 35 reputacji lub 10 000 IG.</p><button ${canAd&&w.s.day>=job.adUntil?'':'disabled'} onclick="financeEarn('ad')">WEŹ REKLAMĘ</button></div></div><div class="panel" style="margin-top:12px"><h3>Status</h3><p>Bramka: ${job.weekly&&w.s.day<job.weekly?'od dnia '+job.weekly:'dostępna'}</p><p>Etat: ${job.monthly?'AKTYWNY':'nieaktywny'}</p><p>Reklama: ${job.adUntil&&w.s.day<job.adUntil?'kolejna od dnia '+job.adUntil:'dostępna po spełnieniu wymagań'}</p></div></section>`)};
w.financeEarn=function(type){const j=w.s.extraIncome||{weekly:0,monthly:false,monthlyStarted:0,adUntil:0};if(type==='weekly'){if(w.s.day<j.weekly)return;w.s.money+=700;j.weekly=w.s.day+7;w.s.log.push('💰 Zlecenie ochrony/eventu: +700 zł.')}if(type==='monthly'){j.monthly=!j.monthly;j.monthlyStarted=j.monthly?w.s.day:0;w.s.log.push(j.monthly?'💼 Rozpoczęto etat miesięczny: +3000 zł.':'💼 Zrezygnowano z etatu miesięcznego.')}if(type==='ad'){if(!(w.s.rep>=35||w.s.ig>=10000)||w.s.day<j.adUntil)return;w.s.money+=8000;j.adUntil=w.s.day+30;w.s.ig+=500;w.s.rep=Math.min(100,w.s.rep+3);w.s.log.push('📺 Udział w reklamie: +8000 zł.')}w.s.extraIncome=j;w.save();w.finance()};
if(!w.__v112DayPatch){w.__v112DayPatch=true;const oldAdvance=w.advanceDay;w.advanceDay=function(){const before=w.s.day;oldAdvance();if(w.s.extraIncome&&w.s.extraIncome.monthly&&Math.floor((w.s.day-1)/30)>Math.floor((before-1)/30)){w.s.money+=3000;w.s.log.push('💼 Wypłata z etatu miesięcznego: +3000 zł.');w.save()}}}
}catch(e){console.error('V112 patch',e)}}f.addEventListener('load',()=>setTimeout(patch,100));setInterval(patch,1000)})();</script></body></html>
