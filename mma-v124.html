<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V124</title><style>html,body{margin:0;width:100%;height:100%;background:#060b10;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.v124event{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99999;padding:18px;font-family:Arial,sans-serif;color:#eef3f5}.v124box{position:relative;width:min(760px,96vw);max-height:90vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px;box-shadow:0 20px 60px #000}.v124box h1{margin-top:5px}.v124gold{color:#d6ae51}.v124muted{color:#91a3ac}.v124actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v124actions button,.v124camp{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:13px;border-radius:9px;font-weight:700}.v124actions button:hover,.v124camp:hover{border-color:#d6ae51}.v124primary{background:#80652a!important;border-color:#d6ae51!important}.v124close{position:absolute;right:15px;top:12px;background:transparent!important;border:0!important;font-size:24px;padding:4px!important;color:#9eb0b8!important}.v124continue{position:fixed;right:24px;top:20px;z-index:5000;display:none;cursor:pointer;color:#fff;background:#80652a;border:1px solid #d6ae51;padding:12px 18px;border-radius:10px;font-weight:900;box-shadow:0 8px 25px #0008}.v124camp{display:block;width:100%;text-align:left;margin:9px 0}.v124no{background:#2a1716!important;border-color:#9a4c45!important}@media(max-width:600px){.v124actions{grid-template-columns:1fr}.v124continue{right:10px;top:10px}}</style></head><body><iframe id="game"></iframe><button id="continue" class="v124continue">▶ KONTYNUUJ DO NASTĘPNEGO EVENTU</button><div id="event" class="v124event"><div class="v124box"><button class="v124close" id="x">×</button><small id="etype" class="v124gold"></small><h1 id="etitle"></h1><div id="ebody"></div><div id="eactions" class="v124actions"></div></div></div><script>(function(){'use strict';const KEY='mmaCareerV111',frame=document.getElementById('game'),cont=document.getElementById('continue'),modal=document.getElementById('event'),etype=document.getElementById('etype'),etitle=document.getElementById('etitle'),ebody=document.getElementById('ebody'),actions=document.getElementById('eactions'),x=document.getElementById('x');let busy=false,offerOpen=false;const EVENT_DAYS=[3,7,14,21,30,45,60];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function write(s){localStorage.setItem(KEY,JSON.stringify(s))}function valid(s){return s&&s.created===true&&s.first&&s.last&&s.type&&s.weight&&Number.isFinite(Number(s.day))}function hideBase(){try{const d=frame.contentDocument,m=d&&d.getElementById('modal');if(m)m.style.display='none'}catch(e){}}function redraw(){try{const w=frame.contentWindow;if(w&&typeof w.dashboard==='function')w.dashboard()}catch(e){}}function closeEvent(){modal.style.display='none';busy=false;offerOpen=false;redraw()}x.onclick=closeEvent;function show(title,type,body,buttons,offer){etype.textContent=type;etitle.textContent=title;ebody.innerHTML=body;actions.innerHTML='';buttons.forEach(a=>{const b=document.createElement('button');b.textContent=a[0];if(a[2])b.className='v124primary';b.onclick=a[1];actions.appendChild(b)});modal.style.display='flex';busy=true;offerOpen=!!offer;hideBase()}
function nextEventDay(s){const now=Number(s.day)||1;let candidates=EVENT_DAYS.filter(d=>d>now);if(s.fight&&s.fight.date>now)candidates.push(Number(s.fight.date));return Math.min.apply(null,candidates.length?candidates:[now+7])}
function continueTime(){const s=read();if(!valid(s)||busy)return;/* A fight offer cannot be generated while a fight is already contracted. */if(s.fight&&s.fight.date&&Number(s.fight.date)>Number(s.day)){const target=Number(s.fight.date);const days=target-Number(s.day);s.day=target;s.age=18+Math.floor((target-1)/365);s.money=Math.max(0,Number(s.money||0)-days*100);s.log=s.log||[];s.log.push('📅 Kalendarz przesunięty do dnia '+target+'.');write(s);redraw();return}const target=nextEventDay(s),days=target-Number(s.day);s.day=target;s.age=18+Math.floor((target-1)/365);s.money=Math.max(0,Number(s.money||0)-days*100);s.log=s.log||[];s.log.push('📅 Kalendarz przesunięty o '+days+' dni.');write(s);redraw();eventAt(target,s)}
function eventAt(day,s){if(s.fight&&Number(s.fight.date)===Number(day)){closeEvent();try{const w=frame.contentWindow;if(typeof w.startFight==='function')w.startFight()}catch(e){}return}if([7,30,45,60].includes(day)){fightOffer();return}if([3,21].includes(day)){social();return}if(day===14){praise();return}generic()}
function fightOffer(){const s=read();if(!valid(s)|| (s.fight&&s.fight.date&&Number(s.fight.date)>Number(s.day))){return}const opp=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek'][Math.floor(Math.random()*5)],org=Number(s.w||0)<2?'Lokalna gala':Number(s.w||0)<4?'Hybrid':Number(s.w||0)<7?'Babilon MMA / FEN':Number(s.w||0)<10?'KSW':'OKTAGON',purse=Number(s.w||0)<2?1800:Number(s.w||0)<4?3000:Number(s.w||0)<7?5000:8000;show('OFERTA WALKI','EVENT · PROPOZYCJA WALKI','<p>Promotor: <b>'+opp+'</b>. Organizacja: <b>'+org+'</b>.</p><p>Gaża: <b>'+purse.toLocaleString('pl-PL')+' zł</b>.</p><p class="v124muted">Masz już pełne prawo powiedzieć tak albo odpuścić. Dopiero po akceptacji wybierzesz przygotowania.</p>',[['AKCEPTUJ WALKĘ',()=>campOffer(opp,org,purse),true],['ODRZUĆ WALKĘ',()=>{const q=read();q.log=q.log||[];q.log.push('❌ Odrzucono ofertę walki z '+opp+'.');write(q);closeEvent()}]],true)}
function campOffer(opp,org,purse){const s=read();if(!valid(s))return;etype.textContent='EVENT · PRZYGOTOWANIE';etitle.textContent='WYBIERZ OBÓZ PRZYGOTOWAWCZY';ebody.innerHTML='<p>Rywal: <b>'+opp+'</b> · '+org+' · gaża <b>'+purse.toLocaleString('pl-PL')+' zł</b></p><p class="v124muted">Nie masz pieniędzy na wybrany camp? Możesz zamknąć okno <b>×</b> i wrócić do kariery albo wybrać przygotowanie bez płatnego campu.</p>';actions.innerHTML='';const camps=[['Reykjavík Fight Lab',10,1200,'Kondycja + szybkość'],['WCA Fight Team',14,3500,'Boks + BJJ'],['ANKOS MMA',14,4200,'Zapasy + praca pod klatką'],['American Top Team',21,12000,'Pełny profesjonalny camp']];camps.forEach(c=>{const b=document.createElement('button');b.className='v124camp';b.innerHTML='<b>'+c[0]+'</b><br>'+c[1]+' dni · '+c[2].toLocaleString('pl-PL')+' zł<br><small>'+c[3]+'</small>';b.onclick=()=>acceptCamp(opp,org,purse,c);actions.appendChild(b)});const free=document.createElement('button');free.className='v124camp v124no';free.innerHTML='<b>PRZYGOTOWANIE WŁASNE — 0 zł</b><br>Trening w obecnym klubie · 7 dni';free.onclick=()=>acceptCamp(opp,org,purse,['Przygotowanie własne',7,0,'Trening w obecnym klubie']);actions.appendChild(free);}
function acceptCamp(opp,org,purse,c){const s=read();if(Number(s.money||0)<Number(c[2])){ebody.innerHTML+='<p style="color:#df5045"><b>Brakuje Ci '+(Number(c[2])-Number(s.money||0)).toLocaleString('pl-PL')+' zł.</b> Wybierz tańszy camp, przygotowanie własne albo zamknij ×.</p>';return}const date=Number(s.day)+Number(c[1])+1;s.money-=Number(c[2]);s.fight={opponent:opp,league:org,purse,date,camp:c[0],campDays:c[1],round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}};s.log=s.log||[];s.log.push('🥊 Zaakceptowano walkę z '+opp+'. Camp: '+c[0]+'. Data walki: dzień '+date+'.');write(s);closeEvent()}
function social(){show('KOLEJNA DRAMA W SOCIALACH','EVENT · SOCIAL MEDIA','<p>Rywal wrzuca: <b>„Dużo szczekasz jak na gościa, którego jeszcze nikt nie zna.”</b></p><p class="v124muted">Wybierz ton odpowiedzi. To ma być Twoja medialna persona, a nie „pozytywna/negatywna” opcja.</p>',[['„Szczekanie zostawmy Tobie. Ja robię to rękami.”',()=>react(3),true],['„Spokojnie. Jak podpiszesz kontrakt, dostaniesz odpowiedź bez klawiatury.”',()=>react(2)],['„Dzięki za zasięg. Następnym razem oznacz mnie, będzie taniej.”',()=>react(2)],['„Nie będę robił kariery w komentarzach.”',()=>react(0)]])}function praise(){show('POCHWAŁA, KTÓRA PROSI SIĘ O ODPOWIEDŹ','EVENT · SOCIAL MEDIA','<p>Profil MMA pisze: <b>„Ten gość zaczyna wyglądać jak poważny problem.”</b></p>',[['„Zaczyna? Poczekajcie na następną walkę.”',()=>react(2),true],['„Niech mówią. Ja mam robotę do zrobienia.”',()=>react(1)],['„W końcu ktoś się zorientował 😂”',()=>react(2)]])}function react(n){const s=read();s.rep=Math.max(0,Math.min(100,Number(s.rep||0)+n));s.ig=Math.max(0,Number(s.ig||0)+n*200);s.log=s.log||[];s.log.push('📱 Odpowiedź w social mediach.');write(s);closeEvent()}function generic(){show('WAŻNY MOMENT','EVENT · KARIERA','<p>Pojawiło się wydarzenie wymagające Twojej decyzji.</p>',[['KONTYNUUJ',closeEvent,true]])}
function boot(){try{const s=read();if(!s||!s.created){cont.style.display='none'}else cont.style.display='block'}catch(e){}}cont.onclick=continueTime;frame.addEventListener('load',()=>setTimeout(boot,200));setInterval(boot,800);frame.src='./mma-v111.html?v=124base&x='+Date.now();})();</script></body></html>
