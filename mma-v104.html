<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMA Career Simulator V104</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060b10;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}
button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}button:hover{border-color:#d6ae51}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#80652a;border-color:#d6ae51}.danger{background:#652b2b;border-color:#a65b5b}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 16px 45px #0006}.creator{max-width:1100px;margin:auto}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{display:none}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:76px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.pick+label small{display:block;color:#9eb0b8;margin-top:6px}.gold{color:#d6ae51}.muted{color:#91a3ac}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.side button.active{border-color:#d6ae51;background:#211f15}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b}.progress{height:10px;background:#202b31;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#d6ae51}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #20333c;text-align:left}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#182d38;color:#a9c1ca;font-size:12px}.modal{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:50;padding:18px}.modalbox{width:min(1000px,96vw);max-height:92vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:26px}.wheelwrap{display:none;position:fixed;inset:0;background:#000e;z-index:100;place-items:center}.wheelbox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:22px;text-align:center;width:min(520px,95vw)}.wheel{width:280px;height:280px;margin:12px auto;border-radius:50%;background:conic-gradient(#c33 0 12.5%,#2e9d5b 12.5% 25%,#c33 25% 37.5%,#2e9d5b 37.5% 50%,#c33 50% 62.5%,#2e9d5b 62.5% 75%,#c33 75% 87.5%,#2e9d5b 87.5% 100%);border:8px solid #17252d;transition:transform 2s cubic-bezier(.12,.7,.15,1);position:relative}.wheel:after{content:'▲';position:absolute;top:-27px;left:50%;transform:translateX(-50%);color:#d6ae51;font-size:25px}.comment{min-height:100px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;font-size:17px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.fight{background:radial-gradient(circle at 50% 0,#293a44,#070c11);min-height:100vh;padding:18px}.fighthead{display:flex;justify-content:space-between;align-items:center}.round{font-size:28px;color:#d6ae51}.clock{font-size:42px;font-weight:800}.fighters{display:grid;grid-template-columns:1fr 250px 1fr;gap:15px;align-items:center;margin:18px 0}.fighter{text-align:center;padding:18px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:14px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.logbox{max-height:260px;overflow:auto;margin-top:10px}.hidden{display:none}@media(max-width:900px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.grid,.cols{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}@media(max-width:600px){.grid,.cols,.stats{grid-template-columns:1fr}.top{display:block}.clock{font-size:34px}}
</style></head>
<body><div id="app" class="app"></div>
<div id="wheel" class="wheelwrap"><div class="wheelbox"><h2 class="gold">KOŁO FORTUNY</h2><p id="wheelText">Losowanie wyniku...</p><div id="wheelEl" class="wheel"></div><button class="primary" id="spinBtn" onclick="spinWheel()">LOSOWANIE</button></div></div>
<script>
(function(){'use strict';
const app=document.getElementById('app'),wheel=document.getElementById('wheel'),wheelEl=document.getElementById('wheelEl'),wheelText=document.getElementById('wheelText');
const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};
const TYPES={Wonderkid:'Talent, refleks i głód zwycięstw. Potencjał ogromny, doświadczenie jeszcze nie.',Bijok:'Szczęka ze stali, ręce z żelaza, a mózg czasem na urlopie.',Fizol:'Siła, klincz i presja. Jeśli nie działa plan A, jest jeszcze ciężar właściwy.',Zapaśnik:'Najpierw nogi rywala, potem pytania. Siatka to jego drugi dom.',Striker:'Dystans, timing i przekonanie, że każda runda może skończyć się przed czasem.',Gumiarz:'Im większy chaos, tym lepiej. Na macie czuje się jak ryba w wodzie.',Allrounder:'Nie ma jednej supermocy. Ma za to odpowiedź na większość problemów.'};
const BUD=[[5000,'Normalny etat','Praca po godzinach. Każdy wydatek boli.'],[10000,'Etat + oszczędności','Trochę oddechu, ale nadal trzeba liczyć.'],[25000,'Rodzina pomaga','Masz zaplecze na pierwszy poważny krok.'],[50000,'Bogata rodzina','Możesz inwestować w obozy i sprzęt.'],[100000,'Rodzinny biznes','Sport jest finansowany jak drugi biznes.']];
const CLUBS=[['Uniq Fight Club','Warszawa',0,6000,'Stójka, boks i kickboxing.',{Boks:5,Szybkość:3}],['ANKOS MMA','Poznań',10,8000,'Zapasy, MMA i praca pod presją.',{Zapasy:6,Kondycja:3}],['WCA Fight Team','Warszawa',20,9000,'BJJ, grappling i praca w parterze.',{BJJ:6,Zapasy:2}],['Czerwony Smok','Poznań',30,11000,'Przekrojowy camp MMA.',{Boks:3,BJJ:3,Zapasy:3}],['American Top Team','Coconut Creek',65,25000,'Międzynarodowy camp dla zawodników z reputacją.',{Boks:4,BJJ:4,Zapasy:4,Kondycja:4}]];
const LEAGUES=[['Lokalna gala',0],['Hybrid',2],['Babilon MMA / FEN',4],['KSW',7],['OKTAGON',10],['Cage Warriors',13],['PFL',16],['UFC',19]];
let s={created:false,day:1,age:18,money:10000,rep:5,ig:100,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',club:'Brak',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,log:[],history:[],screen:'dashboard',fightTimer:null,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,comment:'',wheelAction:null,wheelCost:0,roundScore:[]};
try{const saved=localStorage.getItem('mmaV104');if(saved)s=Object.assign(s,JSON.parse(saved));}catch(e){}
function save(){try{localStorage.setItem('mmaV104',JSON.stringify(s))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}
function league(){let x=LEAGUES[0][0];LEAGUES.forEach(a=>{if(s.w>=a[1])x=a[0]});return x}
function nextReq(){for(const a of LEAGUES)if(s.w<a[1])return a;return ['UFC',99]}
function creator(){let types='',bud='',weights='';Object.keys(TYPES).forEach((k,i)=>types+=`<input class="pick" id="t${i}" name="type" type="radio" value="${k}"><label for="t${i}"><b>${k}</b><small>${TYPES[k]}</small></label>`);BUD.forEach((x,i)=>bud+=`<input class="pick" id="b${i}" name="bud" type="radio" value="${x[0]}"><label for="b${i}"><b>${money(x[0])}</b><small><b>${x[1]}</b><br>${x[2]}</small></label>`);Object.keys(KG).forEach((k,i)=>weights+=`<input class="pick" id="w${i}" name="weight" type="radio" value="${k}"><label for="w${i}"><b>${k}</b><small>${KG[k]}</small></label>`);app.innerHTML=`<div class="wrap creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do wielkich gal.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="Imię"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="Nazwisko"></div><h3>TYP ZAWODNIKA</h3><div class="grid">${types}</div><h3>BUDŻET STARTOWY</h3><div class="grid">${bud}</div><h3>KATEGORIA WAGOWA</h3><div class="grid">${weights}</div><br><button class="primary" onclick="startCareer()">STWÓRZ KARIERĘ →</button></div></div>`}
function startCareer(){const f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij imię, nazwisko, typ zawodnika, budżet i kategorię wagową.');return}s.created=true;s.first=f;s.last=l;s.type=t.value;s.money=+b.value;s.weight=w.value;s.log=[`🥊 Rozpoczęto karierę ${f} ${l}. Budżet: ${money(s.money)}.`];save();dashboard()}
function nav(){const items=[['dashboard','⌂ Dashboard'],['training','🥊 Trening'],['fights','🏆 Walki'],['career','📋 Kariera'],['media','📱 Media'],['manager','💼 Menedżer'],['statistics','📊 Statystyki'],['finance','💰 Finanse'],['events','◉ Eventy']];return '<aside class="side">'+items.map(x=>`<button class="${s.screen===x[0]?'active':''}" onclick="${x[0]}()">${x[1]}</button>`).join('')+`<button onclick="advance(1)">＋ Jeden dzień</button></aside>`}
function shell(content){app.innerHTML=`<div class="layout">${nav()}<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>${esc(s.first)} ${esc(s.last)}</h1><p class="muted">Dzień ${s.day} · ${s.age} lat · ${esc(s.type)} · ${esc(s.weight)} (${KG[s.weight]})</p></div><div><button onclick="advance(1)">＋ 1 DZIEŃ</button> <button class="primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div>${stats()}${content}</main></div>`}
function stats(){return `<div class="stats"><div class="stat"><small>REKORD</small><b>${s.w}-${s.l}-${s.d}</b></div><div class="stat"><small>REPUTACJA</small><b>${s.rep}/100</b></div><div class="stat"><small>INSTAGRAM</small><b>${s.ig.toLocaleString('pl-PL')}</b></div><div class="stat"><small>GOTÓWKA</small><b>${money(s.money)}</b></div><div class="stat"><small>ORGANIZACJA</small><b>${league()}</b></div><div class="stat"><small>KLUB</small><b>${esc(s.club)}</b></div></div>`}
function dashboard(){if(!s.created){creator();return}s.screen='dashboard';const req=nextReq();let path=LEAGUES.map((a,i)=>`<div class="feed">${s.w>=a[1]?'🟢':'🔒'} <b>${a[0]}</b> <span class="muted">${a[1]===0?'start':'od '+a[1]+' zwycięstw'}</span></div>`).join('');let skills=Object.entries(s.sk).map(([k,v])=>`<div class="feed"><b>${k}</b> ${v}<div class="bar"><i style="width:${Math.min(100,v)}%"></i></div></div>`).join('');let hero=s.fight?`<div class="hero"><h2>🥊 WALKA W KALENDARZU</h2><p>${s.fight.league} · Rywal: <b>${esc(s.fight.opponent)}</b> · ${s.fight.purse}</p><button class="primary" onclick="startFight()">WEJDŹ DO WALKI</button></div>`:`<div class="hero"><h2>📅 BUDOWANIE KARIERY</h2><p>Jesteś w organizacji <b>${league()}</b>. Następny cel: <b>${req[0]}</b>${req[1]>s.w?' po '+(req[1]-s.w)+' zwycięstwach.':'.'}</p><button class="primary" onclick="nextEvent()">WYGNERUJ NASTĘPNY EVENT</button></div>`;shell(hero+`<div class="cols"><section class="panel"><h2>Twoja kariera</h2>${path}</section><section class="panel"><h2>Umiejętności</h2>${skills}</section></div><section class="panel"><h2>Ostatnie wydarzenia</h2>${s.log.slice(-8).reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')||'<p class="muted">Brak wydarzeń.</p>'}</section>`)}
function training(){s.screen='training';const cards=CLUBS.map(c=>{const ok=s.rep>=c[2];return `<div class="tile ${ok?'':'locked'}"><h3>${c[0]}</h3><span class="tag">${c[1]}</span><p class="muted">${c[4]}</p><p>Reputacja: ${c[2]} · Miesięcznie: ${money(c[3])}</p><button ${ok?'':'disabled'} onclick="joinClub('${c[0]}')">${s.club===c[0]?'WYBRANO':'WYBIERZ KLUB'}</button></div>`}).join('');shell(`<section class="panel"><h2>🥊 Trening i camp</h2><p class="muted">Wybierz klub. Trening kosztuje pieniądze, ale rozwija konkretne umiejętności.</p><div class="tiles">${cards}</div><div class="actions"><button onclick="doTraining('Kondycja')">TRENING KONDYCJI · 500 zł</button><button onclick="doTraining('Boks')">BOKS · 600 zł</button><button onclick="doTraining('Zapasy')">ZAPASY · 700 zł</button><button onclick="doTraining('BJJ')">BJJ · 700 zł</button></div></section>`)}
function joinClub(name){const c=CLUBS.find(x=>x[0]===name);if(!c||s.rep<c[2])return;if(s.money<c[3]){alert('Za mało pieniędzy.');return}s.money-=c[3];s.club=name;Object.entries(c[5]).forEach(([k,v])=>s.sk[k]+=v);s.log.push(`🏋️ Dołączono do ${name}. Opłata ${money(c[3])}.`);save();training()}
function doTraining(skill){const cost=skill==='Kondycja'?500:(skill==='Boks'?600:700);if(s.money<cost){alert('Za mało pieniędzy.');return}s.money-=cost;s.sk[skill]=Math.min(100,s.sk[skill]+2);s.mot=Math.min(100,s.mot+2);s.log.push(`🥊 Trening: ${skill} +2. Koszt ${money(cost)}.`);save();training()}
function nextEvent(){if(s.fight){alert('Masz już zaplanowaną walkę.');return}const opps=['Kamil Wrona','Marek Lis','Patryk Nowak','Daniel Cruz','Rafał Kaczmarek','Jonas Berg'];const purse=Math.max(2500,Math.round(2500+s.rep*180+s.w*500));s.fight={opponent:opps[Math.floor(Math.random()*opps.length)],league:league(),purse:money(purse),purseRaw:purse};s.log.push(`📅 Otrzymano ofertę walki w ${league()} z ${s.fight.opponent}.`);save();dashboard()}
function fights(){s.screen='fights';let rows=s.history.slice().reverse().map(h=>`<tr><td>${h.date}</td><td>${h.league}</td><td>${esc(h.opponent)}</td><td>${h.result}</td><td>${h.method}</td><td>${money(h.purse)}</td></tr>`).join('');shell(`<section class="panel"><h2>🏆 Walki</h2>${s.fight?`<div class="hero"><h3>${s.fight.league} · ${esc(s.fight.opponent)}</h3><p>Gaża: ${s.fight.purse}</p><button class="primary" onclick="startFight()">ROZPOCZNIJ WALKĘ</button></div>`:'<p class="muted">Brak walki w kalendarzu. Użyj „Następny event”.</p>'}<table class="table"><thead><tr><th>Dzień</th><th>Gala</th><th>Rywal</th><th>Wynik</th><th>Metoda</th><th>Gaża</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Brak historii</td></tr>'}</tbody></table></section>`)}
function career(){s.screen='career';const req=nextReq();shell(`<div class="cols"><section class="panel"><h2>📋 Profil zawodnika</h2><p><b>${esc(s.first)} ${esc(s.last)}</b></p><p>${esc(s.type)} · ${esc(s.weight)} · ${KG[s.weight]}</p><p>Rekord: <b>${s.w}-${s.l}-${s.d}</b></p><p>Reputacja: <b>${s.rep}/100</b></p><p>Cel: <b>${req[0]}</b></p></section><section class="panel"><h2>Droga na szczyt</h2>${LEAGUES.map(a=>`<div class="feed">${s.w>=a[1]?'✅':'🔒'} ${a[0]} — ${a[1]} zwycięstw</div>`).join('')}</section></div>`)}
function media(){s.screen='media';shell(`<section class="panel"><h2>📱 Media</h2><p>Instagram: <b>${s.ig.toLocaleString('pl-PL')}</b> obserwujących.</p><div class="tiles"><div class="tile"><h3>Wywiad</h3><p>Zysk reputacji +2, Instagram +150.</p><button onclick="mediaAction(2,150)">UDZIEL WYWIADU</button></div><div class="tile"><h3>Post po walce</h3><p>Buduje markę, jeśli masz coś do powiedzenia.</p><button onclick="mediaAction(1,250)">OPUBLIKUJ</button></div><div class="tile"><h3>Konferencja</h3><p>Ryzyko kontrowersji, większy zasięg.</p><button onclick="mediaAction(4,500)">WEJDŹ W SHOW</button></div></div></section>`)}
function mediaAction(rep,ig){s.rep=Math.min(100,s.rep+rep);s.ig+=ig;s.log.push(`📱 Media: +${rep} reputacji, +${ig} obserwujących.`);save();media()}
function manager(){s.screen='manager';shell(`<section class="panel"><h2>💼 Menedżer</h2><p>Na początku kariery działasz sam. Agent pojawia się po serii zwycięstw.</p><div class="hero"><h3>${s.w>=4?'🤝 Agent zainteresowany':'🔒 Agent jeszcze nie teraz'}</h3><p>${s.w>=4?'Możesz negocjować lepsze gaże i większe gale.':'Potrzebujesz minimum 4 zwycięstw.'}</p>${s.w>=4?'<button onclick="agent()">NEGOCJUJ KONTRAKT</button>':''}</div></section>`)}
function agent(){s.rep=Math.min(100,s.rep+3);s.log.push('💼 Agent dołączył do zespołu. Reputacja +3.');save();manager()}
function statistics(){s.screen='statistics';const total=s.w+s.l+s.d,winrate=total?Math.round(s.w/total*100):0;shell(`<div class="tiles"><div class="tile"><h3>Walki</h3><b>${total}</b></div><div class="tile"><h3>Win rate</h3><b>${winrate}%</b></div><div class="tile"><h3>KO/TKO</h3><b>${s.history.filter(x=>/KO|TKO/.test(x.method)).length}</b></div><div class="tile"><h3>Submissions</h3><b>${s.history.filter(x=>/Submission/.test(x.method)).length}</b></div></div><section class="panel"><h2>Umiejętności</h2>${Object.entries(s.sk).map(([k,v])=>`<div class="feed"><b>${k}</b> ${v}/100<div class="progress"><i style="width:${v}%"></i></div></div>`).join('')}</section>`)}
function finance(){s.screen='finance';let income=s.history.reduce((a,h)=>a+h.purse,0);shell(`<section class="panel"><h2>💰 Finanse</h2><div class="tiles"><div class="tile"><small>GOTÓWKA</small><h2>${money(s.money)}</h2></div><div class="tile"><small>GAŻE Z WALK</small><h2>${money(income)}</h2></div><div class="tile"><small>WYDATKI ZNANE</small><h2>${money(Math.max(0,income-(s.money-(s.created?0:0))))}</h2></div></div><h3>Przykładowe koszty kariery</h3><div class="feed">🥊 Trening indywidualny: 500–700 zł</div><div class="feed">🏋️ Klub: 6 000–25 000 zł / okres</div><div class="feed">🧳 Camp i wyjazd: zależnie od poziomu gali</div></section>`)}
function events(){s.screen='events';shell(`<section class="panel"><h2>◉ Eventy</h2><p class="muted">Pełne wydarzenia pojawiają się wraz z rozwojem kariery. Na razie możesz generować kolejny event z poziomu Dashboardu.</p>${s.log.slice(-15).reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section>`)}
function startFight(){if(!s.fight)return;clearInterval(s.fightTimer);s.round=1;s.time=300;s.stamina=100;s.vitality=100;s.oppStamina=100;s.oppVitality=100;s.comment='Witamy w klatce! JURAS: „Panowie gotowi. Teraz nie ma już wymówek.”';s.roundScore=[];s.screen='fight';renderFight();s.fightTimer=setInterval(tick,1000)}
function tick(){if(s.screen!=='fight'){clearInterval(s.fightTimer);return}if(s.time<=0){endRound();return}s.time--;if(Math.random()<0.35)autoExchange();renderFight()}
function autoExchange(){const dmg=Math.max(1,Math.round(1+Math.random()*3+(s.sk.Boks+s.sk.Szybkość)/90));const odmg=Math.max(1,Math.round(1+Math.random()*3));s.oppVitality=Math.max(0,s.oppVitality-dmg);s.vitality=Math.max(0,s.vitality-odmg);s.stamina=Math.max(0,s.stamina-(1+Math.random()*1.5));s.oppStamina=Math.max(0,s.oppStamina-(1+Math.random()*1.5));const lines=['JURAS: Dobra wymiana w stójce, nikt nie chce oddać środka klatki.','JURAS: Presja rośnie. Widać pracę na nogach.','JURAS: Ładny prosty! Rywal musiał się cofnąć.','JURAS: Obaj czują już tempo tej walki.'];s.comment=lines[Math.floor(Math.random()*lines.length)];if(s.oppVitality<=0){finishFight('KO/TKO','KO');}}
function action(name){if(s.screen!=='fight')return;const data={Prosty:[3,4,0,0],Lowkick:[5,5,3,0],Highkick:[12,9,10,25],Kolano:[10,8,7,18],Obalenie:[7,6,12,22],Balacha:[18,10,15,28],Trójkąt:[16,10,16,30],RNC:[20,12,17,32],Spinning:[15,11,13,26]}[name]||[3,4,0,0];if(['Highkick','Kolano','Obalenie','Balacha','Trójkąt','RNC','Spinning'].includes(name)){s.wheelAction={name,data};wheel.style.display='grid';wheelText.textContent=`${name}: ryzyko zależne od trudności techniki`;wheelEl.style.transform='rotate(0deg)';return}applyAction(name,data,true)}
function applyAction(name,d,player){let dmg=d[0]+Math.round(Math.random()*d[1]);let cost=d[2];s.stamina=Math.max(0,s.stamina-cost);s.oppVitality=Math.max(0,s.oppVitality-dmg);s.oppStamina=Math.max(0,s.oppStamina-(2+Math.random()*4));s.time=Math.max(0,s.time-(2+Math.floor(Math.random()*5)));s.comment=player?`JURAS: ${name==='Prosty'?'Prosty dochodzi!':name==='Lowkick'?'Low kick na nogę wykroczną.':name+'! Próba wykonana z pełnym przekonaniem.'}`:'';if(s.oppVitality<=0){finishFight('KO/TKO','KO');return}if(Math.random()<0.18){const back=Math.max(1,Math.round(2+Math.random()*4));s.vitality=Math.max(0,s.vitality-back);s.stamina=Math.max(0,s.stamina-2);s.comment+=' JURAS: Rywal odpowiada!'}if(s.vitality<=0){finishFight('KO/TKO','KO');return}renderFight()}
window.spinWheel=function(){if(!s.wheelAction)return;document.getElementById('spinBtn').disabled=true;const r=Math.random();const name=s.wheelAction.name;const d=s.wheelAction.data;const success= r < (0.25+(100-d[3])*0.005);const partial=!success && r<0.78;wheelEl.style.transform=`rotate(${1440+Math.floor(Math.random()*360)}deg)`;setTimeout(()=>{wheel.style.display='none';document.getElementById('spinBtn').disabled=false;if(success){wheelText.textContent='';applyAction(name,d,true)}else if(partial){s.comment=`JURAS: ${name} częściowo trafiony. Jest efekt, ale zapłacisz za ryzyko.`;applyAction(name,[Math.round(d[0]*.55),d[1],d[2]+4],true)}else{const back=Math.round(d[2]*.7);s.stamina=Math.max(0,s.stamina-back);s.vitality=Math.max(0,s.vitality-3);s.comment=`JURAS: Nieudana próba ${name}! Rywal wykorzystuje błąd.`;renderFight()}s.wheelAction=null},2100)};
function endRound(){const my=Math.round((100-s.oppVitality)+(s.oppStamina<s.stamina?8:0)),op=Math.round((100-s.vitality)+(s.stamina<s.oppStamina?8:0));s.roundScore.push(my>=op?10:9);if(s.round>=3){finishFight('Decyzja',s.roundScore.reduce((a,b)=>a+b,0)>27?'W':'L');return}s.round++;s.time=300;s.stamina=Math.min(100,s.stamina+25);s.oppStamina=Math.min(100,s.oppStamina+22);s.comment=`JURAS: Koniec rundy ${s.round-1}. Punktacja ${s.roundScore[s.roundScore.length-1]}-${s.roundScore[s.roundScore.length-1]===10?9:10}. Do narożnika!`;renderFight()}
function finishFight(method,result){clearInterval(s.fightTimer);if(!s.fight)return;const win=result==='W'||method==='KO/TKO';const purse=s.fight.purseRaw||0;s.money+=purse;if(win){s.w++;s.rep=Math.min(100,s.rep+(method==='KO/TKO'?6:4));s.ig+=Math.round(100+s.rep*8)}else{s.l++;s.rep=Math.max(0,s.rep-2);s.ig=Math.max(0,s.ig-50)}s.history.push({date:'Dzień '+s.day,league:s.fight.league,opponent:s.fight.opponent,result:win?'WIN':'LOSS',method,purse});s.log.push(`${win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA'} z ${s.fight.opponent} — ${method}. Gaża ${money(purse)}.`);s.fight=null;save();setTimeout(()=>{dashboard()},700)}
function renderFight(){app.innerHTML=`<div class="fight"><div class="fighthead"><div><div class="gold">${esc(s.fight.league)}</div><h1>${esc(s.first)} ${esc(s.last)} vs ${esc(s.fight.opponent)}</h1></div><div><div class="round">RUNDA ${s.round}/3</div><div class="clock">${String(Math.floor(s.time/60)).padStart(2,'0')}:${String(s.time%60).padStart(2,'0')}</div></div></div><div class="fighters"><div class="fighter"><h2>${esc(s.first)}</h2><p>Witalność ${Math.round(s.vitality)}%</p><div class="hp"><i style="width:${s.vitality}%"></i></div><p>Stamina ${Math.round(s.stamina)}%</p><div class="hp"><i style="width:${s.stamina}%"></i></div></div><div class="comment">${esc(s.comment)}</div><div class="fighter"><h2>${esc(s.fight.opponent)}</h2><p>Witalność ${Math.round(s.oppVitality)}%</p><div class="hp"><i style="width:${s.oppVitality}%"></i></div><p>Stamina ${Math.round(s.oppStamina)}%</p><div class="hp"><i style="width:${s.oppStamina}%"></i></div></div></div><div class="panel"><h3>AKCJE</h3><div class="actions"><button onclick="action('Prosty')">Prosty</button><button onclick="action('Lowkick')">Low kick</button><button onclick="action('Highkick')">High kick 🎡</button><button onclick="action('Kolano')">Latające kolano 🎡</button><button onclick="action('Spinning')">Spinning backfist 🎡</button><button onclick="action('Obalenie')">Obalenie 🎡</button><button onclick="action('Balacha')">Balacha 🎡</button><button onclick="action('Trójkąt')">Trójkąt 🎡</button><button onclick="action('RNC')">RNC 🎡</button></div><p class="muted">Zwykła walka toczy się automatycznie. Znaczące techniki uruchamiają koło fortuny.</p></div><button onclick="clearInterval(s.fightTimer);dashboard()">OPUŚĆ WALKĘ</button></div>`}
function advance(days){if(!s.created)return;clearInterval(s.fightTimer);s.day+=days;if(s.day%365<days)s.age++;s.money=Math.max(0,s.money-200*days);s.mot=Math.max(0,s.mot-days*.2);s.log.push(`📅 Minęło ${days} dzień. Koszty życia: ${money(200*days)}.`);save();dashboard()}
window.startCareer=startCareer;window.dashboard=dashboard;window.training=training;window.fights=fights;window.career=career;window.media=media;window.manager=manager;window.statistics=statistics;window.finance=finance;window.events=events;window.nextEvent=nextEvent;window.startFight=startFight;window.joinClub=joinClub;window.doTraining=doTraining;window.mediaAction=mediaAction;window.agent=agent;window.action=action;window.advance=advance;
if(!s.created)creator();else dashboard();
})();
</script></body></html>
