<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V85</title><style>body{margin:0;background:#060d12;color:#fff;font:14px Arial}#boot{padding:24px}</style></head><body><div id="boot">Ładowanie V85…</div><script>(async()=>{try{const base=await fetch('https://raw.githubusercontent.com/michalposlednik-collab/mma-simulator/3bf165d16acae20fb914677f0581f845802eff00/index.html').then(r=>r.text());let html=base.replace(/<title>[^<]*<\/title>/i,'<title>MMA Career Simulator V85</title>');const extra=`<style>.v85dash{animation:v85in .45s ease both}@keyframes v85in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.v85alert{position:fixed;right:24px;top:88px;z-index:5000;width:min(390px,calc(100vw - 48px));padding:16px;background:#0d1821;border:1px solid #d2ab48;border-radius:14px;box-shadow:0 20px 70px #000;animation:v85in .35s ease}.v85alert b{color:#e4bd5b}.v85close{float:right;background:none;border:0;color:#aaa;font-size:20px}.kg{display:block;color:#d2ab48;font-size:12px;margin-top:5px}.budgetgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.budgetgrid label{padding:14px;background:#101e28;border:1px solid #294454;border-radius:8px;cursor:pointer}.budgetgrid input{display:none}.budgetgrid input:checked+label{border-color:#d6ab45;background:#211f15}.v85wheel{position:fixed;inset:0;background:#020609ee;z-index:6000;display:grid;place-items:center}.v85wm{width:min(440px,90vw);padding:24px;text-align:center;background:#0d1821;border:1px solid #d2ab48;border-radius:18px}.v85w{width:280px;height:280px;margin:18px auto;border-radius:50%;border:7px solid #65747d;background:conic-gradient(#35c77b 0 8%,#d94d5b 8% 16%,#35c77b 16% 24%,#d94d5b 24% 32%,#35c77b 32% 40%,#d94d5b 40% 48%,#35c77b 48% 56%,#d94d5b 56% 64%,#35c77b 64% 72%,#d94d5b 72% 80%,#35c77b 80% 88%,#d94d5b 88%);transition:transform 2s cubic-bezier(.12,.75,.08,1);position:relative}.v85w:after{content:'▼';position:absolute;left:50%;top:-38px;transform:translateX(-50%);font-size:28px}.v85wm button{padding:11px 18px;background:#80652b;color:#fff;border:1px solid #d6ab45;border-radius:8px;font-weight:800}</style>`;html=html.replace('</head>',extra+'</head>');const patch=`<script>(function(){const kg={Flyweight:'56.7 kg',Bantamweight:'61.2 kg',Featherweight:'65.8 kg',Lightweight:'70.3 kg',Welterweight:'77.1 kg',Middleweight:'83.9 kg', 'Light Heavyweight':'93.0 kg',Heavyweight:'120.2 kg'};const oldCreator=window.creator;let injected=false;function fix(){if(!window.app||!window.state)return;const obs=new MutationObserver(()=>{const labels=document.querySelectorAll('.picklabel');labels.forEach(x=>{const b=x.querySelector('b');if(b&&kg[b.textContent]&&!x.querySelector('.kg')){const s=document.createElement('span');s.className='kg';s.textContent=kg[b.textContent];x.appendChild(s)}});const c=document.querySelector('.creator .box');if(c&&!c.querySelector('.budgetgrid')){const h=[...c.querySelectorAll('h3')].find(x=>x.textContent.includes('KATEGORIA'));if(h){const box=document.createElement('div');box.className='budgetgrid';[['5000','5 000 ISK'],['10000','10 000 ISK'],['25000','25 000 ISK'],['50000','50 000 ISK']].forEach((v,i)=>{box.innerHTML+=`<input id="v85b${i}" type="radio" name="budget" value="${v[0]}" ${i===0?'checked':''}><label for="v85b${i}">${v[1]}<small class="kg">Budżet startowy</small></label>`});h.parentNode.insertBefore(box,h)}}});obs.observe(document.body,{childList:true,subtree:true})}function eventAlert(t,m){const o=document.createElement('div');o.className='v85alert';o.innerHTML='<button class="v85close">×</button><b>'+t+'</b><p>'+m+'</p>';o.querySelector('button').onclick=()=>o.remove();document.body.appendChild(o);setTimeout(()=>o.remove(),9000)}function wheel(btn){const name=(btn.innerText||'Akcja').trim();let chance=70,x=name.toLowerCase();if(/high kick|spinning|latające|obrot/.test(x))chance=48;if(/balacha|trójkąt|duszenie|rnc/.test(x))chance=55;const ok=Math.random()*100<chance,o=document.createElement('div');o.className='v85wheel';o.innerHTML='<div class="v85wm"><div>JURAS · MOMENT W WALCE</div><h2>'+name+'</h2><div class="v85w"></div><h2 class="res">LOSOWANIE...</h2><button class="back" disabled>WRÓĆ DO WALKI</button></div>';document.body.appendChild(o);requestAnimationFrame(()=>o.querySelector('.v85w').style.transform='rotate('+(1800+Math.random()*720)+'deg)');setTimeout(()=>{o.querySelector('.res').textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';o.querySelector('.res').style.color=ok?'#35c77b':'#d94d5b';o.querySelector('.back').disabled=false;o.querySelector('.back').onclick=()=>o.remove();if(ok&&/high kick|spinning|latające|obrot/.test(x)){const c=document.querySelector('.comment');if(c){const p=document.createElement('p');p.textContent='JURAS: „ŁOOOO! Ależ to weszło!”';c.prepend(p)}}},2100)}document.addEventListener('click',e=>{const b=e.target.closest('.act');if(!b||!document.querySelector('.fight')||!b.closest('.decision'))return;e.preventDefault();e.stopImmediatePropagation();wheel(b)},true);fix();})();<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px;color:#fff">Błąd V85: '+String(e)+'</pre>'}})();</script></body></html>
