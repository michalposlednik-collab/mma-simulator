<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V85</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060d12}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./v83.html"></iframe><script>(()=>{const f=document.getElementById('game');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const css=d.createElement('style');css.textContent='.kg{display:block;color:#d2ab48;font-size:12px;margin-top:5px}.budgetgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.budgetgrid label{padding:12px;background:#101e28;border:1px solid #294454;border-radius:8px}.budgetgrid input{display:none}.budgetgrid input:checked+label{border-color:#d6ab45;background:#211f15}.v85wheel{position:fixed;inset:0;background:#020609ee;z-index:9999;display:grid;place-items:center}.v85wm{width:420px;padding:24px;text-align:center;background:#0d1821;border:1px solid #d2ab48;border-radius:18px}.v85w{width:280px;height:280px;margin:18px auto;border-radius:50%;border:7px solid #65747d;background:conic-gradient(#35c77b 0 8%,#d94d5b 8% 16%,#35c77b 16% 24%,#d94d5b 24% 32%,#35c77b 32% 40%,#d94d5b 40% 48%,#35c77b 48% 56%,#d94d5b 56% 64%,#35c77b 64% 72%,#d94d5b 72% 80%,#35c77b 80% 88%,#d94d5b 88%);transition:transform 2s cubic-bezier(.12,.75,.08,1)}';d.head.appendChild(css);const kg={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};function patch(){d.querySelectorAll('.picklabel').forEach(x=>{const b=x.querySelector('b');if(b&&kg[b.textContent]&&!x.querySelector('.kg')){const s=d.createElement('span');s.className='kg';s.textContent=kg[b.textContent];x.appendChild(s)}});const c=d.querySelector('.creator .box');if(c&&!c.querySelector('.budgetgrid')){const h=[...c.querySelectorAll('h3')].find(x=>x.textContent.includes('KATEGORIA'));if(h){const box=d.createElement('div');box.innerHTML='<h3>BUDŻET STARTOWY</h3><div class="budgetgrid">'+['5000','10000','25000','50000'].map((x,i)=>'<input id="b85'+i+'" type="radio" name="budget85" value="'+x+'" '+(!i?'checked':'')+'><label for="b85'+i+'">'+Number(x).toLocaleString('pl-PL')+' ISK<br><span class="kg">Budżet startowy</span></label>').join('')+'</div>';h.parentNode.insertBefore(box,h)}}}patch();new MutationObserver(patch).observe(d.body,{childList:true,subtree:true});d.addEventListener('click',e=>{const b=e.target.closest('.act');if(!b||!d.querySelector('.fight')||!b.closest('.decision'))return;e.preventDefault();e.stopImmediatePropagation();const name=(b.innerText||'Akcja').trim(),x=name.toLowerCase(),chance=/high kick|spinning|latające|obrot/.test(x)?48:/balacha|trójkąt|duszenie|rnc/.test(x)?55:70,ok=Math.random()*100<chance,o=d.createElement('div');o.className='v85wheel';o.innerHTML='<div class="v85wm"><b>JURAS · MOMENT W WALCE</b><h2>'+name+'</h2><div class="v85w"></div><h2 class="res">LOSOWANIE...</h2><button class="back" disabled>WRÓĆ DO WALKI</button></div>';d.body.appendChild(o);requestAnimationFrame(()=>o.querySelector('.v85w').style.transform='rotate('+(1800+Math.random()*720)+'deg)');setTimeout(()=>{const r=o.querySelector('.res');r.textContent=ok?'🟢 UDAŁO SIĘ':'🔴 NIE UDAŁO SIĘ';r.style.color=ok?'#35c77b':'#d94d5b';const back=o.querySelector('.back');back.disabled=false;back.onclick=()=>o.remove();if(ok&&/high kick|spinning|latające|obrot/.test(x)){const c=d.querySelector('.comment');if(c){const p=d.createElement('p');p.textContent='JURAS: „ŁOOOO! Ależ to weszło!”';c.prepend(p)}}},2100)},true)});})();</script></body></html>
