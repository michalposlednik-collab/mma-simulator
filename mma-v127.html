id;place-items:center}.timer:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#d6ae51 var(--pct),#26343b 0);box-shadow:0 0 0 8px #111d24}.timer:after{content:'';position:absolute;inset:18px;border-radius:50%;background:#081016;border:1px solid #304955}.timerText{position:relative;z-index:2;text-align:center}.clock{font-size:44px;font-weight:900}.round{font-size:13px;letter-spacing:2px;color:#d6ae51}.actions{display:flex;flex-wrap:wrap;gap:8px;max-width:1250px;margin:14px auto}.log{max-width:1250px;margin:14px auto;max-height:150px;overflow:auto}.wheelModal,.resultModal{display:none;position:fixed;inset:0;background:#000e;z-index:2000;place-items:center;padding:18px}.wheelbox,.resultBox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px;width:min(700px,96vw);text-align:center}.wheelstage{width:350px;height:350px;margin:10px auto;position:relative}.wheel{position:absolute;left:15px;top:15px;width:320px;height:320px;border-radius:50%;border:9px solid #17252d;transition:transform 2.7s cubic-bezier(.12,.7,.15,1);background:conic-gradient(#5fd37a 0 45deg,#df5045 45deg 90deg,#f0ad4e 90deg 135deg,#df5045 135deg 180deg,#5fd37a 180deg 225deg,#f0ad4e 225deg 270deg,#df5045 270deg 315deg,#5fd37a 315deg 360deg)}.wheel:after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(transparent 0 43deg,#fff 43deg 45deg);opacity:.8}.pointer{position:absolute;z-index:5;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid #d6ae51}.wheelResult{font-size:30px;font-weight:900;color:#d6ae51;min-height:44px}.winner{font-size:40px;color:#d6ae51;font-weight:900}.sherdog{background:#eee;color:#111;border-radius:4px;overflow:hidden}.sdhead{background:#171717;color:#fff;padding:16px}.sdnav{background:#333;color:#fff;padding:8px;font-size:12px}.sdrow{display:grid;grid-template-columns:150px 1fr;gap:0 hallenge" class="hidden"></div><div id="ptext" class="panel hidden"></div><button id="back" class="primary hidden" onclick="closeResult()">WRÓĆ DO DASHBOARDU</button></div></div><script>
const KEY='mmaCareerV127';const types={Wonderkid:'Talent, refleks i głód zwycięstw.',Bijok:'Szczęka, presja i moc.',Fizol:'Siła, klincz i presja.',Zapaśnik:'Obalenia, siatka i kontrola.',Striker:'Dystans, timing i nokaut.',Gumiarz:'Chaos, parter i kreatywność.',Allrounder:'Wszechstronność.'};const weights=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];const kg={'Flyweight':'56,7 kg','Bantamweight':'61,2 kg','Featherweight':'65,8 kg','Lightweight':'70,3 kg','Welterweight':'77,1 kg','Middleweight':'83,9 kg','Light Heavyweight':'93,0 kg','Heavyweight':'120,2 kg'};const budgets=[[5000,'Normalny etat','praca po godzinach'],[10000,'Etat + oszczędności','trochę oddechu'],[25000,'Rodzina pomaga','zaplecze na pierwszy krok'],[50000,'Bogata rodzina','inwestycje w obozy'],[100000,'Rodzinny biznes','sport finansowany jak drugi biznes']];const opps=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk','Michał „Bizon” Kowal'];let s=load()||{created:false};let timerRAF=0,last=0,paused=false,pending=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}function league(){if(s.w<2)return'Lokalna gala';if(s.w<4)return'Hybrid';if(s.w<7)return'Babilon MMA / FEN';if(s.w<10)return'KSW';if(s.w<13)return'OKTAGON';if(s.w<16)return'Cage Warriors';if(s.w<19)return'PFL';return'UFC'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function creator(){let t=Object.keys(types).map((x,i)=>`<input class="pick" id="t${i}" name="type" type="radio" value="${x}"><label for="t${i}"><b>${x}</b><small>${types[x]}</small></label>`).join(''),b=budgets.map((x,i)=>`<input class="pick" id="b${i}" name="bud" type="radio" value="${x[0]}"><label for="b${i}"><b>${money(x[0])}</b><small><b>${x[1]}</b><br>${x[2]}</small></label>`).join(''),w=weights.map((x,i)=>`<input class="pick" id="w${i}" name="weight" type="radio" value="${x}"><label for="w${i}"><b>${x}</b><small>${kg[x]}</small></label>`).join('');app.innerHTML=`<div class="wrap"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Stwórz zawodnika i prowadź go od lokalnej gali do UFC.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="Imię"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="Nazwisko"></div><h3>TYP ZAWODNIKA</h3><div class="grid">${t}</div><h3>BUDŻET STARTOWY</h3><div class="grid">${b}</div><h3>KATEGORIA WAGOWA</h3><div class="grid">${w}</div><br><button class="primary" onclick="createCareer()">STWÓRZ KARIERĘ →</button></div></div>`}function createCareer(){let f=fn.value.trim(),l=ln.value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s={created:true,first:f,last:l,type:t.value,weight:w.value,money:+b.value,day:1,age:18,rep:5,ig:100,w:0,l:0,d:0,club:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,history:[],log:['🥊 Start kariery: '+f+' '+l+'. Budżet '+money(+b.value)+'.'],media:{interviewUntil:0,postUntil:0,controversyUntil:0},manager:null,sponsors:[],income:{gateUntil:0,job:false,adUntil:0,extortCount:0,extortMonth:0},campPlan:[],injuryUntil:0,careerFreezeUntil:0};save();dashboard()}
function nav(){return`<aside class="side">${[['dashboard','⌂ Dashboard'],['calendar','📅 Kalendarz'],['training','🥊 Trening'],['fights','🏆 Walki'],['career','📋 Sherdog'],['media','📱 Media'],['manager','💼 Menedżer'],['finance','💰 Finanse'],['statistics','📊 Statystyki'],['events','◉ Eventy']].map(x=>`<button class="${s.screen===x[0]?'primary':''}" onclick="${x[0]}()">${x[1]}</button>`).join('')}</aside>`}function stats(){return`<div class="stats"><div class="stat"><small>REKORD</small><b>${s.w}-${s.l}-${s.d}</b></div><div class="stat"><small>REPUTACJA</small><b>${s.rep}/100</b></div><div class="stat"><small>INSTAGRAM</small><b>${s.ig.toLocaleString('pl-PL')}</b></div><div class="stat"><small>GOTÓWKA</small><b>${money(s.money)}</b></div><div class="stat"><small>ORGANIZACJA</small><b>${league()}</b></div><div class="stat"><small>DZIEŃ / WIEK</small><b>${s.day} / ${s.age}</b></div></div>`}function shell(c){app.innerHTML=`<div class="layout">${nav()}<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>${esc(s.first)} ${esc(s.last)}</h1><p class="muted">${s.age} lat · dzień ${s.day} · ${esc(s.type)} · ${esc(s.weight)}</p></div><button class="primary" onclick="continueToEvent()">▶ KONTYNUUJ DO NASTĘPNEGO EVENTU</button></div>${stats()}${c}</main></div>`}
function dashboard(){if(!s.created)return creator();s.screen='dashboard';let f=s.fight?`<div class="hero"><h2>🥊 WALKA ZAPLANOWANA</h2><p><b>${esc(s.fight.opponent)}</b> · ${esc(s.fight.league)}</p><p>Camp: ${esc(s.fight.camp)} · dzień <b>${s.fight.date}</b> · gaża ${money(s.fight.purse)}</p>${s.day>=s.fight.date?'<button class="primary" onclick="startFight()">WEJDŹ DO KLATKI</button>':'<p class="muted">KONTYNUUJ prowadzi przez kolejne dni campu.</p>'}</div>`:'<div class="panel"><h2>Kariera gotowa</h2><p class="muted">KONTYNUUJ prowadzi Cię do kolejnego wydarzenia. Nie ma już osobnego komunikatu „nowe zdarzenie” — od razu otwiera się właściwe okno.</p></div>';shell(f+`<div class="cols"><section class="panel"><h2>Oś kariery</h2>${s.log.slice(-12).reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section><section class="panel"><h2>Umiejętności</h2>${Object.entries(s.sk).map(([k,v])=>`<div class="feed"><b>${k}</b> ${v}/100<div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</section></div>`)}
function nextEvent(){if(s.fight&&s.day<s.fight.date)return s.day+1;let dates=[];for(let i=s.day+1;i<=s.day+365;i++){if(i%35===0&&!s.fight)dates.push(i);if(i%21===0)dates.push(i);if(i===s.day+14&&s.rep>=8)dates.push(i)}let future=dates.filter(x=>x>s.day);return future.length?Math.min(...future):s.day+7}function continueToEvent(){if(s.careerFreezeUntil&&s.day<s.careerFreezeUntil){let left=s.careerFreezeUntil-s.day;advance(Math.min(30,left));openEvent('KONSEKWENCJE','⏳ KARIERA ZAMROŻONA',`<p>Kariera jest zamrożona jeszcze przez <b>${s.careerFreezeUntil-s.day} dni</b>.</p>`,[['OK',closeEvent]]);return}if(s.injuryUntil&&s.day<s.injuryUntil){let left=s.injuryUntil-s.day;openEvent('REHABILITACJA','🩹 KONTUZJA',`<p>Potrzebujesz jeszcze <b>${left} dni</b> rehabilitacji.</p><p>Możesz od razu przewinąć kalendarz do końca rehabilitacji.</p>`,[['🩹 REHABILITACJA — PRZEWIŃ '+left+' DNI',rehabilitate]]);return}if(s.fight&&s.day<s.fight.date){campDaily();return}if(s.fight&&s.day>=s.fight.date){startFight();return}let target=nextEvent();advance(target-s.day);if(!s.fight&&s.day%35===0){offerFight();return}if(s.day%21===0){socialEvent();return}if(Math.random()<.35){specialEvent();return}genericEvent()}function skipToFight(){if(!s.fight||s.day>=s.fight.date){closeEvent();return}let days=s.fight.date-s.day;advance(days);s.log.push('⏩ Pominięto dni campu. Gotowy do walki z '+s.fight.opponent+'.');save();closeEvent();dashboard()}function closeEvent(){modal.style.display='none';dashboard()}
function offerFight(){if(s.fight)return;let opp=opps[Math.floor(Math.random()*opps.length)],purse=2200+s.rep*140+s.w*400;openEvent('PROPOZYCJA WALKI','📩 OFERTA WALKI',`<p>Promotor proponuje walkę z <b>${opp}</b> w <b>${league()}</b>.</p><p>Gaża: <b>${money(purse)}</b>.</p>`,[['🥊 AKCEPTUJ WALKĘ',()=>chooseCamp(opp,league(),purse)],['ODRZUĆ WALKĘ',()=>{s.log.push('❌ Odrzucono ofertę z '+opp+'.');save();closeEvent()}]])}
function chooseCamp(opp,org,purse){let camps=[['Reykjavík Fight Lab',1200,10,['Cardio','Sparingi','Boks','MMA','Regeneracja','Sparingi','Gameplan','Lekki trening','Regeneracja','Waga']],['WCA Fight Team',3500,14,['Cardio','BJJ','Boks','Sparingi','Zapasy','Regeneracja','MMA','Sparingi','BJJ','Cardio','Gameplan','Sparingi','Lekki trening','Regeneracja']],['ANKOS MMA',4200,14,['Cardio','Zapasy','Boks','Sparingi','BJJ','Regeneracja','MMA','Sparingi','Zapasy','Cardio','BJJ','Sparingi','Gameplan','Regeneracja']],['American Top Team',12000,21,['Cardio','BJJ','Boks','Sparingi','Zapasy','Regeneracja','MMA','Sparingi','BJJ','Cardio','Worek','Sparingi','Gameplan','Regeneracja','Zapasy','MMA','Sparingi','Lekki trening','Waga','Regeneracja','Gameplan']]];mb.innerHTML='';mt.textContent='PRZYGOTOWANIE';mh.textContent='🏕️ WYBIERZ CAMP';mc.innerHTML='';camps.forEach(c=>{let b=document.createElement('button');b.className='camp';b.innerHTML=`<b>${c[0]}</b><br>${money(c[1])} · ${c[2]} dni`;b.onclick=()=>acceptCamp(opp,org,purse,c);mc.appendChild(b)});let free=document.createElement('button');free.className='camp';free.innerHTML='<b>PRZYGOTOWANIE WŁASNE — 0 zł</b><br>7 dni · obecny klub';free.onclick=()=>acceptCamp(opp,org,purse,['Przygotowanie własne',0,7,['Cardio','Boks','BJJ','Sparingi','Regeneracja','Gameplan','Waga']]);mc.appendChild(free);modal.style.display='flex'}function acceptCamp(opp,org,purse,c){let cost=Number(c[1])||0;let days=Number(c[2])||1;let plan=Array.isArray(c[3])?c[3]:[];if(s.money<cost){alert('Za mało pieniędzy na ten camp. Potrzebujesz '+money(cost)+', a masz '+money(s.money)+'.');return}s.money-=cost;s.campPlan=plan.map((x,i)=>({day:s.day+i+1,activity:x}));s.fight={opponent:opp,league:org,purse,date:s.day+days,camp:c[0],campDays:days,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}};s.log.push('🥊 Zaakceptowano walkę z '+opp+'. Camp: '+c[0]+'. Koszt: '+money(cost)+'.');save();document.getElementById('modal').style.display='none';calendar()}function rehabilitate(){if(!s.injuryUntil||s.day>=s.injuryUntil){s.injuryUntil=0;save();closeEvent();dashboard();return}let days=s.injuryUntil-s.day;advance(days);s.injuryUntil=0;s.log.push('🩹 Zakończono rehabilitację. Powrót do treningów.');save();closeEvent();dashboard()}function campDaily(){if(!s.fight||s.day>=s.fight.date)return;let left=s.fight.date-s.day;openEvent('PRZYGOTOWANIA DO WALKI','🏕️ CAMP W TOKU',`<p>Przygotowania trwają. Do dnia walki pozostało <b>${left} dni</b>.</p><p>Plan campu jest zapisany w kalendarzu. Nie musisz potwierdzać każdego dnia osobno.</p>`,[['⏩ PRZEWIŃ DO DNIA WALKI',skipToFight],['ZOSTAŃ W TYM DNIU',closeEvent]])}function arrachion(go){if(Math.random()<.75){s.rep=Math.max(0,s.rep-3);s.log.push('⚠️ Problemy prawne po wyjeździe do Olsztyna.')}else{s.sk.BJJ=Math.min(100,s.sk.BJJ+7);s.sk.Zapasy=Math.min(100,s.sk.Zapasy+2);s.log.push('🥋 Arrachion: BJJ +7, zapasy +2.')}save();closeEvent();openEvent('WYNIK WYJAZDU','🥋 WYNIK DECYZJI',s.sk.BJJ>=57&&s.log[s.log.length-1].includes('Arrachion')?'<p><b>BJJ +7, zapasy +2.</b></p>':'<p><b>Problemy prawne.</b> Reputacja spada o 3.</p>',[['OK',closeEvent]])}function genericEvent(){openEvent('KARIERA','📨 ZDARZENIE','<p>Wydarzyło się coś w Twojej karierze.</p>',[['KONTYNUUJ',closeEvent]])}
function training(){s.screen='training';let cs=[['Lokalny klub',0,500,{Boks:2,Szybkość:1}],['WCA Fight Team',20,650,{Boks:2,BJJ:3}],['ANKOS MMA',10,650,{Zapasy:3,Kondycja:2}],['Arrachion Olsztyn',25,700,{BJJ:4,Zapasy:2}],['Muay Thai / K1',15,500,{Szybkość:2,Boks:2}],['Wrestling',15,550,{Zapasy:4,Kondycja:1}],['S&C / przygotowanie motoryczne',20,600,{Siła:3,Kondycja:3}],['Fizjoterapia / recovery',0,450,{Kondycja:2}]];shell(`<section class="panel"><h2>🥊 Trening</h2><p class="muted">Ceny są orientacyjne i mają charakter symulacyjny; bazują na realnych typach usług/klubów, nie są aktualnymi cennikami.</p><div class="tiles">${cs.map(c=>`<div class="tile"><h3>${c[0]}</h3><p>${money(c[2])} · wymag. rep. ${c[1]}</p><p>${Object.entries(c[3]).map(x=>x[0]+' +'+x[1]).join(' · ')}</p><button ${s.rep<c[1]?'disabled':''} onclick="train('${c[0]}')">TRENUJ</button></div>`).join('')}</div><div class="panel" style="margin-top:12px"><h3>🌍 Wyjazdy i seminaria</h3><button class="camp" onclick="specialTraining('rozal')">🥕 Seminarium z Marcinem Różalskim · worek paszy + marchew dla koni</button><button class="camp" onclick="specialTraining('arrachion')">🥋 Camp gościnny Arrachion Olsztyn · orientacyjnie 900 zł</button><button class="camp" onclick="specialTraining('wca')">🇵🇱 Weekend WCA Fight Team · orientacyjnie 1200 zł</button><button class="camp" onclick="specialTraining('ankos')">🥊 Weekend ANKOS MMA · orientacyjnie 1200 zł</button></div></section>`);window.cs=cs}function train(n){let c=cs.find(x=>x[0]===n);if(s.money<c[2]){alert('Za mało pieniędzy.');return}s.money-=c[2];Object.entries(c[3]).forEach(([k,v])=>s.sk[k]=Math.min(100,s.sk[k]+v));s.club=n;s.log.push('🏋️ Trening: '+n);save();training()}function specialTraining(k){if(k==='rozal'){openEvent('SEMINARIUM','🐎 MARCIN „RÓŻAL” RÓŻALSKI','<p>Oferta seminarium: opłata to <b>worek paszy i marchew dla koni</b>.</p><p><b>75%</b> kontuzja / <b>25%</b> lepsza stójka.</p>',[['JADĘ',()=>rozal(true)],['ODPUSZCZAM',closeEvent]]);return}if(k==='arrachion'){if(s.money<900){alert('Za mało pieniędzy.');return}s.money-=900;save();openEvent('WYJAZD DO OLSZTYNA','🥋 AR(R)ACHION OLSZTYN','<p>Specjalny camp BJJ w Olsztynie.</p><p><b>75%</b> — nieprzewidziane problemy prawne i spadek reputacji. <b>25%</b> — lepsze BJJ.</p>',[['JADĘ',()=>arrachion(true)],['ODWOŁUJĘ',closeEvent]]);return}let price=1200;if(s.money<price){alert('Za mało pieniędzy.');return}s.money-=price;if(k==='wca'){s.sk.Boks=Math.min(100,s.sk.Boks+3);s.sk.BJJ=Math.min(100,s.sk.BJJ+2)}else{s.sk.Zapasy=Math.min(100,s.sk.Zapasy+3);s.sk.Boks=Math.min(100,s.sk.Boks+2)}s.log.push('🌍 Weekendowy camp: '+k+'.');save();openEvent('WYNIK WYJAZDU','🔥 CAMP ZAKOŃCZONY','<p>Wyjazd zakończony. Umiejętności zostały podniesione.</p>',[['OK',closeEvent]])}
function calendar(){s.screen='calendar';let start=Math.max(1,s.day-3),cells='';for(let i=start;i<start+35;i++){let f=s.fight&&s.fight.date===i,p=s.campPlan.find(x=>x.day===i);cells+=`<div class="day ${f?'fight':''} ${p?'campday':''} ${i===s.day?'today':''}"><b>Dzień ${i}</b>${f?`<div class="gold">🥊 ${esc(s.fight.opponent)}</div>`:''}${p?`<small>🏕️ ${esc(p.activity)}</small>`:''}</div>`}shell(`<section class="panel"><h2>📅 Kalendarz kariery</h2><p>Aktualny dzień: <b>${s.day}</b> · wiek: <b>${s.age}</b></p><div class="calendar">${cells}</div></section>`)}

function career(){s.screen='career';shell(`<section class="sherdog"><div class="sdhead"><b>SHERDOG</b><span style="float:right">MMA FIGHTER PROFILE</span></div><div class="sdnav">Fighter Search · Rankings · Fight Finder · News · Forums</div><div class="sdrow"><div class="sdside"><h3>${esc(s.first)} ${esc(s.last)}</h3><p>Record</p><h2>${s.w}-${s.l}-${s.d}</h2><p>${esc(s.weight)}</p><p>${esc(s.type)}</p><p>Organization</p><b>${league()}</b></div><div class="sdmain"><h2>${esc(s.first)} ${esc(s.last)}</h2><table class="sdtable"><tr><th>Statistic</th><th>Value</th><th>Career</th></tr><tr><td>Wins</td><td>${s.w}</td><td>${s.history.filter(x=>x.win).length}</td></tr><tr><td>Losses</td><td>${s.l}</td><td>${s.history.filter(x=>!x.win).length}</td></tr><tr><td>Draws</td><td>${s.d}</td><td>${s.d}</td></tr><tr><td>KO/TKO</td><td>${s.history.filter(x=>x.method==='KO/TKO').length}</td><td>-</td></tr><tr><td>Submission</td><td>${s.history.filter(x=>x.method==='SUBMISSION').length}</td><td>-</td></tr><tr><td>Decision</td><td>${s.history.filter(x=>x.method==='DECYZJA').length}</td><td>-</td></tr></table><h3>Fight History</h3><table class="sdtable"><tr><th>W/L</th><th>Opponent</th><th>Method</th><th>Event</th></tr>${s.history.slice().reverse().map(h=>`<tr><td><b>${h.win?'W':'L'}</b></td><td>${esc(h.opponent)}</td><td>${h.method}</td><td>${esc(h.league)}</td></tr>`).join('')}</table></div></div></section>`)}
function media(){s.screen='media';let a=s.day>=s.media.interviewUntil,b=s.day>=s.media.postUntil,c=s.day>=s.media.controversyUntil;shell(`<section class="panel"><h2>📱 Media</h2><div class="tiles"><div class="tile"><h3>Wywiad</h3><p>Raz na 14 dni.</p><button ${a?'':'disabled'} onclick="useMedia('interview')">UDZIEL WYWIADU</button></div><div class="tile"><h3>Post</h3><p>Raz na 7 dni.</p><button ${b?'':'disabled'} onclick="useMedia('post')">WRZUĆ POST</button></div><div class="tile"><h3>Kontrowersja</h3><p>Raz na 60 dni.</p><button ${c?'':'disabled'} onclick="useMedia('controversy')">ZAGRAJ VA BANQUE</button></div></div></section>`)}function useMedia(k){if(k==='interview'&&s.day<s.media.interviewUntil||k==='post'&&s.day<s.media.postUntil||k==='controversy'&&s.day<s.media.controversyUntil)return;if(k==='interview'){s.media.interviewUntil=s.day+14;s.rep=Math.min(100,s.rep+2);s.ig+=250}else if(k==='post'){s.media.postUntil=s.day+7;s.rep=Math.min(100,s.rep+1);s.ig+=300}else{s.media.controversyUntil=s.day+60;s.rep=Math.min(100,s.rep+4);s.ig+=700}s.log.push('📱 Aktywność medialna.');save();media()}
function manager(){s.screen='manager';if(!s.manager&&s.ig>=5000)return managerOffer();shell(`<section class="panel"><h2>💼 Menedżer</h2>${s.manager?`<p><b>${esc(s.manager.name)}</b> · prowizja ${s.manager.fee}%</p><p>Sponsorzy: ${s.sponsors.length}</p><button class="primary" onclick="sponsorOffer()">OFERTY SPONSORSKIE</button>`:`<p>Manager dostępny od <b>5000 obserwujących</b>.</p>`}</section>`)}function managerOffer(){openEvent('MENEDŻER','💼 KTOŚ CHCE CIĘ REPREZENTOWAĆ','<p>Masz już 5000+ obserwujących. Trzech managerów chce wejść do gry.</p>',[['Marek Kowalski Management · 10%',()=>signManager('Marek Kowalski Management',10)],['North Fight Management · 15%',()=>signManager('North Fight Management',15)],['Elite Combat Group · 20%',()=>signManager('Elite Combat Group',20)]])}function signManager(n,f){s.manager={name:n,fee:f};s.log.push('💼 Podpisano managera: '+n+'.');save();closeEvent();sponsorOffer()}function sponsorOffer(){let sp=[['Fight Gear','500 zł/mies. + odzież'],['Suplementy','900 zł/mies. + suplementacja'],['Dieta pudełkowa','1800 zł/mies. + posiłki'],['Sponsor odzieżowy','3500 zł/mies. + sprzęt i ekspozycja']];openEvent('SPONSOR','🤝 OFERTY SPONSORSKIE','<p>Wybierz współpracę.</p>',sp.map(x=>[x[0]+' · '+x[1],()=>{s.sponsors.push(x[0]);s.log.push('🤝 Sponsor: '+x[0]);save();closeEvent();manager()}]))}
function finance(){s.screen='finance';let gate=s.day>=s.income.gateUntil,ad=s.day>=s.income.adUntil;shell(`<section class="panel"><h2>💰 Finanse</h2><div class="tiles"><div class="tile"><h3>🚪 Bramka / ochrona</h3><p>700 zł · raz na 7 dni</p><button ${gate?'':'disabled'} onclick="earn('gate')">WEŹ ZLECENIE</button></div><div class="tile"><h3>🧾 Etat miesięczny</h3><p>3000 zł/miesiąc</p>${s.income.job?'<button onclick="s.income.job=false;save();finance()">ZREZYGNUJ Z ETATU</button>':'<button onclick="s.income.job=true;save();finance()">PODEJMIJ ETAT</button>'}</div><div class="tile"><h3>📺 Reklama</h3><p>8000 zł · od 35 rep. lub 10000 IG</p><button ${(s.rep>=35||s.ig>=10000)&&ad?'':'disabled'} onclick="earn('ad')">PRZYJMIJ REKLAMĘ</button></div><div class="tile"><h3>⚠️ Wymuszenie / haracz</h3><p>+2000 zł · ryzykowna mechanika fikcyjnej gry</p><button onclick="extortion()">WYMUSZENIE +2000</button></div></div><p class="muted">Wymuszenie jest celowo przedstawione jako ryzykowna, satyryczna mechanika gry, nie instrukcja działania w rzeczywistości.</p></section>`)}function earn(k){if(k==='gate'){s.money+=700;s.income.gateUntil=s.day+7;s.log.push('💰 Zlecenie: bramka/ochrona +700 zł')}else{s.money+=8000;s.income.adUntil=s.day+60;s.log.push('💰 Reklama +8000 zł')}save();finance()}function extortion(){let month=Math.floor((s.day-1)/30);if(s.income.extortMonth!==month){s.income.extortMonth=month;s.income.extortCount=0}s.income.extortCount++;s.money+=2000;s.log.push('⚠️ Wymuszenie/haracz +2000 zł.');if(s.income.extortCount>=3){openEvent('KONSEKWENCJE','🚔 ARESZT','<p>Przesadziłeś z ryzykowną mechaniką. W grze uruchamia się areszt i wybór dalszego scenariusza.</p>',[['„TRZYMAM SIĘ SZTYWNO I ODPOCZYWAM POD CELĄ”',()=>{s.careerFreezeUntil=s.day+90;save();closeEvent();openEvent('WYROK','⛓️ KARIERA ZAMROŻONA NA 3 MIESIĄCE','<p>Kariera stoi przez 3 miesiące.</p>',[['OK',closeEvent]])}],['„KORZYSTAM Z DOBRODZIEJSTWA ARTYKUŁU 60-EGO”',()=>{s.rep=Math.max(0,s.rep-10);s.income.extortCount=0;s function statistics(){s.screen='statistics';shell(`<section class="panel"><h2>📊 Statystyki</h2><div class="tiles"><div class="tile">Walki <b>${s.w+s.l+s.d}</b></div><div class="tile">Win rate <b>${s.w+s.l+s.d?Math.round(s.w/(s.w+s.l+s.d)*100):0}%</b></div><div class="tile">KO/TKO <b>${s.history.filter(x=>x.method==='KO/TKO').length}</b></div><div class="tile">Submission <b>${s.history.filter(x=>x.method==='SUBMISSION').length}</b></div></div></section>`)}function events(){s.screen='events';shell(`<section class="panel"><h2>◉ Eventy</h2>${s.log.slice().reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section>`)}
function startFight(){if(!s.fight)return;if(s.day<s.fight.date){alert('Walka jest dnia '+s.fight.date);return}paused=false;renderFight();last=performance.now();cancelAnimationFrame(timerRAF);timerRAF=requestAnimationFrame(fightLoop)}function renderFight(){let f=s.fight;app.innerHTML=`<div class="fight"><div class="top"><div><small class="gold">${esc(f.league)}</small><h1>${esc(s.first)} vs ${esc(f.opponent)}</h1><p class="muted">Dzień ${s.day} · ${esc(f.camp)}</p></div><button onclick="dashboard()">OPUŚĆ</button></div><div class="fighttop"><div class="fighter"><h2>${esc(s.first)}</h2><p>Witalność <b id="hp1">100</b>%</p><div class="hp"><i id="bar1" style="width:100%"></i></div><p>Stamina <b id="st1">100</b>%</p><div class="hp"><i id="bars1" style="width:100%"></i></div></div><div class="timer" id="timer" style="--pct:100%"><div class="timerText"><div id="round" class="round">RUNDA 1 / 3</div><div id="clock" class="clock">05:00</div><small>ZEGAR ×4</small></div></div><div class="fighter"><h2>${esc(f.opponent)}</h2><p>Witalność <b id="hp2">100</b>%</p><div class="hp"><i id="bar2" style="width:100%"></i></div><p>Stamina <b id="st2">100</b>%</p><div class="hp"><i id="bars2" style="width:100%"></i></div></div></div><div id="comment" class="comment">JURAS: Zaczynamy. Zobaczymy, kto narzuci tempo.</div><div class="actions">${ab('Jab / prosty','jab',3)}${ab('Low kick','low',3)}${ab('High kick 🎡','high',2)}${ab('Latające kolano 🎡','flying',2)}${ab('Spinning backfist 🎡','spin',2)}${ab('Obalenie 🎡','takedown',2)}${ab('Balacha 🎡','armbar',2)}${ab('Trójkąt 🎡','triangle',2)}${ab('RNC 🎡','rnc',2)}</div><div id="flog" class="panel log"></div></div>`}function ab(n,k,m){return`<button id="a-${k}" onclick="fightAction('${k}')">${n}<small id="u-${k}">0/${m}</small></button>`}function fightLoop(now){if(!s.fight)return;if(paused){timerRAF=requestAnimationFrame(fightLoop);return}let dt=Math.min(.05,(now-last)/1000);last=now;let f=s.fight;f.time-=dt*4;f.stamina=Math.max(0,f.stamina-dt*.6);f.oppStamina=Math.max(0,f.oppStamina-dt*.5);if(Math.random()<dt*.65)exchange();updateFight();if(f.vitality<=0)return finishFight(false,'KO/TKO');if(f.oppVitality<=0)return finishFight(true,'KO/TKO');if(f.time<=0)return endRound();timerRAF=requestAnimationFrame(fightLoop)}function exchange(){let f=s.fight;f.oppVitality=Math.max(0,f.oppVitality-(.7+Math.random()*1.7));f.vitality=Math.max(0,f.vitality-(.5+Math.random()*1.4));f.comment=['JURAS: Rywal odpowiada, mamy wymianę w półdystansie.','JURAS: Presja pod siatką, ale dobrze pracujesz nogami.','JURAS: Tempo jest wysokie, trzeba pilnować staminy.'][Math.floor(Math.random()*3)];logF(f.comment)}function updateFight(){let f=s.fight,e=id=>document.getElementById(id);if(!e('timer'))return;e('timer').style.setProperty('--pct',Math.max(0,f.time/300*100)+'%');e('clock').textContent=String(Math.floor(f.time/60)).padStart(2,'0')+':'+String(Math.ceil(f.time%60)).padStart(2,'0');e('round').textContent=`RUNDA ${f.round} / 3`;[['hp1',f.vitality,'bar1'],['st1',f.stamina,'bars1'],['hp2',f.oppVitality,'bar2'],['st2',f.oppStamina,'bars2']].forEach(x=>{e(x[0]).textContent=Math.round(x[1]);e(x[2]).style.width=Math.max(0,x[1])+'%'});e('comment').textContent=f.comment||'';Object.entries({jab:3,low:3,high:2,flying:2,spin:2,takedown:2,armbar:2,triangle:2,rnc:2}).forEach(([k,m])=>{document.getElementById('u-'+k).textContent=(f.uses[k]||0)+'/'+m;document.getElementById('a-'+k).disabled=(f.uses[k]||0)>=m||paused})}function logF(x){let e=document.getElementById('flog');if(e)e.innerHTML='<div class="feed">'+esc(x)+'</div>'+e.innerHTML}function fightAction(k){let f=s.fight,max={jab:3,low:3,high:2,flying:2,spin:2,takedown:2,armbar:2,triangle:2,rnc:2}[k];if((f.uses[k]||0)>=max||paused)return;f.uses[k]=(f.uses[k]||0)+1;if(k==='jab'){f.oppVitality=Math.max(0,f.oppVitality-3.5);f.stamina=Math.max(0,f.stamina-2);f.comment='JURAS: Prosty dochodzi. Limitujemy go, żeby nie dało się spamować.';logF(f.comment);updateFight();return}if(k==='low'){f.oppVitality=Math.max(0,f.oppVitality-5);f.oppStamina=Math.max(0,f.oppStamina-3);f.stamina=Math.max(0,f.stamina-3);f.comment='JURAS: Low kick trafia w nogę.';logF(f.comment);updateFight();return}pending=k;paused=true;wa.textContent=({high:'HIGH KICK',flying:'LATAJĄCE KOLANO',spin:'SPINNING BACKFIST',takedown:'OBALENIE',armbar:'BALACHA',triangle:'TRÓJKĄT',rnc:'RNC'})[k];wr.textContent='LOSUJ EFEKT';wheel.style.transform='rotate(0deg)';spin.disabled=false;wheelModal.style.display='grid'}spin.onclick=()=>{if(!pending)return;spin.disabled=true;let r=Math.random(),out=r<.45?'FULL':r<.78?'PARTIAL':'FAIL',seg=out==='FULL'?[0,4,7][Math.floor(Math.random()*3)]:out==='PARTIAL'?[2,5][Math.floor(Math.random()*2)]:[1,3,6][Math.floor(Math.random()*3)],center=seg*45+22.5;wheel.style.transform=`rotate(${1800+(360-center)}deg)`;setTimeout(()=>{wr.textContent=out==='FULL'?'PEŁNY SUKCES':out==='PARTIAL'?'CZĘŚCIOWY SUKCES':'NIEUDANA TECHNIKA';applySpecial(out);setTimeout(()=>{wheelModal.style.display='none';pending=null;paused=false;last=performance.now();timerRAF=requestAnimationFrame(fightLoop)},1200)},2800)};function applySpecial(out){let f=s.fight,name=({high:'High kick',flying:'Latające kolano',spin:'Spinning backfist',takedown:'Obalenie',armbar:'Balacha',triangle:'Trójkąt',rnc:'RNC'})[pending],d={"High kick":17,"Latające kolano":15,"Spinning backfist":14,"Obalenie":9,"Balacha":18,"Trójkąt":17,RNC:20}[name];if(out==='FULL'){f.oppVitality=Math.max(0,f.oppVitality-d*1.45);f.oppStamina=Math.max(0,f.oppStamina-10);f.comment='JURAS: '+name+' — PEŁNY SUKCES! Kapitalne wykonanie.'}else if(out==='PARTIAL'){f.oppVitality=Math.max(0,f.oppVitality-d*.65);f.oppStamina=Math.max(0,f.oppStamina-5);f.comment='JURAS: '+name+' — CZĘŚCIOWY SUKCES. Jest efekt, ale nie weszło czysto.'}else{f.vitality=Math.max(0,f.vitality-4);f.stamina=Math.max(0,f.stamina-15);f.comment='JURAS: '+name+' — NIEUDANA TECHNIKA! Rywal wykorzystał moment.'}logF(f.comment);updateFight()}function endRound(){let f=s.fight,my=(100-f.oppVitality)+(f.stamina>f.oppStamina?6:0),op=(100-f.vitality)+(f.oppStamina>f.stamina?6:0);f.score.push(my>=op?10:9);if(f.round>=3)return finishFight(f.score.filter(x=>x===10).length>=2,'DECYZJA');f.round++;f.time=300;f.stamina=Math.min(100,f.stamina+25);f.oppStamina=Math.min(100,f.oppStamina+22);f.comment='JURAS: Koniec rundy. Punktacja: '+f.score[f.score.length-1]+'-'+(f.score[f.score.length-1]===10?9:10)+'.';logF(f.comment);updateFight()}
function finishFight(win,method){cancelAnimationFrame(timerRAF);let f=s.fight;s.money+=f.purse;if(win){s.w++;s.rep=Math.min(100,s.rep+(method==='KO/TKO'?6:4));s.ig+=300}else{s.l++;s.rep=Math.max(0,s.rep-2);s.ig=Math.max(0,s.ig-50)}s.media={interviewUntil:s.day+14,postUntil:s.day+7,controversyUntil:s.day+60};s.history.push({win,method,opponent:f.opponent,league:f.league,purse:f.purse});s.log.push((win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA')+' z '+f.opponent+' przez '+method+'.');s.fight=null;s.campPlan=[];save();winner.textContent=win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA';document.getElementById('method').textContent=method;summary.textContent=s.first+' '+s.last+' '+(win?'pokonuje':'przegrywa z')+' '+f.opponent+'.';postfight.style.display='grid';challenge.classList.add('hidden');ptext.classList.add('hidden');back.classList.add('hidden');resultModal.style.display='grid'}function postfight(k){if(k==='challenge'){postfightChoices();return}let txt={corner:'Dziękuję mojemu narożnikowi. Bez nich nie byłoby tej walki.',joke:'Mówili, że cardio będzie problemem. Chyba mam drugie płuca.',respect:'Szacunek dla rywala. To była dobra walka.',fans:'Dziękuję wszystkim kibicom.',belt:'Nie przyszedłem tutaj po jedną wygraną. Idę po pas.'}[k];s.rep=Math.min(100,s.rep+(k==='belt'?5:2));s.ig+=k==='joke'?800:300;s.log.push('🎙️ Wywiad po walce.');save();postfight.style.display='none';ptext.classList.remove('hidden');ptext.innerHTML='<b>Twój wywiad:</b><br>'+esc(txt);back.classList.remove('hidden')}function postfightChoices(){postfight.style.display='none';challenge.classList.remove('hidden');challenge.innerHTML='<h3>Wybierz rywala</h3>'+opps.map(o=>`<button onclick="challengeNow('${esc(o)}')">${esc(o)}</button>`).join('')}function challengeNow(o){s.rep=Math.min(100,s.rep+6);s.ig+=1000;s.log.push('🔥 Wyzwanie: '+o);save();challenge.classList.add('hidden');ptext.classList.remove('hidden');ptext.innerHTML='<b>Twój callout:</b><br>„Chcę walki z '+esc(o)+'. Zróbmy to w następnej gali.”';back.classList.remove('hidden')}function closeResult(){resultModal.style.display='none';dashboard()}init();</script><script>(function(){try{var raw=localStorage.getItem('mmaCareerV127');if(!raw)return;var career=JSON.parse(raw);if(!career||!career.created)return;setTimeout(function(){try{if(typeof dashboard==='function'&&!document.querySelector('.layout'))dashboard()}catch(e){console.error('Dashboard boot error:',e)}},0)}catch(e){console.error('Career boot error:',e)}})();</script></body></html>
