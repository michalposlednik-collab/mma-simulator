<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V96</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 16px 45px #0006}.creator{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{position:absolute;opacity:0}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:72px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.primary{background:#80652a;border-color:#d6ae51;font-weight:bold;color:#fff;padding:12px 16px;border-radius:9px}.btn{background:#162833;color:#fff;border:1px solid #526873;padding:11px 15px;border-radius:9px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;padding:12px;text-align:left;background:#0b151d;color:#c8d2d6;border:1px solid #203642;border-radius:8px}.side button:hover{border-color:#d6ae51}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.gold{color:#d6ae51}.muted{color:#91a3ac}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small{color:#82949d}.stat b{display:block;font-size:19px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.45fr .85fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b;border-radius:8px}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50;padding:18px}.modalbox{width:min(950px,95vw);max-height:90vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:26px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.club{padding:15px;border:1px solid #304955;border-radius:12px;background:#0b151d;margin:7px 0}.club h3{margin:0 0 5px}.locked{opacity:.5}.sherdog{background:#090f14;border:1px solid #344b56;border-radius:10px;overflow:hidden}.sherdog .head{padding:12px;background:#14232c;color:#d6ae51;font-weight:bold}.fightrow{display:grid;grid-template-columns:1fr 100px 1fr;padding:13px;border-top:1px solid #20333c;align-items:center}.center{text-align:center}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#1d323d;margin:2px}.timeline{position:relative;padding-left:22px}.timeline:before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:#304955}.timeline .feed{position:relative}.timeline .feed:before{content:'';position:absolute;left:-21px;top:14px;width:10px;height:10px;border-radius:50%;background:#d6ae51}.money{font-size:24px;color:#d6ae51}.green{color:#49d58c}.red{color:#ef6b72}@media(max-width:950px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.grid,.cols{grid-template-columns:1fr 1fr}}@media(max-width:600px){.stats,.grid,.tiles,.choices,.cols{grid-template-columns:1fr}.top{display:block}} </style></head><body><div id="app" class="app"></div><script>(function(){'use strict';var app=document.getElementById('app');var KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};var TYPE={Wonderkid:['Talent, refleks i głód zwycięstw.'], 'Osiedlowy bijok':['Szczęka ze stali, ręce z żelaza, mózg czasem na urlopie.'],'Fizol':['Siła, klincz i argumenty, których nie trzeba długo tłumaczyć.'],'Zapaśnik':['Najpierw nogi rywala, potem pytania. Siatka to jego drugi dom.'],'Striker':['Dystans, timing i przekonanie, że każda runda może skończyć się przed czasem.'],'Gumiarz':['Na macie czuje się jak w domu. Im bardziej chaotycznie, tym weselej.'],'Allrounder':['Nic spektakularnego na papierze — za to wszystko działa.']};var BUD=[[5000,'Normalny etat','Pracujesz po godzinach i liczysz każdą złotówkę.'],[10000,'Etat + oszczędności','Trochę oddechu, ale nadal trzeba pracować.'],[25000,'Rodzina pomaga','Masz zaplecze, żeby zacząć trenować poważniej.'],[50000,'Bogata rodzina','Możesz inwestować w obozy i sprzęt.'],[100000,'Rodzinny biznes','Kariera sportowa dostaje mocne finansowe wsparcie.']];var CLUBS=[{n:'Uniq Fight Club',city:'Warszawa',req:0,cost:2500,days:7,desc:'Stójka, boks i kickboxing.',g:{Boks:3,Szybkość:2}},{n:'ANKOS MMA',city:'Poznań',req:15,cost:6000,days:14,desc:'Zapasy, MMA i praca pod presją.',g:{Zapasy:6,Kondycja:2}},{n:'WCA Fight Team',city:'Warszawa',req:25,cost:7000,days:14,desc:'Grappling, BJJ i przekrojowe MMA.',g:{BJJ:5,Zapasy:2}},{n:'Czerwony Smok',city:'Poznań',req:35,cost:8500,days:14,desc:'MMA i wszechstronny rozwój.',g:{Boks:2,BJJ:3,Zapasy:3}},{n:'American Top Team',city:'USA',req:65,cost:25000,days:21,desc:'Międzynarodowy camp dla zawodników z wysoką reputacją.',g:{Boks:4,Zapasy:4,BJJ:4,Kondycja:4}}];var s={day:1,age:18,month:1,week:1,ig:100,rep:5,mot:55,money:10000,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',fight:null,manager:false,gym:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},log:[],history:[],mediaLog:[],sponsors:[],supplements:false,gate:false,job:true,jobPay:3000,gatePay:900};function creator(){app.innerHTML='<div class="wrap creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do wielkich gal.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="Michał"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="Kowalski"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.keys(TYPE).map(function(x,i){return '<input class="pick" id="t'+i+'" name="type" type="radio" value="'+x+'"><label for="t'+i+'"><b>'+x+'</b><small>'+TYPE[x][0]+'</small></label>'}).join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="grid">'+BUD.map(function(x,i){return '<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'"><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' ISK</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>'}).join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.keys(KG).map(function(x,i){return '<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+x+'"><label for="w'+i+'"><b>'+x+'</b><small>'+KG[x]+'</small></label>'}).join('')+'</div><br><button id="start" class="primary">STWÓRZ KARIERĘ →</button></div></div>';document.getElementById('start').onclick=start}function start(){var f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('input[name="type"]:checked'),b=document.querySelector('input[name="bud"]:checked'),w=document.querySelector('input[name="weight"]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.first=f;s.last=l;s.type=t.value;s.money=Number(b.value);s.weight=w.value;s.log=['🥊 Kariera rozpoczęta: '+f+' '+l+'.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance()">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fights()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="statistics()">📊 Statystyki</button><button onclick="finance()">💰 Finanse</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button class="btn" onclick="advance()">＋ 1 DZIEŃ</button><button class="primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><b>'+s.w+'-'+s.l+'-'+s.d+'</b></div><div class="stat"><small>INSTAGRAM</small><b>'+s.ig.toLocaleString('pl-PL')+'</b></div><div class="stat"><small>REPUTACJA</small><b>'+s.rep+'/100</b></div><div class="stat"><small>BUDŻET</small><b>'+s.money.toLocaleString('pl-PL')+' ISK</b></div><div class="stat"><small>MOTYWACJA</small><b>'+s.mot+'/100</b></div><div class="stat"><small>WIEK</small><b>'+s.age+'</b></div></div><div class="hero"><small class="gold">NAJBLIŻSZY CEL</small><h2>'+(s.fight?'🏆 PRZYGOTOWANIE DO WALKI':'📅 BUDOWANIE KARIERY')+'</h2><p>'+(s.fight?'Rywal: <b>'+s.fight.opponent+'</b> · pozostało '+Math.max(0,s.fight.days)+' dni obozu.':'Trenuj, zarabiaj, buduj reputację i czekaj na odpowiednią ofertę.')+'</p><button class="primary" onclick="nextEvent()">PRZEWIŃ DO NASTĘPNEGO EVENTU</button></div><div class="cols"><section><div class="panel"><h3>📰 OŚ KARIERY</h3><div class="timeline">'+s.log.slice(0,14).map(function(x){return '<div class="feed">'+x+'</div>'}).join('')+'</div></div><div class="panel"><h3>🎯 ŚCIEŻKA KARIERY</h3>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map(function(x,i){return '<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'🟢 ':'🔒 ')+x+'</div>'}).join('')+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+Object.keys(s.sk).map(function(k){return '<div class="feed"><b>'+k+'</b> '+s.sk[k]+'<div class="bar"><i style="width:'+Math.min(100,s.sk[k])+'%"></i></div></div>'}).join('')+'</div><div class="tiles"><div class="tile">🏋️ Klub<br><b>'+s.gym+'</b></div><div class="tile">💼 Menedżer<br><b>'+(s.manager?'Tak':'Brak')+'</b></div><div class="tile">🥤 Suplementy<br><b>'+(s.supplements?'Aktywne':'Brak')+'</b></div></div></aside></div></main></div>'}function advance(){s.day++;s.week=Math.floor((s.day-1)/7)+1;s.month=Math.floor((s.day-1)/30)+1;if(s.day%365===0){s.age++;s.log.unshift('🎂 Urodziny. Zawodnik ma teraz '+s.age+' lat.')}if(s.day%7===0){s.money+=s.gatePay;s.log.unshift('🚪 Weekendowa brama: +'+s.gatePay+' ISK.')}if(s.day%30===1&&s.day>1){s.money+=s.jobPay;s.log.unshift('💼 Miesięczna wypłata z etatu: +'+s.jobPay+' ISK.')}if(s.fight)s.fight.days--;s.mot=Math.max(0,s.mot-1);if(s.fight&&s.fight.days<=0)s.log.unshift('🥊 Obóz zakończony. Walka jest gotowa.');if(!s.manager&&s.rep>=20){s.manager=true;s.log.unshift('💼 Zgłosił się pierwszy menedżer. Reputacja przekroczyła 20.');}dashboard()}function nextEvent(){advance();if(s.fight){modalChoices('DZIEŃ OBOZU','Masz aktywną walkę. Wybierz, co robisz dzisiaj.',[['TRENING',training],['REGENERACJA',function(){s.mot=Math.min(100,s.mot+5);s.log.unshift('🛌 Regeneracja. +5 motywacji.');dashboard()}]]);return}var r=Math.random();if(r<.30)offerFight();else if(r<.52)mediaEvent();else if(r<.72)trainingInvite();else if(r<.88)viralEvent();else sponsorEvent()}function offerFight(){var level=s.rep<20?'lokalnej gali':s.rep<35?'FEN / Hybrid':s.rep<50?'KSW / OKTAGON':s.rep<65?'Cage Warriors / OKTAGON':'międzynarodowej gali';modalChoices('PROPOZYCJA WALKI','Promotor z '+level+' proponuje pojedynek. Po akceptacji nie możesz przyjąć drugiej walki do czasu zakończenia tej.',[['PRZYJMUJĘ',function(){s.fight={opponent:['Marek „Kosa” Nowak','Paweł „Beton” Zieliński','Igor „Kret” Wrona','Kamil „Rzeźnik” Bąk'][Math.floor(Math.random()*4)],days:21,purse:5000+Math.floor(s.rep/5)*1000};s.log.unshift('🏆 Przyjęto walkę z '+s.fight.opponent+'. Obóz: 21 dni.');dashboard()}],['ODRZUCAM',function(){s.mot=Math.max(0,s.mot-2);dashboard()}]])}function trainingInvite(){modalChoices('ZAPROSZENIE NA TRENING','Trener zaprasza Cię na dodatkowy camp. To kosztuje, ale rozwija konkretne elementy.',[['OTWÓRZ TRENING',training],['ODMAWIAM',dashboard]])}function mediaEvent(){modalChoices('MEDIA O TOBIE','W mediach MMA pojawia się Twoje nazwisko. Ktoś chce komentarza.',[['UDZIEL WYWIADU',function(){s.ig+=150;s.rep+=1;s.mediaLog.unshift('Wojciech Rysiewski wspomniał o Tobie w rozmowie.');s.log.unshift('🎙️ Wywiad. +150 Instagram, +1 reputacji.');dashboard()}],['NIE KOMENTUJ',dashboard]])}function viralEvent(){modalChoices('MOMENT, KTÓRY ŻYJE W SIECI','Krótki fragment Twojej akcji treningowej zaczyna krążyć.',[['WRZUĆ NA INSTAGRAM',function(){s.ig+=400;s.rep+=1;s.log.unshift('🔥 Treningowy klip zrobił viral. +400 IG.');dashboard()}],['ZOSTAW TO',dashboard]])}function sponsorEvent(){modalChoices('KTOŚ CHCE CIĘ SPONSOROWAĆ','Mała firma proponuje produkt za obecność w social media.',[['BIORĘ',function(){s.money+=1500;s.sponsors.push('Lokalny sponsor');s.log.unshift('💰 Sponsor: +1500 ISK.');dashboard()}],['ODMAWIAM',dashboard]])}function modalChoices(title,text,choices){var d=document.createElement('div');d.className='modal';d.innerHTML='<div class="modalbox"><small class="gold">EVENT KARIERY</small><h1>'+title+'</h1><p style="font-size:17px">'+text+'</p><div class="choices"></div></div>';document.body.appendChild(d);choices.forEach(function(c){var b=document.createElement('button');b.className='primary';b.textContent=c[0];b.onclick=function(){d.remove();c[1]()};d.querySelector('.choices').appendChild(b)})}function modal(title,text){modalChoices(title,text,[['WRÓĆ',dashboard]])}function training(){var html='<div class="modal"><div class="modalbox"><small class="gold">CENTRUM TRENINGOWE</small><h1>Wybierz obóz</h1><p class="muted">Im wyższa reputacja, tym lepsze campy stają się dostępne. Ceny są modelowe dla rozgrywki.</p>';CLUBS.forEach(function(c){var ok=s.rep>=c.req&&s.money>=c.cost;html+='<div class="club '+(ok?'':'locked')+'"><h3>'+c.n+' · '+c.city+'</h3><p>'+c.desc+'</p><span class="pill">REP '+c.req+'</span><span class="pill">'+c.cost+' ISK</span><span class="pill">'+c.days+' dni</span><p class="green">'+Object.keys(c.g).map(function(k){return '+'+c.g[k]+' '+k}).join(' · ')+'</p><button class="'+(ok?'primary':'btn')+'" '+(ok?'':'disabled')+' onclick="camp('+CLUBS.indexOf(c)+')">'+(ok?'JADĘ NA CAMP':'NIEDOSTĘPNY')+'</button></div>'});html+='<button class="btn" onclick="closeModal()">WRÓĆ</button></div></div>';app.insertAdjacentHTML('beforeend',html)}function camp(i){var c=CLUBS[i];if(s.rep<c.req||s.money<c.cost)return;s.money-=c.cost;s.gym=c.n;s.mot=Math.min(100,s.mot+6);Object.keys(c.g).forEach(function(k){s.sk[k]=Math.min(100,s.sk[k]+c.g[k])});s.log.unshift('🥋 Camp w '+c.n+': '+Object.keys(c.g).map(function(k){return '+'+c.g[k]+' '+k}).join(', ')+'.');closeModal();dashboard()}function closeModal(){var m=document.querySelector('.modal');if(m)m.remove()}function fights(){if(!s.fight)return modal('WALKI','Nie masz aktywnej walki. Kolejna oferta pojawi się w wydarzeniach.');var ready=s.fight.days<=0;modalChoices('WALKI — CENTRUM','Rywal: '+s.fight.opponent+' · '+Math.max(0,s.fight.days)+' dni obozu · gaża '+s.fight.purse+' ISK.',[['TRENUJ',training],['PRZEWIŃ DZIEŃ',advance],['WEJDŹ DO WALKI',function(){if(!ready){alert('Najpierw zakończ okres przygotowawczy.');return}startFight()}]])}function startFight(){s.money+=s.fight.purse;s.w++;s.rep+=3;s.ig+=250;s.history.unshift({date:'Dzień '+s.day,opponent:s.fight.opponent,result:'W',method:'DEC',fed:s.rep<20?'Lokalna gala':s.rep<35?'FEN / Hybrid':s.rep<50?'KSW':'OKTAGON'});s.log.unshift('🏆 Wygrana z '+s.fight.opponent+' przez decyzję.');s.fight=null;dashboard()}function career(){var rows=s.history.length?s.history.map(function(x){return '<div class="fightrow"><div>'+x.date+'<br><b>'+x.fed+'</b></div><div class="center"><span class="pill">'+x.result+'</span><br>'+x.method+'</div><div><b>'+x.opponent+'</b></div></div>'}).join(''):'<div style="padding:20px">Brak walk. Kariera dopiero się zaczyna.</div>';modalChoices('ŚCIEŻKA KARIERY','Aktualny poziom: <b>'+careerLevel()+'</b><br><br><div class="sherdog"><div class="head">REKORD I HISTORIA WALK</div>'+rows+'</div>',[['WRÓĆ',dashboard]])}function careerLevel(){if(s.rep>=80)return'UFC';if(s.rep>=65)return'PFL';if(s.rep>=50)return'Cage Warriors / OKTAGON';if(s.rep>=35)return'OKTAGON / KSW';if(s.rep>=20)return'KSW / FEN';return'Lokalne gale'}function media(){var list=s.mediaLog.concat(['Instagram: '+s.ig.toLocaleString('pl-PL'),'X: aktywność rośnie wraz z reputacją.']);modalChoices('MEDIA',list.map(function(x){return'<div class="feed">📱 '+x+'</div>'}).join(''),[['WRÓĆ',dashboard]])}function manager(){if(!s.manager){modal('MENEDŻER','Na razie nikt nie chce prowadzić Twojej kariery. Przy reputacji 20+ zaczną się telefony.');return}modalChoices('MENEDŻER KARIERY','Twój menedżer negocjuje walki, sponsorów i zaplecze. Może też organizować dietę pudełkową.',[['SZUKAJ SPONSORA',function(){s.money+=2500;s.sponsors.push('Sponsor menedżerski');s.log.unshift('💼 Menedżer znalazł sponsora: +2500 ISK.');dashboard()}],['DIETA PUDEŁKOWA',function(){if(s.money<1800)return alert('Koszt diety: 1800 ISK.');s.money-=1800;s.mot=Math.min(100,s.mot+8);s.log.unshift('🥗 Dieta pudełkowa poprawiła regenerację.');dashboard()}]])}function statistics(){modal('STATYSTYKI',Object.keys(s.sk).map(function(k){return'<div class="feed"><b>'+k+'</b> '+s.sk[k]+'<div class="bar"><i style="width:'+s.sk[k]+'%"></i></div></div>'}).join('')+'<br><b>Overall: '+Math.round(Object.keys(s.sk).reduce(function(a,k){return a+s.sk[k]},0)/6)+'</b>')}function finance(){modalChoices('FINANSE','Kapitał: <span class="money">'+s.money.toLocaleString('pl-PL')+' ISK</span><br><br>Etat: '+s.jobPay+' ISK / miesiąc<br>Brama: '+s.gatePay+' ISK / weekend<br>Suplementy: '+(s.supplements?'aktywne':'brak'),[['KUP SUPLEMENTY · 3500 ISK',function(){if(s.money<3500)return alert('Za mało pieniędzy.');s.money-=3500;s.supplements=true;s.log.unshift('🥤 Kupiono suplementy. Regeneracja będzie odrobinę lepsza.');dashboard()}],['ETAT — 3000 ISK / MIESIĄC',function(){s.job=true;dashboard()}],['BRAMA — 900 ISK / WEEKEND',function(){s.gate=true;dashboard()}],['SZARA STREFA — RYZYKO',function(){modalChoices('RYZYKOWNA DECYZJA','Możesz dorobić w nielegalny sposób, ale ryzykujesz kontuzją, problemami z reputacją albo konsekwencjami. Bez gwarancji zysku.',[['ODPUSZCZAM',dashboard],['RYZYKUJĘ',function(){if(Math.random()<.55){s.money+=1800;s.rep=Math.max(0,s.rep-1);s.log.unshift('⚠️ Ryzykowna fucha przyniosła pieniądze, ale reputacja ucierpiała.')}else{s.mot=Math.max(0,s.mot-8);s.log.unshift('🚨 Ryzykowna fucha skończyła się problemami.');}dashboard()}]])}]])}function events(){modal('KALENDARZ I EVENTY','Dzień '+s.day+' · tydzień '+s.week+' · miesiąc '+s.month+' · wiek '+s.age+' lat.<br><br>'+s.log.slice(0,20).map(function(x){return'<div class="feed">'+x+'</div>'}).join(''))}window.dashboard=dashboard;window.advance=advance;window.nextEvent=nextEvent;window.training=training;window.fights=fights;window.career=career;window.media=media;window.manager=manager;window.statistics=statistics;window.finance=finance;window.events=events;window.closeModal=closeModal;window.camp=camp;window.startFight=startFight;creator()})();</script></body></html>
