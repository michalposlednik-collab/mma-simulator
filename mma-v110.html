<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V110</title><style>
*{box-sizing:border-box}body{margin:0;background:#060b10;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}button:hover{border-color:#d6ae51}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#80652a;border-color:#d6ae51}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.side .active{border-color:#d6ae51;background:#211f15}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.panel,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small,.muted{color:#82949d}.stat b{display:block;font-size:18px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:92px;background:#0b151d;border:1px solid #304955;border-radius:9px;padding:8px}.day b{color:#d6ae51}.event{display:block;margin-top:7px;padding:6px;border-radius:6px;background:#211f15;border:1px solid #80652a;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:100;align-items:center;justify-content:center;padding:18px}.box{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:25px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0b151d;text-align:left;min-height:90px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#293a44,#070c11)}.fighttop{display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;gap:20px;max-width:1250px;margin:auto}.fighter{text-align:center;padding:18px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:14px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.comment{min-height:105px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;font-size:17px;line-height:1.5}.timer{width:270px;height:270px;margin:auto;position:relative;border-radius:50%;display:grid;place-items:center}.timer:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#d6ae51 var(--pct),#26343b 0);box-shadow:0 0 0 8px #111d24}.timer:after{content:'';position:absolute;inset:18px;border-radius:50%;background:#081016;border:1px solid #304955}.timerText{position:relative;z-index:2;text-align:center}.clock{font-size:44px;font-weight:900}.round{font-size:13px;letter-spacing:2px;color:#d6ae51}.actions{display:flex;flex-wrap:wrap;gap:8px;max-width:1250px;margin:14px auto}.log{max-width:1250px;margin:auto;max-height:160px;overflow:auto}.wheelwrap{display:none;position:fixed;inset:0;background:#000e;z-index:200;place-items:center;padding:18px}.wheelbox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px;width:min(700px,96vw);text-align:center}.wheelstage{width:360px;height:360px;margin:15px auto;position:relative}.wheel{position:absolute;inset:10px;border-radius:50%;border:10px solid #17252d;box-shadow:0 8px 30px #0008;transition:transform 2.6s cubic-bezier(.12,.7,.15,1);background:conic-gradient(#b83a3a 0deg 45deg,#318c58 45deg 90deg,#b77b32 90deg 135deg,#318c58 135deg 180deg,#b83a3a 180deg 225deg,#b77b32 225deg 270deg,#318c58 270deg 315deg,#b83a3a 315deg 360deg)}.wheel:after{content:'';position:absolute;inset:50%;width:24px;height:24px;margin:-12px;border-radius:50%;background:#d6ae51;border:4px solid #17252d}.segline{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0deg 44.3deg,#eef3f5 44.3deg 45deg);opacity:.8;pointer-events:none}.pointer{position:absolute;z-index:5;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid #d6ae51;filter:drop-shadow(0 2px 2px #000)}.wheelresult{font-size:32px;font-weight:900;color:#d6ae51;min-height:45px}.result{display:none;position:fixed;inset:0;background:#000d;z-index:210;align-items:center;justify-content:center;padding:18px}.resultbox{width:min(720px,96vw);background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:28px;text-align:center}.winner{font-size:42px;color:#d6ae51;font-weight:900}.hidden{display:none}@media(max-width:950px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.cols,.fighttop{grid-template-columns:1fr}.timer{width:230px;height:230px}.calendar{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid,.stats,.cards{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.timer{width:210px;height:210px}.clock{font-size:34px}}
</style></head><body><div id="app"></div>
<div id="modal" class="modal"><div class="box"><div id="mt" class="muted"></div><h1 id="mh"></h1><div id="mb"></div><div id="mc" class="cards"></div><div class="row"><button onclick="closeModal()">ZAMKNIJ</button></div></div></div>
<div id="wheelModal" class="wheelwrap"><div class="wheelbox"><div class="muted">CZAS ZATRZYMANY — RYZYKOWNA TECHNIKA</div><h2 id="wheelAction" class="gold">HIGH KICK</h2><p>Wskaźnik jest nieruchomy. Segmenty nie mają napisów — wynik poznasz dopiero po losowaniu.</p><div class="wheelstage"><div class="pointer"></div><div id="wheel" class="wheel"><div class="segline"></div></div></div><div id="wheelResult" class="wheelresult">GOTOWE DO LOSOWANIA</div><button id="spin" class="primary">LOSUJ EFEKT</button></div></div>
<div id="result" class="result"><div class="resultbox"><div class="muted">OFICJALNY WYNIK</div><div id="winner" class="winner"></div><h2 id="method"></h2><p id="summary"></p><button class="primary" onclick="closeResult()">WRÓĆ DO DASHBOARDU</button></div></div>
<script>
(function(){'use strict';
const app=document.getElementById('app'),modal=document.getElementById('modal'),wheelModal=document.getElementById('wheelModal'),result=document.getElementById('result');
const types={Wonderkid:'Talent, refleks i głód zwycięstw.',Bijok:'Szczęka, presja i moc.',Fizol:'Siła, klincz i presja.',Zapaśnik:'Obalenia, siatka i kontrola.',Striker:'Dystans, timing i nokaut.',Gumiarz:'Chaos, parter i kreatywność.',Allrounder:'Wszechstronność i odpowiedź na wszystko.'};
const weights=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];
const leagues=['Lokalna gala','Hybrid','Babilon MMA / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'];
const opps=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk','Alex Pereira Jr.','Michał „Bizon” Kowal'];
const special={High kick:18,'Latające kolano':16,'Spinning backfist':15,Obalenie:10,Balacha:20,Trójkąt:18,RNC:22};
let s=load()||{created:false,first:'',last:'',age:18,day:1,money:10000,rep:5,ig:100,w:0,l:0,d:0,type:'',weight:'Middleweight',club:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,events:[],log:[],screen:'dashboard'};
let timer=null,paused=false,pending=null,spinRotation=0;
function load(){try{return JSON.parse(localStorage.getItem('mmaCareerV110'))}catch(e){return null}}function save(){localStorage.setItem('mmaCareerV110',JSON.stringify(s))}function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function league(){return leagues[Math.min(7,Math.floor(s.w/2))]}
function showModal(title,head,body,cards=[]){document.getElementById('mt').textContent=title;document.getElementById('mh').textContent=head;document.getElementById('mb').innerHTML=body;const c=document.getElementById('mc');c.innerHTML='';cards.forEach(x=>{const b=document.createElement('button');b.className='card';b.innerHTML=x[0];b.onclick=x[1];c.appendChild(b)});modal.style.display='flex'}
window.closeModal=()=>modal.style.display='none';window.closeResult=()=>{result.style.display='none';dashboard()};
function creator(){app.innerHTML='<div style="padding:28px"><div class="panel" style="max-width:1100px;margin:auto"><h1>MMA Career Simulator V110</h1><p class="muted">Stwórz zawodnika. W V110 kalendarz, eventy i walka są jedną spójną karierą.</p><div class="grid"><label>Imię<input id="first" class="field" placeholder="Imię"></label><label>Nazwisko<input id="last" class="field" placeholder="Nazwisko"></label><label>Waga<select id="weight" class="field">${weights.map(x=>'<option>'+x+'</option>').join('')}</select></label></div><h3>Typ zawodnika</h3><div class="grid">${Object.entries(types).map(([k,v])=>'<button class="card" onclick="pickType(\''+k+'\')"><b>'+k+'</b><small>'+v+'</small></button>').join('')}</div><p id="picked" class="gold">Nie wybrano typu</p><button class="primary" onclick="create()">ROZPOCZNIJ KARIERĘ</button></div></div>'}
let chosen='Allrounder';window.pickType=k=>{chosen=k;document.getElementById('picked').textContent='Wybrano: '+k+' — '+types[k]};window.create=()=>{s.created=true;s.first=document.getElementById('first').value||'Michał';s.last=document.getElementById('last').value||'Nowak';s.weight=document.getElementById('weight').value;s.type=chosen;save();dashboard()};
function nav(){return '<div class="side"><button class="active" onclick="dashboard()">🏠 Dashboard</button><button onclick="calendar()">📅 Kalendarz</button><button onclick="career()">🥊 Kariera</button><button onclick="events()">📩 Eventy</button><button onclick="nextDay()">＋ NASTĘPNY DZIEŃ</button></div>'}
function dashboard(){s.screen='dashboard';save();app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><h1>'+esc(s.first)+' '+esc(s.last)+'</h1><div class="muted">'+esc(s.type)+' · '+esc(s.weight)+' · '+esc(league())+'</div></div><div><b>Dzień '+s.day+'</b> · wiek '+s.age+'</div></div><div class="stats"><div class="stat"><small>Rekord</small><b>'+s.w+'-'+s.l+'-'+s.d+'</b></div><div class="stat"><small>Reputacja</small><b>'+s.rep+'</b></div><div class="stat"><small>Instagram</small><b>'+s.ig.toLocaleString('pl-PL')+'</b></div><div class="stat"><small>Finanse</small><b>'+money(s.money)+'</b></div><div class="stat"><small>Organizacja</small><b>'+league()+'</b></div><div class="stat"><small>Wiek</small><b>'+s.age+'</b></div></div><div class="hero">'+fightHero()+'</div><div class="cols"><div class="panel"><h2>Ostatnie wydarzenia</h2>${(s.log||[]).slice(-8).reverse().map(x=>'<div class="feed">'+esc(x)+'</div>').join('')||'<p class="muted">Brak wydarzeń.</p>'}</div><div class="panel"><h2>Dzisiaj</h2><p>Przejdź do <b>Kalendarza</b>, aby zobaczyć dokładny plan.</p><button onclick="calendar()">OTWÓRZ KALENDARZ</button></div></div></main></div>'}
function fightHero(){if(!s.fight)return '<h2>Brak zakontraktowanej walki</h2><p>Oferta walki pojawia się jako osobny event. Po jej zaakceptowaniu wybierasz camp, a walka trafia do kalendarza.</p><button class="primary" onclick="newFightEvent()">SPRAWDŹ OFERTĘ WALKI</button>';let days=s.fight.date-s.day;return '<h2>📅 '+esc(s.fight.league)+' — '+esc(s.fight.opponent)+'</h2><p>Walka: dzień <b>'+s.fight.date+'</b> · zostało <b>'+Math.max(0,days)+'</b> dni · camp: '+esc(s.fight.camp)+'</p>'+(days<=0?'<button class="primary" onclick="startFight()">WEJDŹ DO WALKI</button>':'<button onclick="calendar()">POKAŻ KALENDARZ</button>')}
function calendar(){s.screen='calendar';const start=Math.max(1,s.day-2),end=s.day+27;let cells='';for(let d=start;d<=end;d++){let ev='';if(s.fight&&d===s.fight.date)ev='<span class="event">🥊 WALKA<br>'+esc(s.fight.opponent)+'</span>';if(d===s.day)ev+='<span class="event">📍 DZISIAJ</span>';cells+='<div class="day"><b>Dzień '+d+'</b>'+ev+'</div>'}app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><h1>📅 Kalendarz kariery</h1><button onclick="nextDay()">＋ NASTĘPNY DZIEŃ</button></div><div class="panel"><p class="muted">Dzień kariery: '+s.day+' · wiek: '+s.age+'</p><div class="calendar">'+cells+'</div></div><div class="panel"><h2>Zaplanowana walka</h2>'+(s.fight?'<p><b>'+esc(s.fight.opponent)+'</b> · '+esc(s.fight.league)+' · dzień <b>'+s.fight.date+'</b><br>Camp: '+esc(s.fight.camp)+' ('+s.fight.campDays+' dni)</p>':'<p class="muted">Brak walki.</p>')+'</div></main></div>'}
function career(){showModal('KARIERA','Profil zawodnika','<b>'+esc(s.first+' '+s.last)+'</b><br>'+esc(s.type)+' · '+esc(s.weight)+'<br>Rekord: '+s.w+'-'+s.l+'-'+s.d+'<br>Reputacja: '+s.rep+'<br>Instagram: '+s.ig.toLocaleString('pl-PL'));}
function events(){showModal('EVENTY','Oczekujące wydarzenia','Tutaj trafiają decyzje, które wymagają Twojej akceptacji.',[['📩 <b>Nowa oferta walki</b><br><small>Podpisanie walki jest osobnym eventem.</small>',newFightEvent]])}
function newFightEvent(){if(s.fight){showModal('EVENT','Masz już zakontraktowaną walkę','Najpierw rozegraj zaplanowaną walkę.');return}const opp=opps[Math.floor(Math.random()*opps.length)],org=league();showModal('📩 EVENT — OFERTA WALKI','Podpisanie walki','<b>'+esc(opp)+'</b> proponuje Ci walkę w <b>'+esc(org)+'</b>.<br><br>Akceptacja tego okna nie rozpoczyna walki. Najpierw wybierzesz camp i dopiero wtedy termin zostanie wpisany do kalendarza.',[['✅ <b>AKCEPTUJ OFERTĘ</b>',()=>campEvent(opp,org)],['❌ ODRZUĆ',()=>{s.log.push('❌ Odrzucono ofertę walki z '+opp+'.');save();closeModal();dashboard()}]])}
function campEvent(opp,org){const camps=[['Lokalny camp',800,7,'Podstawowe przygotowanie'],['WCA Fight Team',3000,14,'MMA / BJJ / zapasy'],['ANKOS MMA',4200,21,'Zapasy + klincz + sparingi'],['UFC Performance Institute',12000,28,'Pełny camp i specjaliści']];showModal('PRZYGOTOWANIE','Wybierz camp','Wybór campu ustala datę walki i zapisuje ją do kalendarza.',camps.map(c=>['<b>'+c[0]+'</b><br>'+money(c[1])+' · '+c[2]+' dni<br><small>'+c[3]+'</small>',()=>{if(s.money<c[1]){alert('Za mało pieniędzy.');return}s.money-=c[1];s.fight={opponent:opp,league:org,camp:c[0],campCost:c[1],campDays:c[2],date:s.day+c[2]+1,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],log:[],uses:{}};s.log.push('📅 Podpisano walkę z '+opp+' w '+org+'. Walka: dzień '+s.fight.date+'. Camp: '+c[0]+'.');save();closeModal();calendar() }]))}
function nextDay(){if(s.fight&&s.day>=s.fight.date){alert('To jest dzień walki — nie możesz przejść dalej bez rozegrania jej.');return}s.day++;if(s.day%365===0)s.age++;s.money=Math.max(0,s.money-150);s.log.push('📅 Dzień '+s.day+'. Koszt życia: 150 zł.');save();if(s.fight&&s.day===s.fight.date)showModal('🥊 DZIEŃ WALKI','Walka jest dzisiaj','Twój pojedynek z <b>'+esc(s.fight.opponent)+'</b> jest gotowy.',['<b>WEJDŹ DO WALKI</b>',startFight]);else dashboard()}
window.nextDay=nextDay;window.dashboard=dashboard;window.calendar=calendar;window.career=career;window.events=events;window.newFightEvent=newFightEvent;
function startFight(){if(!s.fight)return;closeModal();s.screen='fight';paused=false;renderFight();if(timer)clearInterval(timer);timer=setInterval(tick,1000)}
function tick(){if(paused)return;if(!s.fight)return;s.fight.time--;if(s.fight.time<=0){endRound();return}renderFight()}
function fmt(t){let m=Math.floor(t/60),sec=t%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function renderFight(){const f=s.fight,pct=(f.time/300)*100;app.innerHTML='<div class="fight"><div class="fighttop"><div class="fighter"><h2>'+esc(s.first+' '+s.last)+'</h2><div class="hp"><i style="width:'+f.vitality+'%"></i></div><p>Witalność '+Math.round(f.vitality)+'% · Stamina '+Math.round(f.stamina)+'%</p></div><div class="timer" style="--pct:'+pct+'%"><div class="timerText"><div class="round">RUNDA '+f.round+'</div><div class="clock">'+fmt(f.time)+'</div></div></div><div class="fighter"><h2>'+esc(f.opponent)+'</h2><div class="hp"><i style="width:'+f.oppVitality+'%"></i></div><p>Witalność '+Math.round(f.oppVitality)+'% · Stamina '+Math.round(f.oppStamina)+'%</p></div></div><div class="comment" id="comment">JURAS: Czytaj sytuację i wybieraj akcje. Ryzykowne techniki zatrzymują czas i otwierają koło fortuny.</div><div class="actions">${['Jab','Cross','Low kick','Middle kick','High kick','Latające kolano','Spinning backfist','Obalenie','Balacha','Trójkąt','RNC','Kontrola','Odpoczynek'].map(a=>'<button onclick="action(\''+a+'\')">'+a+'</button>').join('')}</div><div class="log">${(f.log||[]).slice(-12).reverse().map(x=>'<div class="feed">'+esc(x)+'</div>').join('')}</div></div>'}
window.action=a=>{if(!s.fight)return;if(['High kick','Latające kolano','Spinning backfist','Obalenie','Balacha','Trójkąt','RNC'].includes(a)){paused=true;pending=a;document.getElementById('wheelAction').textContent=a;document.getElementById('wheelResult').textContent='GOTOWE DO LOSOWANIA';document.getElementById('spin').disabled=false;wheelModal.style.display='grid';return}resolveAction(a)};
function resolveAction(a,effect){const f=s.fight;let dmg=0,cost=0,msg='';if(effect==='fail'){cost=10;msg='Nieudana technika — przeciwnik uniknął akcji.'}else if(effect==='partial'){dmg=special[a]*.55;cost=12;msg='Częściowy sukces — technika dochodzi, ale bez pełnego efektu.'}else if(effect==='success'){dmg=special[a];cost=8;msg='Pełny sukces — czysta technika trafia.'}else if(a==='Jab'){dmg=4;cost=3;msg='Jab trafia i utrzymuje dystans.'}else if(a==='Cross'){dmg=6;cost=4;msg='Mocny cross znajduje cel.'}else if(a==='Low kick'){dmg=7;cost=5;msg='Low kick odbiera bazę.'}else if(a==='Middle kick'){dmg=8;cost=6;msg='Middle kick trafia na korpus.'}else if(a==='Kontrola'){dmg=2;cost=2;msg='Dobra kontrola i spokojna praca.'}else if(a==='Odpoczynek'){cost=-10;msg='Łapiesz oddech i odzyskujesz część staminy.'}f.oppVitality=Math.max(0,f.oppVitality-dmg);f.stamina=Math.max(0,Math.min(100,f.stamina-cost));if(a==='Odpoczynek')f.stamina=Math.min(100,f.stamina+10);let odmg=Math.max(1,Math.round(4+Math.random()*8-(f.stamina/25)));f.vitality=Math.max(0,f.vitality-odmg);f.oppStamina=Math.max(0,f.oppStamina-(2+Math.random()*5));f.log.unshift(a+': '+msg+' JURAS: '+comment(a,effect,dmg));if(f.oppVitality<=0){clearInterval(timer);finish('KO','Wykończyłeś rywala.');return}if(f.vitality<=0){clearInterval(timer);finish('KO','Rywal znalazł sposób na zakończenie walki.');return}renderFight()}
function comment(a,e,d){if(e==='success')return 'Ale to weszło! Pełny efekt i bardzo duża kara dla rywala.';if(e==='partial')return 'Jest kontakt, ale rywal częściowo wybronił.';if(e==='fail')return 'Ryzykowna próba nie wyszła. Trzeba wrócić do podstaw.';return a==='Odpoczynek'?'Mądra decyzja, trzeba gospodarować paliwem.':'Dobra robota, akcja pracuje na przewagę.'}
function endRound(){const f=s.fight;f.score.push(f.oppVitality<f.vitality?10:9);if(f.round>=3){clearInterval(timer);finish('DECYZJA','Walka przeszła pełny dystans.');return}f.round++;f.time=300;f.stamina=Math.min(100,f.stamina+18);f.oppStamina=Math.min(100,f.oppStamina+15);f.log.unshift('Koniec rundy '+(f.round-1)+'. Sędziowie zapisują punktację.');renderFight()}
document.getElementById('spin').onclick=()=>{const btn=document.getElementById('spin');btn.disabled=true;const outcomes=['success','partial','fail','success','partial','fail','success','fail'];const effect=outcomes[Math.floor(Math.random()*outcomes.length)];const index=outcomes.indexOf(effect);spinRotation+=1440+(index*45+22.5);document.getElementById('wheel').style.transform='rotate('+spinRotation+'deg)';setTimeout(()=>{const labels={success:'PEŁNY SUKCES',partial:'CZĘŚCIOWY SUKCES',fail:'NIEUDANA TECHNIKA'};document.getElementById('wheelResult').textContent=labels[effect];setTimeout(()=>{wheelModal.style.display='none';paused=false;resolveAction(pending,effect);pending=null},900)},2700)};
function finish(method,summary){const f=s.fight;const win=method==='DECYZJA'?f.oppVitality<f.vitality:true;if(win){s.w++;s.rep+=5;s.ig+=500}else{s.l++;s.rep=Math.max(0,s.rep-2)}s.money+=Math.round(2500+s.rep*100);s.log.push((win?'✅ ZWYCIĘSTWO ':'❌ PORAŻKA ')+method+' z '+f.opponent+'.');s.fight=null;save();document.getElementById('winner').textContent=win?'ZWYCIĘSTWO':'PORAŻKA';document.getElementById('method').textContent=method;document.getElementById('summary').textContent=summary;result.style.display='flex'}
if(!s.created)creator();else dashboard();
})();
