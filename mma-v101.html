<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V101</title><style>*{box-sizing:border-box}body{margin:0;background:#060b10;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer;color:#fff;border:1px solid #526873;background:#142833;padding:11px 15px;border-radius:9px;font-weight:700}.primary{background:#80652a;border-color:#d6ae51}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 16px 45px #0006}.creator{max-width:1100px;margin:auto}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{display:none}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:76px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.pick+label small{display:block;color:#9eb0b8;margin-top:6px}.gold{color:#d6ae51}.muted{color:#91a3ac}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b}.modal{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:50;padding:18px}.modalbox{width:min(1000px,96vw);max-height:92vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:26px}.club{padding:16px;border:1px solid #304955;border-radius:12px;background:#0b151d;margin:9px 0}.locked{opacity:.45}.fight{background:radial-gradient(circle at 50% 0,#293a44,#070c11);min-height:100vh;padding:22px}.fighthead{display:flex;justify-content:space-between}.round{font-size:28px;color:#d6ae51}.clock{font-size:44px;font-weight:800}.fighters{display:grid;grid-template-columns:1fr 180px 1fr;gap:15px;align-items:center;margin:18px 0}.fighter{text-align:center;padding:22px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:14px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.comment{min-height:90px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;font-size:18px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.wheelwrap{display:none;position:fixed;inset:0;background:#000d;z-index:100;place-items:center}.wheelbox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:22px;text-align:center}.wheel{width:280px;height:280px;border-radius:50%;background:conic-gradient(#c33 0 12%,#2e9d5b 12% 25%,#c33 25% 37%,#2e9d5b 37% 50%,#c33 50% 62%,#2e9d5b 62% 75%,#c33 75% 87%,#2e9d5b 87% 100%);border:8px solid #17252d;transition:transform 2.5s cubic-bezier(.12,.7,.15,1);position:relative}.wheel:after{content:'▲';position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:#d6ae51;font-size:25px}.hidden{display:none}@media(max-width:900px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:125px}.stats{grid-template-columns:repeat(3,1fr)}.grid,.cols{grid-template-columns:1fr 1fr}.fighters{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}@media(max-width:600px){.grid,.cols,.stats{grid-template-columns:1fr}.top{display:block}}</style></head><body><div id="app" class="app"></div><div id="wheel" class="wheelwrap"><div class="wheelbox"><h2 class="gold">KOŁO FORTUNY</h2><p id="wheelText">Timing decyduje...</p><div id="wheelEl" class="wheel"></div><br><button class="primary" onclick="spinWheel()">LOSOWANIE</button></div></div><script>(function(){'use strict';var app=document.getElementById('app'),wheel=document.getElementById('wheel'),wheelEl=document.getElementById('wheelEl');var KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};var TYPES={Wonderkid:'Talent, refleks i głód zwycięstw. Potencjał ogromny, doświadczenie jeszcze nie.',Bijok:'Szczęka ze stali, ręce z żelaza, a mózg czasem na urlopie.',Fizol:'Siła, klincz i presja. Jeśli nie działa plan A, jest jeszcze ciężar właściwy.',Zapaśnik:'Najpierw nogi rywala, potem pytania. Siatka to jego drugi dom.',Striker:'Dystans, timing i przekonanie, że każda runda może skończyć się przed czasem.',Gumiarz:'Im większy chaos, tym lepiej. Na macie czuje się jak ryba w wodzie.',Allrounder:'Nie ma jednej supermocy. Ma za to odpowiedź na większość problemów.'};var BUD=[[5000,'Normalny etat','Praca po godzinach. Każdy wydatek boli.'],[10000,'Etat + oszczędności','Trochę oddechu, ale nadal trzeba liczyć.'],[25000,'Rodzina pomaga','Masz zaplecze na pierwszy poważny krok.'],[50000,'Bogata rodzina','Możesz inwestować w obozy i sprzęt.'],[100000,'Rodzinny biznes','Sport jest finansowany jak drugi biznes.']];var CLUBS=[['Uniq Fight Club','Warszawa',0,6000,'Stójka, boks i kickboxing.',{Boks:5,Szybkość:3}],['ANKOS MMA','Poznań',15,8000,'Zapasy, MMA i praca pod presją.',{Zapasy:6,Kondycja:3}],['WCA Fight Team','Warszawa',25,9000,'BJJ, grappling i praca w parterze.',{BJJ:6,Zapasy:2}],['Czerwony Smok','Poznań',35,11000,'Przekrojowy camp MMA.',{Boks:3,BJJ:3,Zapasy:3}],['American Top Team','Coconut Creek',65,25000,'Międzynarodowy camp dla zawodników z reputacją.',{Boks:4,BJJ:4,Zapasy:4,Kondycja:4}]];var s={created:false,day:1,age:18,money:10000,rep:5,ig:100,mot:70,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,log:[],history:[],fightLive:false,round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,comment:'',wheelAction:null};function creator(){app.innerHTML='<div class="wrap creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Od osiedlowej sali do wielkich gal.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="Michał"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="Kowalski"></div><h3>TYP ZAWODNIKA</h3><div class="grid">'+Object.keys(TYPES).map(function(k,i){return '<input class="pick" id="t'+i+'" name="type" type="radio" value="'+k+'"><label for="t'+i+'"><b>'+k+'</b><small>'+TYPES[k]+'</small></label>}).join('')+'</div><h3>BUDŻET STARTOWY</h3><div class="grid">'+BUD.map(function(x,i){return '<input class="pick" id="b'+i+'" name="bud" type="radio" value="'+x[0]+'"><label for="b'+i+'"><b>'+x[0].toLocaleString('pl-PL')+' zł</b><small><b>'+x[1]+'</b><br>'+x[2]+'</small></label>}).join('')+'</div><h3>KATEGORIA WAGOWA</h3><div class="grid">'+Object.keys(KG).map(function(k,i){return '<input class="pick" id="w'+i+'" name="weight" type="radio" value="'+k+'"><label for="w'+i+'"><b>'+k+'</b><small>'+KG[k]+'</small></label>}).join('')+'</div><br><button class="primary" onclick="startCareer()">STWÓRZ KARIERĘ →</button></div></div>'}function startCareer(){var f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s.created=true;s.first=f;s.last=l;s.type=t.value;s.money=+b.value;s.weight=w.value;s.log=['🥊 Rozpoczęto karierę '+f+' '+l+'.'];dashboard()}function nav(){return '<aside class="side"><button onclick="dashboard()">⌂ Dashboard</button><button onclick="advance(1)">＋ Jeden dzień</button><button onclick="nextEvent()">⏩ Następny event</button><button onclick="training()">🥊 Trening</button><button onclick="fights()">🏆 Walki</button><button onclick="career()">📋 Kariera</button><button onclick="media()">📱 Media</button><button onclick="manager()">💼 Menedżer</button><button onclick="statistics()">📊 Statystyki</button><button onclick="finance()">💰 Finanse</button><button onclick="events()">◉ Eventy</button></aside>'}function dashboard(){if(!s.created)return creator();app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>'+s.first+' '+s.last+'</h1><p class="muted">Dzień '+s.day+' · '+s.age+' lat · '+s.type+' · '+s.weight+' ('+KG[s.weight]+')</p></div><div><button onclick="advance(1)">＋ 1 DZIEŃ</button> <button class="primary" onclick="nextEvent()">⏩ NASTĘPNY EVENT</button></div></div><div class="stats"><div class="stat"><small>REKORD</small><b>'+s.w+'-'+s.l+'-'+s.d+'</b></div><div class="stat"><small>INSTAGRAM</small><b>'+s.ig.toLocaleString('pl-PL')+'</b></div><div class="stat"><small>REPUTACJA</small><b>'+s.rep+'/100</b></div><div class="stat"><small>BUDŻET</small><b>'+s.money.toLocaleString('pl-PL')+' zł</b></div><div class="stat"><small>MOTYWACJA</small><b>'+s.mot+'/100</b></div><div class="stat"><small>WIEK</small><b>'+s.age+'</b></div></div><div class="hero"><small class="gold">NAJBLIŻSZY CEL</small><h2>'+ (s.fight?'🏆 '+(s.fight.days>0?'PRZYGOTOWANIE DO WALKI':'WALKA GOTOWA'):'📅 BUDOWANIE KARIERY')+'</h2><p>'+ (s.fight?'Rywal: <b>'+s.fight.opponent+'</b> · '+(s.fight.days>0?'wybierz jeden klub i rozpocznij cały camp.':'obóz zakończony — możesz wejść do walki.'):'Trenuj, buduj reputację i czekaj na ofertę.')+'</p><button class="primary" onclick="'+(s.fight?(s.fight.days>0?'training()':'startFight()'):'nextEvent()')+'">'+(s.fight?(s.fight.days>0?'WYBIERZ CAMP':'WEJDŹ DO WALKI'):'PRZEWIŃ DO NASTĘPNEGO EVENTU')+'</button></div><div class="cols"><section><div class="panel"><h3>📰 OŚ KARIERY</h3>'+s.log.slice(0,12).map(function(x){return '<div class="feed">'+x+'</div>'}).join('')+'</div><div class="panel"><h3>🎯 ŚCIEŻKA KARIERY</h3>'+['Hybrid / Babylon / FEN','KSW','OKTAGON','Cage Warriors','PFL','UFC'].map(function(x,i){return '<div class="feed">'+(s.rep>=[5,20,35,50,65,80][i]?'🟢':'🔒')+' '+x+'</div>'}).join('')+'</div></section><aside><div class="panel"><h3>📈 UMIEJĘTNOŚCI</h3>'+Object.keys(s.sk).map(function(k){return '<div class="feed"><b>'+k+'</b> '+s.sk[k]+'<div class="bar"><i style="width:'+Math.min(100,s.sk[k])+'%"></i></div></div>'}).join('')+'</div><div class="tiles"><div class="tile">🏋️ Klub<br><b>'+ (s.gym||'Lokalny')+'</b></div><div class="tile">💼 Menedżer<br><b>'+ (s.rep>=20?'Dostępny':'Brak')+'</b></div><div class="tile">🥤 Regeneracja<br><b>'+ (s.supplements?'Suplementy':'Standard')+'</b></div></div></aside></div></main></div>'}function advance(n){for(var i=0;i<n;i++){s.day++;if(s.day%365===0){s.age++;s.log.unshift('🎂 Urodziny — '+s.age+' lat.')}if(s.day%7===0){s.money+=900;s.log.unshift('🚪 Weekendowa brama: +900 zł.')}if(s.day%30===1&&s.day>1){s.money+=3000;s.log.unshift('💼 Wypłata z etatu: +3000 zł.')}}s.mot=Math.max(0,s.mot-1);dashboard()}function nextEvent(){var jump=7;if(s.fight)jump=Math.max(1,s.fight.days);advance(jump);if(!s.fight&&s.rep>=5){s.fight={opponent:'Kacper „Raptor” Nowak',days:21,fed:s.rep>=20?'KSW':'Hybrid / Babylon / FEN'};s.log.unshift('📩 OFERTA WALKI: '+s.fight.fed+' — Kacper „Raptor” Nowak. Masz 21 dni na przygotowanie.')}else{s.log.unshift('📅 Nowy event: trener zaprasza na sparingi.')}}function training(){if(!s.fight){modal('TRENING','Możesz trenować lokalnie. Po otrzymaniu walki wybierzesz klub na cały camp.')}else{var html='<div class="modal"><div class="modalbox"><small class="gold">OBÓZ PRZYGOTOWAWCZY · 21 DNI</small><h1>Wybierz jeden klub</h1><p class="muted">Płacisz raz. Camp trwa 21 dni i po zakończeniu automatycznie otwiera ekran walki.</p>';CLUBS.forEach(function(c,i){var ok=s.rep>=c[2]&&s.money>=c[3];html+='<div class="club '+(ok?'':'locked')+'"><h3>'+c[0]+' · '+c[1]+'</h3><p>'+c[4]+'</p><span class="gold">REP '+c[2]+' · '+c[3].toLocaleString('pl-PL')+' zł · 21 dni</span><p class="green">'+Object.keys(c[5]).map(function(k){return '+'+c[5][k]+' '+k}).join(' · ')+'</p><button '+(ok?'':'disabled')+' class="'+(ok?'primary':'')+'" onclick="startCamp('+i+')">'+(ok?'ROZPOCZNIJ CAMP':'NIEDOSTĘPNY')+'</button></div>'});html+='<button onclick="closeModal()">WRÓĆ</button></div></div>';app.insertAdjacentHTML('beforeend',html)}}function startCamp(i){var c=CLUBS[i];if(!s.fight||s.rep<c[2]||s.money<c[3])return;s.money-=c[3];s.gym=c[0];Object.keys(c[5]).forEach(function(k){s.sk[k]=Math.min(100,s.sk[k]+c[5][k])});s.day+=21;s.fight.days=0;s.log.unshift('🥋 Zakończono 21-dniowy camp w '+c[0]+' za '+c[3].toLocaleString('pl-PL')+' zł.');closeModal();startFight()}function fights(){if(!s.fight)return modal('WALKI','Brak aktywnej walki. Kliknij „Następny event”, aby dostać ofertę.');if(s.fight.days>0)return training();startFight()}function startFight(){s.fightLive=true;s.round=1;s.time=300;s.stamina=100;s.vitality=100;s.oppStamina=100;s.oppVitality=100;s.comment='Juras: Panowie, zaczynamy! Zobaczymy, kto pierwszy narzuci swoje warunki.';renderFight();if(s.timer)clearInterval(s.timer);s.timer=setInterval(tickFight,180)}function tickFight(){if(!s.fightLive)return;s.time-=3;if(Math.random()<.28){s.stamina=Math.max(0,s.stamina-(1+Math.random()*2));s.oppStamina=Math.max(0,s.oppStamina-(1+Math.random()*2));}if(Math.random()<.12){s.vitality=Math.max(0,s.vitality-1);s.oppVitality=Math.max(0,s.oppVitality-1)}if(s.time<=0){if(s.round<3){s.round++;s.time=300;s.comment='Juras: Koniec rundy! Wracamy po przerwie. Trenerzy mają co robić.'}else finishFight('DECYZJA')}renderFight()}function action(name){var special=['High Kick','Spinning Backfist','Latające kolano','Łokieć','Balacha','Trójkąt','RNC'].indexOf(name)>=0;if(special){s.wheelAction=name;wheel.style.display='grid';wheelEl.style.transform='rotate(0deg)';document.getElementById('wheelText').textContent='Juras: '+name+'! Timing albo będzie pięknie, albo będzie bardzo głupio.';return}var dmg=3+Math.random()*7;s.oppVitality=Math.max(0,s.oppVitality-dmg);s.stamina=Math.max(0,s.stamina-2);s.comment='Juras: '+name+'! Dobra akcja, rywal to poczuł. Walka cały czas żyje.';if(s.oppVitality<=0)finishFight('TKO');renderFight()}function spinWheel(){var success=Math.random()<.58;wheelEl.style.transform='rotate('+(1440+Math.floor(Math.random()*720))+'deg)';setTimeout(function(){wheel.style.display='none';if(success){if(['Balacha','Trójkąt','RNC'].indexOf(s.wheelAction)>=0){s.comment='Juras: '+s.wheelAction+'! Jest poddanie! Koniec walki!';finishFight('SUBMISSION')}else{s.oppVitality=Math.max(0,s.oppVitality-35);s.comment='JURAS: ŁOOOOOO! '+s.wheelAction+'! Ależ weszło! To może być nokaut!';if(s.oppVitality<=0)finishFight('KO')}}else{s.comment='Juras: Nie weszło! Ryzyko było duże, rywal się wybronił.'}renderFight()},2600)}function renderFight(){if(!s.fightLive)return;app.innerHTML='<div class="fight"><div class="fighthead"><div><small class="gold">MMA MAIN EVENT</small><h1>'+s.first+' '+s.last+' vs '+s.fight.opponent+'</h1></div><div class="round">Runda '+s.round+' / 3<br><span class="clock">'+Math.floor(s.time/60)+':'+String(s.time%60).padStart(2,'0')+'</span></div></div><div class="fighters"><div class="fighter"><h2>'+s.first+' '+s.last+'</h2><p>STAMINA</p><div class="hp"><i style="width:'+s.stamina+'%"></i></div><p>WITALNOŚĆ</p><div class="hp"><i style="width:'+s.vitality+'%"></i></div></div><div class="center"><div class="round">VS</div><p class="muted">'+s.fight.fed+'</p></div><div class="fighter"><h2>'+s.fight.opponent+'</h2><p>STAMINA</p><div class="hp"><i style="width:'+s.oppStamina+'%"></i></div><p>WITALNOŚĆ</p><div class="hp"><i style="width:'+s.oppVitality+'%"></i></div></div></div><div class="comment">'+s.comment+'</div><div class="actions"><button onclick="action(\'Lewy prosty\')">Lewy prosty</button><button onclick="action(\'Sierp\')">Sierp</button><button onclick="action(\'Low kick\')">Low kick</button><button onclick="action(\'Obalenie\')">Obalenie</button><button onclick="action(\'High Kick\')" class="primary">HIGH KICK</button><button onclick="action(\'Spinning Backfist\')">SPINNING BACKFIST</button><button onclick="action(\'Latające kolano\')">LATAJĄCE KOLANO</button><button onclick="action(\'Łokieć\')">ŁOKIEĆ</button><button onclick="action(\'Balacha\')">BALACHA</button><button onclick="action(\'Trójkąt\')">TRÓJKĄT</button><button onclick="action(\'RNC\')">RNC</button></div></div>'}function finishFight(result){if(!s.fightLive)return;clearInterval(s.timer);s.fightLive=false;var win=result!=='DECYZJA'||Math.random()<.52;if(result==='KO'||result==='TKO'||result==='SUBMISSION')win=true;if(win){s.w++;s.rep=Math.min(100,s.rep+(result==='DECYZJA'?3:7));s.ig+=result==='DECYZJA'?120:1000;s.comment='Zwycięstwo!';s.log.unshift('🏆 WYGRAŁEŚ — '+result+' z '+s.fight.opponent+'.')}else{s.l++;s.rep=Math.max(0,s.rep-2);s.log.unshift('❌ PORAŻKA — decyzja z '+s.fight.opponent+'.')}s.history.unshift({op:s.fight.opponent,result:win?'W':'L',method:result,day:s.day,fed:s.fight.fed});s.fight=null;app.innerHTML='<div class="wrap"><div class="card"><small class="gold">WYNIK WALKI</small><h1>'+ (win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA')+'</h1><h2>'+result+'</h2><p>'+s.first+' '+s.last+' vs '+s.history[0].op+'</p><button class="primary" onclick="dashboard()">WRÓĆ DO DASHBOARDU</button></div></div>'}function modal(title,text){app.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalbox"><small class="gold">'+title+'</small><h1>'+title+'</h1><p>'+text+'</p><button onclick="closeModal()">ZAMKNIJ</button></div></div>')}function closeModal(){var m=document.querySelector('.modal');if(m)m.remove()}function page(title,html){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="panel"><small class="gold">'+title+'</small><h1>'+title+'</h1>'+html+'</div></main></div>'}function career(){page('KARIERA','<div class="sherdog"><div class="feed"><b>Rekord</b> '+s.w+'-'+s.l+'-'+s.d+'</div>'+s.history.map(function(x){return '<div class="feed">Dzień '+x.day+' · '+x.fed+' · '+x.result+' · '+x.method+' · vs '+x.op+'</div>'}).join('')+'</div>')}function media(){page('MEDIA','<h3>Instagram</h3><div class="money">'+s.ig.toLocaleString('pl-PL')+' followers</div><div class="feed">Wojciech Rysiewski wspomniał o Twoim ostatnim występie.</div><div class="feed">Hubert Mściwujewski pyta, czy jesteś gotowy na większą federację.</div><div class="feed">Artur Gwoźdź obserwuje rozwój Twojej kariery.</div>')}function manager(){page('MENEDŻER',s.rep>=20?'<h2>Menadżer jest dostępny</h2><p>Negocjuje walki, sponsorów i usługi regeneracyjne.</p>':'<h2>Brak menadżera</h2><p>Potrzebujesz 20 reputacji.</p>')}function statistics(){page('STATYSTYKI',Object.keys(s.sk).map(function(k){return '<div class="feed"><b>'+k+'</b> '+s.sk[k]+'/100</div>'}).join(''))}function finance(){page('FINANSE','<h2>'+s.money.toLocaleString('pl-PL')+' zł</h2><p>Etat: 3000 zł / miesiąc · Brama: 900 zł / weekend.</p><button onclick="buySupp()">Kup suplementy regeneracyjne — 1200 zł</button>')}function buySupp(){if(s.money<1200)return alert('Za mało pieniędzy.');s.money-=1200;s.supplements=true;s.log.unshift('🥤 Kupiono suplementy regeneracyjne.');finance()}function events(){page('E
