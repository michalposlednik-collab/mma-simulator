<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Career Simulator V111</title><style>
*{box-sizing:border-box}body{margin:0;background:#060b10;color:#eef3f5;font:15px Arial,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 15% 0,#173d4c,#05090d 65%)}button{cursor:pointer;color:#fff;background:#142833;border:1px solid #526873;padding:11px 15px;border-radius:9px;font-weight:700}button:hover{border-color:#d6ae51}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#80652a;border-color:#d6ae51}.wrap{padding:28px}.card,.panel{background:#101c25;border:1px solid #304955;border-radius:16px;padding:22px;box-shadow:0 16px 45px #0006}.creator{max-width:1100px;margin:auto}.field{margin:12px 0}.field label{display:block;color:#9eb0b8;font-size:11px}.field input{width:100%;padding:13px;margin-top:6px;background:#071018;color:#fff;border:1px solid #304955;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{display:none}.pick+label{display:block;padding:14px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer;min-height:76px}.pick:checked+label{border-color:#d6ae51;background:#211f15}.pick+label small{display:block;color:#9eb0b8;margin-top:6px}.gold{color:#d6ae51}.muted{color:#91a3ac}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b10;border-right:1px solid #203642;padding:12px}.side button{display:block;width:100%;margin:4px 0;text-align:left}.side .active{border-color:#d6ae51;background:#211f15}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.stat,.tile{background:#101e27;border:1px solid #304955;border-radius:12px;padding:14px}.stat small{color:#82949d}.stat b{display:block;font-size:18px;margin-top:6px}.hero{padding:25px;border:1px solid #80652a;border-radius:16px;background:radial-gradient(circle at 80% 0,#3b301b,#101a21 60%);margin:12px 0}.cols{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.feed{padding:9px 0;border-bottom:1px solid #20333c}.bar{height:8px;background:#1b2b33;border-radius:8px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#36c77b}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:76px;padding:8px;background:#0b151d;border:1px solid #243b46;border-radius:8px}.day.fight{border-color:#d6ae51;background:#211f15}.day.today{box-shadow:inset 0 0 0 2px #36c77b}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:200;align-items:center;justify-content:center;padding:18px}.modalbox{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{text-align:left;padding:16px;min-height:90px}.fight{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#293a44,#070c11)}.fighttop{display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;gap:20px;max-width:1250px;margin:auto}.fighter{text-align:center;padding:18px;background:#101c25;border:1px solid #304955;border-radius:16px}.hp{height:14px;background:#202b31;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#36c77b}.comment{min-height:105px;padding:18px;background:#101c25;border:1px solid #304955;border-radius:14px;font-size:17px;line-height:1.5;max-width:1250px;margin:14px auto}.timer{width:270px;height:270px;margin:auto;position:relative;border-radius:50%;display:grid;place-items:center}.timer:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#d6ae51 var(--pct),#26343b 0);box-shadow:0 0 0 8px #111d24}.timer:after{content:'';position:absolute;inset:18px;border-radius:50%;background:#081016;border:1px solid #304955}.timerText{position:relative;z-index:2;text-align:center}.clock{font-size:44px;font-weight:900}.round{font-size:13px;letter-spacing:2px;color:#d6ae51}.actions{display:flex;flex-wrap:wrap;gap:8px;max-width:1250px;margin:14px auto}.log{max-width:1250px;margin:14px auto;max-height:150px;overflow:auto}.wheelModal{display:none;position:fixed;inset:0;background:#000e;z-index:300;place-items:center;padding:18px}.wheelbox{background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:24px;width:min(680px,96vw);text-align:center}.wheelstage{width:350px;height:350px;margin:12px auto;position:relative}.wheel{position:absolute;left:15px;top:15px;width:320px;height:320px;border-radius:50%;border:9px solid #17252d;transition:transform 2.7s cubic-bezier(.12,.7,.15,1);box-shadow:0 8px 30px #0008;background:conic-gradient(#5fd37a 0deg 45deg,#df5045 45deg 90deg,#f0ad4e 90deg 135deg,#df5045 135deg 180deg,#5fd37a 180deg 225deg,#f0ad4e 225deg 270deg,#df5045 270deg 315deg,#5fd37a 315deg 360deg);}.wheel:after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(transparent 0deg 43deg,#f5f7f8 43deg 45deg);opacity:.8}.pointer{position:absolute;z-index:5;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid #d6ae51;filter:drop-shadow(0 2px 2px #000)}.wheelLegend{display:flex;justify-content:center;gap:18px;font-weight:800}.green{color:#5fd37a}.orange{color:#f0ad4e}.red{color:#df5045}.wheelResult{font-size:32px;font-weight:900;color:#d6ae51;min-height:48px;margin:8px}.resultModal{display:none;position:fixed;inset:0;background:#000d;z-index:350;place-items:center;padding:18px}.resultBox{width:min(760px,96vw);background:#101c25;border:1px solid #d6ae51;border-radius:18px;padding:25px;text-align:center}.winner{font-size:40px;color:#d6ae51;font-weight:900}.choice{padding:15px;text-align:left;min-height:85px}.challenge{display:grid;grid-template-columns:1fr 1fr;gap:8px}.target{padding:12px;border:1px solid #304955;border-radius:10px;background:#0b151d;cursor:pointer}.target.selected{border-color:#d6ae51;background:#211f15}.hidden{display:none}@media(max-width:950px){.layout{display:block}.side{display:flex;overflow:auto}.side button{min-width:120px}.stats{grid-template-columns:repeat(3,1fr)}.cols,.fighttop{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid,.stats,.modalgrid,.challenge{grid-template-columns:1fr}.top{display:block}.timer{width:220px;height:220px}.wheelstage{transform:scale(.85);margin:-8px auto}}
</style></head><body><div id="app" class="app"></div><div id="modal" class="modal"><div class="modalbox"><small id="mt" class="gold"></small><h1 id="mh"></h1><div id="mb"></div><div id="mc" class="modalgrid"></div><button onclick="closeModal()" style="margin-top:12px">PÓŹNIEJ</button></div></div><div id="wheelModal" class="wheelModal"><div class="wheelbox"><small class="gold">CZAS WALKI ZATRZYMANY</small><h2 id="wheelAction">HIGH KICK</h2><div class="wheelstage"><div class="pointer"></div><div id="wheel" class="wheel"></div></div><div class="wheelLegend"><span class="green">● PEŁNY</span><span class="orange">● CZĘŚCIOWY</span><span class="red">● NIEUDANA</span></div><div id="wheelResult" class="wheelResult">LOSUJ EFEKT</div><button id="spin" class="primary">LOSUJ EFEKT</button></div></div><div id="resultModal" class="resultModal"><div class="resultBox"><small class="gold">OFICJALNY WYNIK</small><div id="winner" class="winner"></div><h2 id="method"></h2><p id="sum"></p><hr><h2>🎙️ WYWIAD W KLATCE</h2><div id="interviewChoices" class="modalgrid"><button class="choice" onclick="interview('challenge')">🔥 Wyzwanie konkretnego rywala</button><button class="choice" onclick="interview('corner')">🙏 Podziękuj narożnikowi</button><button class="choice" onclick="interview('joke')">😂 Rzuć żart</button><button class="choice" onclick="interview('respect')">🤝 Oddaj szacunek rywalowi</button><button class="choice" onclick="interview('fans')">❤️ Podziękuj kibicom</button><button class="choice" onclick="interview('belt')">🏆 Powiedz, że idziesz po pas</button></div><div id="challengeBox" class="hidden"><h3>Wybierz rywala</h3><div id="targets" class="challenge"></div><button class="primary" onclick="confirmChallenge()">WYZWANIE NA ŻYWO</button></div><div id="interviewText" class="panel hidden"></div><button id="back" class="primary hidden" onclick="closeResult()">WRÓĆ DO DASHBOARDU</button></div></div><script>
'use strict';
const app=document.getElementById('app');let raf=0,last=0,paused=false,pending=null,selected=null;const opponents=['Kamil Wrona','Marek Lis','Daniel Cruz','Jonas Berg','Rafał Kaczmarek','Tomasz Bąk','Alex Pereira Jr.','Michał „Bizon” Kowal'];const KG={Flyweight:'56,7 kg',Bantamweight:'61,2 kg',Featherweight:'65,8 kg',Lightweight:'70,3 kg',Welterweight:'77,1 kg',Middleweight:'83,9 kg','Light Heavyweight':'93,0 kg',Heavyweight:'120,2 kg'};const TYPES={Wonderkid:'Talent, refleks i głód zwycięstw.',Bijok:'Szczęka, presja i moc.',Fizol:'Siła, klincz i presja.',Zapaśnik:'Obalenia, siatka i kontrola.',Striker:'Dystans, timing i nokaut.',Gumiarz:'Chaos, parter i kreatywność.',Allrounder:'Wszechstronność.'};const BUD=[[5000,'Normalny etat','Praca po godzinach.'],[10000,'Etat + oszczędności','Trochę oddechu.'],[25000,'Rodzina pomaga','Zaplecze na pierwszy krok.'],[50000,'Bogata rodzina','Możesz inwestować w obozy.'],[100000,'Rodzinny biznes','Sport finansowany jak drugi biznes.']];let s={created:false,day:1,age:18,money:10000,rep:5,ig:100,w:0,l:0,d:0,first:'',last:'',type:'',weight:'Middleweight',club:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,history:[],log:[],media:{interviewUntil:0,postUntil:0,controversyUntil:0},manager:null,sponsors:[],screen:'dashboard'};try{const old=localStorage.getItem('mmaCareerV111');if(old)s=JSON.parse(old)}catch(e){}function save(){localStorage.setItem('mmaCareerV111',JSON.stringify(s))}function money(n){return Math.round(n).toLocaleString('pl-PL')+' zł'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function league(){if(s.w<2)return'Lokalna gala';if(s.w<4)return'Hybrid';if(s.w<7)return'Babilon MMA / FEN';if(s.w<10)return'KSW';if(s.w<13)return'OKTAGON';if(s.w<16)return'Cage Warriors';if(s.w<19)return'PFL';return'UFC'}function creator(){let t=Object.keys(TYPES).map((x,i)=>`<input class="pick" id="t${i}" name="type" type="radio" value="${x}"><label for="t${i}"><b>${x}</b><small>${TYPES[x]}</small></label>`).join(''),b=BUD.map((x,i)=>`<input class="pick" id="b${i}" name="bud" type="radio" value="${x[0]}"><label for="b${i}"><b>${money(x[0])}</b><small><b>${x[1]}</b><br>${x[2]}</small></label>`).join(''),w=Object.keys(KG).map((x,i)=>`<input class="pick" id="w${i}" name="weight" type="radio" value="${x}"><label for="w${i}"><b>${x}</b><small>${KG[x]}</small></label>`).join('');app.innerHTML=`<div class="wrap creator"><div class="card"><h1>MMA <span class="gold">CAREER SIMULATOR</span></h1><p class="muted">Stwórz zawodnika od zera i poprowadź go od lokalnej gali do UFC.</p><div class="field"><label>IMIĘ *</label><input id="fn" placeholder="Imię"></div><div class="field"><label>NAZWISKO *</label><input id="ln" placeholder="Nazwisko"></div><h3>TYP ZAWODNIKA</h3><div class="grid">${t}</div><h3>BUDŻET STARTOWY</h3><div class="grid">${b}</div><h3>KATEGORIA WAGOWA</h3><div class="grid">${w}</div><br><button class="primary" onclick="createCareer()">STWÓRZ KARIERĘ →</button></div></div>`}function createCareer(){const f=document.getElementById('fn').value.trim(),l=document.getElementById('ln').value.trim(),t=document.querySelector('[name=type]:checked'),b=document.querySelector('[name=bud]:checked'),w=document.querySelector('[name=weight]:checked');if(!f||!l||!t||!b||!w){alert('Uzupełnij wszystkie pola.');return}s={created:true,day:1,age:18,money:+b.value,rep:5,ig:100,w:0,l:0,d:0,first:f,last:l,type:t.value,weight:w.value,club:'Lokalny klub',sk:{Boks:50,Zapasy:50,BJJ:50,Kondycja:50,Siła:50,Szybkość:50},fight:null,history:[],log:[`🥊 Start kariery: ${f} ${l}. Budżet ${money(+b.value)}.`],media:{interviewUntil:0,postUntil:0,controversyUntil:0},manager:null,sponsors:[],screen:'dashboard'};save();dashboard()}function stats(){return`<div class="stats"><div class="stat"><small>REKORD</small><b>${s.w}-${s.l}-${s.d}</b></div><div class="stat"><small>REPUTACJA</small><b>${s.rep}/100</b></div><div class="stat"><small>INSTAGRAM</small><b>${s.ig.toLocaleString('pl-PL')}</b></div><div class="stat"><small>GOTÓWKA</small><b>${money(s.money)}</b></div><div class="stat"><small>ORGANIZACJA</small><b>${league()}</b></div><div class="stat"><small>DZIEŃ / WIEK</small><b>${s.day} / ${s.age}</b></div></div>`}function nav(){return`<aside class="side">${[['dashboard','⌂ Dashboard'],['calendar','📅 Kalendarz'],['training','🥊 Trening'],['fights','🏆 Walki'],['career','📋 Kariera'],['media','📱 Media'],['manager','💼 Menedżer'],['finance','💰 Finanse'],['statistics','📊 Statystyki'],['events','◉ Eventy']].map(x=>`<button class="${s.screen===x[0]?'active':''}" onclick="${x[0]}()">${x[1]}</button>`).join('')}<button class="primary" onclick="advanceDay()">＋ NASTĘPNY DZIEŃ</button></aside>`}function shell(content){app.innerHTML=`<div class="layout">${nav()}<main class="main"><div class="top"><div><small class="gold">CENTRUM KARIERY</small><h1>${esc(s.first)} ${esc(s.last)}</h1><p class="muted">${s.age} lat · dzień ${s.day} · ${esc(s.type)} · ${esc(s.weight)} (${KG[s.weight]})</p></div></div>${stats()}${content}</main></div>`}function dashboard(){if(!s.created)return creator();s.screen='dashboard';let event=s.fight?`<div class="hero"><h2>📅 WALKA ZAPLANOWANA</h2><p><b>${esc(s.fight.opponent)}</b> · ${esc(s.fight.league)} · dzień <b>${s.fight.date}</b></p><p>Camp: ${esc(s.fight.camp)} · ${s.fight.campDays} dni · ${money(s.fight.purse)} gaży</p>${s.day>=s.fight.date?'<button class="primary" onclick="startFight()">WEJDŹ DO KLATKI</button>':'<p class="muted">Przejdź przez kalendarz do dnia walki.</p>'}</div>`:'<div class="panel"><h2>Brak zakontraktowanej walki</h2><p class="muted">Nowa oferta pojawi się jako osobne okno decyzyjne.</p><button class="primary" onclick="offerFight()">SPRAWDŹ OFERTĘ WALKI</button></div>';shell(`${event}<div class="cols"><section><div class="panel"><h2>Oś kariery</h2>${s.log.slice(-12).reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</div></section><section><div class="panel"><h2>Umiejętności</h2>${Object.entries(s.sk).map(([k,v])=>`<div class="feed"><b>${k}</b> ${v}/100<div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div></section></div>`)}function offerFight(){if(s.fight){alert('Masz już zakontraktowaną walkę.');return}const opp=opponents[Math.floor(Math.random()*opponents.length)],org=league(),purse=2500+s.rep*150+s.w*450;openModal('OFERTA WALKI','📩 Propozycja walki',`<p><b>${opp}</b> · ${org}</p><p>Gaża: <b>${money(purse)}</b></p><p>To jest osobny event. Dopiero po akceptacji wybierzesz obóz przygotowawczy.</p>`,[['AKCEPTUJ WALKĘ',()=>chooseCamp(opp,org,purse)],['ODRZUĆ',closeModal]])}function chooseCamp(opp,org,purse){const camps=[['Reykjavík Fight Lab',1200,10,'Stójka + motoryka'],['WCA Fight Team',3500,14,'MMA / BJJ / zapasy'],['ANKOS MMA',4200,14,'Zapasy + klincz + sparingi'],['UFC Performance Institute',12000,21,'Pełny camp, regeneracja i specjaliści']];openModal('PRZYGOTOWANIE','🥊 Wybierz obóz',`<p>Dzisiejszy dzień: <b>${s.day}</b>. Data walki zostanie wyliczona na podstawie długości campu.</p>`,camps.map(c=>[`${c[0]}<br><small>${money(c[1])} · ${c[2]} dni · ${c[3]}</small>`,()=>{if(s.money<c[1]){alert('Za mało pieniędzy.');return}s.money-=c[1];s.fight={opponent:opp,league:org,purse,date:s.day+c[2]+1,camp:c[0],campDays:c[2],round:1,time:300,stamina:100,vitality:100,oppStamina:100,oppVitality:100,score:[],uses:{jab:0,low:0,high:0,flying:0,spin:0,takedown:0,armbar:0,triangle:0,rnc:0}};s.log.push(`📅 ${opp}: walka dzień ${s.fight.date}; camp ${c[0]}.`);save();closeModal();dashboard()}]))}function openModal(title,head,body,opts){document.getElementById('mt').textContent=title;document.getElementById('mh').textContent=head;document.getElementById('mb').innerHTML=body;document.getElementById('mc').innerHTML=opts.map(x=>`<button class="option" onclick="(${x[1].toString()})()">${x[0]}</button>`).join('');document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function advanceDay(){if(s.fight&&s.day>=s.fight.date){alert('To dzień walki. Najpierw stocz zaplanowaną walkę.');return}s.day++;if(s.day%365===0)s.age++;s.money=Math.max(0,s.money-200);if(Math.random()<.18)dailyEvent();save();dashboard()}function dailyEvent(){const type=Math.random()<.5?'Pochwała':'Zaczepka';openModal('DODATKOWY EVENT',type==='Pochwała'?'👏 Ktoś Cię pochwalił':'💬 Ktoś Cię zaczepił',type==='Pochwała'?'Zawodnik z większym nazwiskiem docenił Twój ostatni występ.':'Rywal próbuje sprowokować Cię publicznie.',[['POZYTYWNIE',()=>socialReact(true)],['NEGATYWNIE',()=>socialReact(false)]])}function socialReact(pos){s.rep=Math.max(0,Math.min(100,s.rep+(pos?2:-1)));s.ig+=pos?150:50;s.log.push('📱 Odpowiedź na event social media.');save();closeModal();dashboard()}function calendar(){s.screen='calendar';let start=Math.max(1,s.day-3),cells='';for(let i=start;i<start+28;i++){const f=s.fight&&s.fight.date===i;cells+=`<div class="day ${f?'fight':''} ${i===s.day?'today':''}"><b>Dzień ${i}</b>${f?`<div class="gold">🥊 ${esc(s.fight.opponent)}</div><small>${esc(s.fight.camp)}</small>`:''}</div>`}shell(`<section class="panel"><h2>📅 Kalendarz kariery</h2><p>Aktualny dzień: <b>${s.day}</b> · wiek: <b>${s.age}</b></p><div class="calendar">${cells}</div></section>`)}function training(){s.screen='training';const camps=[['Lokalny klub',0,{Boks:2,Szybkość:1}],['ANKOS MMA',10,{Zapasy:3,Kondycja:2}],['WCA Fight Team',20,{BJJ:3,Zapasy:2}],['Czerwony Smok',30,{Boks:2,BJJ:2,Zapasy:2}],['American Top Team',65,{Boks:2,BJJ:2,Zapasy:2,Kondycja:3}]];shell(`<section class="panel"><h2>🥊 Trening</h2><div class="tiles">${camps.map(c=>`<div class="tile"><h3>${c[0]}</h3><p>Reputacja ${c[1]}</p><p>${Object.entries(c[2]).map(x=>x[0]+' +'+x[1]).join(' · ')}</p><button ${s.rep<c[1]?'disabled':''} onclick="camp('${c[0]}')">TRENUJ</button></div>`).join('')}</div></section>`);window._camps=camps}function camp(name){const c=window._camps.find(x=>x[0]===name);if(s.money<500){alert('Za mało pieniędzy.');return}s.money-=500;Object.entries(c[2]).forEach(([k,v])=>s.sk[k]=Math.min(100,s.sk[k]+v));s.club=name;s.log.push('🏋️ Trening: '+name);save();dashboard()}function fights(){s.screen='fights';shell(`<section class="panel"><h2>🏆 Walki</h2>${s.fight?`<div class="hero"><h3>${esc(s.fight.league)} · ${esc(s.fight.opponent)}</h3><p>Dzień ${s.fight.date} · camp ${esc(s.fight.camp)}</p>${s.day>=s.fight.date?'<button class="primary" onclick="startFight()">WEJDŹ DO KLATKI</button>':'<p class="muted">Walka jest zaplanowana. Kalendarz działa do dnia gali.</p>'}</div>`:'<p>Brak walki.</p>'}${s.history.slice().reverse().map(h=>`<div class="feed">${h.win?'🏆 WIN':'❌ LOSS'} · ${h.method} · ${esc(h.opponent)} · ${esc(h.league)}</div>`).join('')}</section>`)}function career(){s.screen='career';shell(`<section class="panel"><h2>📋 Kariera / Sharedok</h2><p>${esc(s.first)} ${esc(s.last)} · ${esc(s.type)} · ${esc(s.weight)}</p><p>Rekord: <b>${s.w}-${s.l}-${s.d}</b></p><h3>Dokument kariery</h3>${s.history.map((h,i)=>`<div class="feed">${i+1}. ${h.win?'WIN':'LOSS'} — ${esc(h.opponent)} — ${h.method}</div>`).join('')||'<p class="muted">Brak walk.</p>'}</section>`)}function media(){s.screen='media';const iv=s.day>=s.media.interviewUntil,po=s.day>=s.media.postUntil,co=s.day>=s.media.controversyUntil;shell(`<section class="panel"><h2>📱 Media</h2><div class="tiles"><div class="tile"><h3>Wywiad</h3><p>${iv?'Dostępny':'Dostępny od dnia '+s.media.interviewUntil}</p><button ${iv?'':'disabled'} onclick="useMedia('interview')">UDZIEL WYWIADU</button></div><div class="tile"><h3>Post</h3><p>${po?'Dostępny':'Dostępny od dnia '+s.media.postUntil}</p><button ${po?'':'disabled'} onclick="useMedia('post')">WRZUĆ POST</button></div><div class="tile"><h3>Kontrowersja</h3><p>${co?'Dostępna':'Dostępna od dnia '+s.media.controversyUntil}</p><button ${co?'':'disabled'} onclick="useMedia('controversy')">ZAGRAJ VA BANQUE</button></div></div></section>`)}function useMedia(k){if(k==='interview'&&s.day<s.media.interviewUntil)return;if(k==='post'&&s.day<s.media.postUntil)return;if(k==='controversy'&&s.day<s.media.controversyUntil)return;if(k==='interview'){s.media.interviewUntil=s.day+14;s.rep=Math.min(100,s.rep+2);s.ig+=250}s;if(k==='post'){s.media.postUntil=s.day+7;s.rep=Math.min(100,s.rep+1);s.ig+=300}s;if(k==='controversy'){s.media.controversyUntil=s.day+60;s.rep=Math.min(100,s.rep+4);s.ig+=700}s.log.push('📱 Aktywność medialna.');save();media()}function manager(){s.screen='manager';if(!s.manager){if(s.ig<5000){shell(`<section class="panel"><h2>💼 Menedżer</h2><p>Managerowie zaczynają się interesować zawodnikiem od <b>5 000 obserwujących</b>.</p></section>`);return}openManager();return}shell(`<section class="panel"><h2>💼 ${esc(s.manager.name)}</h2><p>Prowizja: <b>${s.manager.fee}%</b></p><p>Podpisany. Umowy sponsorskie są dostępne poniżej.</p><button class="primary" onclick="sponsorOffer()">SPRAWDŹ SPONSORÓW</button></section>`)}function openManager(){const ms=[['Marek Kowalski Management',10,'Negocjacje gaży i lokalni sponsorzy'],['North Fight Management',15,'Media, sponsorzy i kontakty zagraniczne'],['Elite Combat Group',20,'Duże gale, PR i plan kariery']];openModal('MENEDŻER','Wybierz reprezentanta','Podpisanie jest jednorazowe. Po wyborze masz tego managera.',ms.map(m=>[`${m[0]}<br><small>${m[1]}% · ${m[2]}</small>`,()=>{s.manager={name:m[0],fee:m[1]};s.log.push('💼 Podpisano managera: '+m[0]);save();closeModal();sponsorOffer()}]))}function sponsorOffer(){const sp=[['Fight Gear','500 zł/mies. + komplet odzieży'],['Suplementy','900 zł/mies. + suplementacja'],['Fizjoterapia','1200 zł/mies. + zabiegi'],['Dieta pudełkowa','1800 zł/mies. + posiłki'],['Sponsor odzieżowy','3500 zł/mies. + sprzęt + ekspozycja']];openModal('SPONSORZY','Oferty sponsorskie','Po podpisaniu managera pojawiają się umowy sponsorskie. Możesz wybrać jedną lub kilka.',sp.map(x=>[`${x[0]}<br><small>${x[1]}</small>`,()=>{s.sponsors.push(x[0]);s.log.push('🤝 Podpisano sponsora: '+x[0]);save();closeModal();manager()}]))}function finance(){s.screen='finance';shell(`<section class="panel"><h2>💰 Finanse</h2><div class="tiles"><div class="tile"><b>${money(s.money)}</b><br>Gotówka</div><div class="tile"><b>200 zł/dzień</b><br>Koszt życia</div><div class="tile"><b>${s.sponsors.length}</b><br>Umowy sponsorskie</div></div></section>`)}function statistics(){s.screen='statistics';shell(`<section class="panel"><h2>📊 Statystyki</h2><div class="tiles"><div class="tile">Walki <b>${s.w+s.l+s.d}</b></div><div class="tile">Win rate <b>${s.w+s.l+s.d?Math.round(s.w/(s.w+s.l+s.d)*100):0}%</b></div><div class="tile">KO/TKO <b>${s.history.filter(x=>x.method==='KO/TKO').length}</b></div><div class="tile">SUB <b>${s.history.filter(x=>x.method==='SUBMISSION').length}</b></div></div></section>`)}function events(){s.screen='events';shell(`<section class="panel"><h2>◉ Eventy</h2>${s.log.slice().reverse().map(x=>`<div class="feed">${esc(x)}</div>`).join('')}</section>`)}
function startFight(){if(!s.fight)return;if(s.day<s.fight.date){alert('Walka jest zaplanowana na dzień '+s.fight.date+'.');return}paused=false;renderFight();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function renderFight(){const f=s.fight;app.innerHTML=`<div class="fight"><div class="top"><div><small class="gold">${esc(f.league)}</small><h1>${esc(s.first)} vs ${esc(f.opponent)}</h1><p class="muted">Dzień ${s.day} · ${esc(f.camp)}</p></div><button onclick="dashboard()">OPUŚĆ</button></div><div class="fighttop"><div class="fighter"><h2>${esc(s.first)}</h2><p>Witalność <b id="hp1">100</b>%</p><div class="hp"><i id="bar1" style="width:100%"></i></div><p>Stamina <b id="st1">100</b>%</p><div class="hp"><i id="bars1" style="width:100%"></i></div></div><div class="timer" id="timer" style="--pct:100%"><div class="timerText"><div id="round" class="round">RUNDA 1 / 3</div><div id="clock" class="clock">05:00</div><small>ZEGAR ×4</small></div></div><div class="fighter"><h2>${esc(f.opponent)}</h2><p>Witalność <b id="hp2">100</b>%</p><div class="hp"><i id="bar2" style="width:100%"></i></div><p>Stamina <b id="st2">100</b>%</p><div class="hp"><i id="bars2" style="width:100%"></i></div></div></div><div id="comment" class="comment">JURAS: Zaczynamy. Zobaczymy, kto narzuci tempo.</div><div class="panel" style="max-width:1250px;margin:14px auto"><div class="actions">${actionButton('Jab / prosty','jab',3)}${actionButton('Low kick','low',3)}${actionButton('High kick 🎡','high',2)}${actionButton('Latające kolano 🎡','flying',2)}${actionButton('Spinning backfist 🎡','spin',2)}${actionButton('Obalenie 🎡','takedown',2)}${actionButton('Balacha 🎡','armbar',2)}${actionButton('Trójkąt 🎡','triangle',2)}${actionButton('RNC 🎡','rnc',2)}</div></div><div id="log" class="panel log"></div></div>`}function actionButton(name,key,max){return`<button data-key="${key}" onclick="fightAction('${key}')">${name}<small id="u-${key}">0/${max}</small></button>`}function loop(now){if(!s.fight)return;if(paused){raf=requestAnimationFrame(loop);return}const dt=Math.min(.05,(now-last)/1000);last=now;const f=s.fight;f.time-=dt*4;f.stamina=Math.max(0,f.stamina-dt*.6);f.oppStamina=Math.max(0,f.oppStamina-dt*.5);if(Math.random()<dt*.65)autoExchange();if(f.vitality<=0)return finishFight(false,'KO/TKO');if(f.oppVitality<=0)return finishFight(true,'KO/TKO');if(f.time<=0)return endRound();updateFight();raf=requestAnimationFrame(loop)}function autoExchange(){const f=s.fight;f.oppVitality=Math.max(0,f.oppVitality-(.7+Math.random()*1.7));f.vitality=Math.max(0,f.vitality-(.5+Math.random()*1.4));const c=['JURAS: Dobry prosty, zejście z linii i powrót do pozycji.','JURAS: Rywal odpowiada, mamy wymianę w półdystansie.','JURAS: Presja pod siatką, ale zawodnik dobrze pracuje nogami.','JURAS: Tempo jest wysokie, trzeba pilnować staminy.'];s.fight.comment=c[Math.floor(Math.random()*c.length)];logFight(s.fight.comment)}function updateFight(){const f=s.fight,e=id=>document.getElementById(id);if(e('timer'))e('timer').style.setProperty('--pct',Math.max(0,f.time/300*100)+'%');if(e('clock'))e('clock').textContent=String(Math.floor(f.time/60)).padStart(2,'0')+':'+String(Math.ceil(f.time%60)).padStart(2,'0');if(e('round'))e('round').textContent=`RUNDA ${f.round} / 3`;[['hp1',f.vitality,'bar1'],['st1',f.stamina,'bars1'],['hp2',f.oppVitality,'bar2'],['st2',f.oppStamina,'bars2']].forEach(x=>{if(e(x[0]))e(x[0]).textContent=Math.round(x[1]);if(e(x[2]))e(x[2]).style.width=Math.max(0,x[1])+'%'});if(e('comment'))e('comment').textContent=f.comment;Object.entries({jab:3,low:3,high:2,flying:2,spin:2,takedown:2,armbar:2,triangle:2,rnc:2}).forEach(([k,m])=>{const u=e('u-'+k);if(u)u.textContent=(f.uses[k]||0)+'/'+m;const b=document.querySelector(`[data-key="${k}"]`);if(b)b.disabled=(f.uses[k]||0)>=m||paused})}function logFight(x){const e=document.getElementById('log');if(e)e.innerHTML=`<div class="feed">${esc(x)}</div>`+e.innerHTML}function fightAction(k){const f=s.fight,max={jab:3,low:3,high:2,flying:2,spin:2,takedown:2,armbar:2,triangle:2,rnc:2}[k];if((f.uses[k]||0)>=max||paused)return;f.uses[k]=(f.uses[k]||0)+1;if(k==='jab'){f.oppVitality=Math.max(0,f.oppVitality-3.5);f.stamina=Math.max(0,f.stamina-2);f.comment='JURAS: Prosty dochodzi. Mały koszt, ale limitujemy go, żeby nie dało się spamować.';logFight(f.comment);return updateFight()}if(k==='low'){f.oppVitality=Math.max(0,f.oppVitality-5);f.oppStamina=Math.max(0,f.oppStamina-3);f.stamina=Math.max(0,f.stamina-3);f.comment='JURAS: Low kick trafia w nogę.';logFight(f.comment);return updateFight()}pending=k;paused=true;document.getElementById('wheelAction').textContent=({high:'HIGH KICK',flying:'LATAJĄCE KOLANO',spin:'SPINNING BACKFIST',takedown:'OBALENIE',armbar:'BALACHA',triangle:'TRÓJKĄT',rnc:'RNC'})[k];document.getElementById('wheelResult').textContent='LOSUJ EFEKT';document.getElementById('spin').disabled=false;wheel.style.display='block';document.getElementById('wheel').style.transform='rotate(0deg)';document.getElementById('wheelModal').style.display='grid'}document.getElementById('spin').onclick=function(){if(!pending)return;this.disabled=true;const r=Math.random(),out=r<.45?'FULL':r<.78?'PARTIAL':'FAIL';const segment=out==='FULL'?[0,4,7][Math.floor(Math.random()*3)]:out==='PARTIAL'?[2,5][Math.floor(Math.random()*2)]:[1,3,6][Math.floor(Math.random()*3)];const center=segment*45+22.5;const rot=1800+(360-center);wheel.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{document.getElementById('wheelResult').textContent=out==='FULL'?'PEŁNY SUKCES':out==='PARTIAL'?'CZĘŚCIOWY SUKCES':'NIEUDANA TECHNIKA';applySpecial(out);setTimeout(()=>{document.getElementById('wheelModal').style.display='none';pending=null;paused=false;last=performance.now();if(s.fight)raf=requestAnimationFrame(loop)},1200)},2800)};function applySpecial(out){const f=s.fight,name=({high:'High kick',flying:'Latające kolano',spin:'Spinning backfist',takedown:'Obalenie',armbar:'Balacha',triangle:'Trójkąt',rnc:'RNC'})[pending],dmg={"High kick":17,"Latające kolano":15,"Spinning backfist":14,"Obalenie":9,"Balacha":18,"Trójkąt":17,RNC:20}[name];if(out==='FULL'){f.oppVitality=Math.max(0,f.oppVitality-dmg*1.45);f.oppStamina=Math.max(0,f.oppStamina-10);f.comment=`JURAS: ${name} — PEŁNY SUKCES! Kapitalne wykonanie.`}else if(out==='PARTIAL'){f.oppVitality=Math.max(0,f.oppVitality-dmg*.65);f.oppStamina=Math.max(0,f.oppStamina-5);f.comment=`JURAS: ${name} — CZĘŚCIOWY SUKCES. Jest efekt, ale nie weszło czysto.`}else{f.vitality=Math.max(0,f.vitality-4);f.stamina=Math.max(0,f.stamina-15);f.comment=`JURAS: ${name} — NIEUDANA TECHNIKA! Rywal wykorzystał moment.`}logFight(f.comment);updateFight()}function endRound(){const f=s.fight,my=(100-f.oppVitality)+(f.stamina>f.oppStamina?6:0),op=(100-f.vitality)+(f.oppStamina>f.stamina?6:0);f.score.push(my>=op?10:9);if(f.round>=3)return finishFight(f.score.filter(x=>x===10).length>=2,'DECYZJA');f.round++;f.time=300;f.stamina=Math.min(100,f.stamina+25);f.oppStamina=Math.min(100,f.oppStamina+22);f.comment=`JURAS: Koniec rundy. Wynik rundy: ${f.score[f.score.length-1]}-${f.score[f.score.length-1]===10?9:10}.`;logFight(f.comment);updateFight()}function finishFight(win,method){cancelAnimationFrame(raf);const f=s.fight;s.money+=f.purse;if(win){s.w++;s.rep=Math.min(100,s.rep+(method==='KO/TKO'?6:4));s.ig+=300}else{s.l++;s.rep=Math.max(0,s.rep-2);s.ig=Math.max(0,s.ig-50)}s.media={interviewUntil:s.day+14,postUntil:s.day+7,controversyUntil:s.day+60};s.history.push({win,method,opponent:f.opponent,league:f.league,purse:f.purse});s.log.push(`${win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA'} z ${f.opponent} przez ${method}.`);s.fight=null;save();showResult(win,method,f.opponent)}function showResult(win,method,opp){document.getElementById('winner').textContent=win?'🏆 ZWYCIĘSTWO':'❌ PORAŻKA';document.getElementById('method').textContent=method;document.getElementById('sum').textContent=`${s.first} ${s.last} ${win?'pokonuje':'przegrywa z'} ${opp}.`;document.getElementById('interviewChoices').style.display='grid';document.getElementById('challengeBox').classList.add('hidden');document.getElementById('interviewText').classList.add('hidden');document.getElementById('back').classList.add('hidden');document.getElementById('resultModal').style.display='grid'}function interview(k){if(k==='challenge'){document.getElementById('interviewChoices').style.display='none';document.getElementById('challengeBox').classList.remove('hidden');document.getElementById('targets').innerHTML=[...new Set(opponents)].map(x=>`<div class="target" onclick="selectTarget(this,'${esc(x)}')">${esc(x)}</div>`).join('');return}const text={corner:'Dziękuję mojemu narożnikowi i całemu teamowi.',joke:'Mówili, że cardio będzie problemem. Chyba mam drugie płuca.',respect:'Szacunek dla rywala. To była dobra walka.',fans:'Dziękuję wszystkim kibicom.',belt:'Nie przyszedłem tutaj po jedną wygraną. Idę po pas.'}[k];s.rep=Math.min(100,s.rep+(k==='belt'?5:2));s.ig+=k==='joke'?800:300;s.log.push('🎙️ Wywiad po walce.');save();finishInterview(text)}function selectTarget(el,x){document.querySelectorAll('.target').forEach(y=>y.classList.remove('selected'));el.classList.add('selected');selected=x}function confirmChallenge(){if(!selected){alert('Wybierz rywala.');return}s.rep=Math.min(100,s.rep+6);s.ig+=1000;s.log.push('🔥 Wyzwanie: '+selected);save();finishInterview(`Chcę walki z ${selected}. Zróbmy to w następnej gali.`)}function finishInterview(text){document.getElementById('interviewChoices').style.display='none';document.getElementById('challengeBox').classList.add('hidden');document.getElementById('interviewText').classList.remove('hidden');document.getElementById('interviewText').innerHTML='<b>Twój wywiad:</b><br>'+esc(text);document.getElementById('back').classList.remove('hidden')}function closeResult(){document.getElementById('resultModal').style.display='none';dashboard()}window.dashboard=dashboard;window.calendar=calendar;window.training=training;window.fights=fights;window.career=career;window.media=media;window.manager=manager;window.finance=finance;window.statistics=statistics;window.events=events;window.offerFight=offerFight;window.chooseCamp=chooseCamp;window.closeModal=closeModal;window.advanceDay=advanceDay;window.startFight=startFight;window.fightAction=fightAction;window.interview=interview;window.selectTarget=selectTarget;window.confirmChallenge=confirmChallenge;window.closeResult=closeResult;if(s.created)dashboard();else creator();
</script></body></html>
